          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),

          linear-gradient(180deg, #0a0e19 0%, #060914 44%, #050711 100%);

      #root, main {
        max-width: 100%;
        overflow-x: hidden;

        min-width: 0;

      @view-transition { navigation: auto; }

        {

      const deals = [

        {

        {

      ];

      const navItems = [
        { label: "Inicio", icon: "home", active: true, href: "home.html" },
        { label: "Historial", icon: "history", href: "historial.html" },
        { label: "Quedar", icon: "users", href: "plans.html" },

      function NavIcon({ name }) {
        const paths = {
          home: <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" />,
          search: <path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />,
          history: <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2" />,
          plus: <path d="M12 5v14M5 12h14" />,
          users: <path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7" />,
          diamond: <path d="M12 3 21 12 12 21 3 12 12 3Z" />,
          transfer: <path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4" />,

        return (

            fill="none"

            strokeLinecap="round"
            strokeLinejoin="round"

      }

      function NotificationBadge({ count }) {
        if (!count) return null;
        return (
          <span className="absolute -right-1 -top-1 grid min-h-5 min-w-5 place-items-center rounded-full bg-coral px-1.5 text-[10px] font-black leading-none text-white ring-2 ring-[#101522]">
            +{count > 9 ? "9" : count}
          </span>
        );
      }

      function Category({ category, active, onClick, count, isReady }) {
        const hasContent = Number(count || 0) > 0;
        return (
          <button className="min-w-[74px] text-center focus:outline-none sm:min-w-[82px]" onClick={onClick}>
            <div
              className={`mx-auto grid h-16 w-16 place-items-center rounded-full bg-gradient-to-br ${category.color} ${category.tint} text-2xl ring-1 transition hover:scale-[1.03] sm:h-[70px] sm:w-[70px] sm:text-3xl ${
                active ? "ring-mint ring-offset-4 ring-offset-[#060914]" : "ring-white/20"
              } ${isReady && !hasContent ? "opacity-60 saturate-[0.75]" : ""}`}
            >
              <span aria-hidden="true">{category.icon}</span>
            </div>
            <p className={`mt-2 text-xs font-bold ${active ? "text-mint" : "text-slate-300"}`}>{category.label}</p>
            {isReady && hasContent && (
              <span className="mt-1 inline-flex rounded-full bg-mint/10 px-2 py-0.5 text-[10px] font-black text-mint ring-1 ring-mint/15">
                {count}
              </span>
            )}
          </button>
        );
      }

      function CategoryDiscovery({ items, onOpenCategory }) {
        const visibleItems = (items || []).filter((item) => Number(item.count || 0) > 0);
        if (visibleItems.length === 0) return null;

        return (
          <section className="rounded-[28px] border border-white/10 bg-white/[0.045] p-4 shadow-2xl shadow-black/20 sm:p-5">
            <div className="mb-4 flex items-center justify-between gap-3">
              <div>
                <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Ver más</p>
                <h2 className="mt-1 text-xl font-black text-white">Categorías con chollos</h2>
              </div>
              <button
                className="shrink-0 rounded-full bg-white/[0.08] px-4 py-2 text-xs font-black text-white ring-1 ring-white/10"
                onClick={() => onOpenCategory(visibleItems[0].category)}
              >
                Ver más
              </button>
            </div>

            <div className="no-scrollbar -mx-4 flex gap-3 overflow-x-auto px-4 pb-1 sm:mx-0 sm:grid sm:grid-cols-2 sm:px-0 lg:grid-cols-3">
              {visibleItems.map((item) => {
                const categoryData = categories.find((category) => category.label === item.category) || categories[0];
                return (
                  <button
                    key={item.category}
                    className="group relative min-h-[132px] min-w-[210px] overflow-hidden rounded-[24px] border border-white/10 bg-[#101522] p-4 text-left shadow-xl shadow-black/20 transition hover:-translate-y-0.5 hover:border-mint/30"
                    onClick={() => onOpenCategory(item.category)}
                  >
                    {item.preview?.cover_photo_data_url && (
                      <img className="absolute inset-0 h-full w-full object-cover opacity-35 transition group-hover:opacity-45" src={item.preview.cover_photo_data_url} alt="" />
                    )}
                    <div className={`absolute inset-0 bg-gradient-to-br ${categoryData.color} opacity-20`}></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/35 to-transparent"></div>
                    <div className="relative flex h-full flex-col justify-between gap-5">
                      <div className="flex items-center justify-between gap-3">
                        <span className="grid h-11 w-11 place-items-center rounded-2xl bg-white/12 text-2xl ring-1 ring-white/10">{categoryData.icon}</span>
                        <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">{item.count} ofertas</span>
                      </div>
                      <div>
                        <p className="text-lg font-black text-white">{item.category}</p>
                        <p className="mt-1 truncate text-xs font-bold text-slate-300">
                          {item.preview?.title || "Ver propuestas disponibles"}
                        </p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </section>
        );
      }

      function buildCategorySummaryFromOffers(offers) {
        const visibleOffers = (offers || []).filter(isVisibleForUsers);
        return categories.map((category) => {
          const categoryOffers = visibleOffers.filter((offer) => (offer.categories || []).includes(category.label));
          const preview = categoryOffers[0] || null;
          return {
            category: category.label,
            count: categoryOffers.length,
            preview: preview
              ? {
                  id: preview.id,
                  title: preview.title,
                  cover_photo_data_url: preview.cover_photo_data_url || preview.presentation_image_data_urls?.[0] || "",
                  required_points: preview.required_points,
                  business_display_name: preview.business_display_name,
                  business_is_verified: Boolean(preview.business_is_verified),
                }
              : null,
          };
        });
      }

      function notifyInicioReady() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "donos:page-ready", route: "inicio" }, window.location.origin);
        }
      }

      function formatEuro(value) {
        if (value === null || value === undefined || value === "") return "—";
        return `${Number(value).toLocaleString("es-ES", { maximumFractionDigits: 2 })}€`;
      }

      function openFullPage(url) {
        const target = new URL(url, window.location.href);
        if (target.pathname.endsWith("category.html") && window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "donos:category",
            category: target.searchParams.get("category") || "Libros",
          }, window.location.origin);
          return;
        }
        if (target.pathname.endsWith("offer-detail.html") && window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "donos:offer-detail",
            id: target.searchParams.get("id") || "",
          }, window.location.origin);
          return;
        }
        if (window.parent && window.parent !== window) {
          window.parent.location.href = url;
        } else {
          window.location.href = url;
        }
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString("es-ES");
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "";
      }

      function getDiscountPercent(basePrice, reducedPrice) {
        const base = Number(basePrice);
        const reduced = Number(reducedPrice);
        if (!base || !Number.isFinite(base) || !Number.isFinite(reduced) || reduced >= base) return null;
        return Math.round(((base - reduced) / base) * 100);
      }

      function getRemainingStock(offer) {
        if (offer.stock_quantity === null || offer.stock_quantity === undefined || offer.stock_quantity === "") return null;
        return Math.max(Number(offer.stock_quantity || 0) - Number(offer.sold_count || 0), 0);
      }

      function isOutOfStock(offer) {
        const remaining = getRemainingStock(offer);
        return remaining !== null && remaining <= 0;
      }

      function isVisibleForUsers(offer) {
        if (offer.is_hidden) return false;
        const today = new Date().toISOString().slice(0, 10);
        const validUntil = offer.qr_valid_until || offer.end_date || null;
        if (validUntil && String(validUntil).slice(0, 10) < today) return false;
        if (!isOutOfStock(offer)) return true;
        if (!offer.out_of_stock_since) return true;
        return Date.now() - new Date(offer.out_of_stock_since).getTime() < 24 * 60 * 60 * 1000;
      }

      function VerifiedBadge({ small = false }) {
        return (
          <span className={`relative inline-grid shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20 ${small ? "h-4 w-4" : "h-5 w-5"}`} title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className={`relative ${small ? "h-3 w-3" : "h-3.5 w-3.5"}`} fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function OfferCard({ offer, onOpen, onLike, isLiked }) {
        const firstCategory = offer.featured_category || offer.categories?.[0] || "Oferta";
        const discountPercent = getDiscountPercent(offer.base_price, offer.reduced_price);
        const businessName = offer.business_display_name || offer.receiver_display_name || offer.author || "";
        const outOfStock = isOutOfStock(offer);
        const image = offer.cover_photo_data_url || offer.presentation_image_data_urls?.[0];
        const categoryIcon = categories.find((category) => category.label === firstCategory)?.icon || "✨";
        return (
          <article
            className="cursor-pointer overflow-hidden rounded-[26px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/20 transition hover:translate-y-[-2px]"
            onClick={() => onOpen(offer)}
          >
            <div className="relative min-h-[150px] overflow-hidden bg-gradient-to-br from-mint via-[#183047] to-[#FF6B6B] p-4">
              {image && <img className="absolute inset-0 h-full w-full object-cover opacity-80" src={image} alt="" />}
              <div className="absolute inset-0 bg-gradient-to-t from-black/65 via-black/12 to-black/20"></div>
              <div className="flex items-center justify-between gap-3">
                <span className="relative rounded-full bg-black/35 px-3 py-1 text-xs font-black text-white backdrop-blur">
                  {firstCategory}
                </span>
                <div className="relative flex items-center gap-2">
                  {outOfStock && (
                    <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">Agotado</span>
                  )}
                  {discountPercent !== null && (
                    <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">-{discountPercent}%</span>
                  )}
                  <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">
                    {offer.required_points || 0} ptos.
                  </span>
                </div>
              </div>
              <button
                className={`absolute bottom-3 left-4 grid h-11 w-11 place-items-center rounded-full text-xl shadow-2xl ring-1 backdrop-blur transition active:scale-90 ${
                  isLiked ? "bg-coral text-white ring-coral/30" : "bg-black/35 text-white ring-white/15"
                }`}
                type="button"
                aria-label={isLiked ? "Quitar de me gusta" : "Guardar en me gusta"}
                onClick={(event) => {
                  event.stopPropagation();
                  onLike?.(offer);
                }}
              >
                {isLiked ? "♥" : "♡"}
              </button>
              <div className="absolute bottom-3 right-4 text-6xl drop-shadow-2xl" aria-hidden="true">
                {image ? "" : categoryIcon}
              </div>
            </div>

            <div className="p-4">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <h3 className="text-base font-black text-white">{offer.title || "Oferta sin título"}</h3>
                  <p className="mt-1 text-sm font-medium text-slate-400">{offer.address || "Donostia"}</p>
                  {businessName && (
                    <p className="mt-2 inline-flex max-w-full items-center gap-1.5 rounded-full bg-white/[0.07] px-2.5 py-1 text-xs font-black text-slate-200 ring-1 ring-white/10">
                      <span className="truncate">{businessName}</span>
                      {offer.business_is_verified && <VerifiedBadge small />}
                    </p>
                  )}
                </div>
                <div className="text-right">
                  {offer.base_price !== null && (
                    <p className="text-xl font-black text-slate-400 line-through">{formatEuro(offer.base_price)}</p>
                  )}
                </div>
              </div>
              <button
                className={`mt-4 h-11 w-full rounded-2xl text-sm font-black ring-1 transition ${
                  outOfStock ? "bg-coral/10 text-coral ring-coral/20" : "bg-white/[0.08] text-white ring-white/10 hover:bg-white/[0.12]"
                }`}
                onClick={(event) => {
                  event.stopPropagation();
                  onOpen(offer);
                }}
              >
                {outOfStock ? "Ver agotado" : "Ver detalles"}
              </button>
            </div>
          </article>
        );
      }

      function OfferDetail({ offer, onClose }) {
        if (!offer) return null;

        const discountPercent = getDiscountPercent(offer.base_price, offer.reduced_price);
        const businessName = offer.business_display_name || offer.receiver_display_name || offer.author || "";
        const outOfStock = isOutOfStock(offer);
        const detailItems = [
          ["Dirección", offer.address],
          ["Categoría", offer.categories?.join(", ")],
          ["Precio base", formatEuro(offer.base_price)],
          ["Puntos necesarios", `${offer.required_points || 0} ptos.`],
          ["Horarios", offer.hours],
          ["Fecha de inicio", offer.start_date],
          ["Fecha de fin", offer.end_date],
          ["Edad", offer.age],
          ["Autor/a", offer.author],
          ["Entrega a domicilio", offer.delivery_home_enabled ? `${offer.delivery_home_points || 0} ptos. extra` : "No disponible"],
          ["Recogida en tienda", offer.delivery_pickup_enabled ? "Disponible" : "No disponible"],

        return (
          <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 px-4 py-5 backdrop-blur-xl">

                <button
                  className="absolute right-4 top-4 grid h-10 w-10 place-items-center rounded-full bg-black/30 text-xl font-black text-white backdrop-blur"

                  ×

	                  <p className="text-sm font-black uppercase tracking-[0.16em] text-ink/70">Detalle</p>

	                    <div className="mt-3 inline-flex items-center gap-2 rounded-full bg-black/30 px-3 py-1.5 text-xs font-black text-white ring-1 ring-white/10 backdrop-blur">
	                      <span>{businessName}</span>
	                      {offer.business_is_verified && <VerifiedBadge />}
	                    </div>

	                </div>
                <div className="absolute bottom-5 right-5 text-7xl drop-shadow-2xl" aria-hidden="true">📚</div>

              <div className="space-y-5 p-5 sm:p-7">

                  <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-xs font-semibold text-slate-400">Precio base</p>
                    <p className="mt-1 text-2xl font-black text-white line-through decoration-slate-500">{formatEuro(offer.base_price)}</p>
                  </div>
                  <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <p className="text-xs font-semibold text-mint">Puntos</p>
                    <p className="mt-1 text-2xl font-black text-white">{offer.required_points || 0}</p>
                  </div>
	                  {discountPercent !== null && (
	                    <div className="rounded-3xl border border-coral/25 bg-coral/10 p-4 col-span-2">
	                      <p className="text-xs font-semibold text-coral">Descuento</p>
	                      <p className="mt-1 text-2xl font-black text-white">-{discountPercent}%</p>
	                    </div>
	                  )}
                    {outOfStock && (
                      <div className="col-span-2 rounded-3xl border border-coral/25 bg-coral/10 p-4">
                        <p className="text-xs font-semibold text-coral">Disponibilidad</p>
                        <p className="mt-1 text-2xl font-black text-white">Agotado</p>
                      </div>
                    )}
	                </div>

                {offer.description && (
                  <div>
                    <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Descripción</p>
                    <p className="mt-2 text-sm leading-6 text-slate-300">{offer.description}</p>
                  </div>
                )}

                <div className="grid gap-3 sm:grid-cols-2">
                  {detailItems
                    .filter(([, value]) => value !== null && value !== undefined && value !== "")
                    .map(([label, value]) => (
                      <div key={label} className="rounded-2xl border border-white/10 bg-white/[0.045] p-3">
                        <p className="text-xs font-semibold text-slate-500">{label}</p>
                        <p className="mt-1 text-sm font-black text-white">{value}</p>
                      </div>
                    ))}
                </div>

	                <button className={`h-14 w-full rounded-2xl text-base font-black ${
                    outOfStock ? "bg-white/10 text-slate-500" : "bg-mint text-ink shadow-glow"
                  }`} disabled={outOfStock}>
	                  {outOfStock ? "Oferta agotada" : (offer.cart_button_text || "Comprar")}
	                </button>
              </div>
            </section>
          </div>
        );
      }

      function App() {
        const [accountType, setAccountType] = React.useState("");
        const [accountName, setAccountName] = React.useState(localStorage.getItem("donosDisplayName") || "");
        const [accountPoints, setAccountPoints] = React.useState(Number(localStorage.getItem("donosPoints") || 0));
        const [transactionId, setTransactionId] = React.useState(localStorage.getItem("donosTransactionId") || "");
        const [accountVerified, setAccountVerified] = React.useState(false);
        const [isLoggedIn, setIsLoggedIn] = React.useState(false);
        const [copyStatus, setCopyStatus] = React.useState("");
        const [selectedCategory, setSelectedCategory] = React.useState("");
        const [categoryOffers, setCategoryOffers] = React.useState([]);
        const [featuredOffers, setFeaturedOffers] = React.useState([]);
        const [categorySummary, setCategorySummary] = React.useState([]);
        const [homeDataReady, setHomeDataReady] = React.useState(false);
        const [likedOfferIds, setLikedOfferIds] = React.useState(new Set());
        const [likeToast, setLikeToast] = React.useState("");
        const [selectedOffer, setSelectedOffer] = React.useState(null);
        const [isLoadingOffers, setIsLoadingOffers] = React.useState(false);
        const [offersStatus, setOffersStatus] = React.useState("");
        const [navBadges, setNavBadges] = React.useState({});
        const [themeMode, setThemeMode] = React.useState(window.donossTheme?.getTheme?.() || "dark");

        React.useEffect(() => {
          const syncTheme = (event) => setThemeMode(event.detail?.theme || window.donossTheme?.getTheme?.() || "dark");
          window.addEventListener("donoss:theme-changed", syncTheme);
          return () => window.removeEventListener("donoss:theme-changed", syncTheme);
        }, []);

        async function loadNotificationBadges() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) return;
          const response = await fetch("/api/me/notifications", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok) setNavBadges(data.counts?.sections || {});
        }

        async function loadFeaturedOffers() {
          try {
            const response = await fetch("/api/offers/featured");
            const data = await response.json().catch(() => ({}));
            if (response.ok) {
              setFeaturedOffers(data.offers || []);
              return;
            }
          } catch (error) {
            // Fallback below keeps Inicio useful even if the server route is still warming up.
          }

          try {
            const { data, error } = await supabaseClient
              .from("business_offers")
              .select("*")
              .order("created_at", { ascending: false })
              .limit(250);
            if (error) throw error;
            const visibleOffers = (data || []).filter(isVisibleForUsers);
            const usedIds = new Set();
            const featured = [];
            for (const category of categories) {
              const offer = visibleOffers.find((item) => !usedIds.has(item.id) && (item.categories || []).includes(category.label));
              if (!offer) continue;
              usedIds.add(offer.id);
              featured.push({ ...offer, featured_category: category.label });
              if (featured.length >= 6) break;
            }
            if (featured.length < 6) {
              for (const offer of visibleOffers) {
                if (usedIds.has(offer.id)) continue;
                usedIds.add(offer.id);
                featured.push({ ...offer, featured_category: offer.categories?.[0] || "Oferta" });
                if (featured.length >= 6) break;
              }
            }
            setFeaturedOffers(featured);
          } catch (error) {
            setFeaturedOffers([]);
          }
        }

        async function loadCategorySummary() {
          try {
            const response = await fetch("/api/offers/categories/summary");
            const data = await response.json().catch(() => ({}));
            if (response.ok) {
              setCategorySummary(data.categories || []);
              return;
            }
          } catch (error) {
            // Fallback below keeps the UI useful even if the server summary is not deployed yet.
          }

          try {
            const { data, error } = await supabaseClient
              .from("business_offers")
              .select("id,title,cover_photo_data_url,presentation_image_data_urls,categories,required_points,business_display_name,business_is_verified,is_hidden,stock_quantity,sold_count,out_of_stock_since,created_at")
              .order("created_at", { ascending: false })
              .limit(250);
            if (error) throw error;
            setCategorySummary(buildCategorySummaryFromOffers(data || []));
          } catch (error) {
            setCategorySummary([]);
          }
        }

        async function loadLikedOffers(token) {
          if (!token) return;
          try {
            const response = await fetch("/api/me/liked-offers", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok) setLikedOfferIds(new Set(data.offer_ids || []));
          } catch (error) {
            setLikedOfferIds(new Set());
          }
        }

        const loadAccount = React.useCallback(async () => {
            const params = new URLSearchParams(window.location.search);
            const typeFromUrl = params.get("type");
            let type = typeFromUrl || localStorage.getItem("donosAccountType") || "user";
            let name = localStorage.getItem("donosDisplayName") || "";
            let donosId = localStorage.getItem("donosTransactionId") || "";
            let points = Number(localStorage.getItem("donosPoints") || 0);

            const { data: sessionData } = await supabaseClient.auth.getSession();
            const accessToken = sessionData.session?.access_token;
            const authUser = sessionData.session?.user;
            setIsLoggedIn(Boolean(authUser?.id));
            const metadata = authUser?.user_metadata || {};

            if (metadata.account_type) type = metadata.account_type;
            if (metadata.display_name) name = metadata.display_name;

            if (authUser?.id) {
              let profile = null;

              if (accessToken) {
                const response = await fetch("/api/me/profile", {
                  headers: { Authorization: `Bearer ${accessToken}` },
                });
                const serverData = await response.json().catch(() => ({}));
                if (response.ok) profile = serverData.profile;
              }

              if (!profile) {
                const fallback = await supabaseClient
                  .from("profiles")
                  .select("account_type, display_name, transaction_id, points, is_verified")
                  .eq("id", authUser.id)
                  .maybeSingle();
                profile = fallback.data;
              }

              if (profile?.account_type) type = profile.account_type;
              if (profile?.display_name) name = profile.display_name;
              if (profile?.transaction_id) donosId = profile.transaction_id;
              points = Number(profile?.points || 0);
              setAccountVerified(Boolean(profile?.is_verified));
              if (profile?.transaction_id) localStorage.setItem("donosTransactionId", profile.transaction_id);
              if (profile && typeof profile.points !== "undefined") localStorage.setItem("donosPoints", String(points));
            }

            setAccountType(type);
            setAccountName(name);
            setTransactionId(donosId);
            setAccountPoints(points);
            localStorage.setItem("donosAccountType", type);
            if (name) localStorage.setItem("donosDisplayName", name);
            if (accessToken) {
              loadNotificationBadges();
              loadLikedOffers(accessToken);
            }
        }, []);

        React.useEffect(() => {
          let cancelled = false;
          Promise.all([loadAccount(), loadFeaturedOffers(), loadCategorySummary()]).finally(() => {
            if (!cancelled) {
              setHomeDataReady(true);
              window.requestAnimationFrame(() => notifyInicioReady());
            }
          });
          return () => {
            cancelled = true;
          };
        }, [loadAccount]);

        React.useEffect(() => {
          const handleRefresh = () => {
            if (!document.hidden) loadAccount();
          };

          document.addEventListener("visibilitychange", handleRefresh);
          window.addEventListener("focus", handleRefresh);

          return () => {
            document.removeEventListener("visibilitychange", handleRefresh);
            window.removeEventListener("focus", handleRefresh);
          };
        }, [loadAccount]);

        const isBusiness = accountType === "business";
        const toggleThemeMode = () => setThemeMode(window.donossTheme?.toggleTheme?.() || "dark");
        const displayAccountName = accountName || (isBusiness ? "Empresa" : "Usuario");
        const displayedDonosId = formatDonosId(transactionId);
        const categoryCountByName = React.useMemo(
          () => Object.fromEntries((categorySummary || []).map((item) => [item.category, item.count || 0])),
          [categorySummary]
        );
        const activeCategorySummary = categorySummary.filter((item) => Number(item.count || 0) > 0);
        const copyTransactionId = async () => {
          const clean = String(transactionId || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
          if (!clean) return;
          await navigator.clipboard.writeText(clean);
          setCopyStatus("Copiado");
          setTimeout(() => setCopyStatus(""), 1400);
        };

        async function loadCategoryOffers(categoryLabel) {
          setSelectedCategory(categoryLabel);
          setSelectedOffer(null);
          setIsLoadingOffers(true);
          setOffersStatus("");

          const { data, error } = await supabaseClient
            .from("business_offers")
            .select("*")
            .contains("categories", [categoryLabel])
            .order("created_at", { ascending: false });

          if (error) {
            setCategoryOffers([]);
            setOffersStatus("No se han podido cargar las ofertas ahora.");
          } else {
            const visibleOffers = (data || []).filter(isVisibleForUsers);
            setCategoryOffers(visibleOffers);
            setOffersStatus(visibleOffers.length ? "" : `Todavía no hay ofertas en ${categoryLabel}.`);
          }

          setIsLoadingOffers(false);
        }

        async function toggleLike(offer) {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent("home.html")}`;
            return;
          }

          const nextLiked = !likedOfferIds.has(offer.id);
          setLikedOfferIds((current) => {
            const next = new Set(current);
            if (nextLiked) next.add(offer.id);
            else next.delete(offer.id);
            return next;
          });
          setLikeToast(nextLiked ? "Guardado en Me gusta" : "Quitado de Me gusta");
          window.setTimeout(() => setLikeToast(""), 1500);

          const response = await fetch("/api/me/liked-offers", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ offerId: offer.id, liked: nextLiked }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            setLikedOfferIds((current) => {
              const next = new Set(current);
              if (nextLiked) next.delete(offer.id);
              else next.add(offer.id);
              return next;
            });
            setLikeToast(data.error === "liked_offers_table_missing" ? "Ejecuta el SQL de Me gusta" : "No se ha podido guardar");
            window.setTimeout(() => setLikeToast(""), 2200);
          } else if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "donos:likes-changed" }, window.location.origin);
          }
        }

        return (
	          <main className="mx-auto min-h-screen w-full max-w-6xl px-3 pb-28 pt-4 sm:px-6 lg:px-8 lg:pb-10">
            <section className="grid gap-6 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
              <div className="lg:sticky lg:top-6">
                <header className="flex items-center justify-between gap-3">
                  <div className="flex min-w-0 items-center gap-3">
                    <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow sm:h-11 sm:w-11">
                      D
                    </div>
                    <div className="min-w-0">
                      <div className="flex flex-wrap items-center gap-2">
                        <p className="text-lg font-black leading-tight">Donoss</p>
                        {isBusiness && (
                          <span className="rounded-full bg-sun px-2.5 py-1 text-[11px] font-black text-ink">
                            Soy Empresa
                          </span>
                        )}
                        <span className="max-w-[145px] truncate rounded-full border border-white/10 bg-white/[0.06] px-2.5 py-1 text-[11px] font-black text-slate-200 sm:max-w-[170px]">
                          {displayAccountName}
                        </span>
                        {accountVerified && <VerifiedBadge small />}
                      </div>
                      <p className="text-xs font-semibold text-slate-400">Inicio</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl border border-white/10 bg-white/[0.06] text-xl transition hover:bg-white/[0.1] active:scale-95 sm:h-11 sm:w-11"
                    title={themeMode === "light" ? "Cambiar a tema oscuro" : "Cambiar a tema claro"}
                    aria-label={themeMode === "light" ? "Cambiar a tema oscuro" : "Cambiar a tema claro"}
                    onClick={toggleThemeMode}
                  >
                    {themeMode === "light" ? "☀" : "◐"}
                  </button>
                </header>

                <section className="mt-5 rounded-[28px] border border-white/10 bg-white/[0.055] p-4 shadow-glow sm:mt-6 sm:rounded-[34px] sm:p-8">
                  <p className="text-xs font-bold uppercase tracking-[0.16em] text-mint sm:text-sm sm:tracking-[0.18em]">Saldo Donoss</p>
                  <div className="mt-4">
                    <p className="text-[52px] font-black leading-none tracking-normal text-white sm:text-[78px]">{formatNumber(accountPoints)}</p>
                    <p className="mt-1 text-base font-bold text-slate-300">puntos</p>
                  </div>
                  <div className="mt-5 flex flex-col items-start gap-3 rounded-3xl border border-mint/20 bg-mint/10 p-4 min-[380px]:flex-row min-[380px]:items-center min-[380px]:justify-between sm:mt-6">
                    <div className="w-full min-w-0">
                      <p className="text-xs font-semibold text-mint">ID Donoss</p>
                      <p className="mt-1 break-all font-mono text-base font-black tracking-normal text-white sm:text-lg">
                        {displayedDonosId || (isLoggedIn ? "ID no disponible" : "Inicia sesión")}
                      </p>
                    </div>
                    {displayedDonosId ? (
                      <button
                        className="shrink-0 rounded-full bg-white/10 px-4 py-2 text-xs font-black text-white ring-1 ring-white/10 transition hover:bg-white/15"
                        onClick={copyTransactionId}
                      >
                        {copyStatus || "Copiar"}
                      </button>
                    ) : (
                      <a
                        className="shrink-0 rounded-full bg-white/10 px-4 py-2 text-xs font-black text-white ring-1 ring-white/10 transition hover:bg-white/15"
                        href="login.html"
                      >
                        Login
                      </a>
                    )}
                  </div>
                </section>
              </div>

              <section className="space-y-7">
                <section>
                  <div className="flex items-end justify-between gap-3">
                    <div className="min-w-0">
                      <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Cerca de ti</p>
                      <h1 className="mt-2 max-w-full break-words text-[26px] font-black leading-tight tracking-normal text-white sm:text-3xl">
                        Aprovechar actividades culturales
                      </h1>
                    </div>
	                    {isBusiness ? (
	                      <div className="flex shrink-0 flex-wrap items-center justify-end gap-2">
	                        <a
	                          href="my-offers.html"
	                          className="hidden rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200 transition hover:bg-white/[0.1] sm:inline-flex"
	                        >
	                          Mis publicaciones
	                        </a>
	                        <a
	                          href="validate-ticket.html"
	                          className="rounded-full border border-mint/25 bg-mint/10 px-4 py-2 text-sm font-black text-mint transition hover:bg-mint/15"
	                        >
	                          Validar QR
	                        </a>
	                        <a
	                          href="admin-offer.html"
	                          className="rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                        >
                          Crear
                        </a>
                      </div>
                    ) : (
                      <button
                        className="hidden rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-bold text-slate-200 transition hover:bg-white/[0.1] sm:block"
                        onClick={() => {
                          const firstActive = activeCategorySummary[0]?.category || "Libros";
                          openFullPage(`category.html?category=${encodeURIComponent(firstActive)}`);
                        }}
                      >
                        Ver más
                      </button>
                    )}
                  </div>

                  <div className="no-scrollbar -mx-3 mt-5 flex max-w-[100vw] gap-3 overflow-x-auto px-3 pb-2 sm:mx-0 sm:gap-4 sm:px-0">
                    {categories.map((category) => (
                      <Category
                        key={category.label}
                        category={category}
                        active={selectedCategory === category.label}
                        count={homeDataReady ? categoryCountByName[category.label] : 0}
                        isReady={homeDataReady}
                        onClick={() => {
                          openFullPage(`category.html?category=${encodeURIComponent(category.label)}`);
                        }}
                      />
                    ))}
                  </div>
                </section>

                {selectedCategory && (
                  <section className="rounded-[30px] border border-white/10 bg-white/[0.04] p-4 sm:p-5">
                    <div className="mb-4 flex items-center justify-between gap-3">
                      <div>
                        <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Categoría</p>
                        <h2 className="mt-1 text-2xl font-black text-white">{selectedCategory}</h2>
                      </div>
                      <button
                        className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-bold text-slate-200"
                        onClick={() => {
                          setSelectedCategory("");
                          setCategoryOffers([]);
                          setOffersStatus("");
                        }}
                      >
                        Cerrar
                      </button>
                    </div>

                    {isLoadingOffers ? (
                      <div className="rounded-2xl border border-white/10 bg-white/[0.045] p-5 text-sm font-bold text-slate-300">
                        Cargando ofertas...
                      </div>
                    ) : offersStatus ? (
                      <div className="space-y-4">
                        <div className="rounded-2xl border border-white/10 bg-white/[0.045] p-5 text-sm font-bold text-slate-300">
                          {offersStatus}
                        </div>
                        <CategoryDiscovery
                          items={categorySummary.filter((item) => item.category !== selectedCategory)}
                          onOpenCategory={(category) => openFullPage(`category.html?category=${encodeURIComponent(category)}`)}
                        />
                      </div>
                    ) : (
                      <div className="grid gap-4 sm:grid-cols-2">
                        {categoryOffers.map((offer) => (
                          <OfferCard key={offer.id} offer={offer} onOpen={setSelectedOffer} />
                        ))}
                      </div>
                    )}
                  </section>
                )}

                <section className="pt-10 lg:pt-0">
                  <div className="mb-4 flex items-center justify-between">
                    <div>
                      <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Feed</p>
                      <h2 className="mt-1 text-2xl font-black text-white">Chollos destacados</h2>
                    </div>
                    <span className="rounded-full bg-mint/10 px-3 py-1 text-xs font-black text-mint ring-1 ring-mint/20">
                      Nuevo
                    </span>
                  </div>

                  <div className="grid gap-4 sm:grid-cols-2">
                    {!homeDataReady ? (
                      [1, 2].map((item) => (
                        <div key={item} className="overflow-hidden rounded-[26px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/20">
                          <div className="h-[150px] animate-pulse bg-gradient-to-br from-mint/20 via-white/[0.06] to-coral/20"></div>
                          <div className="space-y-3 p-4">
                            <div className="h-5 w-3/4 animate-pulse rounded-full bg-white/10"></div>
                            <div className="h-4 w-1/2 animate-pulse rounded-full bg-white/10"></div>
                            <div className="h-11 w-full animate-pulse rounded-2xl bg-white/[0.08]"></div>
                          </div>
                        </div>
                      ))
                    ) : featuredOffers.length > 0 ? (
                      featuredOffers.map((offer) => (
                        <OfferCard
                          key={offer.id}
                          offer={offer}
                          onOpen={(offer) => openFullPage(`offer-detail.html?id=${encodeURIComponent(offer.id)}`)}
                          onLike={toggleLike}
                          isLiked={likedOfferIds.has(offer.id)}
                        />
                      ))
                    ) : (
                      <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold leading-6 text-slate-300 sm:col-span-2">
                        Todavía no hay chollos destacados reales. Cuando una empresa publique ofertas, aparecerá una selección variada aquí.
                      </div>
                    )}
                  </div>
                </section>
              </section>
            </section>

            {likeToast && (
              <div className="fixed left-1/2 top-1/2 z-[60] -translate-x-1/2 -translate-y-1/2 rounded-[28px] border border-mint/25 bg-[#101522]/95 px-6 py-5 text-center shadow-2xl shadow-mint/10 backdrop-blur-2xl">
                <div className="mx-auto grid h-14 w-14 place-items-center rounded-full bg-mint text-2xl text-ink shadow-glow">♥</div>
                <p className="mt-3 whitespace-nowrap text-base font-black text-white">{likeToast}</p>
              </div>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => {
                  const badgeCount = navBadges[item.href === "historial.html" ? "historial" : ""];
                  return (
                  <a
                    key={item.label}
                    href={item.href}
                    className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${
                      item.active
                        ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]"
                        : "text-slate-400 hover:bg-white/[0.06] hover:text-white"
                    }`}
                  >
                    <NotificationBadge count={badgeCount} />
                    <NavIcon name={item.icon} />
                    <span className="mt-1">{item.label}</span>
                  </a>
                  );
                })}
              </div>
            </nav>

            <OfferDetail offer={selectedOffer} onClose={() => setSelectedOffer(null)} />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
