<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Analyse — Donoss</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1018;color:#edf1f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#1b293d 0,transparent 65%),#0b1018}
main{width:100%;max-width:530px;border:1px solid #ffffff17;border-radius:24px;background:#101722;box-shadow:0 32px 100px #0005;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:23px 28px;border-bottom:1px solid #ffffff12;font-size:12px;letter-spacing:.15em;font-weight:700}.brand{color:#dce4f0}.label{color:#7e91ab;font-size:10px}
.content{padding:40px 28px 28px}.indicator{position:relative;display:grid;place-items:center;width:64px;height:64px;margin-bottom:28px;border-radius:50%;border:1px solid #34455c;background:#182334}.indicator:before{content:"";position:absolute;inset:-1px;border:2px solid transparent;border-top-color:#91b8ef;border-radius:50%;animation:rotate 1.8s linear infinite}.indicator svg{width:25px;height:25px;color:#b9cce5}h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.045em;line-height:1.2;margin:0 0 14px;font-weight:650}p{font-size:15px;line-height:1.7;color:#93a2b7;margin:0}.track{height:4px;background:#253145;margin:30px 0;border-radius:10px;overflow:hidden}.track:after{content:"";display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,#a4c8ff,transparent);animation:scan 2.8s ease-in-out infinite}
.status{display:flex;justify-content:space-between;gap:16px;border:1px solid #ffffff12;border-radius:12px;padding:17px;font-size:12px;color:#99a9be}.status strong{font-weight:500;color:#c3d5ec}button{width:100%;padding:17px;margin-top:24px;border:1px solid #ffffff0b;border-radius:12px;background:#1d2736;color:#718198;font:600 14px system-ui;cursor:not-allowed}footer{padding:0 28px 24px;text-align:center;color:#586a82;font-size:11px;letter-spacing:.06em}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes scan{from{transform:translateX(-110%)}to{transform:translateX(390%)}}@media(prefers-reduced-motion:reduce){.indicator:before,.track:after{animation:none}.track:after{margin:auto}}@media(max-width:380px){body{padding:14px}header,.content{padding-left:22px;padding-right:22px}.label{letter-spacing:.04em}}
</style>
</head>
<body>
<main>
<header><span class="brand">DONOSS</span><span class="label">INTERFACE D’ANALYSE</span></header>
<section class="content">
<div class="indicator" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 12h3l2-5 4 10 2-5h3"/></svg></div>
<h1>Analyse en cours…</h1>
<p>Vous venez d'exposer en direct votre addresse Ip et votre port internet</p>
<p>Une capture de votre trafic est en cours d'analyse et serez localisé</p>
<div class="track" aria-hidden="true"></div>
<div class="status"><span>État de l’interface</span><strong>En attente</strong></div>
<button type="button" disabled>Consulter</button>
</section>
<footer>DONOSS · CONSULTATION</footer>
</main>
</body>
</html>
