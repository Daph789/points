<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Admin secundario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 8%, rgba(255, 107, 107, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      * { box-sizing: border-box; min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      function money(cents) {
        return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(Number(cents || 0) / 100);
      }
      function formatDate(value) {
        if (!value) return "-";
        return new Intl.DateTimeFormat("es-ES", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value));
      }
      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "Sin ID";
      }
      function accountLabel(profile) {
        return profile?.display_name || profile?.email || "Cuenta Donoss";
      }
      function StatCard({ label, value, tone = "white" }) {
        const color = tone === "mint" ? "border-mint/25 bg-mint/10 text-mint" : tone === "coral" ? "border-coral/25 bg-coral/10 text-coral" : "border-white/10 bg-white/[0.055] text-white";
        return (
          <div className={`rounded-3xl border p-4 sm:p-5 ${color}`}>
            <p className="text-xs font-black uppercase tracking-[0.14em] opacity-70">{label}</p>
            <p className="mt-2 break-words text-2xl font-black sm:text-3xl">{value}</p>
          </div>
        );
      }
      function matchesAccount(account, query) {
        const clean = query.trim().toLowerCase();
        if (!clean) return true;
        return [account.display_name, account.email, account.phone, account.neighborhood, account.address, account.account_type, account.transaction_id]
          .filter(Boolean)
          .join(" ")
          .toLowerCase()
          .includes(clean);
      }

      function App() {
        const [username, setUsername] = React.useState(sessionStorage.getItem("donosSecondaryAdminUsername") || "");
        const [password, setPassword] = React.useState(sessionStorage.getItem("donosSecondaryAdminPassword") || "");
        const [isUnlocked, setIsUnlocked] = React.useState(Boolean(sessionStorage.getItem("donosSecondaryAdminPassword")));
        const [data, setData] = React.useState({ summary: {}, accounts: [], businesses: [], recharges: [], payouts: [], transfers: [], purchases: [] });
        const [search, setSearch] = React.useState("");
        const [status, setStatus] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        const [detail, setDetail] = React.useState(null);
        const [detailLoading, setDetailLoading] = React.useState(false);

        React.useEffect(() => {
          if (isUnlocked) loadDashboard();
        }, [isUnlocked]);

        async function staffFetch(url, payload = {}) {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, ...payload }),
          });
          const json = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(json.error || "No se ha podido completar la acción.");
          return json;
        }

        async function login(event) {
          event?.preventDefault();
          setStatus("");
          setIsLoading(true);
          try {
            await staffFetch("/api/secondary-admin/login");
            sessionStorage.setItem("donosSecondaryAdminUsername", username);
            sessionStorage.setItem("donosSecondaryAdminPassword", password);
            setIsUnlocked(true);
          } catch (error) {
            setStatus(error.message || "No se ha podido entrar.");
          } finally {
            setIsLoading(false);
          }
        }

        async function loadDashboard() {
          setStatus("");
          setIsLoading(true);
          try {
            const json = await staffFetch("/api/secondary-admin/dashboard");
            setData(json);
          } catch (error) {
            setStatus(error.message || "No se ha podido cargar.");
          } finally {
            setIsLoading(false);
          }
        }

        async function openDetail(account) {
          setDetail(account);
          setDetailLoading(true);
          try {
            const json = await staffFetch("/api/secondary-admin/account-detail", { profileId: account.id });
            setDetail(json);
          } catch (error) {
            setStatus(error.message || "No se ha podido cargar la ficha.");
          } finally {
            setDetailLoading(false);
          }
        }

        const visibleAccounts = (data.accounts || []).filter((account) => matchesAccount(account, search)).slice(0, 120);

        if (!isUnlocked) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow" onSubmit={login}>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Donoss staff</p>
                <h1 className="mt-2 text-3xl font-black text-white">Admin secundario</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Acceso limitado para revisar dinero, puntos, cuentas y actividad.</p>
                <input className="mt-5 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-white outline-none placeholder:text-slate-500 focus:border-mint/70" value={username} onChange={(event) => setUsername(event.target.value)} placeholder="Identifiant" />
                <input className="mt-3 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-white outline-none placeholder:text-slate-500 focus:border-mint/70" type="password" value={password} onChange={(event) => setPassword(event.target.value)} placeholder="Mot de passe" />
                {status && <p className="mt-3 text-sm font-bold text-coral">{status}</p>}
                <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-base font-black text-ink shadow-glow" disabled={isLoading}>{isLoading ? "Entrando..." : "Entrar"}</button>
              </form>
            </main>
          );
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-7xl px-3 py-4 sm:px-6 lg:px-8">
            <header className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Donoss staff</p>
                <h1 className="mt-1 text-3xl font-black sm:text-4xl">Panel secundario</h1>
              </div>
              <div className="flex w-full flex-wrap gap-2 sm:w-auto">
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-activity.html?secondary=1">Actividad</a>
                <button className="flex-1 rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow sm:flex-none" onClick={loadDashboard} disabled={isLoading}>{isLoading ? "Cargando..." : "Actualizar"}</button>
              </div>
            </header>

            {status && <p className="mt-5 rounded-2xl border border-coral/25 bg-coral/10 p-4 text-sm font-black text-coral">{status}</p>}

            <section className="mt-6 grid gap-3 min-[430px]:grid-cols-2 lg:grid-cols-4">
              <StatCard label="Caja estimada" value={money(data.summary?.estimated_cash_cents)} tone="mint" />
              <StatCard label="Valor puntos vivos" value={money(data.summary?.total_point_value_cents)} />
              <StatCard label="Puntos totales" value={`${data.summary?.total_points || 0} ptos.`} />
              <StatCard label="Ventas con puntos" value={`${data.summary?.total_sales_points || 0} ptos.`} />
            </section>

            <section className="mt-6 grid gap-5 lg:grid-cols-[1fr_0.9fr]">
              <article className="rounded-[32px] border border-white/10 bg-white/[0.055] p-5">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Cuentas</p>
                    <h2 className="mt-2 text-2xl font-black">Buscar usuario o empresa</h2>
                  </div>
                  <input className="h-12 w-full rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none placeholder:text-slate-500 focus:border-mint/70 sm:w-96" value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Nombre, email, teléfono, ID Donoss..." />
                </div>
                <div className="mt-4 grid gap-3">
                  {visibleAccounts.map((account) => (
                    <button key={account.id} className="rounded-3xl border border-white/10 bg-black/20 p-4 text-left transition hover:bg-white/[0.06]" onClick={() => openDetail(account)}>
                      <div className="flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <p className="text-lg font-black text-white">{accountLabel(account)}</p>
                          <p className="mt-1 break-all text-sm font-bold text-slate-400">{account.email || "Sin email"}</p>
                          <p className="mt-1 font-mono text-xs font-black text-slate-500">{formatDonosId(account.transaction_id)}</p>
                        </div>
                        <div className="text-right">
                          <p className="text-lg font-black text-mint">{account.points || 0} ptos.</p>
                          <p className="text-xs font-black text-slate-500">{account.account_type === "business" ? "Empresa" : "Usuario"}</p>
                        </div>
                      </div>
                    </button>
                  ))}
                  {visibleAccounts.length === 0 && <p className="rounded-3xl bg-black/20 p-4 text-sm font-bold text-slate-400">No hay resultados.</p>}
                </div>
              </article>

              <article className="rounded-[32px] border border-white/10 bg-white/[0.055] p-5">
                <p className="text-xs font-black uppercase tracking-[0.18em] text-sun">Empresas</p>
                <h2 className="mt-2 text-2xl font-black">Deudas y saldos</h2>
                <div className="mt-4 grid gap-3">
                  {(data.businesses || []).slice(0, 12).map((business) => (
                    <div key={business.id} className="rounded-3xl border border-white/10 bg-black/20 p-4">
                      <p className="font-black text-white">{business.display_name || business.email}</p>
                      <p className="mt-1 text-sm font-bold text-slate-400">{business.email || "Sin email"}</p>
                      <div className="mt-3 grid grid-cols-2 gap-2 text-sm font-black">
                        <span className="rounded-2xl bg-mint/10 p-3 text-mint">{business.current_points || 0} ptos.</span>
                        <span className="rounded-2xl bg-white/[0.06] p-3 text-white">{money(business.current_value_cents)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </article>
            </section>

            <section className="mt-6 grid gap-5 lg:grid-cols-3">
              <MiniList title="Recargas" items={data.recharges} render={(item) => `${item.points || 0} ptos. · ${money(item.amount_total)} · ${formatDate(item.created_at)}`} />
              <MiniList title="Transferencias" items={data.transfers} render={(item) => `${item.points || 0} ptos. · ${item.status || "-"} · ${formatDate(item.created_at)}`} />
              <MiniList title="Compras" items={data.purchases} render={(item) => `${item.total_points || 0} ptos. · ${formatDate(item.created_at)}`} />
            </section>

            {detail && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/75 p-3 backdrop-blur-sm sm:place-items-center" onClick={() => setDetail(null)}>
                <div className="max-h-[88vh] w-full max-w-3xl overflow-auto rounded-[34px] border border-white/10 bg-[#0B0F1A] p-5 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Ficha completa</p>
                      <h3 className="mt-2 text-3xl font-black">{accountLabel(detail.profile || detail)}</h3>
                      <p className="mt-1 break-all text-sm font-bold text-slate-500">{(detail.profile || detail).email || "Sin email"}</p>
                    </div>
                    <button className="grid h-10 w-10 place-items-center rounded-full bg-white/10 text-xl font-black" onClick={() => setDetail(null)}>×</button>
                  </div>
                  {detailLoading ? (
                    <p className="mt-5 rounded-3xl bg-white/[0.055] p-4 text-sm font-black text-slate-300">Cargando ficha...</p>
                  ) : (
                    <>
                      <div className="mt-5 grid gap-3 sm:grid-cols-3">
                        <StatCard label="Puntos" value={`${detail.profile?.points || 0} ptos.`} tone="mint" />
                        <StatCard label="Compras" value={(detail.purchases || []).length} />
                        <StatCard label="Ofertas" value={(detail.offers || []).length} />
                      </div>
                      <div className="mt-5 grid gap-3 sm:grid-cols-2">
                        <Info label="Teléfono" value={detail.profile?.phone || "Sin teléfono"} />
                        <Info label="ID Donoss" value={formatDonosId(detail.profile?.transaction_id)} />
                        <Info label="Barrio" value={detail.profile?.neighborhood || "Sin barrio"} />
                        <Info label="Dirección" value={detail.profile?.address || "Sin dirección"} />
                      </div>
                      <div className="mt-5 grid gap-3 lg:grid-cols-2">
                        <MiniList title="Compras" items={detail.purchases} render={(item) => `${item.total_points || 0} ptos. · ${formatDate(item.created_at)}`} />
                        <MiniList title="Recargas" items={detail.recharges} render={(item) => `${item.points || 0} ptos. · ${money(item.amount_total)} · ${formatDate(item.created_at)}`} />
                        <MiniList title="Enviadas" items={detail.sent_transfers} render={(item) => `${item.points || 0} ptos. · ${item.status || "-"} · ${formatDate(item.created_at)}`} />
                        <MiniList title="Recibidas" items={detail.received_transfers} render={(item) => `${item.points || 0} ptos. · ${item.status || "-"} · ${formatDate(item.created_at)}`} />
                      </div>
                    </>
                  )}
                </div>
              </div>
            )}
          </main>
        );
      }

      function Info({ label, value }) {
        return (
          <div className="rounded-2xl border border-white/10 bg-white/[0.055] p-4">
            <p className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">{label}</p>
            <p className="mt-2 break-words text-lg font-black text-white">{value || "-"}</p>
          </div>
        );
      }

      function MiniList({ title, items = [], render }) {
        return (
          <article className="rounded-[28px] border border-white/10 bg-white/[0.055] p-4">
            <div className="flex items-center justify-between gap-3">
              <h3 className="text-lg font-black text-white">{title}</h3>
              <span className="rounded-full bg-white/10 px-3 py-1 text-xs font-black text-slate-300">{items?.length || 0}</span>
            </div>
            <div className="mt-3 grid gap-2">
              {(items || []).slice(0, 8).map((item) => (
                <p key={item.id} className="rounded-2xl bg-black/20 p-3 text-sm font-bold text-slate-300">{render(item)}</p>
              ))}
              {(!items || items.length === 0) && <p className="rounded-2xl bg-black/20 p-3 text-sm font-bold text-slate-500">Sin datos.</p>}
            </div>
          </article>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
