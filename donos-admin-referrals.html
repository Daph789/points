<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Admin referidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 8%, rgba(255, 107, 107, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>
    <script type="text/babel">
      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "Sin ID";
      }

      function formatDate(value) {
        if (!value) return "Pendiente";
        return new Intl.DateTimeFormat("es-ES", { dateStyle: "short", timeStyle: "short" }).format(new Date(value));
      }

      function Stat({ label, value, tone = "white" }) {
        const cls = tone === "mint" ? "border-mint/25 bg-mint/10 text-mint" : tone === "coral" ? "border-coral/25 bg-coral/10 text-coral" : "border-white/10 bg-white/[0.055] text-white";
        return (
          <article className={`rounded-3xl border p-4 ${cls}`}>
            <p className="text-xs font-black uppercase tracking-[0.16em] opacity-70">{label}</p>
            <p className="mt-2 text-3xl font-black">{value}</p>
          </article>
        );
      }

      function App() {
        const [password, setPassword] = React.useState(sessionStorage.getItem("donosAdminPassword") || "");
        const [isUnlocked, setIsUnlocked] = React.useState(Boolean(sessionStorage.getItem("donosAdminPassword")));
        const [groups, setGroups] = React.useState([]);
        const [summary, setSummary] = React.useState({});
        const [search, setSearch] = React.useState("");
        const [status, setStatus] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        const [rewardingId, setRewardingId] = React.useState("");

        React.useEffect(() => {
          if (isUnlocked) loadReferrals();
        }, [isUnlocked]);

        async function loadReferrals(event) {
          event?.preventDefault();
          setStatus("");
          setIsLoading(true);
          try {
            const response = await fetch("/api/admin/referrals", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "No se han podido cargar los referidos.");
            sessionStorage.setItem("donosAdminPassword", password);
            setIsUnlocked(true);
            setGroups(data.groups || []);
            setSummary(data.summary || {});
          } catch (error) {
            setStatus(error.message || "No se han podido cargar los referidos.");
          } finally {
            setIsLoading(false);
          }
        }

        async function payReward(group) {
          if (!group?.referrer?.id) return;
          const ok = window.confirm(`¿Marcar como entregado el bonus de ${group.referrer.display_name}? Esto NO cambia sus puntos en Donoss, solo confirma que ya lo gestionaste.`);
          if (!ok) return;
          setRewardingId(group.referrer.id);
          setStatus("");
          try {
            const response = await fetch("/api/admin/referrals/reward", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, referrerId: group.referrer.id, points: 100 }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              if (data.error === "reward_already_paid") throw new Error("Este bonus ya fue entregado.");
              if (data.error === "not_enough_referrals") throw new Error("Aún no tiene 5 invitados con recarga.");
              throw new Error(data.error || "No se ha podido entregar el bonus.");
            }
            setStatus("Bonus marcado como entregado. No se han añadido puntos automáticamente.");
            await loadReferrals();
          } catch (error) {
            setStatus(error.message || "No se ha podido entregar el bonus.");
          } finally {
            setRewardingId("");
          }
        }

        const filteredGroups = groups.filter((group) => {
          const query = search.trim().toLowerCase();
          if (!query) return true;
          return [
            group.referrer?.display_name,
            group.referrer_private?.email,
            group.referrer?.transaction_id,
            ...(group.referrals || []).flatMap((item) => [item.referred_profile?.display_name, item.referred_profile?.transaction_id]),
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });

        if (!isUnlocked) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow" onSubmit={loadReferrals}>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donoss</p>
                <h1 className="mt-2 text-3xl font-black text-white">Referidos</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Zona privada para gestionar invitaciones y bonus.</p>
                <input className="mt-5 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-white outline-none" type="password" value={password} onChange={(event) => setPassword(event.target.value)} placeholder="Contraseña" />
                {status && <p className="mt-3 text-sm font-bold text-coral">{status}</p>}
                <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-base font-black text-ink shadow-glow" disabled={isLoading}>{isLoading ? "Entrando..." : "Entrar"}</button>
              </form>
            </main>
          );
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-7xl px-3 py-4 sm:px-6 lg:px-8">
            <header className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donoss</p>
                <h1 className="mt-1 text-3xl font-black text-white sm:text-4xl">Compartir enlaces</h1>
              </div>
              <div className="flex w-full gap-2 sm:w-auto">
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-accounts.html">Cuentas</a>
                <button className="flex-1 rounded-full bg-mint px-4 py-2 text-sm font-black text-ink sm:flex-none" onClick={loadReferrals} disabled={isLoading}>Actualizar</button>
              </div>
            </header>

            <section className="mt-6 grid gap-3 sm:grid-cols-4">
              <Stat label="Referidos totales" value={summary.total_referrals || 0} />
              <Stat label="Con recarga" value={summary.total_completed || 0} tone="mint" />
              <Stat label="Listos para bonus" value={summary.reward_ready || 0} tone="coral" />
              <Stat label="Bonus entregados" value={summary.reward_paid || 0} />
            </section>

            <div className="mt-6 rounded-[30px] border border-white/10 bg-white/[0.055] p-4">
              <input
                className="h-14 w-full rounded-2xl border border-white/10 bg-[#0D111D] px-4 text-base font-black text-white outline-none placeholder:text-slate-500"
                value={search}
                onChange={(event) => setSearch(event.target.value)}
                placeholder="Buscar por nombre, email, ID Donoss..."
              />
            </div>

            {status && <p className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4 text-sm font-bold text-slate-200">{status}</p>}

            <section className="mt-6 grid gap-4">
              {filteredGroups.map((group) => {
                const ready = group.completed >= 5 && !group.reward_paid;
                return (
                  <article key={group.referrer?.id || Math.random()} className={`rounded-[34px] border p-4 shadow-2xl shadow-black/20 sm:p-5 ${group.reward_paid ? "border-mint/20 bg-mint/10" : ready ? "border-coral/25 bg-coral/10" : "border-white/10 bg-white/[0.055]"}`}>
                    <div className="flex flex-wrap items-start justify-between gap-4">
                      <div className="min-w-0">
                        <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Propietario del enlace</p>
                        <h2 className="mt-2 text-2xl font-black text-white">{group.referrer?.display_name || "Cuenta Donoss"}</h2>
                        <p className="mt-1 text-sm font-bold text-slate-400">{group.referrer_private?.email || "Sin email"} · {formatDonosId(group.referrer?.transaction_id)}</p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="rounded-full bg-white/10 px-4 py-2 text-sm font-black text-white">{group.completed}/5 con recarga</span>
                        <button
                          className={`rounded-full px-4 py-2 text-sm font-black ${ready ? "bg-mint text-ink shadow-glow" : "bg-white/10 text-slate-400"}`}
                          disabled={!ready || rewardingId === group.referrer?.id}
                          onClick={() => payReward(group)}
                        >
                          {group.reward_paid ? "Bonus confirmado" : rewardingId === group.referrer?.id ? "Guardando..." : "Marcar bonus dado"}
                        </button>
                      </div>
                    </div>
                    <div className="mt-4 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
                      {(group.referrals || []).map((item) => (
                        <div key={item.id} className="rounded-3xl border border-white/10 bg-[#0D111D] p-3">
                          <div className="flex items-start justify-between gap-3">
                            <div className="min-w-0">
                              <p className="truncate text-sm font-black text-white">{item.referred_profile?.display_name || "Cuenta Donoss"}</p>
                              <p className="mt-1 font-mono text-xs font-black text-slate-500">{formatDonosId(item.referred_profile?.transaction_id)}</p>
                            </div>
                            <span className={`shrink-0 rounded-full px-2.5 py-1 text-[11px] font-black ${item.referred_recharged_at ? "bg-mint text-ink" : "bg-white/10 text-slate-300"}`}>
                              {item.referred_recharged_at ? "Recargó" : "Solo cuenta"}
                            </span>
                          </div>
                          <p className="mt-3 text-xs font-bold text-slate-500">Registro: {formatDate(item.created_at)}</p>
                          {item.referred_recharged_at && <p className="mt-1 text-xs font-bold text-mint">Recarga: {formatDate(item.referred_recharged_at)}</p>}
                        </div>
                      ))}
                    </div>
                  </article>
                );
              })}
              {filteredGroups.length === 0 && (
                <p className="rounded-[30px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-400">Todavía no hay referidos.</p>
              )}
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
