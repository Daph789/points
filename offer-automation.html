<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Automatización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 10%, rgba(56, 189, 248, 0.14), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .25; } }
      .blink { animation: blink 1s infinite; }
      @keyframes scanline { 0% { transform: translateY(-110%); opacity: 0; } 18%, 72% { opacity: .55; } 100% { transform: translateY(360%); opacity: 0; } }
      .scanline::before {
        content: "";
        position: absolute;
        inset: 0;
        height: 42px;
        background: linear-gradient(180deg, transparent, rgba(66, 242, 179, .16), transparent);
        animation: scanline 2.8s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;
      }

      function formatDate(value) {
        if (!value) return "";
        return new Date(value).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" });
      }

      function RequestCard({ item }) {
        const completed = item.status === "completed";
        return (
          <article className={`rounded-[28px] border p-4 sm:p-5 ${completed ? "border-mint/25 bg-mint/10" : "border-sun/25 bg-sun/10"}`}>
            <div className="flex flex-wrap items-start justify-between gap-3">
              <div className="min-w-0">
                <p className={`text-xs font-black uppercase tracking-[0.16em] ${completed ? "text-mint" : "text-sun"}`}>
                  {completed ? "Completada" : "En preparación"}
                </p>
                <p className="mt-2 break-all text-sm font-bold text-slate-300">{item.source_url}</p>
                <p className="mt-2 text-xs font-bold text-slate-500">Solicitada: {formatDate(item.created_at)}</p>
              </div>
              {completed && item.result_offer_url && (
                <a className="rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow" href={item.result_offer_url}>
                  Ver oferta
                </a>
              )}
            </div>
            {item.admin_note && <p className="mt-3 rounded-2xl bg-black/20 p-3 text-sm font-semibold text-slate-300">{item.admin_note}</p>}
          </article>
        );
      }

      function App() {
        const [sourceUrl, setSourceUrl] = React.useState("");
        const [prefersExternalCheckout, setPrefersExternalCheckout] = React.useState(false);
        const [requests, setRequests] = React.useState([]);
        const [status, setStatus] = React.useState("Cargando automatización...");
        const [formStatus, setFormStatus] = React.useState({ type: "", message: "" });
        const [isSending, setIsSending] = React.useState(false);
        const [token, setToken] = React.useState("");
        const [activeLine, setActiveLine] = React.useState(0);

        const pendingRequest = requests.find((item) => item.status === "pending");
        const formLocked = Boolean(pendingRequest) || isSending;
        const visibleSourceUrl = pendingRequest?.source_url || sourceUrl;
        const processStarted = Boolean(pendingRequest) || isSending;
        const consoleLines = processStarted
          ? [
              "iniciando lectura del enlace...",
              "verificando cuenta empresa...",
              "copiando título, fechas e imágenes...",
              "comparando datos principales...",
              "preparando publicación Donoss...",
              "sincronizando estado de la oferta...",
            ]
          : [
              "esperando enlace...",
              "sistema listo para copiar datos",
              "estado: disponible",
            ];

        React.useEffect(() => {
          const timer = setInterval(() => {
            setActiveLine((current) => (current + 1) % consoleLines.length);
          }, processStarted ? 1050 : 1600);
          return () => clearInterval(timer);
        }, [consoleLines.length, processStarted]);

        React.useEffect(() => {
          loadRequests();
        }, []);

        async function loadRequests() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          if (!accessToken) {
            redirectToLogin();
            return;
          }
          setToken(accessToken);

          try {
            const response = await fetch("/api/me/offer-automation-requests", {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "requests_failed");
            setRequests(data.requests || []);
            const pending = (data.requests || []).find((item) => item.status === "pending");
            if (pending) {
              setSourceUrl(pending.source_url || "");
              setPrefersExternalCheckout(Boolean(pending.prefers_external_checkout));
            }
            setStatus("");
          } catch (error) {
            setStatus(error.message === "offer_automation_sql_missing"
              ? "Falta ejecutar el SQL de automatización en Supabase."
              : "No se han podido cargar tus solicitudes.");
          }
        }

        async function submitRequest(event) {
          event.preventDefault();
          setFormStatus({ type: "", message: "" });
          if (pendingRequest) {
            setFormStatus({ type: "error", message: "Ya tienes una publicación en preparación. Podrás enviar otra cuando esta esté terminada." });
            return;
          }
          setIsSending(true);

          try {
            new URL(sourceUrl.trim());
            const response = await fetch("/api/me/offer-automation-requests", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ sourceUrl: sourceUrl.trim(), prefersExternalCheckout }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "create_failed");
            setRequests((current) => [data.request, ...current]);
            setSourceUrl(data.request?.source_url || sourceUrl.trim());
            setPrefersExternalCheckout(Boolean(data.request?.prefers_external_checkout));
            setFormStatus({ type: "success", message: "Enlace recibido. La verificación de cuenta y la copia de datos ya están en curso." });
          } catch (error) {
            setFormStatus({
              type: "error",
              message: error.message === "offer_automation_sql_missing"
                ? "Falta ejecutar el SQL de automatización en Supabase."
                : error.message === "automation_request_already_pending"
                  ? "Ya tienes una publicación en preparación. Podrás enviar otra cuando esta esté terminada."
                : "Pega un enlace válido para enviar la solicitud.",
            });
          } finally {
            setIsSending(false);
          }
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-6xl px-4 py-5 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="create-offer.html" className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200">Volver</a>
              <a href="my-offers.html" className="rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow">Mis publicaciones</a>
            </header>

            <section className="mt-8 grid gap-5 lg:grid-cols-[1fr_460px]">
              <div className="rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow sm:p-8">
                <p className="text-sm font-black uppercase tracking-[0.18em] text-sky-300">Automatización</p>
                <h1 className="mt-3 text-4xl font-black leading-tight text-white sm:text-5xl">Copiar una publicación desde tu web</h1>
                <p className="mt-4 text-base font-semibold leading-7 text-slate-400">
                  Pega el enlace directo de tu billete u oferta. Donoss verificará tu cuenta, leerá los datos principales y te avisará cuando la publicación esté lista.
                </p>

                <form className="mt-7 grid gap-4" onSubmit={submitRequest}>
                  <label>
                    <span className="mb-2 block text-sm font-bold text-slate-300">Enlace de la página a copiar</span>
                    <input
                      className={`h-14 w-full rounded-2xl border border-white/10 bg-black/20 px-4 text-base font-bold text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10 ${formLocked ? "cursor-not-allowed opacity-70" : ""}`}
                      value={visibleSourceUrl}
                      onChange={(event) => setSourceUrl(event.target.value)}
                      disabled={formLocked}
                      placeholder="https://tuweb.com/evento/billete..."
                    />
                  </label>
                  <label className={`flex items-start gap-3 rounded-2xl border p-4 transition ${formLocked ? "cursor-not-allowed opacity-70" : "cursor-pointer"} ${prefersExternalCheckout ? "border-mint/40 bg-mint/10" : "border-white/10 bg-black/20"}`}>
                    <input
                      type="checkbox"
                      className="mt-1 h-5 w-5 rounded border-line bg-panel accent-mint"
                      checked={prefersExternalCheckout}
                      disabled={formLocked}
                      onChange={(event) => setPrefersExternalCheckout(event.target.checked)}
                    />
                    <span>
                      <span className="block text-sm font-black text-white">Prefiero que el cliente compre finalmente en mi web</span>
                      <span className="mt-1 block text-xs font-semibold leading-5 text-slate-400">
                        Si no marcas esta opción, recibirás el dinero directamente dentro de Donoss cuando los clientes paguen con puntos.
                      </span>
                    </span>
                  </label>
                  <button className="h-14 rounded-2xl bg-mint text-base font-black text-ink shadow-glow disabled:opacity-50" disabled={formLocked || !sourceUrl.trim()}>
                    {isSending ? "Enviando..." : pendingRequest ? "Publicación en preparación" : "Enviar solicitud"}
                  </button>
                </form>

                {formStatus.message && (
                  <p className={`mt-4 rounded-2xl border p-4 text-sm font-bold ${formStatus.type === "success" ? "border-mint/25 bg-mint/10 text-mint" : "border-coral/25 bg-coral/10 text-coral"}`}>
                    {formStatus.message}
                  </p>
                )}
              </div>

              <aside className="rounded-[34px] border border-white/10 bg-[#080c17] p-5 shadow-2xl shadow-black/30">
                <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Estado</p>
                {processStarted && (
                  <p className="mt-3 rounded-2xl border border-mint/25 bg-mint/10 p-3 text-sm font-black text-mint">
                    Verificación de cuenta y copia de los datos<span className="blink">...</span>
                  </p>
                )}
                <p className="mt-4 text-sm font-semibold leading-6 text-slate-400">
                  Para publicar varias ofertas a la vez y acelerar la publicación automática, pasa al modo premium desde tu perfil.
                </p>
                <div className="scanline relative mt-5 min-h-[168px] overflow-hidden rounded-2xl border border-white/10 bg-black/30 p-4 font-mono text-xs text-slate-300">
                  {consoleLines.map((line, index) => (
                    <p
                      key={line}
                      className={`relative z-10 py-1 transition-all duration-500 ${
                        index === activeLine ? "translate-x-1 text-mint" : index < activeLine ? "text-slate-500" : "text-slate-300"
                      }`}
                    >
                      $ {line}
                    </p>
                  ))}
                </div>
              </aside>
            </section>

            <section className="mt-6">
              <div className="mb-4 flex items-end justify-between gap-3">
                <div>
                  <p className="text-sm font-black uppercase tracking-[0.18em] text-mint">Seguimiento</p>
                  <h2 className="mt-2 text-2xl font-black text-white">Tus solicitudes</h2>
                </div>
                <button className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200" onClick={loadRequests}>Actualizar</button>
              </div>
              <div className="grid gap-3">
                {status ? (
                  <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-5 text-sm font-bold text-slate-300">{status}</div>
                ) : requests.length ? (
                  requests.map((item) => <RequestCard key={item.id} item={item} />)
                ) : (
                  <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-5 text-sm font-bold text-slate-300">
                    Todavía no has enviado ninguna solicitud.
                  </div>
                )}
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
