      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;

      function formatDate(value) {
        if (!value) return "";
        return new Date(value).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
      }

      function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function planTitle(plan) {
        return plan.title || plan.purchase?.offer?.title || "Plan Donoss";
      }

      function isFreePlan(plan) {
        return (plan?.plan_type || "ticket") === "free";
      }

      const FREE_PLAN_CATEGORIES = ["Estudiar", "Pasear", "Tomar algo", "Deporte", "Idiomas", "Fotos", "Meditar", "Otro"];

      function ticketImage(ticket) {
        return ticket?.offer?.cover_photo_data_url || ticket?.offer?.presentation_image_data_urls?.[0] || "";
      }

      function planPhotos(plan) {
        const photos = Array.isArray(plan?.photo_data_urls) ? plan.photo_data_urls : [];
        if (photos.length > 0) return photos;
        return plan?.photo_data_url ? [plan.photo_data_url] : [];
      }

      function offerImages(ticket) {
        return [
          ticket?.offer?.cover_photo_data_url,
          ...(Array.isArray(ticket?.offer?.presentation_image_data_urls) ? ticket.offer.presentation_image_data_urls : []),
        ].filter(Boolean);
      }

      function offerMerchant(ticket) {
        return ticket?.offer?.business_display_name || ticket?.receiver?.display_name || "Donoss";
      }

      function offerCategories(ticket) {
        const categories = ticket?.offer?.categories || ticket?.offer?.category || "";
        return Array.isArray(categories) ? categories.join(", ") : String(categories || "");
      }

      function offerDateRange(ticket) {
        const start = ticket?.offer?.start_date ? formatDate(ticket.offer.start_date) : "";
        const end = ticket?.offer?.end_date ? formatDate(ticket.offer.end_date) : "";
        if (start && end) return `${start} - ${end}`;
        return start || end || "";
      }

      function offerDetailUrl(ticket) {
        return ticket?.offer?.id ? `offer-detail.html?id=${ticket.offer.id}` : "home.html";
      }

      function openOfferDetailInApp(event, ticket) {
        const offerId = ticket?.offer?.id || ticket?.offer_id;
        if (!isEmbeddedPlans || !offerId || window.parent === window) return;
        event.preventDefault();
        window.parent.postMessage({ type: "donos:offer-detail", id: offerId }, window.location.origin);
      }

      function statusLabel(value) {
        const labels = { open: "Abierto", confirmed: "Confirmado", cancelled: "Cancelado", accepted: "Aceptado", waiting: "Lista de espera", removed: "Retirado" };
        return labels[value] || value || "";
      }

      function genderLabel(value) {
        return value === "woman" ? "Chica" : value === "man" ? "Chico" : "Libre";
      }

          free_social_plans_sql_missing: "Falta activar Planes libres en Supabase. Ejecuta supabase-free-social-plans.sql.",
          free_plan_location_required: "Indica dónde será el plan libre.",
          free_plan_date_required: "Elige una fecha válida para el plan libre.",
          purchases_table_missing: "Falta activar el SQL de pagos en Supabase.",
          purchase_already_has_plan: "Este billete ya tiene un plan activo.",
          purchase_not_found: "No encontramos este billete en tu cuenta.",
          photo_too_large: "La foto es demasiado pesada. Prueba con otra imagen.",
          invalid_group_size: "Indica entre 1 y 20 plazas para el grupo.",

      async function fileToDataUrl(file) {
        if (!file) return "";
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function compressImageToDataUrl(file, maxSide = 960, quality = 0.78) {
        if (!file) return "";
        if (!file.type?.startsWith("image/")) throw new Error("invalid_image");

        const originalUrl = URL.createObjectURL(file);
        try {
          const image = await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = originalUrl;
          });

          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const width = Math.max(1, Math.round(image.width * scale));
          const height = Math.max(1, Math.round(image.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d");
          context.drawImage(image, 0, 0, width, height);
          return canvas.toDataURL("image/jpeg", quality);
        } finally {
          URL.revokeObjectURL(originalUrl);
        }
      }

              <div className="absolute bottom-4 left-4 right-4">

                  {plan.is_expired && <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">Caducado</span>}

                  {plan.viewer_member && <span className="rounded-full bg-white/15 px-3 py-1 text-xs font-black text-white">{statusLabel(plan.viewer_member.status)}</span>}

              {plan.message && <p className="mt-3 overflow-hidden text-ellipsis text-sm font-semibold leading-6 text-slate-300" style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}>{plan.message}</p>}

                </div>
              )}
              <div className={`mt-4 grid gap-2 ${plan.is_owner && plan.status === "open" ? "grid-cols-3" : "grid-cols-2"}`}>
                <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" onClick={() => onOpen(plan)}>Ver grupo</button>
                {plan.is_owner && plan.status === "open" && <button className="h-12 rounded-2xl border border-mint/25 bg-mint/10 text-sm font-black text-mint" onClick={() => onEdit(plan)}>Editar</button>}
                <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={plan.is_owner || plan.viewer_member || plan.status !== "open"} onClick={() => onJoin(plan)}>
                  {plan.viewer_member ? statusLabel(plan.viewer_member.status) : plan.is_owner ? "Tu plan" : "Voy contigo"}
                </button>
              </div>
              {canChat && (
                <button
                  className="mt-2 h-12 w-full rounded-2xl border border-mint/25 bg-mint/10 text-sm font-black text-mint"
                  onClick={() => onChat(plan)}
                  onPointerEnter={() => onWarmChat?.(plan)}
                  onTouchStart={() => onWarmChat?.(plan)}
                >
                  Chatear con el grupo{chatUnreadCount > 0 ? ` · +${chatUnreadCount > 9 ? "9" : chatUnreadCount}` : ""}
                </button>
              )}
              {canOpenSideGroup && (
                <button
                  className="mt-2 h-12 w-full rounded-2xl border border-sun/25 bg-sun/10 text-sm font-black text-sun"
                  onClick={() => onSideGroup(plan, sideStatus)}
                  onPointerEnter={() => onWarmSideGroup?.(plan, sideStatus)}
                  onTouchStart={() => onWarmSideGroup?.(plan, sideStatus)}
                >
                  {sideStatus === "waiting" ? "Ver grupo alternativo" : "Ver grupo aparte"}{sideUnreadCount > 0 ? ` · +${sideUnreadCount > 9 ? "9" : sideUnreadCount}` : ""}
                </button>
              )}
            </div>
          </article>
        );
      }

      function App() {
        const [profile, setProfile] = React.useState(null);
        const [token, setToken] = React.useState("");
        const initialMode = new URLSearchParams(window.location.search).get("tab");
        const [mode, setMode] = React.useState(["discover", "create", "mine", "joined"].includes(initialMode) ? initialMode : "discover");
        const [plans, setPlans] = React.useState([]);
        const [ownedPlans, setOwnedPlans] = React.useState([]);
        const [joinedPlans, setJoinedPlans] = React.useState([]);
        const [editingPlanId, setEditingPlanId] = React.useState("");
        const [tickets, setTickets] = React.useState([]);
        const [selectedTicketId, setSelectedTicketId] = React.useState("");
        const [planType, setPlanType] = React.useState("ticket");
        const [freeCategory, setFreeCategory] = React.useState("Estudiar");
        const [customFreeCategory, setCustomFreeCategory] = React.useState("");
        const [freeLocation, setFreeLocation] = React.useState("");
        const [freeEventDate, setFreeEventDate] = React.useState(new Date().toISOString().slice(0, 10));
        const [freeCoverDataUrl, setFreeCoverDataUrl] = React.useState("");
        const [ticketPickerOpen, setTicketPickerOpen] = React.useState(false);
        const [ticketQuery, setTicketQuery] = React.useState("");
        const [title, setTitle] = React.useState("");
        const [message, setMessage] = React.useState("");
        const [photoDataUrls, setPhotoDataUrls] = React.useState([]);
        const [maxPeople, setMaxPeople] = React.useState("");
        const [freePreference, setFreePreference] = React.useState(true);
        const [wantedWomen, setWantedWomen] = React.useState(0);
        const [wantedMen, setWantedMen] = React.useState(0);
        const [joinPlan, setJoinPlan] = React.useState(null);
        const [purchaseRequiredPlan, setPurchaseRequiredPlan] = React.useState(null);
        const [photoGatePlan, setPhotoGatePlan] = React.useState(null);
        const [planProfilePhotos, setPlanProfilePhotos] = React.useState([]);
        const [joinGender, setJoinGender] = React.useState("open");
        const [joinNote, setJoinNote] = React.useState("");
        const [detailPlan, setDetailPlan] = React.useState(null);
        const [memberFilter, setMemberFilter] = React.useState("accepted");
        const [status, setStatus] = React.useState("");
        const [isSaving, setIsSaving] = React.useState(false);
        const [actionToast, setActionToast] = React.useState(null);
        const [cancelPromptPlan, setCancelPromptPlan] = React.useState(null);
        const [notificationEvents, setNotificationEvents] = React.useState([]);
        const [notificationCounts, setNotificationCounts] = React.useState({ sections: {}, subsections: {} });
        const [readKeys, setReadKeys] = React.useState(new Set());
        const warmedChatIdsRef = React.useRef(new Set());
        const warmedSideKeysRef = React.useRef(new Set());
        const createFormRef = React.useRef(null);

        React.useEffect(() => {
          bootstrap();
        }, []);

        React.useEffect(() => {
          warmVisibleChats();
        }, [plans, ownedPlans, joinedPlans, notificationEvents.length, mode]);

        async function api(path, options = {}) {
          const response = await fetch(path, {
            ...options,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
              ...(options.headers || {}),
            },
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "request_failed");
          return data;
        }

        async function bootstrap() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          if (!accessToken) return redirectToLogin();
          setToken(accessToken);
          try {
            const profileResponse = await fetch("/api/me/profile", { headers: { Authorization: `Bearer ${accessToken}` } });
            const profileData = await profileResponse.json().catch(() => ({}));
            setProfile(profileData.profile || null);
            if (profileData.profile?.account_type === "business") {
              setStatus("");
              return;
            }
            if (["woman", "man"].includes(profileData.profile?.plan_gender_preference)) {
              setJoinGender(profileData.profile.plan_gender_preference);
            }
            await Promise.all([loadPlans(accessToken), loadMine(accessToken), loadTickets(accessToken), loadPlanProfilePhotos(accessToken), loadNotifications(accessToken)]);
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido cargar Quedar."));
          }
        }

        async function loadNotifications(accessToken = token) {
          const response = await fetch("/api/me/notifications", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) return;
          setNotificationEvents(data.events || []);
          setNotificationCounts(data.counts || { sections: {}, subsections: {} });
          setReadKeys(new Set((data.events || []).filter((event) => event.read).map((event) => event.key)));
        }

        async function loadPlans(accessToken = token) {
          const response = await fetch("/api/social-plans", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "plans_failed");
          setPlans(data.plans || []);
          setStatus("");
        }

        async function loadMine(accessToken = token) {
          const response = await fetch("/api/social-plans/me", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "mine_failed");
          setOwnedPlans(data.owned || []);
          setJoinedPlans(data.joined || []);
        }

        async function loadTickets(accessToken = token) {
          const response = await fetch("/api/me/plan-tickets", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "tickets_failed");
          setTickets(data.tickets || []);
        }

        async function loadPlanProfilePhotos(accessToken = token) {
          const response = await fetch("/api/me/plan-photos", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "plan_photos_failed");
          const photos = data.photos || [];
          setPlanProfilePhotos(photos);
          setPhotoDataUrls((current) => current.length ? current : photos);
        }

        async function reloadAll() {
          await Promise.all([loadPlans(), loadMine(), loadTickets(), loadPlanProfilePhotos(), loadNotifications()]);
        }

        function unreadEventsFor(subsection) {
          return notificationEvents.filter((event) => event.section === "quedar" && event.subsection === subsection && !readKeys.has(event.key));
        }

        function unreadCount(subsection) {
          return unreadEventsFor(subsection).length || notificationCounts.subsections?.[`quedar:${subsection}`] || 0;
        }

        function chatUnreadEventsForPlan(planId) {
          return notificationEvents.filter((event) => event.section === "quedar" && event.kind === "chat" && event.plan_id === planId && !readKeys.has(event.key));
        }

        function chatUnreadCountForPlan(planId) {
          return chatUnreadEventsForPlan(planId).length;
        }

        function sideUnreadEventsForPlan(planId, status) {
          return notificationEvents.filter((event) => event.section === "quedar" && String(event.kind || "").startsWith("side_") && event.plan_id === planId && event.side_status === status && !readKeys.has(event.key));
        }

        function sideUnreadCountForPlan(planId, status) {
          return sideUnreadEventsForPlan(planId, status).length;
        }

        function canUseMainChat(plan) {
          return Boolean(plan?.id && (plan.is_owner || plan.viewer_member?.status === "accepted"));
        }

        function sideStatusForPlan(plan) {
          return ["waiting", "removed"].includes(plan?.viewer_member?.status) ? plan.viewer_member.status : "";
        }

        function canUseSideGroup(plan) {
          return Boolean(plan?.id && plan.status === "confirmed" && sideStatusForPlan(plan));
        }

        function warmPlanChat(plan) {
          if (!isEmbeddedPlans || window.parent === window || !canUseMainChat(plan)) return;
          if (warmedChatIdsRef.current.has(plan.id)) return;
          warmedChatIdsRef.current.add(plan.id);
          window.parent.postMessage({ type: "donos:prefetch-plan-chat", id: plan.id }, window.location.origin);
        }

        function warmSideGroup(plan, status = sideStatusForPlan(plan)) {
          if (!isEmbeddedPlans || window.parent === window || !canUseSideGroup(plan)) return;
          const key = `${plan.id}:${status}`;
          if (warmedSideKeysRef.current.has(key)) return;
          warmedSideKeysRef.current.add(key);
          window.parent.postMessage({ type: "donos:prefetch-side-group", id: plan.id, status }, window.location.origin);
        }

        function warmVisibleChats() {
          if (!isEmbeddedPlans || window.parent === window) return;
          const visibleByMode =
            mode === "mine"
              ? ownedPlans
              : mode === "joined"
                ? joinedPlans
                : [...joinedPlans, ...ownedPlans, ...plans];
          const uniquePlans = [...new Map(visibleByMode.filter(Boolean).map((plan) => [plan.id, plan])).values()];
          uniquePlans
            .sort((first, second) => {
              const firstUnread = chatUnreadCountForPlan(first.id) + sideUnreadCountForPlan(first.id, sideStatusForPlan(first));
              const secondUnread = chatUnreadCountForPlan(second.id) + sideUnreadCountForPlan(second.id, sideStatusForPlan(second));
              return secondUnread - firstUnread;
            })
            .slice(0, 4)
            .forEach((plan) => {
              warmPlanChat(plan);
              warmSideGroup(plan);
            });
        }

        async function markQuedarSubsectionRead(subsection) {
          const keys = unreadEventsFor(subsection).filter((event) => event.kind !== "chat" && !String(event.kind || "").startsWith("side_")).map((event) => event.key).filter(Boolean);
          if (keys.length === 0) return;
          setReadKeys((current) => new Set([...current, ...keys]));
          const response = await fetch("/api/me/notifications/read", {
            method: "POST",
            keepalive: true,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ keys }),
          });
          if (response.ok) loadNotifications();
        }

        async function markPlanChatRead(planId) {
          const keys = chatUnreadEventsForPlan(planId).map((event) => event.key).filter(Boolean);
          if (keys.length === 0) return;
          setReadKeys((current) => new Set([...current, ...keys]));
          await fetch("/api/me/notifications/read", {
            method: "POST",
            keepalive: true,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ keys }),
          });
          loadNotifications();
        }

        async function markSideGroupRead(planId, status) {
          const keys = sideUnreadEventsForPlan(planId, status).map((event) => event.key).filter(Boolean);
          if (keys.length === 0) return;
          setReadKeys((current) => new Set([...current, ...keys]));
          await fetch("/api/me/notifications/read", {
            method: "POST",
            keepalive: true,
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ keys }),
          });
          loadNotifications();
        }

        function openPlanChat(plan) {
          if (!plan?.id) return;
          markPlanChatRead(plan.id);
          if (isEmbeddedPlans && window.parent !== window) {
            window.parent.postMessage({ type: "donos:plan-chat", id: plan.id }, window.location.origin);
            return;
          }
          window.location.href = `plan-chat.html?id=${encodeURIComponent(plan.id)}`;
        }

        function openSideGroup(plan, status) {
          if (!plan?.id || !status) return;
          markSideGroupRead(plan.id, status);
          if (isEmbeddedPlans && window.parent !== window) {
            window.parent.postMessage({ type: "donos:side-group", id: plan.id, status }, window.location.origin);
            return;
          }
          window.location.href = `side-group.html?id=${encodeURIComponent(plan.id)}&status=${encodeURIComponent(status)}`;
        }

        async function syncPlanPhotos(nextPhotos, options = {}) {
          const cleanPhotos = [...new Set((nextPhotos || []).filter(Boolean))].slice(0, 5);
          setPhotoDataUrls(cleanPhotos);
          setPlanProfilePhotos(cleanPhotos);
          if (!token) return cleanPhotos;
          try {
            const response = await fetch("/api/me/plan-photos", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ photos: cleanPhotos }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "plan_photos_failed");
            const savedPhotos = data.photos || [];
            setPhotoDataUrls(savedPhotos);
            setPlanProfilePhotos(savedPhotos);
            if (!options.silent) setStatus("Fotos actualizadas en tu perfil.");
            return savedPhotos;
          } catch (error) {
            setStatus(error.message === "plan_photos_sql_missing" ? "Falta ejecutar el SQL de fotos para planes." : "No se han podido guardar tus fotos en el perfil.");
            return cleanPhotos;
          }
        }

        async function handlePhoto(event) {
          const files = Array.from(event.target.files || []).slice(0, 5 - photoDataUrls.length);
          if (files.length === 0) return;
          if (files.some((file) => file.size > 8 * 1024 * 1024)) {
            setStatus("La foto es demasiado grande. Usa una foto de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressedPhotos = await Promise.all(files.map((file) => compressImageToDataUrl(file, 820, 0.72)));
            if (compressedPhotos.some((photo) => photo.length > 1200000)) {
              setStatus("La foto sigue siendo demasiado pesada. Prueba con otra imagen más ligera.");
              event.target.value = "";
              return;
            }
            const nextPhotos = [...photoDataUrls, ...compressedPhotos].slice(0, 5);
            await syncPlanPhotos(nextPhotos, { silent: true });
            setStatus("");
          } catch (error) {
            setStatus("No se ha podido preparar la foto. Prueba con otra imagen.");
          } finally {
            event.target.value = "";
          }
        }

        async function handleFreeCoverPhoto(event) {
          const file = Array.from(event.target.files || [])[0];
          if (!file) return;
          if (file.size > 8 * 1024 * 1024) {
            setStatus("La portada es demasiado grande. Usa una imagen de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressedPhoto = await compressImageToDataUrl(file, 1100, 0.76);
            if (compressedPhoto.length > 1400000) {
              setStatus("La portada sigue siendo demasiado pesada. Prueba con otra imagen más ligera.");
              event.target.value = "";
              return;
            }
            setFreeCoverDataUrl(compressedPhoto);
            setStatus("");
          } catch (_error) {
            setStatus("No se ha podido preparar la portada. Prueba con otra imagen.");
          } finally {
            event.target.value = "";
          }
        }

        async function handlePlanProfilePhotoUpload(event) {
          const files = Array.from(event.target.files || []).slice(0, 5 - planProfilePhotos.length);
          if (files.length === 0) return;
          if (files.some((file) => file.size > 8 * 1024 * 1024)) {
            setStatus("Una foto es demasiado grande. Usa una foto de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressedPhotos = await Promise.all(files.map((file) => compressImageToDataUrl(file, 900, 0.76)));
            setPlanProfilePhotos((current) => [...current, ...compressedPhotos].slice(0, 5));
            setStatus("");
          } catch (_error) {
            setStatus("No se han podido preparar las fotos.");
          } finally {
            event.target.value = "";
          }
        }

        async function savePlanProfilePhotos() {
          if (planProfilePhotos.length < 2) {
            setStatus("Añade mínimo 2 fotos para participar en planes con más gente.");
            return false;
          }
          try {
            const response = await fetch("/api/me/plan-photos", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ photos: planProfilePhotos }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "plan_photos_failed");
            setPlanProfilePhotos(data.photos || []);
            setStatus("");
            return true;
          } catch (error) {
            setStatus(error.message === "plan_photos_sql_missing" ? "Falta ejecutar el SQL de fotos para planes." : "No se han podido guardar tus fotos.");
            return false;
          }
        }

        async function createPlan() {
          const today = new Date().toISOString().slice(0, 10);
          if (planType === "ticket" && !selectedTicketId) {
            setStatus("Elige un billete para crear el plan.");
            return;
          }
          if (planType === "free") {
            const category = freeCategory === "Otro" ? customFreeCategory.trim() : freeCategory;
            if (!category) {
              setStatus("Escribe la categoría del plan libre.");
              return;
            }
            if (!freeLocation.trim()) {
              setStatus("Indica dónde será el plan libre.");
              return;
            }
            if (!freeEventDate || freeEventDate < today) {
              setStatus("Elige una fecha de hoy o posterior para el plan libre.");
              return;
            }
          }
          if (photoDataUrls.length < 2) {
            setStatus("Añade mínimo 2 fotos tuyas. Se guardarán en tu perfil y solo las verá la gente autorizada.");
            return;
          }
          const totalWanted = Math.max(Math.floor(Number(maxPeople || 0)), 0);
          const womenWanted = freePreference ? 0 : Math.max(Math.floor(Number(wantedWomen || 0)), 0);
          const menWanted = freePreference ? 0 : Math.max(Math.floor(Number(wantedMen || 0)), 0);
          const openWanted = freePreference ? totalWanted : Math.max(totalWanted - womenWanted - menWanted, 0);
          if (totalWanted <= 0) return setStatus("Indica cuántas personas pueden apuntarse como máximo.");
          if (totalWanted > 20) return setStatus("El máximo para un plan es de 20 personas.");
          if (!freePreference && womenWanted + menWanted > totalWanted) return setStatus("La suma de chicas y chicos no puede superar el máximo de personas.");
          setIsSaving(true);
          setStatus("");
          try {
            const savedPhotos = await syncPlanPhotos(photoDataUrls, { silent: true });
            if (savedPhotos.length < 2) {
              setStatus("Añade mínimo 2 fotos tuyas para publicar el plan.");
              setIsSaving(false);
              return;
            }
            await api(editingPlanId ? `/api/social-plans/${editingPlanId}` : "/api/social-plans", {
              method: editingPlanId ? "PATCH" : "POST",
              body: JSON.stringify({
                planType,
                purchaseId: planType === "ticket" ? selectedTicketId : "",
                freeCategory: planType === "free" && freeCategory === "Otro" ? customFreeCategory : freeCategory,
                location: freeLocation,
                eventDate: freeEventDate,
                freeCoverDataUrl,
                title,
                message,
                photoDataUrls: savedPhotos,
                wantedWomen: womenWanted,
                wantedMen: menWanted,
                wantedOpen: openWanted,
              }),
            });
            setStatus(editingPlanId ? "Plan actualizado correctamente." : "Plan publicado correctamente.");
            setMode("mine");
            setEditingPlanId("");
            setSelectedTicketId("");
            setPlanType("ticket");
            setFreeCategory("Estudiar");
            setCustomFreeCategory("");
            setFreeLocation("");
            setFreeEventDate(new Date().toISOString().slice(0, 10));
            setFreeCoverDataUrl("");
            setTitle("");
            setMessage("");
            setPhotoDataUrls([]);
            setMaxPeople("");
            setFreePreference(true);
            setWantedWomen(0);
            setWantedMen(0);
            await reloadAll();
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido publicar el plan."));
          } finally {
            setIsSaving(false);
          }
        }

        async function submitJoin() {
          if (!joinPlan) return;
          setIsSaving(true);
          setStatus("");
          try {
            if (joinGender !== profile?.plan_gender_preference && ["woman", "man"].includes(joinGender)) {
              await fetch("/api/me/plan-preferences", {
                method: "PUT",
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                body: JSON.stringify({ gender: joinGender }),
              }).catch(() => {});
              setProfile((current) => current ? { ...current, plan_gender_preference: joinGender } : current);
            }
            const data = await api(`/api/social-plans/${joinPlan.id}/join`, {
              method: "POST",
              body: JSON.stringify({ gender: joinGender, note: joinNote }),
            });
            setStatus(data.status === "accepted" ? "Estás dentro del grupo." : "Estás en lista de espera.");
            setJoinPlan(null);
            setJoinNote("");
            await reloadAll();
          } catch (error) {
            if (error.message === "plan_photos_required") {
              setPhotoGatePlan(joinPlan);
              setJoinPlan(null);
              setStatus("Añade mínimo 2 fotos para que puedan reconocerte en el plan.");
              return;
            }
            setStatus(friendlyError(error.message, "No se ha podido enviar tu solicitud."));
          } finally {
            setIsSaving(false);
          }
        }

        async function savePhotosAndJoin() {
          const saved = await savePlanProfilePhotos();
          if (!saved || !photoGatePlan) return;
          setJoinPlan(photoGatePlan);
          setPhotoGatePlan(null);
        }

        function hasPurchasedOffer(plan) {
          if (isFreePlan(plan)) return true;
          const offerId = plan?.purchase?.offer_id || plan?.purchase?.offer?.id;
          if (!offerId) return false;
          return tickets.some((ticket) => ticket.offer_id === offerId || ticket.offer?.id === offerId);
        }

        function openJoinFlow(plan) {
          if (!hasPurchasedOffer(plan)) {
            setPurchaseRequiredPlan(plan);
            return;
          }
          if (planProfilePhotos.length < 2) {
            setPhotoGatePlan(plan);
            setStatus("Para apuntarte necesitas mínimo 2 fotos tuyas. Solo las verá la gente autorizada del plan.");
            return;
          }
          if (["woman", "man"].includes(profile?.plan_gender_preference)) {
            setJoinGender(profile.plan_gender_preference);
          }
          setJoinPlan(plan);
        }

        function startEditPlan(plan) {
          const women = Number(plan.wanted_women || 0);
          const men = Number(plan.wanted_men || 0);
          const open = Number(plan.wanted_open || 0);
          const total = women + men + open;
          const free = isFreePlan(plan);
          setEditingPlanId(plan.id);
          setPlanType(free ? "free" : "ticket");
          setSelectedTicketId(free ? "" : (plan.purchase_id || plan.purchase?.id || ""));
          setFreeCategory(FREE_PLAN_CATEGORIES.includes(plan.free_category) ? plan.free_category : "Otro");
          setCustomFreeCategory(FREE_PLAN_CATEGORIES.includes(plan.free_category) ? "" : (plan.free_category || ""));
          setFreeLocation(plan.location || "");
          setFreeEventDate((plan.event_date || new Date().toISOString()).slice(0, 10));
          setFreeCoverDataUrl(plan.free_cover_data_url || "");
          setTitle(plan.title || "");
          setMessage(plan.message || "");
          setPhotoDataUrls(planPhotos(plan));
          setMaxPeople(total || "");
          setFreePreference(women === 0 && men === 0);
          setWantedWomen(women);
          setWantedMen(men);
          setDetailPlan(null);
          setStatus("Editando tu plan. Guarda los cambios cuando termines.");
          setMode("create");
          window.scrollTo({ top: 0, behavior: "smooth" });

          setEditingPlanId("");
          setSelectedTicketId("");
          setPlanType("ticket");

          setCustomFreeCategory("");

          setFreeCoverDataUrl("");
          setTitle("");
          setMessage("");
          setPhotoDataUrls([]);
          setMaxPeople("");
          setFreePreference(true);
          setWantedWomen(0);
          setWantedMen(0);
          setStatus("");
        }

        function selectMode(nextMode) {
          setMode(nextMode);
          if (nextMode === "mine" || nextMode === "joined") markQuedarSubsectionRead(nextMode);
          if (nextMode === "create" && !editingPlanId && photoDataUrls.length === 0 && planProfilePhotos.length > 0) {
            setPhotoDataUrls(planProfilePhotos);
          }
        }

        function openDetailPlan(plan) {
          setMemberFilter("accepted");
          setDetailPlan(plan);
        }

        async function updateMember(plan, member, nextStatus) {
          setIsSaving(true);
          const personName = member.user?.display_name || "La persona";
          const loadingMessages = {
            accepted: `Aceptando a ${personName}...`,
            waiting: `Moviendo a ${personName} a espera...`,
            removed: `Retirando a ${personName} del plan...`,
          };
          setActionToast({
            type: "loading",
            title: "Guardando cambio",
            message: loadingMessages[nextStatus] || "Actualizando participante...",
          });
          try {
            const data = await api(`/api/social-plans/${plan.id}/members/${member.id}`, {
              method: "PATCH",
              body: JSON.stringify({ status: nextStatus }),
            });
            const messages = {
              accepted: `${personName} aceptado/a en el grupo.`,
              waiting: `${personName} queda en lista de espera.`,
              removed: `${personName} retirado/a del plan.`,
            };
            const titles = {
              accepted: "Participante aceptado",
              waiting: "En lista de espera",
              removed: "Participante retirado",
            };
            setActionToast({
              type: nextStatus === "removed" ? "warning" : "success",
              title: titles[nextStatus] || "Cambio guardado",
              message: messages[nextStatus] || "Participante actualizado.",
            });
            window.setTimeout(() => setActionToast(null), 2600);
            await reloadAll();
            const fresh = data.plan || [...ownedPlans, ...plans].find((item) => item.id === plan.id);
            if (fresh) setDetailPlan(fresh);
            setMemberFilter(nextStatus);
          } catch (error) {
            setActionToast({
              type: "error",
              title: "No se ha guardado",
              message: "No se ha podido actualizar la persona.",
            });
            window.setTimeout(() => setActionToast(null), 3000);
          } finally {
            setIsSaving(false);
          }
        }

        async function confirmPlan(plan) {
          const acceptedCount = Number(plan?.counts?.accepted || 0);
          if (acceptedCount < 1) {
            setStatus("Necesitas aceptar al menos a 1 persona antes de confirmar el grupo.");
            return;
          }
          if (!window.confirm("Al confirmar, el grupo queda cerrado y no se podrá modificar más.")) return;
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/confirm`, { method: "POST", body: "{}" });
            setStatus("Grupo confirmado.");
            setDetailPlan(null);
            await reloadAll();
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido confirmar el grupo."));
          } finally {
            setIsSaving(false);
          }
        }

        async function cancelPlan(plan) {
          if (!plan) return;
          setCancelPromptPlan(plan);
        }

        async function confirmCancelPlan() {
          const plan = cancelPromptPlan;
          if (!plan) return;
          setIsSaving(true);
          try {
            const data = await api(`/api/social-plans/${plan.id}/cancel`, { method: "POST", body: "{}" });
            setStatus(data.transferred ? "Has dejado la administración. El plan sigue activo con nuevo administrador." : "Plan cancelado.");
            setCancelPromptPlan(null);
            setDetailPlan(null);
            await reloadAll();

            setStatus("No se ha podido cancelar el plan.");
          } finally {
            setIsSaving(false);
          }

        const filteredTickets = tickets.filter((ticket) => {
          const query = ticketQuery.trim().toLowerCase();
          if (!query) return true;
          return [
            ticket.offer?.title,
            ticket.offer?.business_display_name,
            ticket.receiver?.display_name,

                            </button>
                          ) : (
                            <div className="mb-4 rounded-[28px] border border-white/10 bg-white/[0.055] p-4">
                              <p className="text-sm font-black text-white">Participantes protegidos</p>
                              <p className="mt-2 text-sm font-bold leading-6 text-slate-400">{protectionDetail}</p>
                              {viewerStatus && <p className="mt-3 inline-flex rounded-full bg-black/25 px-3 py-2 text-xs font-black text-slate-200 ring-1 ring-white/10">Tu estado: {statusLabel(viewerStatus)}</p>}
                            </div>
                          )}

                          {canChat && <div className="grid gap-3 sm:grid-cols-2">
                            {visibleMembers.map((member) => (
                              <article key={member.id} className={`overflow-hidden rounded-[30px] border shadow-2xl shadow-black/10 ${memberCardTone[member.status] || "border-white/10 bg-white/[0.055]"}`}>
                                <div className="flex gap-2 overflow-x-auto bg-black/20 p-3">
                                  {(member.user?.plan_photo_data_urls || []).length > 0 ? (
                                    member.user.plan_photo_data_urls.map((photo, index) => (
                                      <img key={`${member.id}-${index}`} className="h-36 w-28 shrink-0 rounded-[24px] object-cover ring-1 ring-white/10" src={photo} alt="" />
                                    ))
                                  ) : (
                                    <div className="grid h-36 w-full place-items-center rounded-[24px] bg-white/[0.055] text-center">
                                      <span className="px-4 text-xs font-bold leading-5 text-slate-500">Fotos visibles solo para personas autorizadas</span>
                                    </div>
                                  )}
                                </div>
                                <div className="grid gap-3 p-4">
                                  <div>
                                    <div className="flex items-center gap-2">
                                      <p className="font-black text-white">{member.user?.display_name || "Usuario Donoss"}</p>
                                      {member.user?.is_verified && <VerifiedBadge />}
                                    </div>
                                    <p className="mt-1 text-sm font-bold text-slate-400">{genderLabel(member.gender)} · {statusLabel(member.status)} · {formatDate(member.created_at)} {formatTime(member.created_at)}</p>
                                    {member.note && <p className="mt-2 rounded-2xl bg-black/20 px-3 py-2 text-xs font-bold text-slate-300">{member.note}</p>}
                                  </div>
                                  {detailPlan.is_owner && detailPlan.status === "open" && (
                                    <div className="grid grid-cols-3 gap-2">
                                      <button className="h-10 rounded-2xl bg-mint px-3 text-xs font-black text-ink disabled:opacity-50" disabled={isSaving || member.status === "accepted"} onClick={() => updateMember(detailPlan, member, "accepted")}>Aceptar</button>
                                      <button className="h-10 rounded-2xl bg-white/[0.08] px-3 text-xs font-black text-slate-200 ring-1 ring-white/10 disabled:opacity-50" disabled={isSaving || member.status === "waiting"} onClick={() => updateMember(detailPlan, member, "waiting")}>Espera</button>
                                      <button className="h-10 rounded-2xl bg-coral/10 px-3 text-xs font-black text-coral ring-1 ring-coral/20 disabled:opacity-50" disabled={isSaving || member.status === "removed"} onClick={() => updateMember(detailPlan, member, "removed")}>Quitar</button>
                                    </div>
                                  )}
                                </div>
                              </article>
                            ))}
                          </div>}

                          {canChat && visibleMembers.length === 0 && (
                            <p className="rounded-3xl border border-white/10 bg-white/[0.055] p-5 text-sm font-bold text-slate-300">{activeTab.empty}</p>
                          )}
                        </>
                      );
                    })()}
                  </div>

                  {detailPlan.is_owner && detailPlan.status === "open" && (
                    <div className="mt-5 grid gap-3 sm:grid-cols-3">
                      <button className="h-12 rounded-2xl border border-mint/25 bg-mint/10 text-sm font-black text-mint" disabled={isSaving} onClick={() => startEditPlan(detailPlan)}>Editar plan</button>
                      <button className="h-12 rounded-2xl border border-coral/25 bg-coral/10 text-sm font-black text-coral" disabled={isSaving} onClick={() => cancelPlan(detailPlan)}>
                        {Number(detailPlan.counts?.accepted || 0) > 0 ? "Dejar admin" : "Cancelar plan"}
                      </button>
                      <button
                        className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:bg-white/10 disabled:text-slate-500 disabled:shadow-none"
                        disabled={isSaving || Number(detailPlan.counts?.accepted || 0) < 1}
                        onClick={() => confirmPlan(detailPlan)}
                      >
                        {Number(detailPlan.counts?.accepted || 0) < 1 ? "Falta 1 persona" : "Confirmar grupo"}
                      </button>
                    </div>
                  )}
                </section>
              </div>
            )}

            {actionToast && (
              <div className="fixed inset-0 z-[70] grid place-items-center bg-black/45 px-5 backdrop-blur-sm">
                <div className="w-full max-w-sm rounded-[34px] border border-white/10 bg-[#0D111D]/95 p-6 text-center shadow-2xl shadow-black/50">
                  <div className={`mx-auto grid h-16 w-16 place-items-center rounded-[24px] ${
                    actionToast.type === "error"
                      ? "bg-coral/15 text-coral ring-1 ring-coral/25"
                      : actionToast.type === "warning"
                        ? "bg-sun/15 text-sun ring-1 ring-sun/25"
                        : actionToast.type === "loading"
                          ? "bg-mint/10 text-mint ring-1 ring-mint/25"
                          : "bg-mint text-ink shadow-glow"
                  }`}>
                    {actionToast.type === "loading" ? (
                      <span className="h-7 w-7 animate-spin rounded-full border-4 border-mint/25 border-t-mint"></span>
                    ) : (
                      <span className="text-2xl font-black">{actionToast.type === "error" ? "!" : "✓"}</span>
                    )}
                  </div>
                  <p className="mt-4 text-lg font-black text-white">{actionToast.title}</p>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-400">{actionToast.message}</p>
                </div>
              </div>
            )}

            {cancelPromptPlan && (
              <div className="fixed inset-0 z-[72] grid place-items-center bg-black/60 px-4 backdrop-blur-sm">
                <section className="w-full max-w-md rounded-[34px] border border-white/10 bg-[#0D111D] p-5 text-center shadow-2xl">
                  {(() => {
                    const acceptedCount = Number(cancelPromptPlan.counts?.accepted || 0);
                    const hasGroup = acceptedCount > 0;
                    return (
                      <>
                        <div className={`mx-auto grid h-14 w-14 place-items-center rounded-2xl text-2xl font-black ${hasGroup ? "bg-sun/15 text-sun ring-1 ring-sun/25" : "bg-coral/10 text-coral ring-1 ring-coral/25"}`}>
                          !
                        </div>
                        <h2 className="mt-4 text-2xl font-black text-white">{hasGroup ? "Dejar administración" : "Cancelar plan"}</h2>
                        <p className="mt-2 text-sm font-bold leading-6 text-slate-400">
                          {hasGroup
                            ? "Este plan ya tiene participantes. Si continúas, no se eliminará: Donoss elegirá un nuevo administrador entre las personas aceptadas y tú pasarás a lista de espera."
                            : "Este plan todavía no tiene participantes aceptados. Si continúas, se cancelará y dejará de aparecer en Quedar."}
                        </p>
                        <div className="mt-5 grid grid-cols-2 gap-3">
                          <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" disabled={isSaving} onClick={() => setCancelPromptPlan(null)}>Volver</button>
                          <button className={`h-12 rounded-2xl text-sm font-black ${hasGroup ? "bg-sun text-ink" : "bg-coral text-white"}`} disabled={isSaving} onClick={confirmCancelPlan}>
                            {isSaving ? "Guardando..." : hasGroup ? "Dejar admin" : "Cancelar"}
                          </button>
                        </div>
                      </>
                    );
                  })()}
                </section>
              </div>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => (
                  <a key={item.label} href={item.href} className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${item.active ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]" : "text-slate-400 hover:bg-white/[0.06] hover:text-white"}`}>
                    <NavIcon name={item.icon} />
                    <span className="mt-0.5">{item.label}</span>
                  </a>
                ))}
              </div>
            </nav>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
