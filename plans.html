      async function fileToDataUrl(file) {
        if (!file) return "";
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function compressImageToDataUrl(file, maxSide = 960, quality = 0.78) {
        if (!file) return "";
        if (!file.type?.startsWith("image/")) throw new Error("invalid_image");

        const originalUrl = URL.createObjectURL(file);
        try {
          const image = await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = originalUrl;
          });

          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const width = Math.max(1, Math.round(image.width * scale));
          const height = Math.max(1, Math.round(image.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d");
          context.drawImage(image, 0, 0, width, height);
          return canvas.toDataURL("image/jpeg", quality);
        } finally {
          URL.revokeObjectURL(originalUrl);
        }
      }

        async function api(path, options = {}) {
          const response = await fetch(path, {
            ...options,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
              ...(options.headers || {}),
            },
          });
          const data = await response.json().catch(() => ({}));

          return data;
        }

        async function bootstrap() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          if (!accessToken) return redirectToLogin();
          setToken(accessToken);
          try {
            const profileResponse = await fetch("/api/me/profile", { headers: { Authorization: `Bearer ${accessToken}` } });
            const profileData = await profileResponse.json().catch(() => ({}));
            setProfile(profileData.profile || null);
            if (profileData.profile?.account_type === "business") {
              setStatus("");
              return;
            }
            await Promise.all([loadPlans(accessToken), loadMine(accessToken), loadTickets(accessToken), loadPlanProfilePhotos(accessToken)]);
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido cargar Quedar."));
          }
        }

        async function loadPlans(accessToken = token) {
          const response = await fetch("/api/social-plans", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "plans_failed");
          setPlans(data.plans || []);
          setStatus("");
        }

        async function loadMine(accessToken = token) {
          const response = await fetch("/api/social-plans/me", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "mine_failed");
          setOwnedPlans(data.owned || []);
          setJoinedPlans(data.joined || []);
        }

        async function loadTickets(accessToken = token) {
          const response = await fetch("/api/me/plan-tickets", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "tickets_failed");
          setTickets(data.tickets || []);
        }

        async function loadPlanProfilePhotos(accessToken = token) {
          const response = await fetch("/api/me/plan-photos", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "plan_photos_failed");
          setPlanProfilePhotos(data.photos || []);
        }

        async function reloadAll() {
          await Promise.all([loadPlans(), loadMine(), loadTickets(), loadPlanProfilePhotos()]);
        }

        async function handlePhoto(event) {
          const files = Array.from(event.target.files || []).slice(0, 5 - photoDataUrls.length);
          if (files.length === 0) return;
          if (files.some((file) => file.size > 8 * 1024 * 1024)) {
            setStatus("La foto es demasiado grande. Usa una foto de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressedPhotos = await Promise.all(files.map((file) => compressImageToDataUrl(file, 820, 0.72)));
            if (compressedPhotos.some((photo) => photo.length > 1200000)) {
              setStatus("La foto sigue siendo demasiado pesada. Prueba con otra imagen más ligera.");
              event.target.value = "";
              return;
            }
            setPhotoDataUrls((current) => [...current, ...compressedPhotos].slice(0, 5));
            setStatus("");
          } catch (error) {
            setStatus("No se ha podido preparar la foto. Prueba con otra imagen.");
          } finally {
            event.target.value = "";
          }
        }

        async function handlePlanProfilePhotoUpload(event) {
          const files = Array.from(event.target.files || []).slice(0, 5 - planProfilePhotos.length);
          if (files.length === 0) return;
          if (files.some((file) => file.size > 8 * 1024 * 1024)) {
            setStatus("Una foto es demasiado grande. Usa una foto de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressedPhotos = await Promise.all(files.map((file) => compressImageToDataUrl(file, 900, 0.76)));
            setPlanProfilePhotos((current) => [...current, ...compressedPhotos].slice(0, 5));
            setStatus("");
          } catch (_error) {
            setStatus("No se han podido preparar las fotos.");
          } finally {
            event.target.value = "";
          }
        }

        async function savePlanProfilePhotos() {
          if (planProfilePhotos.length < 2) {
            setStatus("Añade mínimo 2 fotos para participar en planes con más gente.");
            return false;
          }
          try {
            const response = await fetch("/api/me/plan-photos", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ photos: planProfilePhotos }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "plan_photos_failed");
            setPlanProfilePhotos(data.photos || []);
            setStatus("");
            return true;
          } catch (error) {
            setStatus(error.message === "plan_photos_sql_missing" ? "Falta ejecutar el SQL de fotos para planes." : "No se han podido guardar tus fotos.");
            return false;
          }
        }

        async function createPlan() {
          if (!selectedTicketId) return setStatus("Elige un billete para crear el plan.");
          const totalWanted = Math.max(Math.floor(Number(maxPeople || 0)), 0);
          const womenWanted = freePreference ? 0 : Math.max(Math.floor(Number(wantedWomen || 0)), 0);
          const menWanted = freePreference ? 0 : Math.max(Math.floor(Number(wantedMen || 0)), 0);
          const openWanted = freePreference ? totalWanted : Math.max(totalWanted - womenWanted - menWanted, 0);
          if (totalWanted <= 0) return setStatus("Indica cuántas personas pueden apuntarse como máximo.");
          if (totalWanted > 20) return setStatus("El máximo para un plan es de 20 personas.");
          if (!freePreference && womenWanted + menWanted > totalWanted) return setStatus("La suma de chicas y chicos no puede superar el máximo de personas.");
          setIsSaving(true);
          setStatus("");
          try {
            await api(editingPlanId ? `/api/social-plans/${editingPlanId}` : "/api/social-plans", {
              method: editingPlanId ? "PATCH" : "POST",
              body: JSON.stringify({
                purchaseId: selectedTicketId,
                title,
                message,
                photoDataUrls,
                wantedWomen: womenWanted,
                wantedMen: menWanted,
                wantedOpen: openWanted,
              }),
            });
            setStatus(editingPlanId ? "Plan actualizado correctamente." : "Plan publicado correctamente.");
            setMode("mine");
            setEditingPlanId("");
            setSelectedTicketId("");
            setTitle("");
            setMessage("");
            setPhotoDataUrls([]);
            setMaxPeople("");
            setFreePreference(true);
            setWantedWomen(0);
            setWantedMen(0);
            await reloadAll();
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido publicar el plan."));
          } finally {
            setIsSaving(false);
          }
        }

        async function submitJoin() {
          if (!joinPlan) return;
          setIsSaving(true);
          setStatus("");
          try {
            const data = await api(`/api/social-plans/${joinPlan.id}/join`, {
              method: "POST",
              body: JSON.stringify({ gender: joinGender, note: joinNote }),
            });
            setStatus(data.status === "accepted" ? "Estás dentro del grupo." : "Estás en lista de espera.");
            setJoinPlan(null);
            setJoinNote("");
            await reloadAll();
          } catch (error) {
            if (error.message === "plan_photos_required") {
              setPhotoGatePlan(joinPlan);
              setJoinPlan(null);
              setStatus("Añade mínimo 2 fotos para que puedan reconocerte en el plan.");
              return;
            }
            setStatus(friendlyError(error.message, "No se ha podido enviar tu solicitud."));
          } finally {
            setIsSaving(false);
          }
        }

        async function savePhotosAndJoin() {
          const saved = await savePlanProfilePhotos();
          if (!saved || !photoGatePlan) return;
          setJoinPlan(photoGatePlan);
          setPhotoGatePlan(null);
        }

        function hasPurchasedOffer(plan) {
          const offerId = plan?.purchase?.offer_id || plan?.purchase?.offer?.id;
          if (!offerId) return false;
          return tickets.some((ticket) => ticket.offer_id === offerId || ticket.offer?.id === offerId);
        }

        function openJoinFlow(plan) {
          if (!hasPurchasedOffer(plan)) {
            setPurchaseRequiredPlan(plan);
            return;
          }
          if (planProfilePhotos.length < 2) {
            setPhotoGatePlan(plan);
            setStatus("Para apuntarte necesitas mínimo 2 fotos tuyas. Solo las verá la gente autorizada del plan.");
            return;
          }
          setJoinPlan(plan);
        }

        function startEditPlan(plan) {
          const women = Number(plan.wanted_women || 0);
          const men = Number(plan.wanted_men || 0);
          const open = Number(plan.wanted_open || 0);
          const total = women + men + open;
          setEditingPlanId(plan.id);
          setSelectedTicketId(plan.purchase_id || plan.purchase?.id || "");
          setTitle(plan.title || "");
          setMessage(plan.message || "");
          setPhotoDataUrls(planPhotos(plan));
          setMaxPeople(total || "");
          setFreePreference(women === 0 && men === 0);
          setWantedWomen(women);
          setWantedMen(men);
          setDetailPlan(null);
          setStatus("Editando tu plan. Guarda los cambios cuando termines.");
          setMode("create");
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function cancelEdit() {
          setEditingPlanId("");
          setSelectedTicketId("");
          setTitle("");
          setMessage("");
          setPhotoDataUrls([]);
          setMaxPeople("");
          setFreePreference(true);
          setWantedWomen(0);
          setWantedMen(0);
          setStatus("");
        }

        async function updateMember(plan, member, nextStatus) {
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/members/${member.id}`, {
              method: "PATCH",
              body: JSON.stringify({ status: nextStatus }),
            });
            await reloadAll();
            const fresh = [...ownedPlans, ...plans].find((item) => item.id === plan.id);
            if (fresh) setDetailPlan(fresh);
          } catch (error) {
            setStatus("No se ha podido actualizar la persona.");
          } finally {
            setIsSaving(false);
          }
        }

        async function confirmPlan(plan) {
          if (!window.confirm("Al confirmar, el grupo queda cerrado y no se podrá modificar más.")) return;
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/confirm`, { method: "POST", body: "{}" });
            setStatus("Grupo confirmado.");
            setDetailPlan(null);
            await reloadAll();
          } catch (error) {
            setStatus("No se ha podido confirmar el grupo.");
          } finally {
            setIsSaving(false);
          }
        }

        async function cancelPlan(plan) {
          if (!window.confirm("¿Cancelar este plan?")) return;
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/cancel`, { method: "POST", body: "{}" });
            setStatus("Plan cancelado.");
            setDetailPlan(null);
            await reloadAll();
          } catch (error) {
            setStatus("No se ha podido cancelar el plan.");
          } finally {
            setIsSaving(false);
          }
        }

        const visiblePlans = plans.filter((plan) => !plan.is_owner);
        const editingPlan = ownedPlans.find((plan) => plan.id === editingPlanId);
        const selectedTicket = tickets.find((ticket) => ticket.id === selectedTicketId) || editingPlan?.purchase;
        const filteredTickets = tickets.filter((ticket) => {
          const query = ticketQuery.trim().toLowerCase();
          if (!query) return true;
          return [
            ticket.offer?.title,
            ticket.offer?.business_display_name,
            ticket.receiver?.display_name,
            ticket.offer?.category,
            ticket.delivery_method,
            formatDate(ticket.created_at),
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });
        const modes = [
          { value: "discover", label: "Planes", icon: "compass", count: visiblePlans.length },
          { value: "create", label: "Crear", icon: "ticket", count: 0 },
          { value: "mine", label: "Míos", icon: "list", count: ownedPlans.length },
          { value: "joined", label: "Voy", icon: "checkCircle", count: joinedPlans.length },
        ];

        if (profile?.account_type === "business") {
          return (
            <main className="mx-auto min-h-screen w-full max-w-3xl px-4 pb-28 pt-4">
              <header className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-xl font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Zona empresa</p>
                </div>
              </header>
              <section className="mt-6 rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow">
                <p className="text-sm font-black uppercase tracking-[0.16em] text-mint">Quedar es para usuarios</p>
                <h1 className="mt-2 text-3xl font-black text-white">Tu empresa publica ofertas</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Los planes sociales son para jóvenes que ya compraron un billete. Como comercio puedes crear y editar tus ofertas.</p>
                <div className="mt-5 grid gap-3 sm:grid-cols-2">
                  <a className="grid h-12 place-items-center rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" href="admin-offer.html">Crear oferta</a>
                  <a className="grid h-12 place-items-center rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" href="my-offers.html">Mis publicaciones</a>
                </div>
              </section>
            </main>
          );
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-5xl px-3 pb-28 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html" className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-xl font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Quedar</p>
                </div>
              </a>
              <button className="grid h-10 w-10 place-items-center rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-mint" onClick={reloadAll}>↻</button>
            </header>

            <div className="sticky top-0 z-30 -mx-3 mt-3 overflow-x-auto border-y border-white/5 bg-[#060914]/72 px-3 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
              <div className="flex w-max min-w-full gap-2">
                {modes.map((item) => (
                  <TopModeButton key={item.value} {...item} mode={mode} onClick={setMode} />
                ))}
              </div>
            </div>

            {status && (
              <p className={`mt-4 rounded-2xl border p-4 text-sm font-bold ${
                status.includes("correctamente") || status.includes("dentro") || status.includes("confirmado")
                  ? "border-mint/25 bg-mint/10 text-mint"
                  : status.includes("Cargando") || status.includes("Editando")
                    ? "border-white/10 bg-white/[0.055] text-slate-300"
                    : "border-coral/25 bg-coral/10 text-coral"
              }`}>{status}</p>
            )}

            {mode === "discover" && (
              <section className="mt-4 grid gap-4 sm:grid-cols-2">
                {visiblePlans.map((plan) => <PlanCard key={plan.id} plan={plan} onOpen={setDetailPlan} onJoin={openJoinFlow} onEdit={startEditPlan} />)}
                {visiblePlans.length === 0 && (
                  <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                    <p className="text-base font-black text-white">Todavía no hay planes de otros usuarios.</p>
                    <p className="mt-2 leading-6 text-slate-400">Tus publicaciones aparecen en <span className="text-mint">Míos</span>. En <span className="text-mint">Planes</span> verás los planes creados por otras personas para poder apuntarte.</p>
                  </div>
                )}
              </section>
            )}

            {mode === "create" && (
              <section className="mt-4 grid gap-4 lg:grid-cols-[.9fr_1.1fr]">
                <div className="rounded-[32px] border border-white/10 bg-white/[0.055] p-4 sm:p-5">
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Billete prueba</p>
                      <p className="mt-1 text-sm font-bold text-slate-400">El QR y los códigos quedan ocultos.</p>
                    </div>
                    <button className="h-11 shrink-0 rounded-2xl bg-mint px-4 text-sm font-black text-ink shadow-glow" onClick={() => setTicketPickerOpen(true)}>Añadir</button>
                  </div>
                  {selectedTicket ? (
                    <div className="mt-4">
                      <TicketCard ticket={selectedTicket} selected={true} onClick={() => setTicketPickerOpen(true)} />
                    </div>
                  ) : (
                    <button className="mt-4 grid min-h-[150px] w-full place-items-center rounded-[28px] border border-dashed border-mint/35 bg-mint/10 p-5 text-center" onClick={() => setTicketPickerOpen(true)}>
                      <span>
                        <span className="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-mint text-ink"><NavIcon name="ticket" /></span>
                        <span className="mt-3 block text-lg font-black text-white">Elegir billete</span>
                        <span className="mt-1 block text-sm font-bold text-slate-400">Abre tu galería con buscador.</span>
                      </span>
                    </button>
                  )}
                </div>

                <div className="rounded-[32px] border border-white/10 bg-white/[0.055] p-5">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">{editingPlanId ? "Editar plan" : "Crear plan"}</p>
                      {editingPlanId && <p className="mt-1 text-xs font-bold text-slate-500">Estás modificando una publicación existente.</p>}
                    </div>
                    {editingPlanId && <button className="rounded-2xl border border-white/10 bg-white/[0.06] px-3 py-2 text-xs font-black text-slate-300" onClick={cancelEdit}>Cancelar</button>}
                  </div>
                  <input className="mt-4 h-12 w-full rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none focus:border-mint/70" value={title} onChange={(event) => setTitle(event.target.value)} placeholder="Título: Vamos al concierto..." />
                  <textarea className="mt-3 min-h-28 w-full rounded-2xl border border-line bg-black/20 px-4 py-3 text-sm font-bold text-white outline-none focus:border-mint/70" value={message} onChange={(event) => setMessage(event.target.value)} placeholder="Texto: quién eres, qué plan quieres, punto de encuentro..." />
                  <label className={`mt-3 flex cursor-pointer items-center justify-between gap-3 rounded-2xl border border-white/10 bg-black/20 px-4 py-3 ${photoDataUrls.length >= 5 ? "opacity-55" : ""}`}>
                    <span className="text-sm font-bold text-slate-300">{photoDataUrls.length ? `${photoDataUrls.length}/5 fotos cargadas` : "Subir fotos tuyas"}</span>
                    <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">Fotos</span>
                    <input type="file" className="hidden" accept="image/*" multiple disabled={photoDataUrls.length >= 5} onChange={handlePhoto} />
                  </label>
                  {photoDataUrls.length > 0 && (
                    <div className="mt-3 flex gap-2 overflow-x-auto pb-1">
                      {photoDataUrls.map((photo, index) => (
                        <div key={`${photo.slice(0, 32)}-${index}`} className="relative h-24 w-24 shrink-0 overflow-hidden rounded-3xl ring-1 ring-white/10">
                          <img className="h-full w-full object-cover" src={photo} alt="" />
                          <button className="absolute right-1 top-1 grid h-7 w-7 place-items-center rounded-full bg-black/65 text-sm font-black text-white" type="button" onClick={() => setPhotoDataUrls((current) => current.filter((_, itemIndex) => itemIndex !== index))}>×</button>
                        </div>
                      ))}
                    </div>
                  )}

                  <label className="mt-4 block rounded-[26px] border border-white/10 bg-black/20 p-4">
                    <span className="text-sm font-black text-white">¿Cuántas personas máximo pueden apuntarse?</span>
                    <span className="mt-1 block text-xs font-bold leading-5 text-slate-500">Ejemplo: si quieres ir con 5 personas, escribe 5.</span>
                    <input className="mt-3 h-12 w-full rounded-2xl border border-line bg-white/[0.04] px-4 text-2xl font-black text-white outline-none focus:border-mint/70" type="number" min="1" max="20" value={maxPeople} onChange={(event) => setMaxPeople(event.target.value)} placeholder="5" />
                  </label>

                  {Number(maxPeople || 0) > 0 && (
                    <div className="mt-3 rounded-[26px] border border-white/10 bg-black/20 p-4">
                      <p className="text-sm font-black text-white">¿Tienes preferencia para el grupo?</p>
                      <label className="mt-3 flex cursor-pointer items-start gap-3 rounded-2xl bg-white/[0.055] p-3">
                        <input className="mt-1 h-5 w-5 accent-[#42F2B3]" type="checkbox" checked={freePreference} onChange={(event) => setFreePreference(event.target.checked)} />
                        <span>
                          <span className="block text-sm font-black text-white">Me da igual, grupo libre</span>
                          <span className="mt-1 block text-xs font-bold leading-5 text-slate-500">Cualquiera puede apuntarse hasta completar el máximo.</span>
                        </span>
                      </label>

                      {!freePreference && (
                        <>
                          <p className="mt-4 text-xs font-bold leading-5 text-slate-500">Opcional: indica cuántas chicas y cuántos chicos prefieres dentro del máximo. Las plazas que sobren quedan abiertas para cualquiera.</p>
                          <div className="mt-3 grid grid-cols-2 gap-2">
                            <label className="rounded-2xl bg-white/[0.055] p-3"><span className="text-xs font-bold text-slate-500">Chicas preferidas</span><input className="mt-2 w-full bg-transparent text-2xl font-black text-white outline-none" type="number" min="0" max="20" value={wantedWomen} onChange={(event) => setWantedWomen(event.target.value)} /></label>
                            <label className="rounded-2xl bg-white/[0.055] p-3"><span className="text-xs font-bold text-slate-500">Chicos preferidos</span><input className="mt-2 w-full bg-transparent text-2xl font-black text-white outline-none" type="number" min="0" max="20" value={wantedMen} onChange={(event) => setWantedMen(event.target.value)} /></label>
                          </div>
                          <p className="mt-3 rounded-2xl bg-mint/10 px-3 py-2 text-xs font-black text-mint">
                            {Math.max(Number(maxPeople || 0) - Number(wantedWomen || 0) - Number(wantedMen || 0), 0)} plaza(s) sin preferencia.
                          </p>
                        </>
                      )}
                    </div>
                  )}
                  <p className="mt-3 text-xs font-bold leading-5 text-slate-500">Cuando alguien se apunta, Donos lo acepta automáticamente si aún queda sitio. Si el grupo ya está completo, esa persona entra en lista de espera y tú puedes decidir después.</p>
                  <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={isSaving} onClick={createPlan}>{isSaving ? "Guardando..." : editingPlanId ? "Guardar cambios" : "Publicar plan"}</button>
                </div>
              </section>
            )}

            {mode === "mine" && (
              <section className="mt-5 grid gap-4 sm:grid-cols-2">
                {ownedPlans.map((plan) => <PlanCard key={plan.id} plan={plan} onOpen={setDetailPlan} onJoin={openJoinFlow} onEdit={startEditPlan} />)}
                {ownedPlans.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">Todavía no has creado planes.</p>}
              </section>
            )}

            {mode === "joined" && (
              <section className="mt-5 grid gap-4 sm:grid-cols-2">
                {joinedPlans.map((plan) => <PlanCard key={plan.id} plan={plan} onOpen={setDetailPlan} onJoin={openJoinFlow} onEdit={startEditPlan} />)}
                {joinedPlans.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">Todavía no te has apuntado a ningún plan.</p>}
              </section>
            )}

            {ticketPickerOpen && (
              <div className="fixed inset-0 z-50 bg-black/75 px-3 py-5 backdrop-blur-xl">
                <section className="mx-auto flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-[34px] border border-white/10 bg-[#0D111D] shadow-2xl">
                  <div className="border-b border-white/10 p-4 sm:p-5">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Galería de billetes</p>
                        <h2 className="mt-1 text-2xl font-black text-white">Elige el billete del plan</h2>
                      </div>
                      <button className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white/10 text-2xl font-black text-white" onClick={() => setTicketPickerOpen(false)}>×</button>
                    </div>
                    <div className="mt-4">
                      <SearchBox value={ticketQuery} onChange={setTicketQuery} placeholder="Buscar por título, empresa, fecha..." />
                    </div>
                  </div>
                  <div className="overflow-y-auto p-4 sm:p-5">
                    <div className="grid gap-3 sm:grid-cols-2">
                      {filteredTickets.map((ticket) => (
                        <TicketCard
                          key={ticket.id}
                          ticket={ticket}
                          selected={selectedTicketId === ticket.id}
                          onClick={() => {
                            setSelectedTicketId(ticket.id);
                            setTicketPickerOpen(false);
                            setStatus("");
                          }}
                        />
                      ))}
                    </div>
                    {tickets.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">Todavía no tienes billetes comprados.</p>}
                    {tickets.length > 0 && filteredTickets.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">No encontramos billetes con esa búsqueda.</p>}
                  </div>
                </section>
              </div>
            )}

            {joinPlan && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 px-4 backdrop-blur-xl">
                <section className="w-full max-w-md rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl">
                  <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Voy contigo</p>
                  <h2 className="mt-2 text-2xl font-black text-white">{planTitle(joinPlan)}</h2>
                  <p className="mt-2 text-sm font-semibold leading-6 text-slate-400">Tus fotos de planes se compartirán solo con la persona que creó este plan y participantes autorizados.</p>
                  <div className="mt-4 grid grid-cols-3 gap-2">
                    {[["woman", "Chica"], ["man", "Chico"], ["open", "Libre"]].map(([value, label]) => (
                      <button key={value} className={`h-11 rounded-2xl text-sm font-black ${joinGender === value ? "bg-mint text-ink" : "bg-white/[0.06] text-slate-300 ring-1 ring-white/10"}`} onClick={() => setJoinGender(value)}>{label}</button>
                    ))}
                  </div>
                  <textarea className="mt-3 min-h-24 w-full rounded-2xl border border-line bg-black/20 px-4 py-3 text-sm font-bold text-white outline-none focus:border-mint/70" value={joinNote} onChange={(event) => setJoinNote(event.target.value)} placeholder="Mensaje opcional..." />
                  <div className="mt-4 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" onClick={() => setJoinPlan(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" disabled={isSaving} onClick={submitJoin}>Enviar</button>
                  </div>
                </section>
              </div>
            )}

            {photoGatePlan && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/75 px-4 py-6 backdrop-blur-xl">
                <section className="mx-auto w-full max-w-lg rounded-[36px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Fotos necesarias</p>
                      <h2 className="mt-2 text-3xl font-black leading-tight text-white">Para participar, enseña quién eres</h2>
                    </div>
                    <button className="grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black text-white" onClick={() => setPhotoGatePlan(null)}>×</button>
                  </div>
                  <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">
                    Añade mínimo 2 fotos tuyas. Solo las verá la persona que creó el plan y la gente autorizada del mismo grupo.
                  </p>

                  <div className="mt-5 flex gap-3 overflow-x-auto pb-2">
                    {planProfilePhotos.map((photo, index) => (
                      <div key={`${photo.slice(0, 28)}-${index}`} className="relative h-48 w-36 shrink-0 overflow-hidden rounded-[30px] border border-white/10 bg-black/20">
                        <img className="h-full w-full object-cover" src={photo} alt="" />
                        <button className="absolute right-2 top-2 grid h-8 w-8 place-items-center rounded-full bg-black/65 text-sm font-black text-white backdrop-blur" type="button" onClick={() => setPlanProfilePhotos((current) => current.filter((_, itemIndex) => itemIndex !== index))}>×</button>
                      </div>
                    ))}
                    {planProfilePhotos.length < 5 && (
                      <label className="grid h-48 w-36 shrink-0 cursor-pointer place-items-center rounded-[30px] border border-dashed border-mint/35 bg-mint/10 text-center">
                        <span>
                          <span className="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-mint text-ink"><NavIcon name="plus" /></span>
                          <span className="mt-2 block text-xs font-black text-mint">Añadir foto</span>
                        </span>
                        <input className="hidden" type="file" accept="image/*" multiple onChange={handlePlanProfilePhotoUpload} />
                      </label>
                    )}
                  </div>

                  <div className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className={`text-sm font-black ${planProfilePhotos.length >= 2 ? "text-mint" : "text-coral"}`}>
                      {planProfilePhotos.length >= 2 ? "Listo para participar" : `Faltan ${2 - planProfilePhotos.length} foto${2 - planProfilePhotos.length === 1 ? "" : "s"}`}
                    </p>
                    <p className="mt-1 text-xs font-bold leading-5 text-slate-500">Si cancelas, no se enviará tu solicitud porque la otra persona no podrá reconocerte.</p>
                  </div>

                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" onClick={() => setPhotoGatePlan(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-50" disabled={isSaving || planProfilePhotos.length < 2} onClick={savePhotosAndJoin}>Guardar y participar</button>
                  </div>
                </section>
              </div>
            )}

            {purchaseRequiredPlan && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-xl">
                <section className="w-full max-w-md overflow-hidden rounded-[34px] border border-white/10 bg-[#0D111D] shadow-2xl">
                  <div className="relative min-h-[210px] bg-gradient-to-br from-mint via-[#17213C] to-violet">
                    {ticketImage(purchaseRequiredPlan.purchase) ? <img className="absolute inset-0 h-full w-full object-cover" src={ticketImage(purchaseRequiredPlan.purchase)} alt="" /> : <span className="absolute bottom-5 right-5 text-7xl">🎟️</span>}
                    <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
                    <button className="absolute right-4 top-4 grid h-10 w-10 place-items-center rounded-full bg-black/45 text-xl font-black text-white backdrop-blur" onClick={() => setPurchaseRequiredPlan(null)}>×</button>
                    <div className="absolute bottom-4 left-4 right-4">
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Ya casi estás</p>
                      <h2 className="mt-2 text-3xl font-black leading-tight text-white">Compra el mismo billete para participar</h2>
                    </div>
                  </div>
                  <div className="p-5">
                    <p className="text-sm font-bold leading-6 text-slate-300">
                      Para ir con {purchaseRequiredPlan.creator?.display_name || "esta persona"} y garantizar tu presencia, primero tienes que comprar este mismo billete en Donos.
                    </p>
                    <div className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                      <p className="text-lg font-black text-white">{purchaseRequiredPlan.purchase?.offer?.title || "Billete Donos"}</p>
                      <p className="mt-1 text-sm font-bold text-slate-400">{offerMerchant(purchaseRequiredPlan.purchase)}</p>
                      {purchaseRequiredPlan.purchase?.offer?.address && <p className="mt-2 text-xs font-bold text-slate-500">{purchaseRequiredPlan.purchase.offer.address}</p>}
                    </div>
                    <div className="mt-5 grid grid-cols-2 gap-3">
                      <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" onClick={() => setPurchaseRequiredPlan(null)}>Ahora no</button>
                      <a className="grid h-12 place-items-center rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" href={offerDetailUrl(purchaseRequiredPlan.purchase)}>Pagar</a>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {detailPlan && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/75 px-4 py-6 backdrop-blur-xl">
                <section className="mx-auto max-w-3xl rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl">
                  {(() => {
                    const photos = planPhotos(detailPlan);
                    const ticket = detailPlan.purchase;
                    const offer = ticket?.offer || {};
                    const merchant = offerMerchant(ticket);
                    const categories = offerCategories(ticket);
                    const dateRange = offerDateRange(ticket);
                    const images = offerImages(ticket);
                    const mapUrl = offer.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(offer.address)}` : "";
                    const requiredPoints = Number(offer.required_points || ticket?.offer_points || ticket?.total_points || 0);
                    return (
                      <>
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Grupo</p>
                      <h2 className="mt-2 text-3xl font-black text-white">{planTitle(detailPlan)}</h2>
                      <p className="mt-2 text-sm font-bold text-slate-400">{merchant} · {statusLabel(detailPlan.status)}</p>
                    </div>
                    <button className="grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black" onClick={() => setDetailPlan(null)}>×</button>
                  </div>

                  {photos.length > 0 && (
                    <div className="mt-5">
                      <p className="mb-3 text-xs font-black uppercase tracking-[0.14em] text-slate-500">Fotos de la persona</p>
                      <div className="flex snap-x snap-mandatory justify-start gap-3 overflow-x-auto scroll-smooth pb-2 sm:justify-center">
                        {photos.map((photo, index) => (
                          <div key={`${photo.slice(0, 30)}-${index}`} className="relative h-72 w-[86%] max-w-sm shrink-0 snap-center overflow-hidden rounded-[32px] border border-white/10 bg-black/20 sm:w-72">
                            <img className="h-full w-full object-cover" src={photo} alt="" />
                            <span className="absolute bottom-3 right-3 rounded-full bg-black/55 px-3 py-1 text-xs font-black text-white backdrop-blur">{index + 1}/{photos.length}</span>
                          </div>
                        ))}
                      </div>
                      {detailPlan.message && (
                        <div className="mt-4 rounded-[28px] border border-white/10 bg-white/[0.055] p-4">
                          <p className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">Mensaje de {detailPlan.creator?.display_name || "la persona"}</p>
                          <p className="mt-2 text-sm font-semibold leading-6 text-slate-200">{detailPlan.message}</p>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="mt-5 overflow-hidden rounded-[30px] border border-white/10 bg-white/[0.055]">
                    <div className="relative min-h-[230px] bg-gradient-to-br from-mint via-[#17213C] to-violet">
                      {images[0] ? <img className="absolute inset-0 h-full w-full object-cover" src={images[0]} alt="" /> : <span className="absolute bottom-5 right-5 text-7xl">🎟️</span>}
                      <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent"></div>
                      <div className="absolute bottom-4 left-4 right-4">
                        <div className="flex flex-wrap items-center gap-2">
                          {categories && <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">{categories}</span>}
                          <span className="rounded-full bg-black/45 px-3 py-1 text-xs font-black text-white backdrop-blur">Billete verificado</span>
                        </div>
                        <h3 className="mt-3 text-2xl font-black text-white">{offer.title || "Billete Donos"}</h3>
                        <div className="mt-2 flex flex-wrap items-center gap-2 text-sm font-bold text-slate-200">
                          <span>{merchant}</span>
                          {offer.business_is_verified && <VerifiedBadge />}
                        </div>
                      </div>
                    </div>
                    <div className="grid gap-3 p-4 sm:grid-cols-2">
                      {offer.start_date && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Fecha de inicio</p><p className="mt-1 text-sm font-black text-white">{formatDate(offer.start_date)}</p></div>}
                      {offer.end_date && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Fecha de fin</p><p className="mt-1 text-sm font-black text-white">{formatDate(offer.end_date)}</p></div>}
                      {!offer.start_date && !offer.end_date && dateRange && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Fecha</p><p className="mt-1 text-sm font-black text-white">{dateRange}</p></div>}
                      {offer.hours && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Horarios</p><p className="mt-1 text-sm font-black text-white">{offer.hours}</p></div>}
                      {requiredPoints > 0 && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Puntos necesarios</p><p className="mt-1 text-sm font-black text-white">{requiredPoints} puntos</p></div>}
                      {offer.age && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Edad</p><p className="mt-1 text-sm font-black text-white">{offer.age}</p></div>}
                      {offer.author && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Autor/a</p><p className="mt-1 text-sm font-black text-white">{offer.author}</p></div>}
                      {categories && <div className="rounded-2xl bg-black/20 p-3"><p className="text-xs font-bold text-slate-500">Categorías</p><p className="mt-1 text-sm font-black text-white">{categories}</p></div>}
                      {offer.address && (
                        <a className="rounded-2xl bg-black/20 p-3 transition hover:bg-mint/10 sm:col-span-2" href={mapUrl} target="_blank" rel="noreferrer">
                          <p className="text-xs font-bold text-slate-500">Lugar</p>
                          <p className="mt-1 text-sm font-black text-white">{offer.address}</p>
                          <p className="mt-2 text-xs font-black text-mint">Abrir en Google Maps</p>
                        </a>
                      )}
                      {offer.description && <div className="rounded-2xl bg-black/20 p-3 sm:col-span-2"><p className="text-xs font-bold text-slate-500">Descripción del evento</p><p className="mt-2 text-sm font-semibold leading-6 text-slate-200">{offer.description}</p></div>}
                      {detailPlan.message && photos.length === 0 && <div className="rounded-2xl bg-black/20 p-3 sm:col-span-2"><p className="text-xs font-bold text-slate-500">Mensaje de {detailPlan.creator?.display_name || "la persona"}</p><p className="mt-2 text-sm font-semibold leading-6 text-slate-200">{detailPlan.message}</p></div>}
                      <a className="grid h-12 place-items-center rounded-2xl bg-mint text-sm font-black text-ink shadow-glow sm:col-span-2" href={offerDetailUrl(ticket)}>Ver el billete en detalle</a>
                    </div>
                  </div>

                  <div className="mt-5 rounded-[28px] border border-white/10 bg-mint/10 p-4">
                    <p className="text-sm font-black text-white">Compra usada como prueba</p>
                    <p className="mt-2 text-sm font-bold leading-6 text-slate-400">Aquí solo aparecen datos públicos del evento. El QR, código de validación y código de seguridad nunca se muestran en Quedar.</p>
                  </div>
                      </>
                    );
                  })()}

                  <div className="mt-5">
                    <div className="mb-3 flex items-end justify-between gap-3">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Gente del plan</p>
                        <h3 className="mt-1 text-xl font-black text-white">Participantes y solicitudes</h3>
                      </div>
                      <span className="rounded-full bg-white/[0.07] px-3 py-1 text-xs font-black text-slate-300 ring-1 ring-white/10">{(detailPlan.members || []).length} personas</span>
                    </div>
                    <div className="grid gap-3 sm:grid-cols-2">
                    {(detailPlan.members || []).map((member) => (
                      <article key={member.id} className="overflow-hidden rounded-[30px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/10">
                        <div className="flex gap-2 overflow-x-auto bg-black/20 p-3">
                          {(member.user?.plan_photo_data_urls || []).length > 0 ? (
                            member.user.plan_photo_data_urls.map((photo, index) => (
                              <img key={`${member.id}-${index}`} className="h-36 w-28 shrink-0 rounded-[24px] object-cover ring-1 ring-white/10" src={photo} alt="" />
                            ))
                          ) : (
                            <div className="grid h-36 w-full place-items-center rounded-[24px] bg-white/[0.055] text-center">
                              <span className="px-4 text-xs font-bold leading-5 text-slate-500">Fotos visibles solo para personas autorizadas</span>
                            </div>
                          )}
                        </div>
                        <div className="grid gap-3 p-4">
                        <div>
                          <p className="font-black text-white">{member.user?.display_name || "Usuario Donos"}</p>
                          <p className="mt-1 text-sm font-bold text-slate-400">{genderLabel(member.gender)} · {statusLabel(member.status)} · {formatDate(member.created_at)} {formatTime(member.created_at)}</p>
                          {member.note && <p className="mt-2 rounded-2xl bg-black/20 px-3 py-2 text-xs font-bold text-slate-300">{member.note}</p>}
                        </div>
                        {detailPlan.is_owner && detailPlan.status === "open" && (
                          <div className="grid grid-cols-3 gap-2">
                            <button className="h-10 rounded-2xl bg-mint px-3 text-xs font-black text-ink" disabled={isSaving} onClick={() => updateMember(detailPlan, member, "accepted")}>Aceptar</button>
                            <button className="h-10 rounded-2xl bg-white/[0.08] px-3 text-xs font-black text-slate-200 ring-1 ring-white/10" disabled={isSaving} onClick={() => updateMember(detailPlan, member, "waiting")}>Espera</button>
                            <button className="h-10 rounded-2xl bg-coral/10 px-3 text-xs font-black text-coral ring-1 ring-coral/20" disabled={isSaving} onClick={() => updateMember(detailPlan, member, "removed")}>Quitar</button>
                          </div>
                        )}
                        </div>
                      </article>
                    ))}
                    </div>
                    {(detailPlan.members || []).length === 0 && <p className="rounded-3xl border border-white/10 bg-white/[0.055] p-5 text-sm font-bold text-slate-300">Todavía nadie se apuntó.</p>}
                  </div>

                  {detailPlan.is_owner && detailPlan.status === "open" && (
                    <div className="mt-5 grid gap-3 sm:grid-cols-3">
                      <button className="h-12 rounded-2xl border border-mint/25 bg-mint/10 text-sm font-black text-mint" disabled={isSaving} onClick={() => startEditPlan(detailPlan)}>Editar plan</button>
                      <button className="h-12 rounded-2xl border border-coral/25 bg-coral/10 text-sm font-black text-coral" disabled={isSaving} onClick={() => cancelPlan(detailPlan)}>Cancelar plan</button>
                      <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" disabled={isSaving} onClick={() => confirmPlan(detailPlan)}>Confirmar grupo</button>
                    </div>
                  )}
                </section>
              </div>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => (
                  <a key={item.label} href={item.href} className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${item.active ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]" : "text-slate-400 hover:bg-white/[0.06] hover:text-white"}`}>
                    <NavIcon name={item.icon} />
                    <span className="mt-0.5">{item.label}</span>
                  </a>
                ))}
              </div>
            </nav>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
