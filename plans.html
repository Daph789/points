<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Quedar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166", violet: "#A78BFA" },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.18)",
              nav: "0 20px 70px rgba(0, 0, 0, 0.42)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 20% -8%, rgba(66, 242, 179, 0.20), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(167, 139, 250, 0.15), transparent 32%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: cubic-bezier(.22,.61,.36,1);
      }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      const navItems = [
        { label: "Inicio", icon: "home", href: "home.html" },
        { label: "Historial", icon: "history", href: "historial.html" },
        { label: "Quedar", icon: "users", active: true, href: "plans.html" },
        { label: "Transf.", icon: "transfer", href: "transfer.html" },
        { label: "Perfil", icon: "user", href: "profile.html" },
      ];

      function NavIcon({ name }) {
        const paths = {
          home: <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" />,
          history: <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2" />,
          users: <path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7" />,
          compass: <path d="m16.2 7.8-2.4 6-6 2.4 2.4-6 6-2.4ZM22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z" />,
          ticket: <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.2a2.8 2.8 0 0 0 0 5.6V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.2a2.8 2.8 0 0 0 0-5.6V7ZM9 8v8" />,
          list: <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />,
          checkCircle: <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4 12 14.01l-3-3" />,
          search: <path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />,
          transfer: <path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4" />,
          user: <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />,
          plus: <path d="M12 5v14M5 12h14" />,
        };
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.3">
            {paths[name]}
          </svg>
        );
      }

      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;
      }

      function formatDate(value) {
        if (!value) return "";
        return new Date(value).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
      }

      function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function planTitle(plan) {
        return plan.title || plan.purchase?.offer?.title || "Plan Donos";
      }

      function ticketImage(ticket) {
        return ticket?.offer?.cover_photo_data_url || ticket?.offer?.presentation_image_data_urls?.[0] || "";
      }

      function statusLabel(value) {
        const labels = { open: "Abierto", confirmed: "Confirmado", cancelled: "Cancelado", accepted: "Aceptado", waiting: "Lista de espera", removed: "Retirado" };
        return labels[value] || value || "";
      }

      function genderLabel(value) {
        return value === "woman" ? "Chica" : value === "man" ? "Chico" : "Libre";
      }

      function friendlyError(message, fallback = "No se ha podido completar la acción.") {
        const messages = {
          social_plans_table_missing: "Falta activar Quedar en Supabase. Ejecuta supabase-social-plans.sql.",
          purchases_table_missing: "Falta activar el SQL de pagos en Supabase.",
          purchase_already_has_plan: "Este billete ya tiene un plan activo.",
          purchase_not_found: "No encontramos este billete en tu cuenta.",
          invalid_group_size: "Indica entre 1 y 20 plazas para el grupo.",
          group_size_below_accepted: "No puedes poner menos plazas que personas ya aceptadas.",
          plan_confirmed: "Este grupo ya está confirmado y no se puede editar.",
          plan_cancelled: "Este plan está cancelado.",
          update_plan_failed: "No se ha podido guardar la modificación.",
          users_only: "Solo los usuarios pueden crear planes para quedar.",
          already_joined: "Ya pediste entrar en este plan.",
          plans_failed: "No se han podido cargar los planes.",
          mine_failed: "No se han podido cargar tus planes.",
          tickets_failed: "No se han podido cargar tus billetes.",
        };
        return messages[message] || `${fallback} Motivo: ${message || "error desconocido"}`;
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-4 w-4 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3 w-3" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      async function fileToDataUrl(file) {
        if (!file) return "";
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function TicketCard({ ticket, selected, onClick }) {
        const image = ticketImage(ticket);
        return (
          <button
            type="button"
            onClick={onClick}
            className={`grid gap-3 rounded-[28px] border p-3 text-left transition sm:grid-cols-[90px_1fr] ${selected ? "border-mint/50 bg-mint/15 shadow-glow" : "border-white/10 bg-white/[0.055]"}`}
          >
            <div className="relative h-24 overflow-hidden rounded-3xl bg-gradient-to-br from-mint via-[#183047] to-violet">
              {image ? <img className="h-full w-full object-cover" src={image} alt="" /> : <span className="grid h-full w-full place-items-center text-3xl">🎟️</span>}
              <div className="absolute left-2 top-2 rounded-full bg-black/45 px-2 py-1 text-[10px] font-black text-white backdrop-blur">Billete verificado</div>
            </div>
            <div className="min-w-0">
              <p className="truncate text-base font-black text-white">{ticket.offer?.title || "Billete Donos"}</p>
              <p className="mt-1 truncate text-sm font-bold text-slate-400">{ticket.offer?.business_display_name || ticket.receiver?.display_name || "Donos"}</p>
              <p className="mt-2 text-xs font-bold text-slate-500">{formatDate(ticket.created_at)} · {ticket.total_points || 0} ptos.</p>
            </div>
          </button>
        );
      }

      function TopModeButton({ value, label, icon, mode, onClick, count }) {
        const active = mode === value;
        return (
          <button
            type="button"
            onClick={() => onClick(value)}
            className={`relative flex h-12 shrink-0 items-center gap-2 rounded-2xl px-3 text-sm font-black transition sm:h-14 sm:px-4 ${active ? "bg-mint text-ink shadow-glow" : "border border-white/10 bg-white/[0.055] text-slate-300"}`}
          >
            <NavIcon name={icon} />
            <span>{label}</span>
            {count > 0 && <span className={`${active ? "bg-ink text-mint" : "bg-mint text-ink"} rounded-full px-2 py-0.5 text-[10px] font-black`}>{count}</span>}
          </button>
        );
      }

      function SearchBox({ value, onChange, placeholder }) {
        return (
          <label className="flex min-h-[52px] items-center gap-3 rounded-[24px] border border-white/10 bg-white/[0.055] px-4">
            <span className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint/12 text-mint">
              <NavIcon name="search" />
            </span>
            <input className="h-full flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500" value={value} onChange={(event) => onChange(event.target.value)} placeholder={placeholder} />
          </label>
        );
      }

      function PlanCard({ plan, onOpen, onJoin, onEdit }) {
        const image = ticketImage(plan.purchase);
        const counts = plan.counts || {};
        const full = Number(plan.wanted_women || 0) + Number(plan.wanted_men || 0) + Number(plan.wanted_open || 0);
        const accepted = Number(counts.accepted || 0);
        const hasPreference = Number(plan.wanted_women || 0) > 0 || Number(plan.wanted_men || 0) > 0;
        return (
          <article className="overflow-hidden rounded-[32px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/20">
            <div className="relative min-h-[210px] bg-gradient-to-br from-mint via-[#17213C] to-violet">
              {image ? <img className="absolute inset-0 h-full w-full object-cover" src={image} alt="" /> : <span className="absolute bottom-5 right-5 text-7xl">🎟️</span>}
              <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/25 to-transparent"></div>
              {plan.photo_data_url && <img className="absolute left-4 top-4 h-16 w-16 rounded-3xl border border-white/20 object-cover shadow-2xl" src={plan.photo_data_url} alt="" />}
              <div className="absolute bottom-4 left-4 right-4">
                <div className="flex flex-wrap items-center gap-2">
                  <span className={`rounded-full px-3 py-1 text-xs font-black ${plan.status === "confirmed" ? "bg-sun text-ink" : "bg-mint text-ink"}`}>{statusLabel(plan.status)}</span>
                  <span className="rounded-full bg-black/45 px-3 py-1 text-xs font-black text-white backdrop-blur">{accepted}/{full} aceptados</span>
                  {plan.viewer_member && <span className="rounded-full bg-white/15 px-3 py-1 text-xs font-black text-white">{statusLabel(plan.viewer_member.status)}</span>}
                </div>
                <h2 className="mt-3 text-2xl font-black leading-tight text-white">{planTitle(plan)}</h2>
              </div>
            </div>
            <div className="p-4">
              <div className="flex items-center gap-2">
                <p className="truncate text-sm font-black text-mint">{plan.creator?.display_name || "Usuario Donos"}</p>
                {plan.creator?.is_verified && <VerifiedBadge />}
                <p className="text-xs font-bold text-slate-500">· {plan.creator?.neighborhood || "Donostia"}</p>
              </div>
              {plan.message && <p className="mt-3 line-clamp-3 text-sm font-semibold leading-6 text-slate-300">{plan.message}</p>}
              {hasPreference ? (
                <div className="mt-4 grid grid-cols-3 gap-2">
                  <div className="rounded-2xl bg-black/20 p-3 text-center"><p className="text-xs font-bold text-slate-500">Chicas</p><p className="text-lg font-black text-white">{counts.women || 0}/{plan.wanted_women || 0}</p></div>
                  <div className="rounded-2xl bg-black/20 p-3 text-center"><p className="text-xs font-bold text-slate-500">Chicos</p><p className="text-lg font-black text-white">{counts.men || 0}/{plan.wanted_men || 0}</p></div>
                  <div className="rounded-2xl bg-black/20 p-3 text-center"><p className="text-xs font-bold text-slate-500">Sin pref.</p><p className="text-lg font-black text-white">{Math.max(accepted - Math.min(counts.women || 0, plan.wanted_women || 0) - Math.min(counts.men || 0, plan.wanted_men || 0), 0)}/{plan.wanted_open || 0}</p></div>
                </div>
              ) : (
                <div className="mt-4 rounded-2xl bg-black/20 p-3">
                  <p className="text-xs font-bold text-slate-500">Personas aceptadas</p>
                  <p className="mt-1 text-2xl font-black text-white">{accepted}/{full}</p>
                </div>
              )}
              <div className={`mt-4 grid gap-2 ${plan.is_owner && plan.status === "open" ? "grid-cols-3" : "grid-cols-2"}`}>
                <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" onClick={() => onOpen(plan)}>Ver grupo</button>
                {plan.is_owner && plan.status === "open" && <button className="h-12 rounded-2xl border border-mint/25 bg-mint/10 text-sm font-black text-mint" onClick={() => onEdit(plan)}>Editar</button>}
                <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={plan.is_owner || plan.viewer_member || plan.status !== "open"} onClick={() => onJoin(plan)}>
                  {plan.viewer_member ? statusLabel(plan.viewer_member.status) : plan.is_owner ? "Tu plan" : "Voy contigo"}
                </button>
              </div>
            </div>
          </article>
        );
      }

      function App() {
        const [profile, setProfile] = React.useState(null);
        const [token, setToken] = React.useState("");
        const [mode, setMode] = React.useState("discover");
        const [plans, setPlans] = React.useState([]);
        const [ownedPlans, setOwnedPlans] = React.useState([]);
        const [joinedPlans, setJoinedPlans] = React.useState([]);
        const [editingPlanId, setEditingPlanId] = React.useState("");
        const [tickets, setTickets] = React.useState([]);
        const [selectedTicketId, setSelectedTicketId] = React.useState("");
        const [ticketPickerOpen, setTicketPickerOpen] = React.useState(false);
        const [ticketQuery, setTicketQuery] = React.useState("");
        const [title, setTitle] = React.useState("");
        const [message, setMessage] = React.useState("");
        const [photoDataUrl, setPhotoDataUrl] = React.useState("");
        const [maxPeople, setMaxPeople] = React.useState("");
        const [freePreference, setFreePreference] = React.useState(true);
        const [wantedWomen, setWantedWomen] = React.useState(0);
        const [wantedMen, setWantedMen] = React.useState(0);
        const [joinPlan, setJoinPlan] = React.useState(null);
        const [joinGender, setJoinGender] = React.useState("open");
        const [joinNote, setJoinNote] = React.useState("");
        const [detailPlan, setDetailPlan] = React.useState(null);
        const [status, setStatus] = React.useState("");
        const [isSaving, setIsSaving] = React.useState(false);

        React.useEffect(() => {
          bootstrap();
        }, []);

        async function api(path, options = {}) {
          const response = await fetch(path, {
            ...options,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
              ...(options.headers || {}),
            },
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "request_failed");
          return data;
        }

        async function bootstrap() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          if (!accessToken) return redirectToLogin();
          setToken(accessToken);
          try {
            const profileResponse = await fetch("/api/me/profile", { headers: { Authorization: `Bearer ${accessToken}` } });
            const profileData = await profileResponse.json().catch(() => ({}));
            setProfile(profileData.profile || null);
            if (profileData.profile?.account_type === "business") {
              setStatus("");
              return;
            }
            await Promise.all([loadPlans(accessToken), loadMine(accessToken), loadTickets(accessToken)]);
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido cargar Quedar."));
          }
        }

        async function loadPlans(accessToken = token) {
          const response = await fetch("/api/social-plans", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "plans_failed");
          setPlans(data.plans || []);
          setStatus("");
        }

        async function loadMine(accessToken = token) {
          const response = await fetch("/api/social-plans/me", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "mine_failed");
          setOwnedPlans(data.owned || []);
          setJoinedPlans(data.joined || []);
        }

        async function loadTickets(accessToken = token) {
          const response = await fetch("/api/me/plan-tickets", { headers: { Authorization: `Bearer ${accessToken}` } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "tickets_failed");
          setTickets(data.tickets || []);
        }

        async function reloadAll() {
          await Promise.all([loadPlans(), loadMine(), loadTickets()]);
        }

        async function handlePhoto(event) {
          const file = event.target.files?.[0];
          if (!file) return;
          if (file.size > 900000) {
            setStatus("La foto es demasiado grande. Usa una foto más ligera.");
            return;
          }
          setPhotoDataUrl(await fileToDataUrl(file));
        }

        async function createPlan() {
          if (!selectedTicketId) return setStatus("Elige un billete para crear el plan.");
          const totalWanted = Math.max(Math.floor(Number(maxPeople || 0)), 0);
          const womenWanted = freePreference ? 0 : Math.max(Math.floor(Number(wantedWomen || 0)), 0);
          const menWanted = freePreference ? 0 : Math.max(Math.floor(Number(wantedMen || 0)), 0);
          const openWanted = freePreference ? totalWanted : Math.max(totalWanted - womenWanted - menWanted, 0);
          if (totalWanted <= 0) return setStatus("Indica cuántas personas pueden apuntarse como máximo.");
          if (totalWanted > 20) return setStatus("El máximo para un plan es de 20 personas.");
          if (!freePreference && womenWanted + menWanted > totalWanted) return setStatus("La suma de chicas y chicos no puede superar el máximo de personas.");
          setIsSaving(true);
          setStatus("");
          try {
            await api(editingPlanId ? `/api/social-plans/${editingPlanId}` : "/api/social-plans", {
              method: editingPlanId ? "PATCH" : "POST",
              body: JSON.stringify({
                purchaseId: selectedTicketId,
                title,
                message,
                photoDataUrl,
                wantedWomen: womenWanted,
                wantedMen: menWanted,
                wantedOpen: openWanted,
              }),
            });
            setStatus(editingPlanId ? "Plan actualizado correctamente." : "Plan publicado correctamente.");
            setMode("mine");
            setEditingPlanId("");
            setSelectedTicketId("");
            setTitle("");
            setMessage("");
            setPhotoDataUrl("");
            setMaxPeople("");
            setFreePreference(true);
            setWantedWomen(0);
            setWantedMen(0);
            await reloadAll();
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido publicar el plan."));
          } finally {
            setIsSaving(false);
          }
        }

        async function submitJoin() {
          if (!joinPlan) return;
          setIsSaving(true);
          setStatus("");
          try {
            const data = await api(`/api/social-plans/${joinPlan.id}/join`, {
              method: "POST",
              body: JSON.stringify({ gender: joinGender, note: joinNote }),
            });
            setStatus(data.status === "accepted" ? "Estás dentro del grupo." : "Estás en lista de espera.");
            setJoinPlan(null);
            setJoinNote("");
            await reloadAll();
          } catch (error) {
            setStatus(friendlyError(error.message, "No se ha podido enviar tu solicitud."));
          } finally {
            setIsSaving(false);
          }
        }

        function startEditPlan(plan) {
          const women = Number(plan.wanted_women || 0);
          const men = Number(plan.wanted_men || 0);
          const open = Number(plan.wanted_open || 0);
          const total = women + men + open;
          setEditingPlanId(plan.id);
          setSelectedTicketId(plan.purchase_id || plan.purchase?.id || "");
          setTitle(plan.title || "");
          setMessage(plan.message || "");
          setPhotoDataUrl(plan.photo_data_url || "");
          setMaxPeople(total || "");
          setFreePreference(women === 0 && men === 0);
          setWantedWomen(women);
          setWantedMen(men);
          setDetailPlan(null);
          setStatus("Editando tu plan. Guarda los cambios cuando termines.");
          setMode("create");
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function cancelEdit() {
          setEditingPlanId("");
          setSelectedTicketId("");
          setTitle("");
          setMessage("");
          setPhotoDataUrl("");
          setMaxPeople("");
          setFreePreference(true);
          setWantedWomen(0);
          setWantedMen(0);
          setStatus("");
        }

        async function updateMember(plan, member, nextStatus) {
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/members/${member.id}`, {
              method: "PATCH",
              body: JSON.stringify({ status: nextStatus }),
            });
            await reloadAll();
            const fresh = [...ownedPlans, ...plans].find((item) => item.id === plan.id);
            if (fresh) setDetailPlan(fresh);
          } catch (error) {
            setStatus("No se ha podido actualizar la persona.");
          } finally {
            setIsSaving(false);
          }
        }

        async function confirmPlan(plan) {
          if (!window.confirm("Al confirmar, el grupo queda cerrado y no se podrá modificar más.")) return;
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/confirm`, { method: "POST", body: "{}" });
            setStatus("Grupo confirmado.");
            setDetailPlan(null);
            await reloadAll();
          } catch (error) {
            setStatus("No se ha podido confirmar el grupo.");
          } finally {
            setIsSaving(false);
          }
        }

        async function cancelPlan(plan) {
          if (!window.confirm("¿Cancelar este plan?")) return;
          setIsSaving(true);
          try {
            await api(`/api/social-plans/${plan.id}/cancel`, { method: "POST", body: "{}" });
            setStatus("Plan cancelado.");
            setDetailPlan(null);
            await reloadAll();
          } catch (error) {
            setStatus("No se ha podido cancelar el plan.");
          } finally {
            setIsSaving(false);
          }
        }

        const visiblePlans = plans.filter((plan) => !plan.is_owner);
        const editingPlan = ownedPlans.find((plan) => plan.id === editingPlanId);
        const selectedTicket = tickets.find((ticket) => ticket.id === selectedTicketId) || editingPlan?.purchase;
        const filteredTickets = tickets.filter((ticket) => {
          const query = ticketQuery.trim().toLowerCase();
          if (!query) return true;
          return [
            ticket.offer?.title,
            ticket.offer?.business_display_name,
            ticket.receiver?.display_name,
            ticket.offer?.category,
            ticket.delivery_method,
            formatDate(ticket.created_at),
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });
        const modes = [
          { value: "discover", label: "Planes", icon: "compass", count: visiblePlans.length },
          { value: "create", label: "Crear", icon: "ticket", count: 0 },
          { value: "mine", label: "Míos", icon: "list", count: ownedPlans.length },
          { value: "joined", label: "Voy", icon: "checkCircle", count: joinedPlans.length },
        ];

        if (profile?.account_type === "business") {
          return (
            <main className="mx-auto min-h-screen w-full max-w-3xl px-4 pb-28 pt-4">
              <header className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-xl font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Zona empresa</p>
                </div>
              </header>
              <section className="mt-6 rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow">
                <p className="text-sm font-black uppercase tracking-[0.16em] text-mint">Quedar es para usuarios</p>
                <h1 className="mt-2 text-3xl font-black text-white">Tu empresa publica ofertas</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Los planes sociales son para jóvenes que ya compraron un billete. Como comercio puedes crear y editar tus ofertas.</p>
                <div className="mt-5 grid gap-3 sm:grid-cols-2">
                  <a className="grid h-12 place-items-center rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" href="admin-offer.html">Crear oferta</a>
                  <a className="grid h-12 place-items-center rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" href="my-offers.html">Mis publicaciones</a>
                </div>
              </section>
            </main>
          );
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-5xl px-3 pb-28 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html" className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-xl font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Quedar</p>
                </div>
              </a>
              <button className="grid h-10 w-10 place-items-center rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-mint" onClick={reloadAll}>↻</button>
            </header>

            <div className="sticky top-0 z-30 -mx-3 mt-3 overflow-x-auto border-y border-white/5 bg-[#060914]/72 px-3 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
              <div className="flex w-max min-w-full gap-2">
                {modes.map((item) => (
                  <TopModeButton key={item.value} {...item} mode={mode} onClick={setMode} />
                ))}
              </div>
            </div>

            {status && (
              <p className={`mt-4 rounded-2xl border p-4 text-sm font-bold ${
                status.includes("correctamente") || status.includes("dentro") || status.includes("confirmado")
                  ? "border-mint/25 bg-mint/10 text-mint"
                  : status.includes("Cargando") || status.includes("Editando")
                    ? "border-white/10 bg-white/[0.055] text-slate-300"
                    : "border-coral/25 bg-coral/10 text-coral"
              }`}>{status}</p>
            )}

            {mode === "discover" && (
              <section className="mt-4 grid gap-4 sm:grid-cols-2">
                {visiblePlans.map((plan) => <PlanCard key={plan.id} plan={plan} onOpen={setDetailPlan} onJoin={setJoinPlan} onEdit={startEditPlan} />)}
                {visiblePlans.length === 0 && (
                  <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                    <p className="text-base font-black text-white">Todavía no hay planes de otros usuarios.</p>
                    <p className="mt-2 leading-6 text-slate-400">Tus publicaciones aparecen en <span className="text-mint">Míos</span>. En <span className="text-mint">Planes</span> verás los planes creados por otras personas para poder apuntarte.</p>
                  </div>
                )}
              </section>
            )}

            {mode === "create" && (
              <section className="mt-4 grid gap-4 lg:grid-cols-[.9fr_1.1fr]">
                <div className="rounded-[32px] border border-white/10 bg-white/[0.055] p-4 sm:p-5">
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Billete prueba</p>
                      <p className="mt-1 text-sm font-bold text-slate-400">El QR y los códigos quedan ocultos.</p>
                    </div>
                    <button className="h-11 shrink-0 rounded-2xl bg-mint px-4 text-sm font-black text-ink shadow-glow" onClick={() => setTicketPickerOpen(true)}>Añadir</button>
                  </div>
                  {selectedTicket ? (
                    <div className="mt-4">
                      <TicketCard ticket={selectedTicket} selected={true} onClick={() => setTicketPickerOpen(true)} />
                    </div>
                  ) : (
                    <button className="mt-4 grid min-h-[150px] w-full place-items-center rounded-[28px] border border-dashed border-mint/35 bg-mint/10 p-5 text-center" onClick={() => setTicketPickerOpen(true)}>
                      <span>
                        <span className="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-mint text-ink"><NavIcon name="ticket" /></span>
                        <span className="mt-3 block text-lg font-black text-white">Elegir billete</span>
                        <span className="mt-1 block text-sm font-bold text-slate-400">Abre tu galería con buscador.</span>
                      </span>
                    </button>
                  )}
                </div>

                <div className="rounded-[32px] border border-white/10 bg-white/[0.055] p-5">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">{editingPlanId ? "Editar plan" : "Crear plan"}</p>
                      {editingPlanId && <p className="mt-1 text-xs font-bold text-slate-500">Estás modificando una publicación existente.</p>}
                    </div>
                    {editingPlanId && <button className="rounded-2xl border border-white/10 bg-white/[0.06] px-3 py-2 text-xs font-black text-slate-300" onClick={cancelEdit}>Cancelar</button>}
                  </div>
                  <input className="mt-4 h-12 w-full rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none focus:border-mint/70" value={title} onChange={(event) => setTitle(event.target.value)} placeholder="Título: Vamos al concierto..." />
                  <textarea className="mt-3 min-h-28 w-full rounded-2xl border border-line bg-black/20 px-4 py-3 text-sm font-bold text-white outline-none focus:border-mint/70" value={message} onChange={(event) => setMessage(event.target.value)} placeholder="Texto: quién eres, qué plan quieres, punto de encuentro..." />
                  <label className="mt-3 flex cursor-pointer items-center justify-between gap-3 rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                    <span className="text-sm font-bold text-slate-300">{photoDataUrl ? "Foto cargada" : "Subir foto tuya"}</span>
                    <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">Foto</span>
                    <input type="file" className="hidden" accept="image/*" onChange={handlePhoto} />
                  </label>
                  {photoDataUrl && <img className="mt-3 h-28 w-28 rounded-3xl object-cover ring-1 ring-white/10" src={photoDataUrl} alt="" />}

                  <label className="mt-4 block rounded-[26px] border border-white/10 bg-black/20 p-4">
                    <span className="text-sm font-black text-white">¿Cuántas personas máximo pueden apuntarse?</span>
                    <span className="mt-1 block text-xs font-bold leading-5 text-slate-500">Ejemplo: si quieres ir con 5 personas, escribe 5.</span>
                    <input className="mt-3 h-12 w-full rounded-2xl border border-line bg-white/[0.04] px-4 text-2xl font-black text-white outline-none focus:border-mint/70" type="number" min="1" max="20" value={maxPeople} onChange={(event) => setMaxPeople(event.target.value)} placeholder="5" />
                  </label>

                  {Number(maxPeople || 0) > 0 && (
                    <div className="mt-3 rounded-[26px] border border-white/10 bg-black/20 p-4">
                      <p className="text-sm font-black text-white">¿Tienes preferencia para el grupo?</p>
                      <label className="mt-3 flex cursor-pointer items-start gap-3 rounded-2xl bg-white/[0.055] p-3">
                        <input className="mt-1 h-5 w-5 accent-[#42F2B3]" type="checkbox" checked={freePreference} onChange={(event) => setFreePreference(event.target.checked)} />
                        <span>
                          <span className="block text-sm font-black text-white">Me da igual, grupo libre</span>
                          <span className="mt-1 block text-xs font-bold leading-5 text-slate-500">Cualquiera puede apuntarse hasta completar el máximo.</span>
                        </span>
                      </label>

                      {!freePreference && (
                        <>
                          <p className="mt-4 text-xs font-bold leading-5 text-slate-500">Opcional: indica cuántas chicas y cuántos chicos prefieres dentro del máximo. Las plazas que sobren quedan abiertas para cualquiera.</p>
                          <div className="mt-3 grid grid-cols-2 gap-2">
                            <label className="rounded-2xl bg-white/[0.055] p-3"><span className="text-xs font-bold text-slate-500">Chicas preferidas</span><input className="mt-2 w-full bg-transparent text-2xl font-black text-white outline-none" type="number" min="0" max="20" value={wantedWomen} onChange={(event) => setWantedWomen(event.target.value)} /></label>
                            <label className="rounded-2xl bg-white/[0.055] p-3"><span className="text-xs font-bold text-slate-500">Chicos preferidos</span><input className="mt-2 w-full bg-transparent text-2xl font-black text-white outline-none" type="number" min="0" max="20" value={wantedMen} onChange={(event) => setWantedMen(event.target.value)} /></label>
                          </div>
                          <p className="mt-3 rounded-2xl bg-mint/10 px-3 py-2 text-xs font-black text-mint">
                            {Math.max(Number(maxPeople || 0) - Number(wantedWomen || 0) - Number(wantedMen || 0), 0)} plaza(s) sin preferencia.
                          </p>
                        </>
                      )}
                    </div>
                  )}
                  <p className="mt-3 text-xs font-bold leading-5 text-slate-500">Cuando alguien se apunta, Donos lo acepta automáticamente si aún queda sitio. Si el grupo ya está completo, esa persona entra en lista de espera y tú puedes decidir después.</p>
                  <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={isSaving} onClick={createPlan}>{isSaving ? "Guardando..." : editingPlanId ? "Guardar cambios" : "Publicar plan"}</button>
                </div>
              </section>
            )}

            {mode === "mine" && (
              <section className="mt-5 grid gap-4 sm:grid-cols-2">
                {ownedPlans.map((plan) => <PlanCard key={plan.id} plan={plan} onOpen={setDetailPlan} onJoin={setJoinPlan} onEdit={startEditPlan} />)}
                {ownedPlans.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">Todavía no has creado planes.</p>}
              </section>
            )}

            {mode === "joined" && (
              <section className="mt-5 grid gap-4 sm:grid-cols-2">
                {joinedPlans.map((plan) => <PlanCard key={plan.id} plan={plan} onOpen={setDetailPlan} onJoin={setJoinPlan} onEdit={startEditPlan} />)}
                {joinedPlans.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">Todavía no te has apuntado a ningún plan.</p>}
              </section>
            )}

            {ticketPickerOpen && (
              <div className="fixed inset-0 z-50 bg-black/75 px-3 py-5 backdrop-blur-xl">
                <section className="mx-auto flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-[34px] border border-white/10 bg-[#0D111D] shadow-2xl">
                  <div className="border-b border-white/10 p-4 sm:p-5">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Galería de billetes</p>
                        <h2 className="mt-1 text-2xl font-black text-white">Elige el billete del plan</h2>
                      </div>
                      <button className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white/10 text-2xl font-black text-white" onClick={() => setTicketPickerOpen(false)}>×</button>
                    </div>
                    <div className="mt-4">
                      <SearchBox value={ticketQuery} onChange={setTicketQuery} placeholder="Buscar por título, empresa, fecha..." />
                    </div>
                  </div>
                  <div className="overflow-y-auto p-4 sm:p-5">
                    <div className="grid gap-3 sm:grid-cols-2">
                      {filteredTickets.map((ticket) => (
                        <TicketCard
                          key={ticket.id}
                          ticket={ticket}
                          selected={selectedTicketId === ticket.id}
                          onClick={() => {
                            setSelectedTicketId(ticket.id);
                            setTicketPickerOpen(false);
                            setStatus("");
                          }}
                        />
                      ))}
                    </div>
                    {tickets.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">Todavía no tienes billetes comprados.</p>}
                    {tickets.length > 0 && filteredTickets.length === 0 && <p className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">No encontramos billetes con esa búsqueda.</p>}
                  </div>
                </section>
              </div>
            )}

            {joinPlan && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 px-4 backdrop-blur-xl">
                <section className="w-full max-w-md rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl">
                  <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Voy contigo</p>
                  <h2 className="mt-2 text-2xl font-black text-white">{planTitle(joinPlan)}</h2>
                  <div className="mt-4 grid grid-cols-3 gap-2">
                    {[["woman", "Chica"], ["man", "Chico"], ["open", "Libre"]].map(([value, label]) => (
                      <button key={value} className={`h-11 rounded-2xl text-sm font-black ${joinGender === value ? "bg-mint text-ink" : "bg-white/[0.06] text-slate-300 ring-1 ring-white/10"}`} onClick={() => setJoinGender(value)}>{label}</button>
                    ))}
                  </div>
                  <textarea className="mt-3 min-h-24 w-full rounded-2xl border border-line bg-black/20 px-4 py-3 text-sm font-bold text-white outline-none focus:border-mint/70" value={joinNote} onChange={(event) => setJoinNote(event.target.value)} placeholder="Mensaje opcional..." />
                  <div className="mt-4 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white" onClick={() => setJoinPlan(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" disabled={isSaving} onClick={submitJoin}>Enviar</button>
                  </div>
                </section>
              </div>
            )}

            {detailPlan && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/75 px-4 py-6 backdrop-blur-xl">
                <section className="mx-auto max-w-3xl rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Grupo</p>
                      <h2 className="mt-2 text-3xl font-black text-white">{planTitle(detailPlan)}</h2>
                      <p className="mt-2 text-sm font-bold text-slate-400">{detailPlan.purchase?.offer?.business_display_name || detailPlan.purchase?.receiver?.display_name || "Donos"} · {statusLabel(detailPlan.status)}</p>
                    </div>
                    <button className="grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black" onClick={() => setDetailPlan(null)}>×</button>
                  </div>

                  <div className="mt-5 rounded-[28px] border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-sm font-black text-white">Billete usado como prueba</p>
                    <p className="mt-2 text-sm font-bold leading-6 text-slate-400">Solo se muestra la información pública del billete. El QR, código de validación y código de seguridad no aparecen aquí.</p>
                  </div>

                  <div className="mt-5 grid gap-3">
                    {(detailPlan.members || []).map((member) => (
                      <article key={member.id} className="grid gap-3 rounded-3xl border border-white/10 bg-white/[0.055] p-4 sm:grid-cols-[1fr_auto] sm:items-center">
                        <div>
                          <p className="font-black text-white">{member.user?.display_name || "Usuario Donos"}</p>
                          <p className="mt-1 text-sm font-bold text-slate-400">{genderLabel(member.gender)} · {statusLabel(member.status)} · {formatDate(member.created_at)} {formatTime(member.created_at)}</p>
                          {member.note && <p className="mt-2 rounded-2xl bg-black/20 px-3 py-2 text-xs font-bold text-slate-300">{member.note}</p>}
                        </div>
                        {detailPlan.is_owner && detailPlan.status === "open" && (
                          <div className="grid grid-cols-3 gap-2">
                            <button className="h-10 rounded-2xl bg-mint px-3 text-xs font-black text-ink" disabled={isSaving} onClick={() => updateMember(detailPlan, member, "accepted")}>Aceptar</button>
                            <button className="h-10 rounded-2xl bg-white/[0.08] px-3 text-xs font-black text-slate-200 ring-1 ring-white/10" disabled={isSaving} onClick={() => updateMember(detailPlan, member, "waiting")}>Espera</button>
                            <button className="h-10 rounded-2xl bg-coral/10 px-3 text-xs font-black text-coral ring-1 ring-coral/20" disabled={isSaving} onClick={() => updateMember(detailPlan, member, "removed")}>Quitar</button>
                          </div>
                        )}
                      </article>
                    ))}
                    {(detailPlan.members || []).length === 0 && <p className="rounded-3xl border border-white/10 bg-white/[0.055] p-5 text-sm font-bold text-slate-300">Todavía nadie se apuntó.</p>}
                  </div>

                  {detailPlan.is_owner && detailPlan.status === "open" && (
                    <div className="mt-5 grid gap-3 sm:grid-cols-3">
                      <button className="h-12 rounded-2xl border border-mint/25 bg-mint/10 text-sm font-black text-mint" disabled={isSaving} onClick={() => startEditPlan(detailPlan)}>Editar plan</button>
                      <button className="h-12 rounded-2xl border border-coral/25 bg-coral/10 text-sm font-black text-coral" disabled={isSaving} onClick={() => cancelPlan(detailPlan)}>Cancelar plan</button>
                      <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" disabled={isSaving} onClick={() => confirmPlan(detailPlan)}>Confirmar grupo</button>
                    </div>
                  )}
                </section>
              </div>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => (
                  <a key={item.label} href={item.href} className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${item.active ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]" : "text-slate-400 hover:bg-white/[0.06] hover:text-white"}`}>
                    <NavIcon name={item.icon} />
                    <span className="mt-0.5">{item.label}</span>
                  </a>
                ))}
              </div>
            </nav>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
