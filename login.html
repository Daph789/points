<!doctype html>
<html lang="es" data-country-guard="auth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="country-guard.js"></script>
    <script src="donoss-i18n.js"></script>
    <script defer src="activity-tracker.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#070A12",
              panel: "#0D111D",
              line: "#20273A",
              mint: "#42F2B3",
              coral: "#FF6B6B",
              sun: "#FFD166",
            },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.18)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");

      html {
        background: #070a12;
        overflow-x: hidden;
      }

      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% -8%, rgba(66, 242, 179, 0.18), transparent 30%),
          radial-gradient(circle at 88% 6%, rgba(255, 107, 107, 0.13), transparent 30%),
          linear-gradient(180deg, #0b0f1a 0%, #070a12 56%, #05070d 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }

      .glass {
        background: rgba(13, 17, 29, 0.78);
        backdrop-filter: blur(22px);
      }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
        },
      });

      const inputClass =
        "h-12 w-full max-w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-[15px] text-white outline-none transition placeholder:text-slate-500 focus:border-mint/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-mint/10";
      const rememberedEmailKey = "donossRememberedEmail";
      const authCopy = {
        es: {
          title: "Donoss | Iniciar sesión",
          loadingTitle: "Preparando tu app.",
          loadingText: "Estamos comprobando tu sesión.",
          tagline: "Tu barrio, tus puntos",
          badge: "Login",
          eyebrow: "Iniciar sesión",
          heading: "Vuelve a Donoss",
          intro: "Entra con tu correo y contraseña. Google y Apple estarán disponibles más adelante.",
          divider: "o con correo",
          email: "Correo electrónico",
          password: "Contraseña",
          passwordPlaceholder: "Tu contraseña",
          remember: "Recordarme",
          forgot: "¿Olvidaste la contraseña?",
          submit: "Iniciar sesión",
          submitting: "Entrando...",
          noAccount: "¿No tienes cuenta?",
          createAccount: "Crear cuenta",
          privacy: "Política de privacidad",
          deleteData: "Eliminar datos",
          socialUnavailable: (provider) => `Ahora ${provider === "apple" ? "Apple" : "Google"} no está disponible. Usa tu correo y contraseña.`,
          socialTitle: "Acceso no disponible",
          socialButton: "Entendido",
          loginError: "No se ha podido iniciar sesión.",
        },
        fr: {
          title: "Donoss | Connexion",
          loadingTitle: "Préparation de ton app.",
          loadingText: "Nous vérifions ta session.",
          tagline: "Ton quartier, tes points",
          badge: "Connexion",
          eyebrow: "Connexion",
          heading: "Retour sur Donoss",
          intro: "Connecte-toi avec ton e-mail et ton mot de passe. Google et Apple seront disponibles plus tard.",
          divider: "ou avec e-mail",
          email: "Adresse e-mail",
          password: "Mot de passe",
          passwordPlaceholder: "Ton mot de passe",
          remember: "Se souvenir de moi",
          forgot: "Mot de passe oublié ?",
          submit: "Se connecter",
          submitting: "Connexion...",
          noAccount: "Tu n’as pas encore de compte ?",
          createAccount: "Créer un compte",
          privacy: "Politique de confidentialité",
          deleteData: "Supprimer mes données",
          socialUnavailable: (provider) => `${provider === "apple" ? "Apple" : "Google"} n’est pas encore disponible. Utilise ton e-mail et ton mot de passe.`,
          socialTitle: "Accès non disponible",
          socialButton: "Compris",
          loginError: "Connexion impossible.",
        },
      };

      function localeFromCountry(country) {
        return ["FR", "BE"].includes(String(country || "").toUpperCase()) ? "fr" : "es";
      }

      function GoogleIcon() {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.7 3.8-5.5 3.8a6 6 0 0 1 0-12c1.9 0 3.1.8 3.8 1.5l2.6-2.5A9.7 9.7 0 0 0 12 2.4a9.6 9.6 0 1 0 0 19.2c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6h-9z" />
            <path fill="#34A853" d="M3.3 7.9l3.2 2.4A5.8 5.8 0 0 1 12 6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5A9.7 9.7 0 0 0 12 2.4a9.6 9.6 0 0 0-8.7 5.5z" />
            <path fill="#4A90E2" d="M12 21.6c2.6 0 4.9-.9 6.5-2.4l-3.1-2.4c-.8.6-1.9 1-3.4 1a5.8 5.8 0 0 1-5.5-4l-3.2 2.5a9.6 9.6 0 0 0 8.7 5.3z" />
            <path fill="#FBBC05" d="M6.5 13.8a5.8 5.8 0 0 1 0-3.5L3.3 7.9a9.6 9.6 0 0 0 0 8.4l3.2-2.5z" />
          </svg>
        );
      }

      function AppleIcon() {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5 fill-white">
            <path d="M16.7 12.8c0-2 1.6-3 1.7-3.1-1-.1-2.1-.6-3-.6-1.3 0-2.4.8-3 .8-.7 0-1.7-.8-2.8-.8-1.4 0-2.7.8-3.4 2.1-1.5 2.6-.4 6.4 1 8.5.7 1 1.5 2.1 2.6 2.1 1 0 1.5-.7 2.8-.7s1.7.7 2.8.7 1.9-1 2.6-2c.8-1.1 1.1-2.2 1.1-2.3 0 0-2.3-.9-2.4-3.7z" />
            <path d="M14.6 6.9c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6.9.1 1.9-.5 2.5-1.2z" />
          </svg>
        );
      }

      function Field({ label, children }) {
        return (
          <label className="block">
            <span className="mb-2 block text-sm font-medium text-slate-300">{label}</span>
            {children}
          </label>
        );
      }

      function App() {
        const [email, setEmail] = React.useState(() => localStorage.getItem(rememberedEmailKey) || "");
        const [password, setPassword] = React.useState("");
        const [rememberMe, setRememberMe] = React.useState(() => Boolean(localStorage.getItem(rememberedEmailKey)));
        const [status, setStatus] = React.useState({ type: "", message: "" });
        const [socialNotice, setSocialNotice] = React.useState(null);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [isCheckingSession, setIsCheckingSession] = React.useState(true);
        const [locale, setLocale] = React.useState("es");
        const t = authCopy[locale] || authCopy.es;

        const canSubmit = email.trim() && password.length >= 1;

        React.useEffect(() => {
          let cancelled = false;
          async function syncLocale() {
            const result = await window.donossCountryGuard?.detectCountry?.();
            if (!cancelled) {
              window.donossI18n?.setCountry?.(result?.country);
              setLocale(localeFromCountry(result?.country));
            }
          }
          syncLocale();
          return () => {
            cancelled = true;
          };
        }, []);

        React.useEffect(() => {
          document.documentElement.lang = locale;
          document.title = t.title;
        }, [locale]);

        function redirectTargetFromNext(next) {
          if (!next) return "app.html#inicio";
          try {
            const url = new URL(next, window.location.origin);
            if (url.origin !== window.location.origin) return "app.html#inicio";
            const file = url.pathname.split("/").pop() || "home.html";
            const routes = {
              "home.html": "inicio",
              "historial.html": "historial",
              "plans.html": "quedar",
              "transfer.html": "transfer",
              "profile.html": "perfil",
            };
            if (routes[file]) return `app.html#${routes[file]}`;
            if (file === "app.html") return `${url.pathname}${url.hash || "#inicio"}`;
            return `${url.pathname}${url.search}${url.hash}`;
          } catch (_error) {
            return "app.html#inicio";
          }
        }

        React.useEffect(() => {
          let isMounted = true;

          async function continueIfSessionExists() {
            try {
              const { data } = await supabaseClient.auth.getSession();
              const userId = data.session?.user?.id;
              if (userId) {
                await loadProfileAndRedirect(userId);
                return;
              }
            } catch (_error) {
            } finally {
              if (isMounted) setIsCheckingSession(false);
            }
          }

          continueIfSessionExists();
          return () => {
            isMounted = false;
          };
        }, []);

        async function loadProfileAndRedirect(userId) {
          const next = new URLSearchParams(window.location.search).get("next");
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          let profile = null;

          if (accessToken) {
            const response = await fetch("/api/me/profile", {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok) profile = data.profile;
          }

          if (!profile) {
            const { data } = await supabaseClient
              .from("profiles")
              .select("account_type, display_name, transaction_id")
              .eq("id", userId)
              .maybeSingle();
            profile = data;
          }

          const accountType = profile?.account_type || "user";
          const displayName = profile?.display_name || "";
          const transactionId = profile?.transaction_id || "";

          localStorage.setItem("donosAccountType", accountType);
          if (displayName) localStorage.setItem("donosDisplayName", displayName);
          if (transactionId) localStorage.setItem("donosTransactionId", transactionId);

          window.location.href = redirectTargetFromNext(next);
        }

        async function handleSubmit(event) {
          event.preventDefault();
          setStatus({ type: "", message: "" });

          if (!canSubmit) return;

          setIsSubmitting(true);

          try {
            const canAccess = await window.donossCountryGuard?.requireSpainAccess?.();
            if (canAccess === false) return;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: email.trim().toLowerCase(),
              password,
            });

            if (error) throw error;

            if (rememberMe) {
              localStorage.setItem(rememberedEmailKey, email.trim().toLowerCase());
            } else {
              localStorage.removeItem(rememberedEmailKey);
            }

            await loadProfileAndRedirect(data.user.id);
          } catch (error) {
            setStatus({
              type: "error",
              message: error.message || t.loginError,
            });
          } finally {
            setIsSubmitting(false);
          }
        }

        async function handleSocialLogin(provider) {
          setSocialNotice({
            provider,
            message: t.socialUnavailable(provider),
          });
        }

        if (isCheckingSession) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <div className="glass w-full max-w-sm rounded-[30px] border border-white/10 p-6 shadow-2xl shadow-black/30">
                <div className="grid h-14 w-14 place-items-center overflow-hidden rounded-2xl bg-white shadow-glow">
                  <img src="assets/donoss-infinity-logo.jpeg" alt="" className="h-full w-full object-cover" />
                </div>
                <p className="mt-4 text-xl font-black text-white">{t.loadingTitle}</p>
                <p className="mt-2 text-sm font-bold text-slate-400">{t.loadingText}</p>
              </div>
            </main>
          );
        }

        return (
          <React.Fragment>
          <main className="grid min-h-screen place-items-center px-3 py-5 sm:px-4 sm:py-6">
            <section className="w-full max-w-[470px]">
              <div className="mb-6 flex items-center justify-between">
                <a href="index.html" className="flex items-center gap-3">
                  <div className="grid h-12 w-12 place-items-center overflow-hidden rounded-2xl bg-white shadow-glow">
                    <img src="assets/donoss-infinity-logo.jpeg" alt="" className="h-full w-full object-cover" />
                  </div>
                  <div>
                    <p className="text-xl font-black">Donoss</p>
                    <p className="text-sm font-medium text-slate-400">{t.tagline}</p>
                  </div>
                </a>
                <span className="rounded-full border border-white/10 px-3 py-1 text-xs font-semibold text-slate-300">{t.badge}</span>
              </div>

              <div className="glass rounded-[30px] border border-white/10 p-5 shadow-2xl shadow-black/30 sm:p-7">
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">{t.eyebrow}</p>
                <h1 className="mt-2 break-words text-3xl font-black tracking-normal text-white sm:text-4xl">{t.heading}</h1>
                <p className="mt-3 text-sm leading-6 text-slate-400">
                  {t.intro}
                </p>

                <div className="mt-6 grid grid-cols-2 gap-2 sm:gap-3">
                  <button
                    type="button"
                    onClick={() => handleSocialLogin("google")}
                    className="flex h-12 min-w-0 items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[0.07] px-2 text-sm font-bold text-white transition hover:bg-white/[0.11] focus:outline-none focus:ring-4 focus:ring-white/10"
                  >
                    <GoogleIcon />
                    Google
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSocialLogin("apple")}
                    className="flex h-12 min-w-0 items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[0.07] px-2 text-sm font-bold text-white transition hover:bg-white/[0.11] focus:outline-none focus:ring-4 focus:ring-white/10"
                  >
                    <AppleIcon />
                    Apple
                  </button>
                </div>

                <div className="my-6 flex items-center gap-3">
                  <div className="h-px flex-1 bg-white/10"></div>
                  <span className="text-xs font-semibold text-slate-500">{t.divider}</span>
                  <div className="h-px flex-1 bg-white/10"></div>
                </div>

                <form className="space-y-4" onSubmit={handleSubmit}>
                  <Field label={t.email}>
                    <input
                      className={inputClass}
                      type="email"
                      placeholder="tu@email.com"
                      autoComplete="email"
                      value={email}
                      onChange={(event) => setEmail(event.target.value)}
                    />
                  </Field>

                  <Field label={t.password}>
                    <input
                      className={inputClass}
                      type="password"
                      placeholder={t.passwordPlaceholder}
                      autoComplete="current-password"
                      value={password}
                      onChange={(event) => setPassword(event.target.value)}
                    />
                  </Field>

                  <div className="flex items-center justify-between gap-3">
                    <label className="flex items-center gap-2 text-xs font-semibold text-slate-400">
                      <input
                        type="checkbox"
                        className="h-4 w-4 rounded border-line bg-panel accent-mint"
                        checked={rememberMe}
                        onChange={(event) => setRememberMe(event.target.checked)}
                      />
                      {t.remember}
                    </label>
                    <button type="button" className="text-xs font-bold text-mint underline decoration-mint/60 underline-offset-4">
                      {t.forgot}
                    </button>
                  </div>

                  {status.message && (
                    <div className="rounded-2xl border border-coral/30 bg-coral/10 p-3 text-sm font-semibold text-coral">
                      {status.message}
                    </div>
                  )}

                  <button
                    className={`mt-2 flex h-14 w-full items-center justify-center rounded-2xl px-5 text-base font-black transition focus:outline-none focus:ring-4 ${
                      canSubmit
                        ? "bg-mint text-ink shadow-glow hover:translate-y-[-1px] hover:bg-[#66ffd0] focus:ring-mint/25"
                        : "cursor-not-allowed bg-slate-700 text-slate-400 shadow-none focus:ring-slate-600/25"
                    }`}
                    disabled={!canSubmit || isSubmitting}
                  >
                    {isSubmitting ? t.submitting : t.submit}
                  </button>
                </form>

                <p className="mt-5 text-center text-sm text-slate-400">
                  {t.noAccount} <a className="font-bold text-white underline decoration-mint/70 underline-offset-4" href="signup.html">{t.createAccount}</a>
                </p>
                <p className="mt-3 text-center text-xs font-bold text-slate-500">
                  <a className="underline decoration-mint/50 underline-offset-4 transition hover:text-white" href="privacy-policy.html" target="_blank" rel="noreferrer">{t.privacy}</a>
                  <span className="mx-2">·</span>
                  <a className="underline decoration-mint/50 underline-offset-4 transition hover:text-white" href="data-deletion.html" target="_blank" rel="noreferrer">{t.deleteData}</a>
                </p>
              </div>
            </section>
          </main>
          {socialNotice && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 py-6 backdrop-blur-xl">
              <div className="w-full max-w-sm rounded-[30px] border border-mint/20 bg-[#0b0f1a] p-5 text-center shadow-2xl shadow-black/60">
                <div className="mx-auto grid h-16 w-16 place-items-center rounded-3xl bg-white/[0.07] ring-1 ring-white/10">
                  {socialNotice.provider === "apple" ? <AppleIcon /> : <GoogleIcon />}
                </div>
                <p className="mt-5 text-xs font-black uppercase tracking-[0.18em] text-mint">{t.socialTitle}</p>
                <h2 className="mt-2 text-2xl font-black leading-tight text-white">
                  {socialNotice.provider === "apple" ? "Apple" : "Google"}
                </h2>
                <p className="mt-3 text-sm font-bold leading-6 text-slate-300">{socialNotice.message}</p>
                <button
                  type="button"
                  className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                  onClick={() => setSocialNotice(null)}
                >
                  {t.socialButton}
                </button>
              </div>
            </div>
          )}
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
