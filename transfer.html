<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Transferencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.18)",
              nav: "0 20px 70px rgba(0, 0, 0, 0.42)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 20% -8%, rgba(66, 242, 179, 0.20), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(255, 107, 107, 0.13), transparent 32%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: cubic-bezier(.22,.61,.36,1);
      }
      body.page-leaving #root {
        opacity: 0.96;
        transform: translateY(4px);
        transition: opacity 120ms ease, transform 120ms ease;
      }
    </style>
    <link rel="stylesheet" href="app-shell.css" />
    <script defer src="app-shell.js"></script>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>
    <nav id="donos-static-nav" class="donos-static-nav" aria-label="Navegación principal">
      <div class="donos-static-nav__grid">
        <a class="donos-static-nav__item" href="home.html" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z"/></svg><span>Inicio</span></a>
        <a class="donos-static-nav__item" href="historial.html" aria-label="Historial"><span class="donos-static-nav__badge" data-nav-badge="historial"></span><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2"/></svg><span>Historial</span></a>
        <a class="donos-static-nav__item" href="plans.html" aria-label="Quedar"><svg viewBox="0 0 24 24"><path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7"/></svg><span>Quedar</span></a>
        <a class="donos-static-nav__item" href="transfer.html" aria-label="Transferencias"><svg viewBox="0 0 24 24"><path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4"/></svg><span>Transf.</span></a>
        <a class="donos-static-nav__item" href="profile.html" aria-label="Perfil"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><span>Perfil</span></a>
      </div>
    </nav>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      const navItems = [
        { label: "Inicio", icon: "home", href: "home.html" },
        { label: "Historial", icon: "history", href: "historial.html" },
        { label: "Quedar", icon: "users", href: "plans.html" },
        { label: "Transf.", icon: "transfer", active: true, href: "transfer.html" },
        { label: "Perfil", icon: "user", href: "profile.html" },
      ];


      function NavIcon({ name }) {
        const paths = {
          home: <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" />,
          search: <path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />,
          history: <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2" />,
          plus: <path d="M12 5v14M5 12h14" />,
          users: <path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7" />,
          transfer: <path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4" />,
          user: <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />,
          card: <path d="M4 7h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm-2 5h20" />,
          send: <path d="M22 2 11 13m11-11-7 20-4-9-9-4 20-7Z" />,
          request: <path d="M12 5v14M5 12h14M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />,
        };
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.3">
            {paths[name]}
          </svg>
        );
      }

      function NotificationBadge({ count }) {
        if (!count) return null;
        return (
          <span className="absolute -right-1 -top-1 grid min-h-5 min-w-5 place-items-center rounded-full bg-coral px-1.5 text-[10px] font-black leading-none text-white ring-2 ring-[#101522]">
            +{count > 9 ? "9" : count}
          </span>
        );
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString("es-ES");
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "";
      }

      function cleanDonosId(value) {
        return String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
      }

      function accountTypeLabel(value) {
        return value === "business" ? "Comercio / Empresa" : "Usuario";
      }

      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;
      }

      function ActionButton({ icon, title, detail, primary, onClick }) {
        return (
          <button
            type="button"
            onClick={onClick}
            className={`group flex min-h-[92px] items-center gap-4 rounded-[28px] border p-4 text-left transition hover:translate-y-[-2px] ${
              primary
                ? "border-mint/30 bg-mint text-ink shadow-glow"
                : "border-white/10 bg-white/[0.055] text-white hover:bg-white/[0.08]"
            }`}
          >
            <span className={`grid h-12 w-12 shrink-0 place-items-center rounded-2xl ${primary ? "bg-ink/10" : "bg-mint/10 text-mint ring-1 ring-mint/20"}`}>
              <NavIcon name={icon} />
            </span>
            <span className="min-w-0">
              <span className="block text-base font-black">{title}</span>
              <span className={`mt-1 block text-xs font-bold leading-5 ${primary ? "text-ink/60" : "text-slate-400"}`}>{detail}</span>
            </span>
          </button>
        );
      }

      function App() {
        const [points, setPoints] = React.useState(Number(localStorage.getItem("donosPoints") || 0));
        const [displayName, setDisplayName] = React.useState(localStorage.getItem("donosDisplayName") || "Tu cuenta");
        const [transactionId, setTransactionId] = React.useState(localStorage.getItem("donosTransactionId") || "");
        const [userId, setUserId] = React.useState("");
        const [showRecharge, setShowRecharge] = React.useState(false);
        const [expandedPack, setExpandedPack] = React.useState(null);
        const [isRedirecting, setIsRedirecting] = React.useState(false);
        const [status, setStatus] = React.useState("");
        const [activeAction, setActiveAction] = React.useState("");
        const [targetId, setTargetId] = React.useState("");
        const [targetProfile, setTargetProfile] = React.useState(null);
        const [targetStatus, setTargetStatus] = React.useState("");
        const [movementPoints, setMovementPoints] = React.useState("");
        const [movementNote, setMovementNote] = React.useState("");
        const [isLookingUp, setIsLookingUp] = React.useState(false);
        const [isSubmittingMovement, setIsSubmittingMovement] = React.useState(false);
        const [confirmMovement, setConfirmMovement] = React.useState(null);
        const [successMovement, setSuccessMovement] = React.useState(null);
        const [navBadges, setNavBadges] = React.useState({});
        const [pointPacks, setPointPacks] = React.useState([
          { points: 50, baseAmount: 500, feeAmount: 120, amount: 620, is_disabled: false },
          { points: 100, baseAmount: 1000, feeAmount: 120, amount: 1120, is_disabled: false },
          { points: 250, baseAmount: 2500, feeAmount: 120, amount: 2620, is_disabled: false },
          { points: 500, baseAmount: 5000, feeAmount: 120, amount: 5120, is_disabled: false },
        ]);
        const euros = points / 10;
        const displayedDonosId = formatDonosId(transactionId);
        const formatMoney = (value) => `${value.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}€`;
        const centsToEuros = (value) => Number(value || 0) / 100;

        async function loadNotificationBadges() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) return;
          const response = await fetch("/api/me/notifications", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok) setNavBadges(data.counts?.sections || {});
        }

        const loadProfile = React.useCallback(async () => {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          const currentUserId = sessionData.session?.user?.id;

          if (!currentUserId) {
            redirectToLogin();
            return 0;
          }
          setUserId(currentUserId);

          let data = null;

          if (accessToken) {
            const response = await fetch("/api/me/profile", {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            const serverData = await response.json().catch(() => ({}));
            if (response.ok) data = serverData.profile;
          }

          if (!data) {
            const fallback = await supabaseClient
              .from("profiles")
              .select("display_name, points, transaction_id")
              .eq("id", currentUserId)
              .maybeSingle();
            data = fallback.data;
          }

          if (data?.display_name) setDisplayName(data.display_name);
          if (data?.transaction_id) {
            setTransactionId(data.transaction_id);
            localStorage.setItem("donosTransactionId", data.transaction_id);
          }
          if (data && typeof data.points !== "undefined") {
            setPoints(Number(data.points || 0));
            localStorage.setItem("donosPoints", String(Number(data.points || 0)));
          }
          if (accessToken) loadNotificationBadges();
          return Number(data?.points || 0);
        }, []);

        function openAction(action) {
          setActiveAction((current) => current === action ? "" : action);
          setTargetStatus("");
          setTargetProfile(null);
          setConfirmMovement(null);
          setSuccessMovement(null);
        }

        React.useEffect(() => {
          loadProfile();
          fetch("/api/point-packs")
            .then((response) => response.json())
            .then((data) => {
              if (Array.isArray(data.packs)) setPointPacks(data.packs);
            })
            .catch(() => {});
        }, [loadProfile]);

        React.useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const stripeStatus = params.get("stripe");
          const sessionId = params.get("session_id");
          if (stripeStatus === "success") {
            setStatus("Pago recibido. Sincronizando tus puntos...");
          }
          if (stripeStatus === "cancelled") {
            setStatus("Recarga cancelada. No se ha cobrado nada.");
          }

          if (stripeStatus !== "success" || !sessionId) return undefined;

          let tries = 0;
          let isActive = true;

          async function syncRecharge() {
            tries += 1;
            try {
              const response = await fetch(`/api/stripe/recharge-status?session_id=${encodeURIComponent(sessionId)}`);
              const data = await response.json();
              if (!response.ok) throw new Error(data.error || "No se ha podido sincronizar.");

              if (typeof data.points === "number") {
                setPoints((current) => Math.max(Number(current || 0), Number(data.points || 0)));
                localStorage.setItem("donosPoints", String(Math.max(Number(localStorage.getItem("donosPoints") || 0), Number(data.points || 0))));
              }
              if (data.credited) {
                setStatus("Puntos añadidos correctamente.");
                return true;
              }

              await loadProfile();
            } catch (error) {
              await loadProfile();
            }

            if (tries >= 20 && isActive) {
              setStatus("Pago recibido. Si el saldo tarda, vuelve a abrir esta página en unos segundos.");
              return true;
            }

            return false;
          }

          syncRecharge();
          const intervalId = window.setInterval(async () => {
            const finished = await syncRecharge();
            if (finished) window.clearInterval(intervalId);
          }, 2500);

          return () => {
            isActive = false;
            window.clearInterval(intervalId);
          };
        }, [loadProfile]);

        React.useEffect(() => {
          if (!userId) return undefined;

          const channel = supabaseClient
            .channel(`donos-profile-points-${userId}`)
            .on(
              "postgres_changes",
              { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${userId}` },
              (payload) => {
                if (typeof payload.new?.points === "number") {
                  setPoints(payload.new.points);
                  localStorage.setItem("donosPoints", String(payload.new.points));
                }
              }
            )
            .subscribe();

          return () => {
            supabaseClient.removeChannel(channel);
          };
        }, [userId]);

        React.useEffect(() => {
          const handleRefresh = () => {
            if (!document.hidden) loadProfile();
          };

          document.addEventListener("visibilitychange", handleRefresh);
          window.addEventListener("focus", handleRefresh);

          return () => {
            document.removeEventListener("visibilitychange", handleRefresh);
            window.removeEventListener("focus", handleRefresh);
          };
        }, [loadProfile]);

        async function startRecharge(pack) {
          if (!userId) {
            redirectToLogin();
            return;
          }

          if (pack.is_disabled) {
            setStatus("Esta recarga está temporalmente suspendida.");
            return;
          }

          setIsRedirecting(true);
          setStatus("");

          try {
            const response = await fetch("/api/stripe/create-checkout-session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ userId, pack: pack.points }),
            });
            const data = await response.json();

            if (!response.ok || !data.url) {
              throw new Error(data.error || "No se ha podido abrir Stripe.");
            }

            window.location.href = data.url;
          } catch (error) {
            setStatus(error.message === "point_pack_disabled" ? "Esta recarga está temporalmente suspendida." : (error.message || "No se ha podido iniciar la recarga."));
            setIsRedirecting(false);
          }
        }

        async function lookupTarget() {
          const cleanId = cleanDonosId(targetId);
          setTargetStatus("");
          setTargetProfile(null);

          if (cleanId.length !== 12) {
            setTargetStatus("Introduce un ID Donos válido de 12 caracteres.");
            return;
          }

          setIsLookingUp(true);
          try {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            const token = sessionData.session?.access_token;
            if (!token) {
              redirectToLogin();
              return;
            }

            const response = await fetch(`/api/points/lookup?donos_id=${encodeURIComponent(cleanId)}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "lookup_failed");
            if (data.is_self) {
              setTargetStatus("No puedes usar tu propio ID Donos para esta operación.");
              return;
            }
            setTargetProfile(data.profile);
            setTargetStatus("Cuenta encontrada. Revisa los datos antes de continuar.");
          } catch (error) {
            setTargetStatus(
              error.message?.includes("profile_not_found")
                ? "No encontramos ninguna cuenta con este ID Donos."
                : "No se ha podido verificar este ID Donos."
            );
          } finally {
            setIsLookingUp(false);
          }
        }

        function prepareMovement() {
          const pointsToMove = Math.floor(Number(movementPoints || 0));
          setStatus("");

          if (!activeAction) return;
          if (!targetProfile) {
            setTargetStatus("Primero verifica el ID Donos.");
            return;
          }
          if (!Number.isFinite(pointsToMove) || pointsToMove <= 0) {
            setStatus("Introduce una cantidad de puntos válida.");
            return;
          }
          if (activeAction === "send" && points < pointsToMove) {
            setStatus("No tienes puntos suficientes para enviar esta cantidad.");
            return;
          }

          setConfirmMovement({
            type: activeAction,
            points: pointsToMove,
            note: movementNote.trim(),
            target: targetProfile,
          });
        }

        async function submitMovement() {
          if (!confirmMovement) return;
          setIsSubmittingMovement(true);
          setStatus("");

          try {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            const token = sessionData.session?.access_token;
            if (!token) {
              redirectToLogin();
              return;
            }

            const isRequest = confirmMovement.type === "request";
            const response = await fetch(isRequest ? "/api/points/request" : "/api/points/send", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                receiverDonosId: isRequest ? undefined : cleanDonosId(targetId),
                payerDonosId: isRequest ? cleanDonosId(targetId) : undefined,
                points: confirmMovement.points,
                note: confirmMovement.note,
              }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "movement_failed");

            if (!isRequest && typeof data.sender_points === "number") {
              setPoints(data.sender_points);
              localStorage.setItem("donosPoints", String(data.sender_points));
            }
            setSuccessMovement({
              ...confirmMovement,
              title: isRequest ? "Solicitud enviada" : "Puntos enviados",
              text: isRequest
                ? `${confirmMovement.target.display_name} recibirá tu solicitud y podrá pagarla desde su historial.`
                : `Transferencia completada. Tu nuevo saldo es ${formatNumber(data.sender_points)} ptos.`,
            });
            setConfirmMovement(null);
            setTargetId("");
            setTargetProfile(null);
            setTargetStatus("");
            setMovementPoints("");
            setMovementNote("");
            await loadProfile();
          } catch (error) {
            const message = error.message || "";
            setStatus(
              message.includes("point_transfers_table_missing")
                ? "Falta activar el SQL de transferencias en Supabase."
                : message.includes("insufficient_points")
                  ? "No tienes puntos suficientes."
                  : message.includes("self")
                    ? "No puedes hacer esta operación contigo mismo."
                    : "No se ha podido completar la operación."
            );
          } finally {
            setIsSubmittingMovement(false);
          }
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-3xl px-3 pb-28 pt-4 sm:px-6">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html" className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black leading-tight">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Transferencias</p>
                </div>
              </a>
              <span className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200">Transf.</span>
            </header>

            <section className="mt-7 overflow-hidden rounded-[38px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/30">
              <div className="relative p-6 sm:p-8">
                <div className="relative">
                  <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Saldo disponible</p>
                  <h1 className="mt-3 text-2xl font-black text-white">{displayName}</h1>
                  <div className="mt-7 flex flex-wrap items-end justify-between gap-5">
                    <div className="min-w-0">
                      <p className="text-[52px] font-black leading-none tracking-normal text-white sm:text-[78px]">{formatNumber(points)}</p>
                      <p className="mt-1 text-base font-bold text-slate-300">puntos</p>
                    </div>
                    <div className="rounded-3xl border border-mint/20 bg-mint/10 px-4 py-3 text-right">
                      <p className="text-xs font-semibold text-mint">ID Donos</p>
                      <p className="mt-1 break-all font-mono text-sm font-black text-white sm:text-base">{displayedDonosId || "Inicia sesión"}</p>
                    </div>
                  </div>
                  <p className="mt-5 inline-flex rounded-full border border-white/10 bg-black/20 px-4 py-2 text-xs font-bold text-slate-400">
                    Equivale aprox. a {euros.toLocaleString("es-ES", { maximumFractionDigits: 2 })}€ · 1€ = 10 ptos.
                  </p>
                </div>
              </div>
            </section>

            {status && (
              <div className="mt-5 rounded-3xl border border-coral/25 bg-coral/10 p-4 text-sm font-bold text-coral">
                {status}
              </div>
            )}

            <section className="mt-5 grid gap-3">
              <ActionButton
                icon="card"
                title="Recargar puntos"
                detail="Añade puntos a tu saldo Donos con Stripe."
                primary
                onClick={() => setShowRecharge((current) => !current)}
              />
              {showRecharge && (
                <div className="rounded-[30px] border border-white/10 bg-white/[0.055] p-4 shadow-2xl shadow-black/20">
                  <div className="mb-4 flex items-center justify-between gap-3">
                    <div>
                      <p className="text-sm font-black text-white">Elige una recarga</p>
                      <p className="mt-1 text-xs font-bold text-slate-400">Pago seguro con Stripe Checkout.</p>
                    </div>
                    <span className="rounded-full bg-mint/10 px-3 py-1 text-xs font-black text-mint ring-1 ring-mint/20">1€ = 10 ptos.</span>
                  </div>
                  <div className="grid gap-3 sm:grid-cols-2">
                    {pointPacks.map((pack) => (
                      <article
                        key={pack.points}
                        className={`rounded-3xl border p-4 transition ${
                          pack.is_disabled
                            ? "border-white/10 bg-white/[0.035] opacity-70"
                            : "border-white/10 bg-[#0D111D] hover:border-mint/40 hover:bg-mint/10"
                        }`}
                      >
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <p className="text-2xl font-black text-white">{pack.points} ptos.</p>
                            <p className="mt-1 text-sm font-bold text-slate-400">{formatMoney(centsToEuros(pack.baseAmount))} de puntos</p>
                          </div>
                          <span className={`rounded-full px-3 py-1 text-xs font-black ring-1 ${pack.is_disabled ? "bg-coral/10 text-coral ring-coral/20" : "bg-mint/10 text-mint ring-mint/20"}`}>
                            {pack.is_disabled ? "Suspendido" : formatMoney(centsToEuros(pack.amount))}
                          </span>
                        </div>

                        <div className="mt-4 rounded-2xl border border-white/10 bg-black/20 p-3">
                          <div className="flex items-center justify-between text-xs font-bold text-slate-400">
                            <span>Gastos Donos</span>
                            <span>+{formatMoney(centsToEuros(pack.feeAmount))}</span>
                          </div>
                          {expandedPack === pack.points && (
                            <div className="mt-3 space-y-2 border-t border-white/10 pt-3 text-xs font-bold text-slate-300">
                              <div className="flex justify-between gap-3"><span>Gasto de transacción</span><span>0,45€</span></div>
                              <div className="flex justify-between gap-3"><span>Gasto de tratamiento</span><span>0,25€</span></div>
                              <div className="flex justify-between gap-3"><span>Sauvegarde sécurisée</span><span>0,50€</span></div>
                            </div>
                          )}
                        </div>

                        <div className="mt-3 grid grid-cols-[auto_1fr] gap-2">
                          <button
                            type="button"
                            className="rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-xs font-black text-slate-200 transition hover:bg-white/[0.1]"
                            onClick={() => setExpandedPack((current) => current === pack.points ? null : pack.points)}
                          >
                            Detalle
                          </button>
                          <button
                            type="button"
                            className={`h-11 rounded-2xl text-sm font-black transition disabled:opacity-60 ${
                              pack.is_disabled ? "bg-white/[0.08] text-slate-500" : "bg-mint text-ink shadow-glow hover:bg-[#66ffd0]"
                            }`}
                            disabled={isRedirecting || pack.is_disabled}
                            onClick={() => startRecharge(pack)}
                          >
                            {pack.is_disabled ? "No disponible" : "Recargar"}
                          </button>
                        </div>
                      </article>
                    ))}
                  </div>
                  {isRedirecting && <p className="mt-3 text-sm font-bold text-mint">Abriendo Stripe...</p>}
                </div>
              )}
	              <div className="grid gap-3 sm:grid-cols-2">
	                <ActionButton icon="send" title="Enviar puntos" detail="Transfiere puntos a otro ID Donos." onClick={() => openAction("send")} />
	                <ActionButton icon="request" title="Pedir puntos" detail="Solicita puntos a una persona o comercio." onClick={() => openAction("request")} />
	              </div>
                {activeAction && (
                  <section className="rounded-[34px] border border-white/10 bg-white/[0.055] p-4 shadow-2xl shadow-black/20 sm:p-6">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">
                          {activeAction === "send" ? "Enviar" : "Pedir"}
                        </p>
                        <h2 className="mt-2 text-2xl font-black text-white">
                          {activeAction === "send" ? "Enviar puntos" : "Pedir puntos"}
                        </h2>
                        <p className="mt-1 text-sm font-semibold leading-6 text-slate-400">
                          {activeAction === "send"
                            ? "Busca a la persona por su ID Donos y confirma antes de transferir."
                            : "Crea una solicitud para que otra cuenta te envíe puntos."}
                        </p>
                      </div>
                      <button
                        type="button"
                        className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-white/10 text-xl font-black text-white ring-1 ring-white/10"
                        onClick={() => setActiveAction("")}
                      >
                        ×
                      </button>
                    </div>

                    <div className="mt-5 grid gap-4">
                      <label>
                        <span className="text-sm font-bold text-slate-300">ID Donos</span>
                        <div className="mt-2 grid gap-2 min-[430px]:grid-cols-[1fr_auto]">
                          <input
                            className="h-14 rounded-2xl border border-white/10 bg-[#0D111D] px-4 font-mono text-base font-black uppercase text-white outline-none placeholder:text-slate-600 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                            value={formatDonosId(targetId)}
                            onChange={(event) => {
                              setTargetId(cleanDonosId(event.target.value));
                              setTargetProfile(null);
                              setTargetStatus("");
                            }}
                            placeholder="3B8K-1940-A27Z"
                          />
                          <button
                            type="button"
                            className="h-14 rounded-2xl bg-mint px-5 text-sm font-black text-ink shadow-glow disabled:opacity-60"
                            disabled={isLookingUp}
                            onClick={lookupTarget}
                          >
                            {isLookingUp ? "Buscando..." : "Verificar"}
                          </button>
                        </div>
                      </label>

                      {(targetStatus || targetProfile) && (
                        <div className={`rounded-3xl border p-4 ${
                          targetProfile ? "border-mint/25 bg-mint/10" : "border-coral/25 bg-coral/10"
                        }`}>
                          {targetProfile ? (
                            <div className="flex flex-wrap items-center justify-between gap-3">
                              <div>
                                <p className="text-lg font-black text-white">{targetProfile.display_name || "Cuenta Donos"}</p>
                                <p className="mt-1 text-sm font-bold text-slate-300">{targetProfile.email || "Email no visible"}</p>
                                <p className="mt-1 text-xs font-black text-mint">{accountTypeLabel(targetProfile.account_type)}</p>
                              </div>
                              <span className="rounded-full bg-black/25 px-3 py-1 text-xs font-black text-white ring-1 ring-white/10">
                                {formatDonosId(targetProfile.transaction_id)}
                              </span>
                            </div>
                          ) : (
                            <p className="text-sm font-bold text-coral">{targetStatus}</p>
                          )}
                        </div>
                      )}

                      <div className="grid gap-4 min-[430px]:grid-cols-2">
                        <label>
                          <span className="text-sm font-bold text-slate-300">Cantidad</span>
                          <input
                            className="mt-2 h-14 w-full rounded-2xl border border-white/10 bg-[#0D111D] px-4 text-base font-black text-white outline-none placeholder:text-slate-600 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                            inputMode="numeric"
                            value={movementPoints}
                            onChange={(event) => setMovementPoints(event.target.value.replace(/[^0-9]/g, ""))}
                            placeholder="Ej. 50"
                          />
                        </label>
                        <label>
                          <span className="text-sm font-bold text-slate-300">Mensaje opcional</span>
                          <input
                            className="mt-2 h-14 w-full rounded-2xl border border-white/10 bg-[#0D111D] px-4 text-base font-bold text-white outline-none placeholder:text-slate-600 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                            value={movementNote}
                            maxLength="180"
                            onChange={(event) => setMovementNote(event.target.value)}
                            placeholder="Ej. Cine, cena, ayuda..."
                          />
                        </label>
                      </div>

                      <button
                        type="button"
                        className="h-14 rounded-2xl bg-mint text-base font-black text-ink shadow-glow transition hover:bg-[#66ffd0] disabled:bg-white/10 disabled:text-slate-500 disabled:shadow-none"
                        disabled={!targetProfile || !movementPoints || isSubmittingMovement}
                        onClick={prepareMovement}
                      >
                        {activeAction === "send" ? "Continuar envío" : "Continuar solicitud"}
                      </button>
                    </div>
                  </section>
                )}
	            </section>

            {confirmMovement && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-2xl">
                <section className="w-full max-w-md rounded-[36px] border border-white/10 bg-[#0D111D] p-6 shadow-2xl shadow-black/50">
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Confirmación</p>
                  <h2 className="mt-2 text-3xl font-black text-white">
                    {confirmMovement.type === "send" ? "Enviar puntos" : "Pedir puntos"}
                  </h2>
                  <div className="mt-5 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-sm font-bold text-slate-400">Cuenta</p>
                    <p className="mt-1 text-xl font-black text-white">{confirmMovement.target.display_name}</p>
                    <p className="mt-1 text-sm font-bold text-slate-400">{confirmMovement.target.email || accountTypeLabel(confirmMovement.target.account_type)}</p>
                  </div>
                  <div className="mt-3 rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <p className="text-sm font-bold text-mint">Total</p>
                    <p className="mt-1 text-4xl font-black text-white">{formatNumber(confirmMovement.points)} ptos.</p>
                  </div>
                  {confirmMovement.note && (
                    <p className="mt-3 rounded-2xl bg-white/[0.055] p-3 text-sm font-semibold text-slate-300">{confirmMovement.note}</p>
                  )}
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button
                      className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-white"
                      onClick={() => setConfirmMovement(null)}
                    >
                      Cancelar
                    </button>
                    <button
                      className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60"
                      disabled={isSubmittingMovement}
                      onClick={submitMovement}
                    >
                      {isSubmittingMovement ? "Procesando..." : confirmMovement.type === "send" ? "Enviar ahora" : "Enviar solicitud"}
                    </button>
                  </div>
                </section>
              </div>
            )}

            {successMovement && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-2xl">
                <section className="w-full max-w-md rounded-[36px] border border-mint/25 bg-[#0D111D] p-6 text-center shadow-2xl shadow-mint/10">
                  <div className="mx-auto grid h-20 w-20 place-items-center rounded-full bg-mint text-ink shadow-glow">
                    <svg viewBox="0 0 24 24" className="h-10 w-10" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3">
                      <path d="m5 12 4 4L19 6" />
                    </svg>
                  </div>
                  <p className="mt-5 text-xs font-black uppercase tracking-[0.18em] text-mint">Operación completada</p>
                  <h2 className="mt-2 text-3xl font-black text-white">{successMovement.title}</h2>
                  <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">{successMovement.text}</p>
                  <a
                    className="mt-5 grid h-12 place-items-center rounded-2xl bg-mint text-sm font-black text-ink shadow-glow"
                    href="historial.html"
                  >
                    Ver historial
                  </a>
                  <button
                    className="mt-3 text-sm font-black text-slate-400"
                    onClick={() => setSuccessMovement(null)}
                  >
                    Cerrar
                  </button>
                </section>
              </div>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => {
                  const badgeCount = navBadges[item.href === "historial.html" ? "historial" : ""];
                  return (
                  <a
                    key={item.label}
                    href={item.href}
                    className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${
                      item.active
                        ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]"
                        : "text-slate-400 hover:bg-white/[0.06] hover:text-white"
                    }`}
                  >
                    <NotificationBadge count={badgeCount} />
                    <NavIcon name={item.icon} />
                    <span className="mt-1">{item.label}</span>
                  </a>
                  );
                })}
              </div>
            </nav>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
