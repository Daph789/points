<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Admin cuentas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html {
        background: #060914;
        overflow-x: hidden;
      }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 8%, rgba(255, 107, 107, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }

      #root,
      main {
        max-width: 100%;
        overflow-x: hidden;
      }

      * {
        min-width: 0;
      }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      function money(cents) {
        return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(Number(cents || 0) / 100);
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "Sin ID";
      }

      function matchesAccount(account, query) {
        const cleanQuery = query.trim().toLowerCase();
        if (!cleanQuery) return true;
        return [
          account.display_name,
          account.email,
          account.phone,
          account.neighborhood,
          account.address,
          account.account_type,
          account.transaction_id,
          account.business_categories?.join(" "),
          account.tax_id,
        ].filter(Boolean).join(" ").toLowerCase().includes(cleanQuery);
      }

      function readImageAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function InfoTip({ title, text, example }) {
        return (
          <span className="group relative inline-flex">
            <button className="grid h-5 w-5 place-items-center rounded-full border border-white/15 bg-white/10 text-[11px] font-black text-slate-200" type="button">i</button>
            <span className="pointer-events-none absolute left-1/2 top-7 z-30 hidden w-72 -translate-x-1/2 rounded-2xl border border-white/10 bg-[#111827] p-3 text-left text-white shadow-2xl shadow-black/40 group-hover:block">
              <span className="block text-xs font-black">{title}</span>
              <span className="mt-1 block text-xs font-bold leading-5 text-slate-300">{text}</span>
              {example && <span className="mt-2 block rounded-xl bg-black/25 p-2 text-[11px] font-bold leading-4 text-mint">Ejemplo: {example}</span>}
            </span>
          </span>
        );
      }

      function StatCard({ label, value, tone = "white", info }) {
        const color = tone === "mint" ? "text-mint border-mint/25 bg-mint/10" : tone === "coral" ? "text-coral border-coral/25 bg-coral/10" : "text-white border-white/10 bg-white/[0.055]";
        return (
          <div className={`rounded-3xl border p-4 sm:p-5 ${color}`}>
            <p className="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.14em] opacity-70">
              <span>{label}</span>
              {info && <InfoTip {...info} />}
            </p>
            <p className="mt-2 break-words text-2xl font-black sm:text-3xl">{value}</p>
          </div>
        );
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-5 w-5 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3.5 w-3.5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function App() {
        const [password, setPassword] = React.useState(sessionStorage.getItem("donosAdminPassword") || "");
        const [isUnlocked, setIsUnlocked] = React.useState(Boolean(sessionStorage.getItem("donosAdminPassword")));
        const [accounts, setAccounts] = React.useState([]);
        const [summary, setSummary] = React.useState({});
        const [search, setSearch] = React.useState("");
        const [status, setStatus] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        const [savingId, setSavingId] = React.useState("");
        const [showDonossMoneyDetails, setShowDonossMoneyDetails] = React.useState(false);
        const [pendingVerifyAccount, setPendingVerifyAccount] = React.useState(null);
        const [emailAccount, setEmailAccount] = React.useState(null);
        const [emailValue, setEmailValue] = React.useState("");
        const [isSavingEmail, setIsSavingEmail] = React.useState(false);
        const [profileAccount, setProfileAccount] = React.useState(null);
        const [profileDraft, setProfileDraft] = React.useState({ display_name: "", premium_identity_dni: "", premium_identity_photo_data_url: "" });
        const [isSavingProfile, setIsSavingProfile] = React.useState(false);
        const filteredAccounts = accounts.filter((account) => matchesAccount(account, search));
        const premiumAccounts = accounts.filter((account) => account.premium?.status === "active");

        React.useEffect(() => {
          if (isUnlocked) loadAccounts();
        }, [isUnlocked]);

        async function loadAccounts(event) {
          event?.preventDefault();
          setStatus("");
          setIsLoading(true);

          try {
            const response = await fetch("/api/admin/accounts", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "No autorizado");

            sessionStorage.setItem("donosAdminPassword", password);
            setIsUnlocked(true);
            setAccounts(data.accounts || []);
            setSummary(data.summary || {});
          } catch (error) {
            setStatus(error.message || "No se han podido cargar las cuentas.");
          } finally {
            setIsLoading(false);
          }
        }

        function openEmailEditor(account) {
          setStatus("");
          setEmailAccount(account);
          setEmailValue(account.email || "");
        }

        function openProfileEditor(account) {
          setStatus("");
          setProfileAccount(account);
          setProfileDraft({
            display_name: account.display_name || "",
            premium_identity_dni: account.premium_identity_dni || "",
            premium_identity_photo_data_url: account.premium_identity_photo_data_url || "",
          });
        }

        async function handleAdminIdentityPhoto(event) {
          const file = Array.from(event.target.files || [])[0];
          if (!file) return;
          if (file.size > 8 * 1024 * 1024) {
            setStatus("La foto es demasiado grande.");
            event.target.value = "";
            return;
          }
          try {
            const dataUrl = await readImageAsDataUrl(file);
            setProfileDraft((current) => ({ ...current, premium_identity_photo_data_url: dataUrl }));
          } catch (_error) {
            setStatus("No se ha podido leer la foto.");
          } finally {
            event.target.value = "";
          }
        }

        async function saveProfileInfo(event) {
          event?.preventDefault();
          if (!profileAccount) return;
          setStatus("");
          setIsSavingProfile(true);

          try {
            const response = await fetch("/api/admin/accounts/profile", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                password,
                profileId: profileAccount.id,
                display_name: profileDraft.display_name,
                premium_identity_dni: profileDraft.premium_identity_dni,
                premium_identity_photo_data_url: profileDraft.premium_identity_photo_data_url,
              }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "No se ha podido guardar la ficha.");

            setAccounts((current) =>
              current.map((item) => (item.id === profileAccount.id ? { ...item, ...data.profile } : item))
            );
            setProfileAccount(null);
            setStatus("Ficha actualizada correctamente.");
          } catch (error) {
            setStatus(error.message || "No se ha podido guardar la ficha.");
          } finally {
            setIsSavingProfile(false);
          }
        }

        async function saveEmail(event) {
          event?.preventDefault();
          if (!emailAccount) return;
          setStatus("");
          setIsSavingEmail(true);

          try {
            const response = await fetch("/api/admin/accounts/email", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, profileId: emailAccount.id, email: emailValue }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "No se ha podido modificar el correo.");

            setAccounts((current) =>
              current.map((item) => (item.id === emailAccount.id ? { ...item, email: data.profile.email } : item))
            );
            setEmailAccount(null);
            setEmailValue("");
            setStatus("Correo actualizado correctamente.");
          } catch (error) {
            setStatus(error.message || "No se ha podido modificar el correo.");
          } finally {
            setIsSavingEmail(false);
          }
        }

        function askToggleVerified(account) {
          if (!account.is_verified) {
            setPendingVerifyAccount(account);
            return;
          }
          toggleVerified(account);
        }

        async function toggleVerified(account) {
          setSavingId(account.id);
          setStatus("");
          setPendingVerifyAccount(null);

          try {
            const response = await fetch("/api/admin/accounts/verify", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, profileId: account.id, isVerified: !account.is_verified }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "No se ha podido actualizar.");

            setAccounts((current) =>
              current.map((item) =>
                item.id === account.id ? { ...item, ...data.profile, is_verified: data.profile.is_verified } : item
              )
            );
          } catch (error) {
            setStatus(error.message || "No se ha podido actualizar la cuenta.");
          } finally {
            setSavingId("");
          }
        }

        async function launchAppUpdate(updateSize = "small") {
          const label = updateSize === "large" ? "gran actualización" : "actualización rápida";
          const ok = window.confirm(`¿Enviar aviso de ${label} a la app? Los usuarios conectados verán el overlay cuando la app compruebe novedades.`);
          if (!ok) return;
          setStatus("");
          setIsLoading(true);

          try {
            const response = await fetch("/api/admin/app-update", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, updateSize }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "No se ha podido lanzar la actualización.");
            setStatus("Aviso de actualización lanzado correctamente.");
          } catch (error) {
            setStatus(error.message || "No se ha podido lanzar la actualización.");
          } finally {
            setIsLoading(false);
          }
        }

        if (!isUnlocked) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow" onSubmit={loadAccounts}>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donoss</p>
                <h1 className="mt-2 text-3xl font-black text-white">Cuentas</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Zona privada para ver saldos y certificar empresas.</p>
                <input
                  className="mt-5 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                  type="password"
                  value={password}
                  onChange={(event) => setPassword(event.target.value)}
                  placeholder="Contraseña"
                />
                {status && <p className="mt-3 text-sm font-bold text-coral">{status}</p>}
                <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-base font-black text-ink shadow-glow" disabled={isLoading}>
                  {isLoading ? "Entrando..." : "Entrar"}
                </button>
              </form>
            </main>
          );
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-7xl px-3 py-4 sm:px-6 lg:px-8">
            <header className="flex flex-wrap items-center justify-between gap-3">
              <div className="min-w-0">
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donoss</p>
                <h1 className="mt-1 break-words text-3xl font-black text-white sm:text-4xl">Cuentas y reserva</h1>
              </div>
              <div className="flex w-full gap-2 sm:w-auto">
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-payments.html">Pagos</a>
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-business-settlements.html">Empresas</a>
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-activity.html">Actividad</a>
                <a className="flex-1 rounded-full border border-coral/25 bg-coral/10 px-4 py-2 text-center text-sm font-black text-coral sm:flex-none" href="donos-admin-launch-reset.html">Lanzamiento</a>
                <button className="flex-1 rounded-full border border-mint/25 bg-mint/10 px-4 py-2 text-sm font-black text-mint sm:flex-none" onClick={() => launchAppUpdate("small")} disabled={isLoading}>
                  Avisar update
                </button>
                <button className="hidden rounded-full border border-sun/25 bg-sun/10 px-4 py-2 text-sm font-black text-sun sm:inline-flex" onClick={() => launchAppUpdate("large")} disabled={isLoading}>
                  Gran update
                </button>
                <button className="flex-1 rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow sm:flex-none" onClick={loadAccounts}>
                  Actualizar
                </button>
              </div>
            </header>

            <section className="mt-6 grid gap-3 min-[430px]:grid-cols-2 lg:grid-cols-4">
              <StatCard label="Valor € puntos existentes" value={money(summary.total_point_value_cents)} tone="mint" info={{ title: "Valor € puntos existentes", text: "En gros, c'est la valeur en € des points total existant todavía en las cuentas. No es beneficio: es una obligación potencial.", example: "1400 ptos. existentes = 140 € que Donoss debe poder cubrir." }} />
              <StatCard label="Caja estimada" value={money(summary.estimated_cash_cents)} info={{ title: "Caja estimada", text: "Neto recibido por Stripe menos lo que ya pagaste a empresas y menos comisiones bancarias.", example: "238,60 € - 100 € - 0,65 € = 137,95 €." }} />
              <StatCard label="Cobertura de reserva" value={money(summary.reserve_margin_cents)} tone={Number(summary.reserve_margin_cents || 0) >= 0 ? "mint" : "coral"} info={{ title: "Cobertura de reserva", text: "No es tu beneficio. Es un test de seguridad: caja estimada menos valor de puntos existentes. Si sale negativo, tu caja no cubre todos los puntos vivos.", example: "Caja 137,95 € - puntos vivos 140 € = -2,05 € de cobertura." }} />
              <StatCard label="Cuentas" value={`${summary.total_accounts || 0}`} info={{ title: "Cuentas", text: "Total de perfiles registrados en Donoss, usuarios y empresas juntos.", example: "1 usuario + 1 empresa = 2 cuentas." }} />
            </section>

            <section className="mt-3 grid gap-3 min-[430px]:grid-cols-2 lg:grid-cols-5">
              <StatCard label="Neto Stripe recibido" value={money(summary.total_net_cents)} info={{ title: "Neto Stripe recibido", text: "Dinero que Stripe deja después de sus cortes por los pagos de recarga.", example: "Cliente paga 51,20 €, Stripe corta 1,91 €, neto 49,29 €." }} />
              <StatCard label="Pagado a empresas" value={money(summary.business_payouts_paid_cents)} info={{ title: "Pagado a empresas", text: "Total que registraste como enviado fuera de Donoss a empresas.", example: "Retiras 250 ptos. = 25 € pagados." }} />
              <StatCard label="Usuarios" value={summary.total_users || 0} info={{ title: "Usuarios", text: "Cuentas normales de clientes.", example: "Daphnel se registra como usuario = +1." }} />
              <StatCard label="Empresas" value={summary.total_businesses || 0} info={{ title: "Empresas", text: "Cuentas registradas como comercio/empresa.", example: "Karcharelle se registra como empresa = +1." }} />
              <StatCard label="Certificadas" value={summary.total_verified || 0} tone="mint" info={{ title: "Certificadas", text: "Cuentas que marcaste como verificadas o cuentas con Premium al día para mostrar badge de confianza.", example: "Premium activo = check azul automático." }} />
            </section>

            <section className="mt-3 grid gap-3 min-[430px]:grid-cols-2 lg:grid-cols-5">
              <button className="text-left" type="button" onClick={() => setShowDonossMoneyDetails(true)}>
                <StatCard label="Dinero empresa Donoss" value={money(summary.donos_company_money_cents)} tone="mint" info={{ title: "Dinero empresa Donoss", text: "Dinero propio estimado de Donoss: incluye margen de recargas y puntos pagados por Premium.", example: "0,59 € de una recarga + 2 € de Premium usuario = 2,59 €." }} />
                <p className="mt-1 pl-1 text-xs font-black text-mint">Ver más</p>
              </button>
              <StatCard label="Beneficio Donoss disponible" value={money(summary.donos_available_profit_cents)} tone={Number(summary.donos_available_profit_cents || 0) >= 0 ? "mint" : "coral"} info={{ title: "Beneficio Donoss disponible", text: "Este es el contador que debes mirar para saber si el dinero propio de Donoss puede cubrir sus deudas operativas.", example: "Dinero Donoss 15 € - deudas 2,45 € = 12,55 € disponibles." }} />
              <StatCard label="Falta para estar en verde" value={money(summary.missing_to_green_cents)} tone={Number(summary.missing_to_green_cents || 0) > 0 ? "coral" : "mint"} info={{ title: "Falta para estar en verde", text: "Cantidad que Donoss necesita ganar o añadir para que el beneficio disponible vuelva a 0 € o positivo.", example: "Dinero Donoss 1,44 €, deudas 3,49 €: faltan 2,05 €." }} />
              <a className="block rounded-3xl border border-coral/25 bg-coral/10 p-4 text-coral sm:p-5" href="donos-admin-stripe-debts.html">
                <p className="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.14em] opacity-80">
                  <span>Deuda por comisiones</span>
                  <InfoTip title="Deuda por comisiones" text="Casos donde el extra cobrado por Donoss no cubre el corte estimado de Stripe." example="Extra Donoss 1,20 €, Stripe corta 1,91 €: deuda 0,71 €." />
                </p>
                <p className="mt-2 break-words text-2xl font-black sm:text-3xl">{money(summary.donos_debt_cents)}</p>
                <p className="mt-2 text-xs font-black text-coral/80">Ver detalle</p>
              </a>
              <a className="block rounded-3xl border border-coral/25 bg-coral/10 p-4 text-coral sm:p-5" href="donos-admin-bank-fee-debts.html">
                <p className="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.14em] opacity-80">
                  <span>Deudas bancarias</span>
                  <InfoTip title="Deudas bancarias" text="Comisiones que tu banco te cobró cuando enviaste dinero real a una empresa." example="Pagas 15 € a la empresa y el banco cobra 0,45 €: deuda bancaria 0,45 €." />
                </p>
                <p className="mt-2 break-words text-2xl font-black sm:text-3xl">{money(summary.bank_fee_debt_cents)}</p>
                <p className="mt-2 text-xs font-black text-coral/80">Transferencias a empresas</p>
              </a>
            </section>

            <section className="mt-5 rounded-[30px] border border-mint/20 bg-mint/10 p-5 sm:p-6">
              <div className="flex flex-wrap items-end justify-between gap-3">
                <div>
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Premium</p>
                  <h2 className="mt-2 text-2xl font-black text-white">Abonados Premium</h2>
                  <p className="mt-1 text-sm font-bold text-slate-300">Cuentas con pago al día y certificación automática.</p>
                </div>
                <div className="rounded-3xl border border-white/10 bg-black/25 px-4 py-3 text-right">
                  <p className="text-2xl font-black text-mint">{summary.premium_subscribers || 0}</p>
                  <p className="text-xs font-black text-slate-400">{money(summary.premium_revenue_cents)} total</p>
                </div>
              </div>
              <div className="mt-4 grid gap-3 lg:grid-cols-2">
                {premiumAccounts.slice(0, 6).map((account) => (
                  <div key={`premium-${account.id}`} className="rounded-3xl border border-white/10 bg-black/20 p-4">
                    <p className="flex items-center gap-2 font-black text-white">
                      <span className="truncate">{account.display_name || "Cuenta Donoss"}</span>
                      <VerifiedBadge />
                      <span className="rounded-full bg-mint px-2 py-1 text-[10px] font-black text-ink">Premium al día</span>
                    </p>
                    <p className="mt-1 text-sm font-bold text-slate-400">{account.email || "Sin email"}</p>
                    <p className="mt-2 text-xs font-black text-mint">{account.premium?.points || 0} ptos. / 31 días · próximo cobro {account.premium?.next_charge_at ? new Date(account.premium.next_charge_at).toLocaleDateString("es-ES") : "sin fecha"}</p>
                  </div>
                ))}
                {premiumAccounts.length === 0 && (
                  <p className="rounded-3xl border border-white/10 bg-black/20 p-4 text-sm font-bold text-slate-300">Todavía no hay abonados Premium.</p>
                )}
              </div>
            </section>

            <section className="mt-5 rounded-[30px] border border-white/10 bg-white/[0.055] p-5 sm:p-6">
              <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Guía rápida para admin</p>
              <h2 className="mt-2 text-2xl font-black text-white">Cómo leer la reserva y el beneficio</h2>
              <div className="mt-4 grid gap-3 lg:grid-cols-3">
                <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                  <p className="text-sm font-black text-mint">1. Valor € puntos existentes</p>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-300">
                    En gros, c'est la valeur en € des points total existant en las cuentas. Si usuarios y empresas tienen 1400 ptos., Donoss tiene una obligación potencial de 140 €. No es ganancia.
                  </p>
                </div>
                <div className="rounded-3xl border border-white/10 bg-black/20 p-4">
                  <p className="text-sm font-black text-white">2. Cobertura de reserva</p>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-300">
                    Sirve para saber si la caja estimada cubre todos los puntos vivos. Fórmula: caja estimada - valor de puntos existentes. Si es negativo, faltaría dinero para cubrir todos los puntos.
                  </p>
                </div>
                <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                  <p className="text-sm font-black text-mint">3. Beneficio Donoss disponible</p>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-300">
                    Este sí responde a tu pregunta: si Donoss gana dinero, puede cubrir deudas. Fórmula: dinero empresa Donoss - deuda Stripe - deudas bancarias.
                  </p>
                </div>
              </div>
              <div className="mt-4 rounded-3xl border border-coral/25 bg-coral/10 p-4 text-coral">
                <p className="text-sm font-black">Ejemplo claro</p>
                <p className="mt-2 text-sm font-bold leading-6">
                  Si Dinero empresa Donoss = 15 €, Deuda por comisiones = 2 €, y Deudas bancarias = 0,45 €, entonces Beneficio Donoss disponible = 12,55 €. Eso significa que Donoss puede cubrir esas deudas y todavía le quedan 12,55 € de beneficio disponible.
                </p>
                <p className="mt-3 text-sm font-bold leading-6">
                  Con tu captura: Dinero empresa Donoss = 1,44 €, Deuda por comisiones = 2,84 €, Deudas bancarias = 0,65 €. Total deudas = 3,49 €. Entonces 1,44 € - 3,49 € = -2,05 €. Para volver en verde, Donoss necesita 2,05 €.
                </p>
              </div>
            </section>

            <section className="mt-6 rounded-[26px] border border-white/10 bg-white/[0.055] p-3 sm:rounded-[30px] sm:p-4">
              <label className="flex items-center gap-3">
                <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                <input
                  className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base"
                  value={search}
                  onChange={(event) => setSearch(event.target.value)}
                  placeholder="Buscar por nombre, email, ID Donoss, barrio, categoría..."
                />
              </label>
            </section>

            {status && <p className="mt-4 rounded-2xl border border-coral/25 bg-coral/10 p-4 text-sm font-bold text-coral">{status}</p>}

            <section className="mt-5 overflow-hidden rounded-[24px] border border-white/10 bg-white/[0.055] sm:rounded-[30px]">
              <div className="hidden grid-cols-[1.2fr_.7fr_.8fr_.7fr_.9fr_auto] gap-3 border-b border-white/10 px-5 py-4 text-xs font-black uppercase tracking-[0.12em] text-slate-500 lg:grid">
                <span>Cuenta</span>
                <span>Tipo</span>
                <span>ID Donoss</span>
                <span>Puntos</span>
                <span>Valor reservado</span>
                <span></span>
              </div>

              <div className="divide-y divide-white/10">
                {filteredAccounts.map((account) => (
                  <article key={account.id} className="grid gap-3 px-4 py-4 lg:grid-cols-[1.2fr_.7fr_.8fr_.7fr_.9fr_auto] lg:items-center lg:px-5">
                    <div className="min-w-0">
                      <p className="flex items-center gap-2 font-black text-white">
                        <span className="truncate">{account.display_name || "Cuenta Donoss"}</span>
                        {account.is_verified && <VerifiedBadge />}
                        {account.premium?.status === "active" && <span className="rounded-full bg-mint px-2 py-1 text-[10px] font-black text-ink">Premium</span>}
                        {account.admin_verified && <span className="rounded-full bg-sky-500/15 px-2 py-1 text-[10px] font-black text-sky-300 ring-1 ring-sky-400/20">Forzado admin</span>}
                        {account.premium?.status === "failed" && <span className="rounded-full bg-coral/15 px-2 py-1 text-[10px] font-black text-coral ring-1 ring-coral/20">Premium fallido</span>}
                      </p>
                      <p className="mt-1 truncate text-sm font-bold text-slate-400">{account.email || "Sin email"}</p>
                      <p className="mt-1 truncate text-xs font-bold text-slate-500">{account.phone || account.neighborhood || "Sin contacto"}</p>
                      <p className={`mt-2 inline-flex rounded-full px-2 py-1 text-[10px] font-black ${
                        account.premium_identity_dni && account.premium_identity_photo_data_url
                          ? "bg-mint/10 text-mint ring-1 ring-mint/20"
                          : "bg-white/[0.06] text-slate-500 ring-1 ring-white/10"
                      }`}>
                        {account.premium_identity_dni && account.premium_identity_photo_data_url ? "Identidad Premium completa" : "Sin identidad Premium"}
                      </p>
                    </div>
                    <p className="text-sm font-black text-slate-200">{account.account_type === "business" ? "Empresa" : "Usuario"}</p>
                    <p className="break-all font-mono text-xs font-black text-slate-300">{formatDonosId(account.transaction_id)}</p>
                    <p className="text-sm font-black text-mint">{account.points || 0} ptos.</p>
                    <p className="text-sm font-black text-white">{money(account.point_value_cents)}</p>
                    <div className="flex flex-wrap gap-2 lg:justify-end">
                      <button
                        className="h-10 rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-sm font-black text-slate-100 transition hover:bg-white/[0.1]"
                        type="button"
                        onClick={() => openEmailEditor(account)}
                      >
                        Correo
                      </button>
                      <button
                        className="h-10 rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-sm font-black text-slate-100 transition hover:bg-white/[0.1]"
                        type="button"
                        onClick={() => openProfileEditor(account)}
                      >
                        Ficha
                      </button>
                      <button
                        className={`h-10 rounded-2xl px-4 text-sm font-black transition disabled:opacity-50 ${
                          account.is_verified
                            ? "border border-coral/25 bg-coral/10 text-coral hover:bg-coral/15"
                            : "bg-mint text-ink shadow-glow hover:bg-[#66ffd0]"
                        }`}
                        disabled={savingId === account.id}
                        onClick={() => askToggleVerified(account)}
                      >
                        {savingId === account.id ? "..." : account.is_verified ? "Quitar" : "Certificar"}
                      </button>
                    </div>
                  </article>
                ))}
              </div>

              {filteredAccounts.length === 0 && (
                <div className="p-6 text-sm font-bold text-slate-300">No hay resultados.</div>
              )}
            </section>

            {pendingVerifyAccount && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-xl">
                <div className="w-full max-w-lg rounded-[34px] border border-white/10 bg-[#101522] p-5 shadow-2xl shadow-black/50">
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Confirmar certificación</p>
                  <h2 className="mt-2 text-3xl font-black text-white">Forzar certificación</h2>
                  <p className="mt-3 text-sm font-bold leading-6 text-slate-300">
                    Vas a certificar manualmente a <span className="text-white">{pendingVerifyAccount.display_name || "esta cuenta"}</span>. Esto mostrará el icono verificado aunque no tenga Premium pagado.
                  </p>
                  <div className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">Estado Premium</p>
                    <p className={`mt-2 text-xl font-black ${
                      pendingVerifyAccount.premium?.status === "active" ? "text-mint" : pendingVerifyAccount.premium?.status === "failed" ? "text-coral" : "text-white"
                    }`}>
                      {pendingVerifyAccount.premium?.status === "active"
                        ? "Pago al día"
                        : pendingVerifyAccount.premium?.status === "failed"
                          ? "Pago fallido"
                          : "No ha pagado Premium"}
                    </p>
                    <p className="mt-1 text-sm font-bold text-slate-400">
                      {pendingVerifyAccount.premium?.status === "active"
                        ? `Próximo cobro: ${pendingVerifyAccount.premium?.next_charge_at ? new Date(pendingVerifyAccount.premium.next_charge_at).toLocaleDateString("es-ES") : "sin fecha"}`
                        : "Esta certificación quedará marcada como decisión del administrador."}
                    </p>
                  </div>
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-white" onClick={() => setPendingVerifyAccount(null)}>
                      Cancelar
                    </button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" onClick={() => toggleVerified(pendingVerifyAccount)}>
                      Certificar igual
                    </button>
                  </div>
                </div>
              </div>
            )}

            {emailAccount && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-xl">
                <form className="w-full max-w-lg rounded-[34px] border border-white/10 bg-[#101522] p-5 shadow-2xl shadow-black/50" onSubmit={saveEmail}>
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Cuenta Donoss</p>
                  <h2 className="mt-2 text-3xl font-black text-white">Modificar correo</h2>
                  <p className="mt-3 text-sm font-bold leading-6 text-slate-300">
                    Cambiarás el correo de <span className="text-white">{emailAccount.display_name || "esta cuenta"}</span>. También será el nuevo email para iniciar sesión.
                  </p>
                  <div className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">Correo actual</p>
                    <p className="mt-1 break-all text-sm font-black text-slate-200">{emailAccount.email || "Sin correo"}</p>
                  </div>
                  <label className="mt-4 block">
                    <span className="text-sm font-black text-white">Nuevo correo</span>
                    <input
                      className="mt-2 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                      type="email"
                      value={emailValue}
                      onChange={(event) => setEmailValue(event.target.value)}
                      placeholder="nuevo@email.com"
                      required
                    />
                  </label>
                  <p className="mt-3 rounded-2xl border border-sun/20 bg-sun/10 p-3 text-xs font-bold leading-5 text-sun">
                    Revisa bien el correo antes de guardar. Si ya existe otra cuenta con ese email, Supabase lo rechazará.
                  </p>
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-white" type="button" onClick={() => setEmailAccount(null)}>
                      Cancelar
                    </button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={isSavingEmail}>
                      {isSavingEmail ? "Guardando..." : "Guardar correo"}
                    </button>
                  </div>
                </form>
              </div>
            )}

            {profileAccount && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-xl">
                <form className="max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-[34px] border border-white/10 bg-[#101522] p-5 shadow-2xl shadow-black/50" onSubmit={saveProfileInfo}>
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Ficha de cuenta</p>
                  <h2 className="mt-2 text-3xl font-black text-white">Modificar datos</h2>
                  <p className="mt-3 text-sm font-bold leading-6 text-slate-300">
                    Puedes corregir el nombre visible y la identidad Premium de <span className="text-white">{profileAccount.email || "esta cuenta"}</span>.
                  </p>

                  <label className="mt-4 block">
                    <span className="text-sm font-black text-white">Nombre visible</span>
                    <input
                      className="mt-2 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                      value={profileDraft.display_name}
                      onChange={(event) => setProfileDraft((current) => ({ ...current, display_name: event.target.value }))}
                      placeholder="Nombre o apodo"
                      required
                    />
                  </label>

                  <label className="mt-4 block">
                    <span className="text-sm font-black text-white">NIE o DNI Premium</span>
                    <input
                      className="mt-2 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 py-3 uppercase text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                      value={profileDraft.premium_identity_dni}
                      onChange={(event) => setProfileDraft((current) => ({ ...current, premium_identity_dni: event.target.value }))}
                      placeholder="Ej. 12345678Z"
                    />
                  </label>

                  <div className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-sm font-black text-white">Foto de identidad Premium</p>
                    <div className="mt-3 grid gap-3 sm:grid-cols-[112px_1fr] sm:items-center">
                      <div className="h-32 overflow-hidden rounded-[26px] border border-white/10 bg-black/25">
                        {profileDraft.premium_identity_photo_data_url ? (
                          <img className="h-full w-full object-cover" src={profileDraft.premium_identity_photo_data_url} alt="" />
                        ) : (
                          <div className="grid h-full place-items-center px-3 text-center text-xs font-black text-slate-500">Sin foto</div>
                        )}
                      </div>
                      <div className="grid gap-2">
                        <label className="grid h-11 cursor-pointer place-items-center rounded-2xl border border-dashed border-mint/35 bg-mint/10 px-4 text-sm font-black text-mint">
                          Cambiar foto
                          <input className="hidden" type="file" accept="image/*" onChange={handleAdminIdentityPhoto} />
                        </label>
                        <button
                          className="h-11 rounded-2xl border border-coral/25 bg-coral/10 px-4 text-sm font-black text-coral"
                          type="button"
                          onClick={() => setProfileDraft((current) => ({ ...current, premium_identity_photo_data_url: "" }))}
                        >
                          Quitar foto
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-white" type="button" onClick={() => setProfileAccount(null)}>
                      Cancelar
                    </button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={isSavingProfile}>
                      {isSavingProfile ? "Guardando..." : "Guardar ficha"}
                    </button>
                  </div>
                </form>
              </div>
            )}

            {showDonossMoneyDetails && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-xl">
                <div className="w-full max-w-lg rounded-[34px] border border-white/10 bg-[#101522] p-5 shadow-2xl shadow-black/50">
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Detalle Donoss</p>
                  <h2 className="mt-2 text-3xl font-black text-white">Dinero empresa Donoss</h2>
                  <div className="mt-5 space-y-3">
                    <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">Desde recargas</p>
                      <p className="mt-2 text-2xl font-black text-white">{money(summary.donos_transaction_money_cents)}</p>
                      <p className="mt-1 text-sm font-bold text-slate-400">Lo que queda del extra Donoss después de estimar el corte Stripe.</p>
                    </div>
                    <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Desde Premium</p>
                      <p className="mt-2 text-2xl font-black text-mint">{money(summary.premium_revenue_cents)}</p>
                      <p className="mt-1 text-sm font-bold text-slate-300">Usuarios: 20 ptos. / Empresas: 30 ptos. Cada pago Premium se cuenta como dinero propio de Donoss.</p>
                    </div>
                  </div>
                  <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" onClick={() => setShowDonossMoneyDetails(false)}>
                    Entendido
                  </button>
                </div>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
