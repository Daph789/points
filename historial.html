<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Historial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.16)",
              nav: "0 18px 70px rgba(0, 0, 0, 0.46)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 7%, rgba(167, 139, 250, 0.13), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 50%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      const navItems = [
        { label: "Inicio", icon: "home", href: "home.html" },
        { label: "Historial", icon: "history", active: true, href: "historial.html" },
        { label: "Vender", icon: "plus", href: "admin-offer.html" },
        { label: "Transf.", icon: "transfer", href: "transfer.html" },
        { label: "Perfil", icon: "user", href: "profile.html" },
      ];

      function NavIcon({ name }) {
        const paths = {
          home: <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" />,
          history: <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2" />,
          plus: <path d="M12 5v14M5 12h14" />,
          transfer: <path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4" />,
          user: <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />,
        };
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.3">
            {paths[name]}
          </svg>
        );
      }

      function formatDate(value) {
        return new Date(value).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
      }

      function formatTime(value) {
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function formatDelivery(value) {
        return value === "home" ? "Entrega a domicilio" : "Recogida en tienda";
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-4 w-4 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3 w-3" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function PurchaseCard({ purchase }) {
        const offer = purchase.offer || {};
        const businessName = offer.business_display_name || purchase.receiver?.display_name || offer.author || "Donos";
        const image = offer.cover_photo_data_url || offer.presentation_image_data_urls?.[0];
        return (
          <a
            href={`order-detail.html?id=${purchase.id}`}
            className="group relative grid gap-3 rounded-[28px] border border-white/10 bg-white/[0.055] p-3 shadow-2xl shadow-black/20 transition hover:border-mint/30 hover:bg-white/[0.08] min-[430px]:grid-cols-[92px_1fr_auto]"
          >
            <div className="relative h-24 overflow-hidden rounded-3xl bg-gradient-to-br from-mint via-[#17213C] to-violet min-[430px]:h-full">
              {image ? <img className="h-full w-full object-cover" src={image} alt="" /> : <span className="absolute bottom-3 right-3 text-4xl">🧾</span>}
              <span className="absolute left-2 top-2 rounded-full bg-black/40 px-2 py-1 text-[10px] font-black text-white backdrop-blur">
                {formatDelivery(purchase.delivery_method)}
              </span>
            </div>

            <div className="min-w-0">
              <div className="flex items-center gap-2">
                <p className="truncate text-xs font-black uppercase tracking-[0.12em] text-mint">{businessName}</p>
                {offer.business_is_verified && <VerifiedBadge />}
              </div>
              <h2 className="mt-1 break-words text-lg font-black leading-tight text-white">{offer.title || "Pedido Donos"}</h2>
              <p className="mt-2 text-sm font-bold text-slate-400">{formatDate(purchase.created_at)} · {formatTime(purchase.created_at)}</p>
              <p className="mt-2 text-xs font-bold text-slate-500">Pedido #{String(purchase.id).slice(0, 8).toUpperCase()}</p>
            </div>

            <div className="flex items-center justify-between gap-3 min-[430px]:block min-[430px]:text-right">
              <p className="rounded-full bg-mint px-3 py-1 text-sm font-black text-ink">{purchase.total_points || 0} pts</p>
              <p className="text-xs font-black text-slate-500 min-[430px]:mt-3">Ver detalle</p>
            </div>
          </a>
        );
      }

      function App() {
        const [mode, setMode] = React.useState("purchases");
        const [purchases, setPurchases] = React.useState([]);
        const [status, setStatus] = React.useState("Cargando historial...");
        const [search, setSearch] = React.useState("");

        React.useEffect(() => {
          loadPurchases();
        }, []);

        async function loadPurchases() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent("historial.html")}`;
            return;
          }

          try {
            const response = await fetch("/api/me/purchases", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "history_failed");

            setPurchases(data.purchases || []);
            setStatus("");
          } catch (error) {
            setStatus(
              error.message === "purchases_table_missing"
                ? "Falta activar el SQL de pagos para ver el historial."
                : "No se ha podido cargar tu historial."
            );
          }
        }

        const filteredPurchases = purchases.filter((purchase) => {
          const query = search.trim().toLowerCase();
          if (!query) return true;
          const offer = purchase.offer || {};
          const receiver = purchase.receiver || {};
          return [
            offer.title,
            offer.business_display_name,
            offer.author,
            receiver.display_name,
            purchase.total_points,
            purchase.delivery_method,
            purchase.id,
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });

        return (
          <main className="mx-auto min-h-screen w-full max-w-4xl px-3 pb-28 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html" className="flex min-w-0 items-center gap-3">
                <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow">D</div>
                <div className="min-w-0">
                  <p className="text-lg font-black leading-tight">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Historial</p>
                </div>
              </a>
              <button className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl border border-white/10 bg-white/[0.06] text-xl" onClick={loadPurchases}>
                ↻
              </button>
            </header>

            <section className="mt-6 rounded-[34px] border border-white/10 bg-white/[0.055] p-4 shadow-glow sm:p-7">
              <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Tu actividad</p>
              <h1 className="mt-2 break-words text-3xl font-black leading-tight text-white sm:text-4xl">Historial Donos</h1>
              <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Consulta tus compras y movimientos importantes, ordenados del más reciente al más antiguo.</p>

              <div className="mt-5 grid gap-2 min-[390px]:grid-cols-2">
                <button
                  className={`rounded-3xl border p-4 text-left transition ${mode === "purchases" ? "border-mint/50 bg-mint/15 shadow-glow" : "border-white/10 bg-black/20"}`}
                  onClick={() => setMode("purchases")}
                >
                  <p className="text-2xl">🛍️</p>
                  <p className="mt-2 text-base font-black text-white">Historial de compras</p>
                  <p className="mt-1 text-xs font-bold text-slate-400">{purchases.length} pedidos</p>
                </button>
                <button
                  className={`rounded-3xl border p-4 text-left transition ${mode === "debts" ? "border-sun/50 bg-sun/15" : "border-white/10 bg-black/20"}`}
                  onClick={() => setMode("debts")}
                >
                  <p className="text-2xl">📌</p>
                  <p className="mt-2 text-base font-black text-white">Historial de deudas</p>
                  <p className="mt-1 text-xs font-bold text-slate-400">Próximamente</p>
                </button>
              </div>
            </section>

            {mode === "purchases" ? (
              <section className="mt-5">
                <div className="rounded-[26px] border border-white/10 bg-white/[0.055] p-3 shadow-2xl shadow-black/20">
                  <label className="flex items-center gap-3">
                    <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                    <input
                      className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base"
                      value={search}
                      onChange={(event) => setSearch(event.target.value)}
                      placeholder="Buscar marca, título, puntos..."
                    />
                  </label>
                </div>

                <div className="mt-5 space-y-3">
                  {status ? (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">{status}</div>
                  ) : filteredPurchases.length > 0 ? (
                    filteredPurchases.map((purchase) => <PurchaseCard key={purchase.id} purchase={purchase} />)
                  ) : (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                      {purchases.length === 0 ? "Todavía no tienes compras." : "No hay resultados para esta búsqueda."}
                    </div>
                  )}
                </div>
              </section>
            ) : (
              <section className="mt-5 rounded-[28px] border border-white/10 bg-white/[0.055] p-6">
                <p className="text-lg font-black text-white">Historial de deudas</p>
                <p className="mt-2 text-sm font-semibold leading-6 text-slate-400">Esta parte queda preparada para cuando activemos deudas, pagos pendientes o compromisos entre usuarios.</p>
              </section>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => (
                  <a
                    key={item.label}
                    href={item.href}
                    className={`flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${
                      item.active ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]" : "text-slate-400 hover:bg-white/[0.06] hover:text-white"
                    }`}
                  >
                    <NavIcon name={item.icon} />
                    <span className="mt-0.5">{item.label}</span>
                  </a>
                ))}
              </div>
            </nav>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
