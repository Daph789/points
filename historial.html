<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Historial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.16)",
              nav: "0 18px 70px rgba(0, 0, 0, 0.46)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 7%, rgba(167, 139, 250, 0.13), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 50%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: cubic-bezier(.22,.61,.36,1);
      }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      const navItems = [
        { label: "Inicio", icon: "home", href: "home.html" },
        { label: "Historial", icon: "history", active: true, href: "historial.html" },
        { label: "Quedar", icon: "users", href: "plans.html" },
        { label: "Transf.", icon: "transfer", href: "transfer.html" },
        { label: "Perfil", icon: "user", href: "profile.html" },
      ];

      function NavIcon({ name }) {
        const paths = {
          home: <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" />,
          history: <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2" />,
          plus: <path d="M12 5v14M5 12h14" />,
          users: <path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7" />,
          transfer: <path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4" />,
          user: <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />,
        };
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.3">
            {paths[name]}
          </svg>
        );
      }

      function formatDate(value) {
        return new Date(value).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
      }

      function formatTime(value) {
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function money(cents) {
        return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(Number(cents || 0) / 100);
      }

      function formatDelivery(value) {
        return value === "home" ? "Entrega a domicilio" : "Recogida en tienda";
      }

      function getRemainingStock(offer) {
        if (offer.stock_quantity === null || offer.stock_quantity === undefined || offer.stock_quantity === "") return null;
        return Math.max(Number(offer.stock_quantity || 0) - Number(offer.sold_count || 0), 0);
      }

      function isOutOfStock(offer) {
        const remaining = getRemainingStock(offer);
        return remaining !== null && remaining <= 0;
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "";
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-4 w-4 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3 w-3" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function NotificationBadge({ count }) {
        if (!count) return null;
        return (
          <span className="absolute -right-1 -top-1 grid min-h-5 min-w-5 place-items-center rounded-full bg-coral px-1.5 text-[10px] font-black leading-none text-white ring-2 ring-[#101522]">
            +{count > 9 ? "9" : count}
          </span>
        );
      }

      function UnreadPill() {
        return <span className="mb-2 inline-flex rounded-full bg-coral px-2.5 py-1 text-[10px] font-black uppercase tracking-[0.12em] text-white">Nuevo</span>;
      }

      function PurchaseCard({ purchase, isUnread, onRead }) {
        const offer = purchase.offer || {};
        const businessName = offer.business_display_name || purchase.receiver?.display_name || offer.author || "Donos";
        const isBusinessVerified = Boolean(offer.business_is_verified || purchase.receiver?.is_verified);
        const image = offer.cover_photo_data_url || offer.presentation_image_data_urls?.[0];
        return (
          <a
            href={`order-detail.html?id=${purchase.id}`}
            onClick={onRead}
            className={`group relative grid gap-3 rounded-[28px] border p-3 shadow-2xl shadow-black/20 transition hover:border-mint/30 hover:bg-white/[0.08] min-[430px]:grid-cols-[92px_1fr_auto] ${isUnread ? "border-coral/35 bg-coral/[0.08] ring-1 ring-coral/20" : "border-white/10 bg-white/[0.055]"}`}
          >
            <div className="relative h-24 overflow-hidden rounded-3xl bg-gradient-to-br from-mint via-[#17213C] to-violet min-[430px]:h-full">
              {image ? <img className="h-full w-full object-cover" src={image} alt="" /> : <span className="absolute bottom-3 right-3 text-4xl">🧾</span>}
              <span className="absolute left-2 top-2 rounded-full bg-black/40 px-2 py-1 text-[10px] font-black text-white backdrop-blur">
                {formatDelivery(purchase.delivery_method)}
              </span>
            </div>

            <div className="min-w-0">
              <div className="flex items-center gap-2">
                <p className="truncate text-xs font-black uppercase tracking-[0.12em] text-mint">{businessName}</p>
                {isBusinessVerified && <VerifiedBadge />}
              </div>
              <h2 className="mt-1 break-words text-lg font-black leading-tight text-white">{offer.title || "Pedido Donos"}</h2>
              <p className="mt-2 text-sm font-bold text-slate-400">{formatDate(purchase.created_at)} · {formatTime(purchase.created_at)}</p>
              <p className="mt-2 text-xs font-bold text-slate-500">Pedido #{String(purchase.id).slice(0, 8).toUpperCase()}</p>
            </div>

            <div className="flex items-center justify-between gap-3 min-[430px]:block min-[430px]:text-right">
              {isUnread && <UnreadPill />}
              <p className="rounded-full bg-mint px-3 py-1 text-sm font-black text-ink">{purchase.total_points || 0} ptos.</p>
              <p className="text-xs font-black text-slate-500 min-[430px]:mt-3">Ver detalle</p>
            </div>
          </a>
        );
      }

      function IncomingCard({ purchase, isUnread, onRead }) {
        const offer = purchase.offer || {};
        const buyer = purchase.buyer || {};
        const buyerName = buyer.display_name || buyer.email || "Cliente Donos";
        const image = offer.cover_photo_data_url || offer.presentation_image_data_urls?.[0];
        return (
          <a
            href={`incoming-detail.html?id=${purchase.id}`}
            onClick={onRead}
            className={`group grid gap-3 rounded-[28px] border p-3 shadow-2xl shadow-black/20 transition hover:border-mint/30 hover:bg-white/[0.08] min-[430px]:grid-cols-[56px_1fr_auto] ${isUnread ? "border-coral/35 bg-coral/[0.08] ring-1 ring-coral/20" : "border-white/10 bg-white/[0.055]"}`}
          >
            <div className="relative grid h-14 w-14 place-items-center overflow-hidden rounded-2xl bg-mint/10 text-lg font-black text-mint ring-1 ring-mint/20">
              {image ? <img className="absolute inset-0 h-full w-full object-cover opacity-80" src={image} alt="" /> : "↑"}
              <span className="relative grid h-7 w-7 place-items-center rounded-full bg-[#060914]/80 text-sm">+</span>
            </div>
            <div className="min-w-0">
              <p className="truncate text-base font-black text-white">+{purchase.total_points || 0} puntos de {buyerName}</p>
              <p className="mt-1 truncate text-sm font-bold text-slate-400">{offer.title || "Pedido Donos"}</p>
              <p className="mt-1 text-xs font-bold text-slate-500">{formatDate(purchase.created_at)} · {formatTime(purchase.created_at)}</p>
            </div>
            <div className="flex items-center justify-between gap-3 min-[430px]:block min-[430px]:text-right">
              {isUnread && <UnreadPill />}
              <span className="rounded-full bg-mint px-3 py-1 text-sm font-black text-ink">+{purchase.total_points || 0}</span>
              <p className="text-xs font-black text-slate-500 min-[430px]:mt-3">
                {purchase.verified_at ? "Validado" : "Pendiente QR"}
              </p>
            </div>
          </a>
        );
      }

      function scanStatusLabel(status) {
        const labels = {
          valid: "Validado",
          already_verified: "Ya validado",
          expired: "Caducado",
          not_started: "No activo",
        };
        return labels[status] || status || "Comprobado";
      }

      function ScannedTicketCard({ scan, isUnread, onRead }) {
        const purchase = scan.purchase || {};
        const offer = purchase.offer || {};
        const buyer = purchase.buyer || {};
        const buyerName = buyer.display_name || buyer.email || "Cliente Donos";
        const businessName = offer.business_display_name || purchase.receiver?.display_name || offer.author || "";
        const isBusinessVerified = Boolean(offer.business_is_verified || purchase.receiver?.is_verified);
        return (
          <a
            href={`scanned-ticket-detail.html?id=${scan.id}`}
            onClick={onRead}
            className={`group grid gap-3 rounded-[28px] border p-3 shadow-2xl shadow-black/20 transition hover:border-mint/30 hover:bg-white/[0.08] min-[430px]:grid-cols-[56px_1fr_auto] ${isUnread ? "border-coral/35 bg-coral/[0.08] ring-1 ring-coral/20" : "border-white/10 bg-white/[0.055]"}`}
          >
            <div className="grid h-14 w-14 place-items-center rounded-2xl bg-white/10 text-lg font-black text-white ring-1 ring-white/10">
              {scan.method === "qr" ? "▣" : "⌨"}
            </div>
            <div className="min-w-0">
              <p className="truncate text-base font-black text-white">{offer.title || "Billete Donos"}</p>
              <p className="mt-1 truncate text-sm font-bold text-slate-400">{buyerName} · {purchase.total_points || 0} ptos.</p>
              {businessName && (
                <p className="mt-1 inline-flex max-w-full items-center gap-1.5 rounded-full bg-white/[0.06] px-2.5 py-1 text-xs font-black text-slate-200 ring-1 ring-white/10">
                  <span className="truncate">{businessName}</span>
                  {isBusinessVerified && <VerifiedBadge />}
                </p>
              )}
              <p className="mt-1 text-xs font-bold text-slate-500">{formatDate(scan.checked_at)} · {formatTime(scan.checked_at)}</p>
            </div>
            <div className="flex items-center justify-between gap-3 min-[430px]:block min-[430px]:text-right">
              {isUnread && <UnreadPill />}
              <span className={`rounded-full px-3 py-1 text-xs font-black ${scan.status === "valid" ? "bg-mint text-ink" : "bg-white/10 text-slate-200"}`}>
                {scanStatusLabel(scan.status)}
              </span>
              <p className="text-xs font-black text-slate-500 min-[430px]:mt-3">{scan.method === "qr" ? "QR" : "Manual"}</p>
            </div>
          </a>
        );
      }

      function StockOfferCard({ offer, isUnread, onRead }) {
        const remaining = getRemainingStock(offer);
        const outOfStock = isOutOfStock(offer);
        const image = offer.cover_photo_data_url || offer.presentation_image_data_urls?.[0];
        return (
          <a
            href={`admin-offer.html?id=${offer.id}`}
            onClick={onRead}
            className={`group grid gap-3 rounded-[28px] border p-3 shadow-2xl shadow-black/20 transition hover:border-mint/30 hover:bg-white/[0.08] min-[430px]:grid-cols-[64px_1fr_auto] ${isUnread ? "border-coral/35 bg-coral/[0.08] ring-1 ring-coral/20" : "border-white/10 bg-white/[0.055]"}`}
          >
            <div className="relative h-16 w-16 overflow-hidden rounded-2xl bg-gradient-to-br from-coral/40 to-mint/20 ring-1 ring-white/10">
              {image ? <img className="h-full w-full object-cover opacity-80" src={image} alt="" /> : <span className="grid h-full w-full place-items-center text-xl">↻</span>}
            </div>
            <div className="min-w-0">
              <p className="truncate text-base font-black text-white">{offer.title || "Oferta sin título"}</p>
              <p className="mt-1 truncate text-sm font-bold text-slate-400">{offer.categories?.join(", ") || "Sin categoría"}</p>
              <p className="mt-1 text-xs font-bold text-slate-500">Vendidos: {offer.sold_count || 0}</p>
            </div>
            <div className="flex items-center justify-between gap-3 min-[430px]:block min-[430px]:text-right">
              {isUnread && <UnreadPill />}
              <span className={`rounded-full px-3 py-1 text-xs font-black ${outOfStock ? "bg-coral text-white" : "bg-white/10 text-slate-200"}`}>
                {outOfStock ? "Agotado" : `${remaining} disponibles`}
              </span>
              <p className="text-xs font-black text-slate-500 min-[430px]:mt-3">Editar stock</p>
            </div>
          </a>
        );
      }

      function PayoutCard({ payout, isUnread, onRead }) {
        const period = payout.period_start || payout.period_end
          ? `${payout.period_start ? formatDate(payout.period_start) : "Inicio"} - ${payout.period_end ? formatDate(payout.period_end) : "Hoy"}`
          : "Sin periodo";
        return (
          <article
            className={`grid gap-3 rounded-[28px] border p-4 shadow-2xl shadow-black/20 transition active:scale-[0.99] min-[430px]:grid-cols-[56px_1fr_auto] ${isUnread ? "border-coral/35 bg-coral/[0.08] ring-1 ring-coral/20" : "border-white/10 bg-white/[0.055]"}`}
            onClick={onRead}
          >
            <div className="grid h-14 w-14 place-items-center rounded-2xl bg-mint/10 text-xl font-black text-mint ring-1 ring-mint/20">€</div>
            <div className="min-w-0">
              <div className="flex min-w-0 items-center gap-2">
                <p className="truncate text-base font-black text-white">Pago recibido de Donos</p>
                {isUnread && <span className="h-2 w-2 shrink-0 rounded-full bg-coral shadow-[0_0_14px_rgba(255,107,107,0.75)]"></span>}
              </div>
              <p className="mt-1 text-sm font-bold text-slate-400">{period}</p>
              <p className="mt-1 text-xs font-bold text-slate-500">{formatDate(payout.created_at)} · {formatTime(payout.created_at)}</p>
              {payout.note && <p className="mt-2 max-w-full truncate rounded-2xl bg-black/20 px-3 py-2 text-xs font-bold text-slate-300">{payout.note}</p>}
            </div>
            <div className="flex items-center justify-between gap-3 min-[430px]:block min-[430px]:text-right">
              {isUnread && <UnreadPill />}
              <p className="rounded-full bg-mint px-3 py-1 text-sm font-black text-ink">{payout.points || 0} ptos.</p>
              <p className="mt-1 text-xs font-black text-slate-500">{money(payout.amount_cents)}</p>
            </div>
          </article>
        );
      }

      function PointMovementCard({ movement, profileId, onRespond, isResponding, isUnread, onRead }) {
        const isOut = movement.from_profile_id === profileId;
        const other = isOut ? movement.to_profile : movement.from_profile;
        const isRequest = movement.transfer_type === "request";
        const isPendingRequestToMe = isRequest && movement.status === "pending" && isOut;
        const title = isRequest
          ? isOut
            ? `${movement.to_profile?.display_name || "Alguien"} te pide puntos`
            : `Pediste puntos a ${movement.from_profile?.display_name || "alguien"}`
          : isOut
            ? `Enviado a ${other?.display_name || "Cuenta Donos"}`
            : `Recibido de ${other?.display_name || "Cuenta Donos"}`;
        const tone = movement.status === "declined" ? "coral" : movement.status === "pending" ? "sun" : isOut ? "coral" : "mint";
        const pointsSign = isOut && movement.status !== "declined" ? "-" : "+";
        const pointsToneClass = tone === "mint" ? "bg-mint text-ink" : tone === "sun" ? "bg-sun text-ink" : "bg-coral/15 text-coral ring-1 ring-coral/25";
        const contact = other?.email || formatDonosId(other?.transaction_id) || "Cuenta Donos";
        return (
          <article
            className={`rounded-[26px] border p-3 shadow-2xl shadow-black/20 transition active:scale-[0.99] ${isUnread ? "border-coral/35 bg-coral/[0.08] ring-1 ring-coral/20" : "border-white/10 bg-white/[0.055]"}`}
            onClick={onRead}
          >
            <div className="grid grid-cols-[1fr_auto] items-start gap-3">
              <div className="min-w-0">
                <div className="flex min-w-0 items-center gap-2">
                  <p className="truncate text-[15px] font-black leading-tight text-white sm:text-base">{title}</p>
                  {isUnread && <span className="h-2 w-2 shrink-0 rounded-full bg-coral shadow-[0_0_14px_rgba(255,107,107,0.75)]"></span>}
                </div>
                <p className="mt-1 truncate text-xs font-bold text-slate-400 sm:text-sm">{contact}</p>
                <p className="mt-1 text-xs font-bold text-slate-600">{formatDate(movement.created_at)} · {formatTime(movement.created_at)}</p>
                {movement.note && <p className="mt-2 max-w-full truncate rounded-2xl bg-black/20 px-3 py-2 text-xs font-bold text-slate-300">{movement.note}</p>}
              </div>
              <div className="flex min-w-[74px] flex-col items-end gap-1">
                <p className={`inline-flex min-h-11 min-w-[70px] items-center justify-center rounded-2xl px-3 text-center text-base font-black ${pointsToneClass}`}>
                  {movement.status === "declined" ? "No" : movement.status === "pending" ? "Pend." : `${pointsSign}${movement.points || 0}`}
                </p>
                <p className="text-[11px] font-black text-slate-500">ptos.</p>
              </div>
            </div>
            {isPendingRequestToMe && (
              <div className="mt-4 grid grid-cols-2 gap-3">
                <button
                  className="h-11 rounded-2xl border border-coral/25 bg-coral/10 text-sm font-black text-coral disabled:opacity-60"
                  disabled={isResponding}
                  onClick={() => onRespond(movement.id, "decline")}
                >
                  Rechazar
                </button>
                <button
                  className="h-11 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60"
                  disabled={isResponding}
                  onClick={() => onRespond(movement.id, "pay")}
                >
                  Pagar ahora
                </button>
              </div>
            )}
          </article>
        );
      }

      function App() {
        const initialTab = new URLSearchParams(window.location.search).get("tab") || "purchases";
        const [mode, setMode] = React.useState(["purchases", "incoming", "scanned", "stock", "payouts", "points", "debts"].includes(initialTab) ? initialTab : "purchases");
        const [purchases, setPurchases] = React.useState([]);
        const [incomingPurchases, setIncomingPurchases] = React.useState([]);
        const [scannedTickets, setScannedTickets] = React.useState([]);
        const [businessOffers, setBusinessOffers] = React.useState([]);
        const [businessPayouts, setBusinessPayouts] = React.useState([]);
        const [pointMovements, setPointMovements] = React.useState([]);
        const [profileId, setProfileId] = React.useState("");
        const [accountType, setAccountType] = React.useState("user");
        const [status, setStatus] = React.useState("Cargando historial...");
        const [incomingStatus, setIncomingStatus] = React.useState("");
        const [scannedStatus, setScannedStatus] = React.useState("");
        const [payoutStatus, setPayoutStatus] = React.useState("");
        const [movementStatus, setMovementStatus] = React.useState("");
        const [respondingMovementId, setRespondingMovementId] = React.useState("");
        const [search, setSearch] = React.useState("");
        const [incomingFilter, setIncomingFilter] = React.useState("all");
        const [stockFilter, setStockFilter] = React.useState(0);
        const [notificationEvents, setNotificationEvents] = React.useState([]);
        const [notificationCounts, setNotificationCounts] = React.useState({ sections: {}, subsections: {} });
        const [readKeys, setReadKeys] = React.useState(new Set());

        React.useEffect(() => {
          loadPurchases();
        }, []);

        async function loadPurchases() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent("historial.html")}`;
            return;
          }

          try {
            const profileResponse = await fetch("/api/me/profile", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const profileData = await profileResponse.json().catch(() => ({}));
            const type = profileData.profile?.account_type === "business" ? "business" : "user";
            setAccountType(type);
            setProfileId(profileData.profile?.id || "");

            const notificationsResponse = await fetch("/api/me/notifications", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const notificationsData = await notificationsResponse.json().catch(() => ({}));
            if (notificationsResponse.ok) {
              setNotificationEvents(notificationsData.events || []);
              setNotificationCounts(notificationsData.counts || { sections: {}, subsections: {} });
              setReadKeys(new Set((notificationsData.events || []).filter((event) => event.read).map((event) => event.key)));
            }

            return { ...current, sections, subsections, total: unread.length };

                </div>
                {unreadCount("stock") > 0 && (
                  <button className="mt-3 h-10 rounded-2xl bg-white/[0.08] px-4 text-xs font-black text-slate-200 ring-1 ring-white/10" onClick={() => markSubsectionRead("stock")}>
                    Marcar stock como leído
                  </button>
                )}

                <div className="mt-5 space-y-3">
                  {stockWatchOffers.length > 0 ? (
                    stockWatchOffers.map((offer) => {
                      const key = eventKeyFor("stock", offer.id, getRemainingStock(offer));
                      return <StockOfferCard key={offer.id} offer={offer} isUnread={isUnreadKey(key)} onRead={() => markNotificationsRead([key])} />;
                    })
                  ) : (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                      No hay productos en este filtro.
                    </div>
                  )}
                </div>
              </section>
            ) : mode === "payouts" ? (
              <section className="mt-5">
                <div className="rounded-[26px] border border-white/10 bg-white/[0.055] p-3 shadow-2xl shadow-black/20">
                  <label className="flex items-center gap-3">
                    <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                    <input
                      className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base"
                      value={search}
                      onChange={(event) => setSearch(event.target.value)}
                      placeholder="Buscar pago, fecha, nota..."
                    />
                  </label>
                </div>

                <div className="mt-5 rounded-[30px] border border-mint/20 bg-mint/10 p-5 shadow-glow">
                  <p className="text-xs font-bold uppercase tracking-[0.16em] text-mint">Total liquidado por Donos</p>
                  <p className="mt-2 text-4xl font-black text-white">
                    {money(businessPayouts.reduce((sum, item) => sum + Number(item.amount_cents || 0), 0))}
                  </p>
                  <p className="mt-1 text-sm font-bold text-slate-400">
                    {businessPayouts.reduce((sum, item) => sum + Number(item.points || 0), 0).toLocaleString("es-ES")} ptos. retirados de tu saldo interno
                  </p>
                </div>
                {unreadCount("payouts") > 0 && (
                  <button className="mt-3 h-10 rounded-2xl bg-white/[0.08] px-4 text-xs font-black text-slate-200 ring-1 ring-white/10" onClick={() => markSubsectionRead("payouts")}>
                    Marcar liquidaciones como leídas
                  </button>
                )}

                <div className="mt-5 space-y-3">
                  {payoutStatus ? (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">{payoutStatus}</div>
                  ) : filteredPayouts.length > 0 ? (
                    filteredPayouts.map((payout) => {
                      const key = eventKeyFor("payout", payout.id);
                      return <PayoutCard key={payout.id} payout={payout} isUnread={isUnreadKey(key)} onRead={() => markNotificationsRead([key])} />;
                    })
                  ) : (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                      {businessPayouts.length === 0 ? "Todavía no has recibido liquidaciones de Donos." : "No hay resultados para esta búsqueda."}
                    </div>
                  )}
                </div>
              </section>
            ) : mode === "points" ? (
              <section className="mt-5">
                <div className="rounded-[26px] border border-white/10 bg-white/[0.055] p-3 shadow-2xl shadow-black/20">
                  <label className="flex items-center gap-3">
                    <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                    <input
                      className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base"
                      value={search}
                      onChange={(event) => setSearch(event.target.value)}
                      placeholder="Buscar persona, email, estado..."
                    />
                  </label>
                </div>

                {movementStatus && (
                  <div className={`mt-4 rounded-2xl border p-4 text-sm font-bold ${
                    movementStatus.includes("correctamente") || movementStatus.includes("rechazada")
                      ? "border-mint/25 bg-mint/10 text-mint"
                      : "border-coral/25 bg-coral/10 text-coral"
                  }`}>
                    {movementStatus}
                  </div>
                )}
                {unreadCount("points") > 0 && (
                  <button className="mt-3 h-10 rounded-2xl bg-white/[0.08] px-4 text-xs font-black text-slate-200 ring-1 ring-white/10" onClick={() => markSubsectionRead("points")}>
                    Marcar movimientos como leídos
                  </button>
                )}

                <div className="mt-5 space-y-3">
                  {filteredPointMovements.length > 0 ? (
                    filteredPointMovements.map((movement) => {
                      const key = eventKeyFor("points", movement.id);
                      return (
                        <PointMovementCard
                          key={movement.id}
                          movement={movement}
                          profileId={profileId}
                          isResponding={respondingMovementId === movement.id}
                          isUnread={isUnreadKey(key)}
                          onRead={() => markNotificationsRead([key])}
                          onRespond={respondToPointRequest}
                        />
                      );
                    })
                  ) : (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                      {pointMovements.length === 0 ? "Todavía no tienes movimientos de puntos." : "No hay resultados para esta búsqueda."}
                    </div>
                  )}
                </div>
              </section>
            ) : (
	              <section className="mt-5">
                <div className="rounded-[26px] border border-white/10 bg-white/[0.055] p-3 shadow-2xl shadow-black/20">
                  <label className="flex items-center gap-3">
                    <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-sun/10 text-lg text-sun ring-1 ring-sun/20">⌕</span>
                    <input
                      className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base"
                      value={search}
                      onChange={(event) => setSearch(event.target.value)}
                      placeholder="Buscar deuda, persona, puntos..."
                    />
                  </label>
                </div>
                {unreadCount("debts") > 0 && (
                  <button className="mt-3 h-10 rounded-2xl bg-white/[0.08] px-4 text-xs font-black text-slate-200 ring-1 ring-white/10" onClick={() => markSubsectionRead("debts")}>
                    Marcar deudas como leídas
                  </button>
                )}
                <div className="mt-5 space-y-3">
                  {filteredDebts.length > 0 ? (
                    filteredDebts.map((movement) => {
                      const key = eventKeyFor("points", movement.id);
                      return (
                        <PointMovementCard
                          key={movement.id}
                          movement={movement}
                          profileId={profileId}
                          isResponding={respondingMovementId === movement.id}
                          isUnread={isUnreadKey(key)}
                          onRead={() => markNotificationsRead([key])}
                          onRespond={respondToPointRequest}
                        />
                      );
                    })
                  ) : (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                      No tienes solicitudes pendientes.
                    </div>
                  )}
                </div>
              </section>
            )}

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => {
                  const badgeCount = notificationCounts.sections?.[item.href === "historial.html" ? "historial" : ""];
                  return (
                  <a
                    key={item.label}
                    href={item.href}
                    className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${
                      item.active ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]" : "text-slate-400 hover:bg-white/[0.06] hover:text-white"
                    }`}
                  >
                    <NotificationBadge count={badgeCount} />
                    <NavIcon name={item.icon} />
                    <span className="mt-0.5">{item.label}</span>
                  </a>
                  );
                })}
              </div>
            </nav>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
