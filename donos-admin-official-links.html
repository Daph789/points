<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss Admin | Liens officiels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      * { min-width: 0; }
      button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
      :focus-visible { outline: 2px solid #42F2B3; outline-offset: 3px; }
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 10%, rgba(255, 107, 107, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
    </style>
  </head>
<body class="min-h-screen text-white antialiased">
<div id="root"></div>
<script type="text/babel">
const emptyDraft = { title: "", source_url: "", description: "" };
const inputClass = "w-full rounded-2xl border border-white/15 bg-black/25 px-4 py-3 text-base text-white placeholder:text-slate-500 focus:border-mint";
const secondaryClass = "rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm font-bold disabled:opacity-40";

function App() {
  const [password, setPassword] = React.useState(() => { try { return localStorage.getItem("donosAdminPassword") || ""; } catch (_) { return ""; } });
  const [access, setAccess] = React.useState("");
  const [search, setSearch] = React.useState("");
  const [page, setPage] = React.useState(0);
  const [revision, setRevision] = React.useState(0);
  const [links, setLinks] = React.useState([]);
  const [total, setTotal] = React.useState(0);
  const [hasMore, setHasMore] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [message, setMessage] = React.useState("");
  const [error, setError] = React.useState("");
  const [editorOpen, setEditorOpen] = React.useState(false);
  const [draft, setDraft] = React.useState(emptyDraft);
  const editorRef = React.useRef(null);

  async function api(action, body, credential = access, signal) {
    const response = await fetch(`/api/admin/official-links/${action}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...body, password: credential }), signal,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (response.status === 401 || response.status === 403) { setAccess(""); setLinks([]); }
      throw new Error(data.error || "Impossible de contacter le serveur. Réessaie.");
    }
    return data;
  }

  async function unlock(event) {
    event.preventDefault(); setLoading(true); setError("");
    try {
      await api("list", {}, password);
      setAccess(password); setPage(0); setRevision(v => v + 1);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }

  React.useEffect(() => {
    if (!access) return;
    const controller = new AbortController();
    setLoading(true); setLinks([]); setError("");
    const timer = setTimeout(async () => {
      try {
        const data = await api("list", { search, offset: page * 50 }, access, controller.signal);
        if (controller.signal.aborted) return;
        setLinks(data.links); setTotal(data.total); setHasMore(data.hasMore);
      } catch (err) {
        if (!controller.signal.aborted) { setError(err.message); setHasMore(false); }
      } finally { if (!controller.signal.aborted) setLoading(false); }
    }, search ? 200 : 0);
    return () => { clearTimeout(timer); controller.abort(); };
  }, [access, search, page, revision]);

  React.useEffect(() => {
    if (editorOpen) { editorRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }); editorRef.current?.querySelector('input')?.focus({ preventScroll: true }); }
  }, [editorOpen]);

  function edit(item = emptyDraft) {
    setDraft({ ...item }); setEditorOpen(true); setMessage(""); setError("");
    if (editorOpen) editorRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function refresh() { setPage(0); setRevision(v => v + 1); }
  async function save(event) {
    event.preventDefault(); setSaving(true); setMessage(""); setError("");
    try {
      await api("save", draft);
      setMessage(draft.id ? "Lien mis à jour." : "Lien enregistré. Tu peux en ajouter un autre.");
      setDraft(emptyDraft); setEditorOpen(false); refresh();
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }
  async function remove(item) {
    if (!window.confirm(`Supprimer « ${item.title} » de ton répertoire ?`)) return;
    setSaving(true); setMessage(""); setError("");
    try {
      await api("delete", { id: item.id });
      if (draft.id === item.id) { setEditorOpen(false); setDraft(emptyDraft); }
      setMessage("Lien supprimé."); refresh();
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }
  async function copy(item) {
    try { await navigator.clipboard.writeText(item.source_url); setMessage("Lien copié."); }
    catch (_) { setError("Copie le lien affiché sous le titre : le presse-papiers n’est pas accessible."); }
  }

  return (
    <main className="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 sm:py-10">
      <header className="flex flex-wrap items-center justify-between gap-4">
        <a href="donos-admin-accounts.html" className="flex items-center gap-3">
          <img src="assets/donoss-infinity-logo.jpeg" alt="" className="h-11 w-11 rounded-2xl bg-white object-cover" />
          <div><p className="text-lg font-black">Admin Donoss</p><p className="text-xs font-semibold text-slate-400">Répertoire privé</p></div>
        </a>
        <nav className="flex flex-wrap gap-2" aria-label="Administration">
          <a className={secondaryClass} href="donos-admin-accounts.html">Administration</a>
          <a className={secondaryClass} href="donos-admin-automation.html">Automatisation</a>
        </nav>
      </header>
      <section className="mt-8 rounded-[30px] border border-mint/20 bg-mint/[0.055] p-5 sm:p-8">
        <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Tes sources, au même endroit</p>
        <div className="mt-3 flex flex-wrap items-center justify-between gap-5">
          <div className="max-w-2xl">
            <h1 className="text-3xl font-black sm:text-4xl">Liens officiels</h1>
            <p className="mt-3 text-sm leading-6 text-slate-300">Retrouve la page du commerçant quand un client achète avec ses points. Enregistre un titre, le lien de vente et, si besoin, une note pour toi.</p>
          </div>
          {access && <button type="button" className="rounded-2xl bg-mint px-5 py-3.5 font-black text-ink shadow-glow disabled:opacity-40" disabled={saving} onClick={() => edit()}>+ Ajouter un lien</button>}
        </div>
        {!access && <form className="mt-6 flex flex-wrap items-end gap-3" onSubmit={unlock}>
          <label className="min-w-0 flex-1"><span className="mb-2 block text-sm font-bold">Mot de passe admin principal</span><input className={inputClass} type="password" autoComplete="current-password" required value={password} onChange={e => setPassword(e.target.value)} /></label>
          <button disabled={loading} className="rounded-2xl bg-mint px-5 py-3.5 font-black text-ink disabled:opacity-40">{loading ? "Ouverture…" : "Ouvrir mon répertoire"}</button>
        </form>}
      </section>

      {message && <p role="status" className="mt-4 rounded-2xl border border-mint/25 bg-mint/10 p-4 text-sm text-mint">{message}</p>}
      {error && <div role="alert" className="mt-4 rounded-2xl border border-coral/30 bg-coral/10 p-4 text-sm text-red-200">{error}{access && <button type="button" className="ml-3 underline" onClick={refresh}>Réessayer</button>}</div>}

      {access && <>
        {editorOpen && <section ref={editorRef} className="mt-6 scroll-mt-4 rounded-[28px] border border-white/15 bg-panel p-5 sm:p-6" aria-labelledby="editor-title">
          <h2 id="editor-title" className="text-xl font-black">{draft.id ? "Modifier le lien" : "Nouveau lien officiel"}</h2>
          <form onSubmit={save} className="mt-5">
            <fieldset disabled={saving} className="grid gap-4 disabled:opacity-60">
              <label><span className="mb-2 block text-sm font-bold">Titre</span><input className={inputClass} required maxLength={200} placeholder="Ex. Entrée aquarium — billet adulte" value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })} /></label>
              <label><span className="mb-2 block text-sm font-bold">Lien officiel du commerçant</span><input className={inputClass} required type="url" maxLength={4000} placeholder="https://…" value={draft.source_url} onChange={e => setDraft({ ...draft, source_url: e.target.value })} /></label>
              <label><span className="mb-2 block text-sm font-bold">Description <span className="font-normal text-slate-400">(facultative)</span></span><textarea className={inputClass} rows={3} maxLength={5000} placeholder="Type de billet, nom du commerçant, précisions utiles…" value={draft.description} onChange={e => setDraft({ ...draft, description: e.target.value })} /></label>
              <div className="flex flex-wrap gap-3"><button className="rounded-xl bg-mint px-5 py-3 font-black text-ink">{saving ? "Enregistrement…" : draft.id ? "Enregistrer les modifications" : "Enregistrer le lien"}</button><button type="button" className={secondaryClass} onClick={() => { setEditorOpen(false); setDraft(emptyDraft); }}>Annuler</button></div>
            </fieldset>
          </form>
        </section>}

        <section className="mt-6" aria-label="Rechercher dans les liens">
          <label htmlFor="search" className="mb-2 block text-sm font-bold">Recherche en direct</label>
          <div className="flex items-center gap-3 rounded-2xl border border-white/15 bg-white/5 px-4">
            <span className="text-2xl text-mint" aria-hidden="true">⌕</span>
            <input id="search" type="search" className="min-w-0 flex-1 bg-transparent py-4 text-base outline-none placeholder:text-slate-500" maxLength={200} placeholder="Titre, description ou lien…" value={search} onChange={e => { setSearch(e.target.value); setPage(0); setLoading(true); }} />
            {search && <button type="button" className="text-sm font-bold text-mint" onClick={() => { setSearch(""); setPage(0); }}>Effacer</button>}
          </div>
          <p role="status" className="my-4 text-sm text-slate-400">{loading ? "Recherche…" : error ? "" : `${total} lien${total > 1 ? "s" : ""}${search ? " trouvé" + (total > 1 ? "s" : "") : " enregistré" + (total > 1 ? "s" : "")}`}</p>
          <div className="grid gap-4" aria-busy={loading}>
            {!loading && links.map(item => <article key={item.id} className="rounded-[26px] border border-white/10 bg-white/[0.045] p-5">
              <div className="flex flex-col items-start justify-between gap-4 sm:flex-row">
                <div className="min-w-0 flex-1"><h2 className="break-words text-xl font-black">{item.title}</h2><p className="mt-2 break-all text-sm text-slate-400">{item.source_url}</p></div>
                <a className="shrink-0 rounded-xl bg-mint px-4 py-3 text-sm font-black text-ink" href={item.source_url} target="_blank" rel="noopener noreferrer">Ouvrir le site ↗</a>
              </div>
              {item.description && <p className="mt-4 whitespace-pre-wrap break-words text-sm leading-6 text-slate-300">{item.description}</p>}
              <div className="mt-5 flex flex-wrap gap-2 border-t border-white/10 pt-4">
                <button type="button" className={secondaryClass} onClick={() => copy(item)}>Copier le lien</button>
                <button type="button" className={secondaryClass} disabled={saving} onClick={() => edit(item)}>Modifier</button>
                <button type="button" className={secondaryClass + " text-red-300"} disabled={saving} onClick={() => remove(item)}>Supprimer</button>
              </div>
            </article>)}
            {!loading && !error && !links.length && <div className="rounded-[26px] border border-dashed border-white/20 p-8 text-center"><h2 className="text-lg font-bold">{search ? "Aucun lien trouvé" : "Ton répertoire est prêt"}</h2><p className="mt-2 text-sm text-slate-400">{search ? "Essaie un autre titre, un mot de la description ou le nom du site." : "Ajoute ton premier lien officiel pour le retrouver ici à tout moment."}</p></div>}
          </div>
          {(page > 0 || hasMore) && <nav aria-label="Pages de résultats" className="mt-5 flex items-center justify-between gap-3">
            <button type="button" className={secondaryClass} disabled={loading || page === 0} onClick={() => setPage(p => p - 1)}>Précédent</button>
            <span className="text-sm text-slate-400">Page {page + 1}</span>
            <button type="button" className={secondaryClass} disabled={loading || !hasMore} onClick={() => setPage(p => p + 1)}>Suivant</button>
          </nav>}
        </section>
      </>}
    </main>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
