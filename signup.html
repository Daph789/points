      function generateTransactionId() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const digits = "0123456789";
        const values = new Uint32Array(24);
        crypto.getRandomValues(values);

        const characters = [
          ...Array.from(values.slice(0, 4), (value) => letters[value % letters.length]),
          ...Array.from(values.slice(4, 12), (value) => digits[value % digits.length]),
        ];

        for (let index = characters.length - 1; index > 0; index -= 1) {
          const swapIndex = values[12 + index] % (index + 1);
          [characters[index], characters[swapIndex]] = [characters[swapIndex], characters[index]];
        }

        return characters.join("");
      }

      function formatTransactionId(transactionId) {
        return transactionId.replace(/(.{4})(.{4})(.{4})/, "$1-$2-$3");
      }

      async function syncServerProfile() {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const accessToken = sessionData.session?.access_token;
        if (!accessToken) return null;

        const response = await fetch("/api/me/profile", {
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        const data = await response.json().catch(() => ({}));
        return response.ok ? data.profile : null;
      }

      function readableSignupError(error) {
        const rawMessage =
          typeof error === "string"
            ? error
            : error?.message || error?.error_description || error?.msg || "";
        const message = String(rawMessage || "").trim();
        const lowerMessage = message.toLowerCase();

        if (!message || message === "{}" || message === "[object Object]") {
          return "Supabase está bloqueando la creación de cuentas. Ejecuta supabase-fix-signup-auth.sql.";
        }
        if (lowerMessage.includes("database error saving new user") || lowerMessage.includes("unexpected_failure")) {
          return "Supabase está bloqueando la creación de cuentas. Ejecuta supabase-fix-signup-auth.sql.";
        }
        if (lowerMessage.includes("already registered") || lowerMessage.includes("already exists")) {
          return "Este correo ya tiene una cuenta. Inicia sesión o usa otro correo.";
        }
        if (lowerMessage.includes("invalid email")) {
          return "El correo electrónico no parece válido.";
        }
        if (lowerMessage.includes("password")) {
          return "La contraseña no cumple los requisitos. Usa mínimo 8 caracteres.";
        }
        if (lowerMessage.includes("network") || lowerMessage.includes("failed")) {
          return "No se ha podido conectar. Revisa internet y vuelve a intentarlo.";
        }

        return message;
      }

        const emailsMatch = normalizedEmail && normalizedEmail === normalizedEmailConfirm;
        const normalizedIban = normalizeIban(bankIban);
        const normalizedIbanConfirm = normalizeIban(bankIbanConfirm);
        const ibanIsValid = isValidIbanShape(normalizedIban);
        const ibansMatch = normalizedIban && normalizedIban === normalizedIbanConfirm;
        const bankDetailsComplete = bankAccountHolder.trim() && ibanIsValid && ibansMatch;
        const bioText = bio.trim();
        const canSubmit =
          accountType &&
          displayName.trim() &&
          bioText.length >= 20 &&
          emailsMatch &&
          phone.trim() &&
          finalCityLabel &&
          finalNeighborhood &&
          password.length >= 8 &&
          password === passwordConfirm &&

            const result = await window.donossCountryGuard?.detectCountry?.();
            const detected = String(result?.country || "").toUpperCase();
            if (!cancelled && ["ES", "FR", "BE"].includes(detected)) {
              handleCountryChange(detected);
            }
          }
          syncCountryFromAccessCheck();
          return () => {
            cancelled = true;
          };
        }, []);

        React.useEffect(() => {
          document.documentElement.lang = locale;
          document.title = t.title;
        }, [locale]);

        function normalizeIban(value) {
          return String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        }

        function formatIban(value) {
          return normalizeIban(value).match(/.{1,4}/g)?.join(" ") || "";
        }

        function isValidIbanShape(value) {
          const clean = normalizeIban(value);
          return /^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(clean);
        }

        function cleanValidReferralCode(value) {
          const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
          const letters = clean.replace(/[^A-Z]/g, "").length;
          const digits = clean.replace(/[^0-9]/g, "").length;
          return clean.length === 12 && letters === 4 && digits === 8 ? clean : "";
        }

        function chooseAccountType(type) {
          setAccountType(type);
          setStatus({
            type: "info",
            message: type === "business" ? t.accountSelectedBusiness : t.accountSelectedUser,
          });
          localStorage.setItem("donosAccountType", type);
          window.setTimeout(() => {
            formRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 120);
        }

        function handleCountryChange(value) {
          const nextCountry = window.donossMarkets?.getCountry?.(value) || selectedCountry;
          const nextMarkets = window.donossMarkets?.getMarkets?.(nextCountry.code) || [];
          setCountryCode(nextCountry.code);
          setCityMarket(nextMarkets[0]?.id || customCityValue);
          setCustomCity("");
        }

        function profilePayload(transactionId) {
          return {
            account_type: accountType,
            display_name: displayName.trim(),
            bio: bioText,
            email: normalizedEmail,
            phone: `${selectedCountry.dialCode} ${phone.trim()}`,
            country_code: selectedCountry.code,
            country_label: selectedCountry.name,
            city_market: finalCityMarket,

            city_status: cityStatus,
            requested_city: isCustomCity ? finalCityLabel : null,
            requested_city_country: isCustomCity ? selectedCountry.code : null,
            neighborhood: finalNeighborhood,
            transaction_id: transactionId,
            business_categories: isBusiness ? businessCategoriesSelected : null,
            tax_id: isBusiness ? taxId.trim().toUpperCase() : null,
            address: isBusiness ? businessAddress.trim() : null,
            bank_account_holder: isBusiness ? bankAccountHolder.trim() : null,
            bank_iban: isBusiness ? normalizedIban : null,
            bank_name: isBusiness ? bankName.trim() || null : null,
            bank_bic: isBusiness ? bankBic.trim().toUpperCase() || null : null,
          };
        }

        function saveBankDetailsFromOverlay() {
          if (!bankAccountHolder.trim()) {
            setStatus({ type: "error", message: "Añade el titular de la cuenta bancaria." });
            return;
          }
          if (!ibanIsValid) {
            setStatus({ type: "error", message: "El IBAN no parece válido. Revisa que empiece por país y tenga todos los caracteres." });
            return;
          }
          if (!ibansMatch) {
            setStatus({ type: "error", message: "Los IBAN no coinciden." });
            return;
          }
          setBankIban(formatIban(normalizedIban));
          setBankIbanConfirm(formatIban(normalizedIbanConfirm));
          setStatus({ type: "success", message: "Datos bancarios guardados para el registro." });
          setIsBankOverlayOpen(false);
        }

        function toggleBusinessCategory(category) {
          setBusinessCategoriesSelected((current) =>
            current.includes(category)

              : [...current, category]

        }

        async function handleSubmit(event) {
          event.preventDefault();
          setStatus({ type: "", message: "" });

          if (normalizedEmail !== normalizedEmailConfirm) {
            setStatus({ type: "error", message: t.emailsDoNotMatch });
            return;
          }

          if (password !== passwordConfirm) {
            setStatus({ type: "error", message: t.passwordsDoNotMatch });
            return;
          }

          if (isBusiness && !bankDetailsComplete) {

            setIsBankOverlayOpen(true);
            return;
          }

          if (!canSubmit) {
            setStatus({ type: "error", message: t.completeRequired });
            return;
          }

          setIsSubmitting(true);
          localStorage.setItem("donosAccountType", accountType);
          localStorage.setItem("donosPendingDisplayName", displayName.trim());
          localStorage.setItem("donosDisplayName", displayName.trim());

              options: {

                  ...profilePayload(transactionId),
                  formatted_transaction_id: formatTransactionId(transactionId),
                  referral_code: initialReferralCode || undefined,
                },
              },
            });

            if (error) throw error;

            if (data.user && data.session) {
              const profile = await syncServerProfile();
              if (profile?.transaction_id) localStorage.setItem("donosTransactionId", profile.transaction_id);
              if (profile?.display_name) localStorage.setItem("donosDisplayName", profile.display_name);

                type: "success",
                message: t.created(formatTransactionId(profile?.transaction_id || transactionId)),
              });

              setStatus({
                type: "success",
                message: t.checkEmail(formatTransactionId(transactionId)),
              });

            setStatus({
              type: "error",
              message: readableSignupError(error),

                        <Field label={t.customZone}>
                          <input
                            className={inputClass}
                            type="text"
                            placeholder="Ej. Bidebieta, Añorga..."
                            value={customNeighborhood}
                            onChange={(event) => setCustomNeighborhood(event.target.value)}
                            autoComplete="address-level3"
                          />
                        </Field>
                      )}

                      <div className="grid gap-4 sm:grid-cols-2">
                        <Field label={t.password}>
                          <input
                            className={inputClass}
                            type="password"
                            placeholder="Mín. 8 caracteres"
                            autoComplete="new-password"
                            value={password}
                            onChange={(event) => setPassword(event.target.value)}
                          />
                        </Field>

                        <Field label={t.repeatPassword}>
                          <input
                            className={inputClass}
                            type="password"
                            placeholder="Repite la clave"
                            autoComplete="new-password"
                            value={passwordConfirm}
                            onChange={(event) => setPasswordConfirm(event.target.value)}
                          />
                          {passwordConfirm && password !== passwordConfirm && (
                            <p className="mt-2 text-xs font-bold text-coral">{t.passwordMismatch}</p>
                          )}
                        </Field>
                      </div>

                      <label className="flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.045] p-3">
                        <input
                          type="checkbox"
                          className="mt-1 h-4 w-4 rounded border-line bg-panel accent-mint"
                          checked={acceptedTerms}
                          onChange={(event) => setAcceptedTerms(event.target.checked)}
                        />
                        <span className="min-w-0 break-words text-xs leading-5 text-slate-400">
                          {t.termsPrefix}{" "}
                          <button
                            type="button"
                            className="font-black text-white underline decoration-mint/70 underline-offset-4"
                            onClick={(event) => {
                              event.preventDefault();
                              event.stopPropagation();
                              setIsTermsOpen(true);
                            }}
                          >
                            {t.termsLink}
                          </button>{" "}
                          {locale === "fr" ? "et la" : "y la"}{" "}
                          <a className="font-black text-white underline decoration-mint/70 underline-offset-4" href="privacy-policy.html" target="_blank" rel="noreferrer">
                            {t.privacyLink}
                          </a>
                          . {t.termsSuffix}
                        </span>
                      </label>

                      {status.message && (
                        <div
                          className={`rounded-2xl border p-3 text-sm font-semibold ${
                            status.type === "success"
                              ? "border-mint/25 bg-mint/10 text-mint"
                              : status.type === "info"
                                ? "border-white/10 bg-white/[0.055] text-slate-300"
                              : "border-coral/30 bg-coral/10 text-coral"
                          }`}
                        >
                          {status.message}
                        </div>
                      )}

                      <button
                        className={`mt-2 flex h-14 w-full items-center justify-center rounded-2xl px-5 text-base font-black transition focus:outline-none focus:ring-4 ${
                          canSubmit
                            ? "bg-mint text-ink shadow-glow hover:translate-y-[-1px] hover:bg-[#66ffd0] focus:ring-mint/25"
                            : "cursor-not-allowed bg-slate-700 text-slate-400 shadow-none focus:ring-slate-600/25"
                        }`}
                        disabled={!canSubmit || isSubmitting}
                      >
                        {isSubmitting ? t.submitting : t.submit}
                      </button>
                    </form>
                  )}

                  <p className="mt-5 text-center text-sm text-slate-400">
                    {t.already} <a className="font-bold text-white underline decoration-mint/70 underline-offset-4" href="login.html">{t.login}</a>
                  </p>
                  <p className="mt-3 text-center text-xs font-bold text-slate-500">
                    <a className="underline decoration-mint/50 underline-offset-4 transition hover:text-white" href="privacy-policy.html" target="_blank" rel="noreferrer">{t.privacyFooter}</a>
                    <span className="mx-2">·</span>
                    <a className="underline decoration-mint/50 underline-offset-4 transition hover:text-white" href="data-deletion.html" target="_blank" rel="noreferrer">{t.deleteFooter}</a>
                  </p>
                </div>

                <div className="no-scrollbar mt-4 flex gap-2 overflow-x-auto pb-1 lg:hidden">
                  {perks.map((perk) => (
                    <div key={perk.label} className="min-w-[132px] rounded-2xl border border-white/10 bg-white/[0.055] p-3">
                      <p className="text-lg font-black">{perk.value}</p>
                      <p className="text-xs text-slate-400">{perk.label}</p>
                    </div>
                  ))}
                </div>
              </section>
            </section>
          </main>
          {isTermsOpen && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-3 py-5 backdrop-blur-xl">
              <div className="max-h-[88vh] w-full max-w-2xl overflow-hidden rounded-[28px] border border-white/10 bg-[#0b0f1a] shadow-2xl shadow-black/60">
                <div className="border-b border-white/10 p-5 sm:p-6">
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Condiciones</p>
                  <h3 className="mt-2 text-2xl font-black leading-tight text-white">Condiciones de uso y privacidad de Donoss</h3>
                  <p className="mt-2 text-sm leading-6 text-slate-400">
                    Lee esto antes de crear tu cuenta. Está escrito para que se entienda, no para esconder nada.
                  </p>
                </div>
                <div className="max-h-[55vh] space-y-4 overflow-y-auto p-5 sm:p-6">
                  {termsSections.map((section) => (
                    <section key={section.title} className="rounded-2xl border border-white/10 bg-white/[0.045] p-4">
                      <h4 className="text-sm font-black text-white">{section.title}</h4>
                      <p className="mt-2 text-sm leading-6 text-slate-400">{section.text}</p>
                    </section>
                  ))}
                </div>
                <div className="grid gap-3 border-t border-white/10 p-5 sm:grid-cols-2 sm:p-6">
                  <button
                    type="button"
                    className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-sm font-black text-white"
                    onClick={() => setIsTermsOpen(false)}
                  >
                    Cerrar
                  </button>
                  <button
                    type="button"
                    className="h-12 rounded-2xl bg-mint px-4 text-sm font-black text-ink shadow-glow"
                    onClick={() => {
                      setAcceptedTerms(true);
                      setIsTermsOpen(false);
                    }}
                  >
                    Aceptar condiciones
                  </button>
                </div>
              </div>
            </div>
          )}
          {socialNotice && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 py-6 backdrop-blur-xl">
              <div className="w-full max-w-sm rounded-[30px] border border-mint/20 bg-[#0b0f1a] p-5 text-center shadow-2xl shadow-black/60">
                <div className="mx-auto grid h-16 w-16 place-items-center rounded-3xl bg-white/[0.07] ring-1 ring-white/10">
                  {socialNotice.provider === "apple" ? <AppleIcon /> : <GoogleIcon />}
                </div>
                <p className="mt-5 text-xs font-black uppercase tracking-[0.18em] text-mint">{t.socialTitle}</p>
                <h2 className="mt-2 text-2xl font-black leading-tight text-white">
                  {socialNotice.provider === "apple" ? "Apple" : "Google"}
                </h2>
                <p className="mt-3 text-sm font-bold leading-6 text-slate-300">{socialNotice.message}</p>
                <button
                  type="button"
                  className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                  onClick={() => setSocialNotice(null)}
                >
                  {t.socialButton}
                </button>
              </div>
            </div>
          )}
          {isBankOverlayOpen && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-3 py-5 backdrop-blur-xl">
              <div className="max-h-[90vh] w-full max-w-lg overflow-hidden rounded-[30px] border border-white/10 bg-[#0b0f1a] shadow-2xl shadow-black/60">
                <div className="border-b border-white/10 p-5 sm:p-6">
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Datos de cobro</p>
                  <h3 className="mt-2 text-2xl font-black leading-tight text-white">Añadir cuenta bancaria</h3>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-400">
                    Estos datos solo se usan para que Donoss pueda enviarte dinero por transferencia cuando corresponda.
                  </p>
                </div>

                <div className="max-h-[58vh] space-y-4 overflow-y-auto p-5 sm:p-6">
                  <Field label="Titular de la cuenta">
                    <input
                      className={inputClass}
                      type="text"
                      placeholder="Nombre fiscal o razón social"
                      autoComplete="organization"
                      value={bankAccountHolder}
                      onChange={(event) => setBankAccountHolder(event.target.value)}
                    />
                  </Field>

                  <Field label="IBAN">
                    <input
                      className="h-12 w-full max-w-full rounded-2xl border border-line bg-white/[0.055] px-4 font-mono text-[15px] uppercase tracking-[0.08em] text-white outline-none transition placeholder:font-sans placeholder:normal-case placeholder:tracking-normal placeholder:text-slate-500 focus:border-mint/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-mint/10"
                      type="text"
                      inputMode="text"
                      placeholder="ES00 0000 0000 0000 0000 0000"
                      autoComplete="off"
                      value={bankIban}
                      onChange={(event) => setBankIban(formatIban(event.target.value))}
                    />
                    {bankIban.trim() && !ibanIsValid && (
                      <p className="mt-2 text-xs font-bold text-coral">El IBAN no parece válido.</p>
                    )}
                  </Field>

                  <Field label="Repetir IBAN">
                    <input
                      className="h-12 w-full max-w-full rounded-2xl border border-line bg-white/[0.055] px-4 font-mono text-[15px] uppercase tracking-[0.08em] text-white outline-none transition placeholder:font-sans placeholder:normal-case placeholder:tracking-normal placeholder:text-slate-500 focus:border-mint/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-mint/10"
                      type="text"
                      inputMode="text"
                      placeholder="Vuelve a escribir el IBAN"
                      autoComplete="off"
                      value={bankIbanConfirm}
                      onChange={(event) => setBankIbanConfirm(formatIban(event.target.value))}
                    />
                    {bankIbanConfirm.trim() && !ibansMatch && (
                      <p className="mt-2 text-xs font-bold text-coral">Los IBAN no coinciden.</p>
                    )}
                  </Field>

                  <div className="grid gap-4 sm:grid-cols-2">
                    <Field label="Banco">
                      <input
                        className={inputClass}
                        type="text"
                        placeholder="Ej. CaixaBank, BBVA..."
                        value={bankName}
                        onChange={(event) => setBankName(event.target.value)}
                      />
                    </Field>

                    <Field label="BIC / SWIFT opcional">
                      <input
                        className={inputClass}
                        type="text"
                        placeholder="Ej. CAIXESBBXXX"
                        value={bankBic}
                        onChange={(event) => setBankBic(event.target.value.toUpperCase())}
                      />
                    </Field>
                  </div>

                  <div className="rounded-2xl border border-mint/20 bg-mint/10 p-4">
                    <p className="text-sm font-black text-mint">Revisión antes de guardar</p>
                    <p className="mt-2 text-xs font-bold leading-5 text-slate-300">
                      Donoss no mostrará tu IBAN al público. Revísalo bien: un IBAN incorrecto puede retrasar tus pagos.
                    </p>
                  </div>
                </div>

                <div className="grid gap-3 border-t border-white/10 p-5 sm:grid-cols-2 sm:p-6">
                  <button
                    type="button"
                    className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-sm font-black text-white"
                    onClick={() => setIsBankOverlayOpen(false)}
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    className="h-12 rounded-2xl bg-mint px-4 text-sm font-black text-ink shadow-glow disabled:opacity-60"
                    onClick={saveBankDetailsFromOverlay}
                    disabled={!bankAccountHolder.trim() || !ibanIsValid || !ibansMatch}
                  >
                    Guardar IBAN
                  </button>
                </div>
              </div>
            </div>
          )}
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
