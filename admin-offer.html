<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Editar oferta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#060914",
              panel: "#0D111D",
              line: "#20273A",
              mint: "#42F2B3",
              coral: "#FF6B6B",

            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.16)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");

      html {
        background: #060914;
        overflow-x: hidden;
      }

      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 10%, rgba(255, 209, 102, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);

      #root,
      main {
        max-width: 100%;
        overflow-x: hidden;
      }

  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      const categories = ["Cine", "Libros", "Festivales", "Conciertos", "Museos", "Gaming", "Música", "Viajes", "Restaurantes"];
      const draftKey = "donosBusinessOfferDraft";
      const offerTransferAdminEmail = "donoss.red@gmail.com";
      const defaultReservationWeekdays = [1, 2, 3, 4, 5, 6, 0];
      const reservationWeekdays = [
        { value: 1, label: "Lun" },
        { value: 2, label: "Mar" },
        { value: 3, label: "Mié" },
        { value: 4, label: "Jue" },
        { value: 5, label: "Vie" },
        { value: 6, label: "Sáb" },
        { value: 0, label: "Dom" },
      ];

      const inputClass =
        "h-12 w-full max-w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-[15px] text-white outline-none transition placeholder:text-slate-500 focus:border-mint/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-mint/10";

      const textareaClass =
        "min-h-28 w-full max-w-full rounded-2xl border border-line bg-white/[0.055] px-4 py-3 text-[15px] text-white outline-none transition placeholder:text-slate-500 focus:border-mint/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-mint/10";

      function Field({ label, children }) {
        return (
          <label className="block">
            <span className="mb-2 block text-sm font-medium text-slate-300">{label}</span>
            {children}
          </label>
        );
      }

      function cleanDonosId(value) {
        return value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
      }

      function formatDonosId(value) {
        const clean = cleanDonosId(value);
        return clean.replace(/(.{4})(.{4})(.{0,4})/, (_, a, b, c) => [a, b, c].filter(Boolean).join("-"));
      }

      function todayDateString() {
        return new Date().toISOString().slice(0, 10);
      }

      function normalizeReservationWeekdays(value, fallback = defaultReservationWeekdays) {
        const source = Array.isArray(value) ? value : defaultReservationWeekdays;
        const normalized = [...new Set(source.map((day) => Number(day)).filter((day) => Number.isInteger(day) && day >= 0 && day <= 6))];
        return normalized.length ? normalized : [...fallback];
      }

      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;
      }

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function FileDrop({ label, multiple, files, existingImages = [], onChange, onRemoveExisting }) {
        return (
          <div>
            <p className="mb-2 text-sm font-medium text-slate-300">{label}</p>
            <label className="grid min-h-32 cursor-pointer place-items-center rounded-[24px] border border-dashed border-white/15 bg-white/[0.045] p-4 text-center transition hover:bg-white/[0.07]">
              <input
                className="hidden"
                type="file"
                accept="image/*"
                multiple={multiple}
                onChange={(event) => onChange(Array.from(event.target.files || []))}
              />
              <div>
                <p className="text-3xl">＋</p>
                <p className="mt-2 text-sm font-black text-white">Subir imagen</p>
                <p className="mt-1 text-xs text-slate-500">Opcional</p>
              </div>
            </label>
            {(existingImages.length > 0 || files.length > 0) && (
              <div className="mt-3 grid grid-cols-3 gap-2">
                {existingImages.map((src, index) => (
                  <div key={`existing-${index}`} className="relative overflow-hidden rounded-2xl border border-white/10 bg-black/20">
                    <img className="h-20 w-full object-cover" src={src} alt="" />
                    {onRemoveExisting && (
                      <button
                        type="button"
                        className="absolute right-1 top-1 grid h-7 w-7 place-items-center rounded-full bg-black/60 text-sm font-black text-white"
                        onClick={() => onRemoveExisting(index)}
                      >
                        ×
                      </button>
                    )}
                  </div>
                ))}
                {files.map((file) => (
                  <div key={`${file.name}-${file.size}`} className="overflow-hidden rounded-2xl border border-white/10 bg-black/20">
                    <img className="h-20 w-full object-cover" src={URL.createObjectURL(file)} alt="" />
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function emptyAdditionalLink() {
        return { label: "", url: "" };
      }

      function emptyAdditionalDetail() {
        return { label: "", value: "" };
      }

      function normalizeAdditionalLinks(items) {
        return (Array.isArray(items) ? items : [])
          .map((item) => ({
            label: String(item?.label || "").trim(),
            url: String(item?.url || "").trim(),
          }))
          .filter((item) => item.label && item.url)
          .slice(0, 6);
      }

      function normalizeAdditionalDetails(items) {
        return (Array.isArray(items) ? items : [])
          .map((item) => ({
            label: String(item?.label || "").trim(),
            value: String(item?.value || "").trim(),
          }))
          .filter((item) => item.label && item.value)
          .slice(0, 8);
      }

      function App() {
        const params = new URLSearchParams(window.location.search);
        const editId = params.get("id");
        const [coverFiles, setCoverFiles] = React.useState([]);
        const [presentationFiles, setPresentationFiles] = React.useState([]);
        const [existingCoverImage, setExistingCoverImage] = React.useState("");
        const [existingPresentationImages, setExistingPresentationImages] = React.useState([]);
        const [title, setTitle] = React.useState("");
        const [address, setAddress] = React.useState("");
        const [selectedCategories, setSelectedCategories] = React.useState([]);
        const [basePrice, setBasePrice] = React.useState("");
        const [reducedPrice, setReducedPrice] = React.useState("");
        const [hours, setHours] = React.useState("");
        const [startDate, setStartDate] = React.useState("");
        const [endDate, setEndDate] = React.useState("");
        const [qrValidFrom, setQrValidFrom] = React.useState(todayDateString());
        const [qrValidUntil, setQrValidUntil] = React.useState("");
        const [qrNoExpiry, setQrNoExpiry] = React.useState(false);
        const [age, setAge] = React.useState("");
        const [author, setAuthor] = React.useState("");
        const [description, setDescription] = React.useState("");
        const [additionalLinks, setAdditionalLinks] = React.useState([emptyAdditionalLink()]);
        const [additionalDetails, setAdditionalDetails] = React.useState([emptyAdditionalDetail()]);
        const [cartButtonText, setCartButtonText] = React.useState("Comprar");
        const [externalCheckoutEnabled, setExternalCheckoutEnabled] = React.useState(false);
        const [externalCheckoutUrl, setExternalCheckoutUrl] = React.useState("");
        const [canUseExternalCheckout, setCanUseExternalCheckout] = React.useState(false);
        const [receiverMode, setReceiverMode] = React.useState("business");
        const [businessProfile, setBusinessProfile] = React.useState(null);
        const [soldCount, setSoldCount] = React.useState(0);
        const [isProfileLoading, setIsProfileLoading] = React.useState(true);
        const [receiverId, setReceiverId] = React.useState("");
        const [receiverName, setReceiverName] = React.useState("");
        const [receiverStatus, setReceiverStatus] = React.useState("");
        const [deliveryOptionsEnabled, setDeliveryOptionsEnabled] = React.useState(false);
        const [homeDeliveryEnabled, setHomeDeliveryEnabled] = React.useState(false);
        const [homeDeliveryPrice, setHomeDeliveryPrice] = React.useState("");
        const [pickupEnabled, setPickupEnabled] = React.useState(true);
        const [reservationEnabled, setReservationEnabled] = React.useState(false);
        const [reservationTimeSlots, setReservationTimeSlots] = React.useState("");
        const [reservationMaxPeople, setReservationMaxPeople] = React.useState("");
        const [reservationDaysAhead, setReservationDaysAhead] = React.useState("0");
        const [reservationAvailableWeekdays, setReservationAvailableWeekdays] = React.useState(defaultReservationWeekdays);
        const [stockQuantity, setStockQuantity] = React.useState("");
        const [status, setStatus] = React.useState({ type: "", message: "" });
        const [isSaving, setIsSaving] = React.useState(false);
        const [isDeleting, setIsDeleting] = React.useState(false);
        const [isOfferLoading, setIsOfferLoading] = React.useState(Boolean(editId));
        const [isDraftRestored, setIsDraftRestored] = React.useState(false);
        const [lastDraftSavedAt, setLastDraftSavedAt] = React.useState("");

        const base = Number.parseFloat(basePrice.replace(",", "."));
        const reduced = Number.parseFloat(reducedPrice.replace(",", "."));
        const requiredPoints = Number.isFinite(reduced) ? Math.max(Math.round(reduced * 10), 0) : 0;
        const deliveryPrice = Number.parseFloat(homeDeliveryPrice.replace(",", "."));
        const deliveryPoints = Number.isFinite(deliveryPrice) ? Math.round(deliveryPrice * 10) : 0;
        const soldItemsCount = Number.parseInt(String(soldCount || "0"), 10) || 0;
        const parsedReservationMaxPeople = Math.max(Number.parseInt(reservationMaxPeople, 10) || 0, 0);
        const parsedReservationDaysAhead = Math.max(Number.parseInt(reservationDaysAhead, 10) || 0, 0);

        function normalizeReservationSlots(value) {
          return [...new Set(String(value || "")
            .split(/[\n,;]+/)
            .map((slot) => slot.trim())
            .filter(Boolean))]
            .slice(0, 24);
        }

        React.useEffect(() => {
          if (editId) {
            setIsDraftRestored(true);
            return;
          }

          const savedDraft = localStorage.getItem(draftKey);

          if (!savedDraft) {
            setIsDraftRestored(true);
            return;
          }

          try {
            const draft = JSON.parse(savedDraft);
            setTitle(draft.title || "");
            setAddress(draft.address || "");
            setSelectedCategories(Array.isArray(draft.selectedCategories) ? draft.selectedCategories : []);
            setBasePrice(draft.basePrice || "");
            setReducedPrice(draft.reducedPrice || "");
            setHours(draft.hours || "");
            setStartDate(draft.startDate || "");
            setEndDate(draft.endDate || "");
            setQrValidFrom(draft.qrValidFrom || todayDateString());
            setQrValidUntil(draft.qrValidUntil || "");
            setQrNoExpiry(Boolean(draft.qrNoExpiry));
            setAge(draft.age || "");
            setAuthor(draft.author || "");
            setDescription(draft.description || "");
            setAdditionalLinks(Array.isArray(draft.additionalLinks) && draft.additionalLinks.length ? draft.additionalLinks : [emptyAdditionalLink()]);
            setAdditionalDetails(Array.isArray(draft.additionalDetails) && draft.additionalDetails.length ? draft.additionalDetails : [emptyAdditionalDetail()]);
            setCartButtonText(draft.cartButtonText || "Comprar");
            setExternalCheckoutEnabled(Boolean(draft.externalCheckoutEnabled));
            setExternalCheckoutUrl(draft.externalCheckoutUrl || "");
            setReceiverMode(draft.receiverMode || "business");
            setReceiverId(draft.receiverId || "");
            setReceiverName(draft.receiverName || "");
            setReceiverStatus(draft.receiverStatus || "");
            setDeliveryOptionsEnabled(Boolean(draft.deliveryOptionsEnabled));
            setHomeDeliveryEnabled(Boolean(draft.homeDeliveryEnabled));
            setHomeDeliveryPrice(draft.homeDeliveryPrice || "");
            setPickupEnabled(draft.pickupEnabled !== false);
            setReservationEnabled(Boolean(draft.reservationEnabled));
            setReservationTimeSlots(draft.reservationTimeSlots || "");
            setReservationMaxPeople(draft.reservationMaxPeople || "");
            setReservationDaysAhead(draft.reservationDaysAhead || "0");
            setReservationAvailableWeekdays(normalizeReservationWeekdays(draft.reservationAvailableWeekdays));
            setStockQuantity(draft.stockQuantity || "");
            setLastDraftSavedAt(draft.savedAt || "");
          } catch (error) {
            localStorage.removeItem(draftKey);
          } finally {
            setIsDraftRestored(true);
          }
        }, []);

        React.useEffect(() => {
          if (!editId) return;

          async function loadOfferForEdit() {
            setIsOfferLoading(true);
            setStatus({ type: "", message: "" });

            const { data, error } = await supabaseClient
              .from("business_offers")
              .select("*")
              .eq("id", editId)
              .maybeSingle();

            if (error || !data) {
              setStatus({ type: "error", message: "No hemos encontrado esta oferta para editar." });
              setIsOfferLoading(false);
              return;
            }

            setExistingCoverImage(data.cover_photo_data_url || "");
            setExistingPresentationImages(Array.isArray(data.presentation_image_data_urls) ? data.presentation_image_data_urls.filter(Boolean) : []);
            setTitle(data.title || "");
            setAddress(data.address || "");
            setSelectedCategories(Array.isArray(data.categories) ? data.categories : []);
            setBasePrice(data.base_price === null || data.base_price === undefined ? "" : String(data.base_price));
            setReducedPrice(data.reduced_price === null || data.reduced_price === undefined ? "" : String(data.reduced_price));
            setHours(data.hours || "");
            setStartDate(data.start_date || "");
            setEndDate(data.end_date || "");
            setQrValidFrom(data.qr_valid_from || data.start_date || todayDateString());
            setQrValidUntil(data.qr_valid_until || "");
            setQrNoExpiry(!data.qr_valid_until);
            setAge(data.age || "");
            setAuthor(data.author || "");
            setDescription(data.description || "");
            setAdditionalLinks(Array.isArray(data.additional_links) && data.additional_links.length ? data.additional_links : [emptyAdditionalLink()]);
            setAdditionalDetails(Array.isArray(data.additional_details) && data.additional_details.length ? data.additional_details : [emptyAdditionalDetail()]);
            setCartButtonText(data.cart_button_text || "Comprar");
            setExternalCheckoutEnabled(Boolean(data.external_checkout_enabled));
            setExternalCheckoutUrl(data.external_checkout_url || "");
            setReceiverId(data.receiver_transaction_id || "");
            setReceiverName(data.receiver_display_name || "");
            setReceiverMode("custom");
            setReceiverStatus(data.receiver_display_name ? "Cuenta encontrada." : "");
            setDeliveryOptionsEnabled(Boolean(data.delivery_home_enabled || data.delivery_pickup_enabled));
            setHomeDeliveryEnabled(Boolean(data.delivery_home_enabled));
            setHomeDeliveryPrice(data.delivery_home_price === null || data.delivery_home_price === undefined ? "" : String(data.delivery_home_price));
            setPickupEnabled(data.delivery_pickup_enabled !== false);
            setReservationEnabled(Boolean(data.reservation_enabled));
            setReservationTimeSlots(Array.isArray(data.reservation_time_slots) ? data.reservation_time_slots.join(", ") : "");
            setReservationMaxPeople(data.reservation_max_people === null || data.reservation_max_people === undefined ? "" : String(data.reservation_max_people));
            setReservationDaysAhead(data.reservation_days_ahead === null || data.reservation_days_ahead === undefined ? "0" : String(data.reservation_days_ahead));
            setReservationAvailableWeekdays(normalizeReservationWeekdays(data.reservation_available_weekdays));
            setStockQuantity(data.stock_quantity === null || data.stock_quantity === undefined ? "" : String(Math.max(Number(data.stock_quantity || 0) - Number(data.sold_count || 0), 0)));
            setSoldCount(Number(data.sold_count || 0));
            setIsOfferLoading(false);
          }

          loadOfferForEdit();
        }, [editId]);

        React.useEffect(() => {
          async function loadBusinessProfile() {
            if (!isDraftRestored) return;
            setIsProfileLoading(true);
            const localTransactionId = localStorage.getItem("donosTransactionId") || "";
            const localName = localStorage.getItem("donosDisplayName") || "";
            const { data: userData } = await supabaseClient.auth.getUser();
            const userId = userData.user?.id;
            const metadata = userData.user?.user_metadata || {};
            const userEmail = String(userData.user?.email || "").trim().toLowerCase();
            setCanUseExternalCheckout(userEmail === offerTransferAdminEmail);
            let profile = {
              display_name: localName || metadata.display_name || "",
              transaction_id: localTransactionId || metadata.transaction_id || "",
              is_verified: false,
            };

            if (!userId) {
              setBusinessProfile(profile.transaction_id ? profile : null);
              if (profile.transaction_id) {
                if (!editId) {
                  setReceiverId(profile.transaction_id);
                  setReceiverName(profile.display_name);
                  setReceiverStatus("Usando el ID Donoss de la empresa.");
                }
              } else {
                redirectToLogin();
              }
              setIsProfileLoading(false);
              return;
            }

            const { data } = await supabaseClient
              .from("profiles")
              .select("display_name, transaction_id, is_verified")
              .eq("id", userId)
              .maybeSingle();

            if (data) {
              profile = {
                display_name: data.display_name || profile.display_name,
                transaction_id: data.transaction_id || profile.transaction_id,
                is_verified: Boolean(data.is_verified),
              };
            }

            setBusinessProfile(profile.transaction_id ? profile : null);
            if (profile.transaction_id) {
              localStorage.setItem("donosTransactionId", profile.transaction_id);
              if (profile.display_name) localStorage.setItem("donosDisplayName", profile.display_name);
              if (!editId) {
                setReceiverId(profile.transaction_id);
                setReceiverName(profile.display_name);
                setReceiverStatus("Usando el ID Donoss de la empresa.");
              }
            } else {
              setReceiverStatus("No encontramos el ID Donoss de esta empresa. Prueba a iniciar sesión otra vez.");
            }
            setIsProfileLoading(false);
          }

          loadBusinessProfile();
        }, [isDraftRestored, editId]);

        React.useEffect(() => {
          if (!isDraftRestored || editId) return;

          const savedAt = new Date().toISOString();
          const draft = {
            title,
            address,
            selectedCategories,
            basePrice,
            reducedPrice,
            hours,
            startDate,
            endDate,
            qrValidFrom,
            qrValidUntil,
            qrNoExpiry,
            age,
            author,
            description,
            additionalLinks,
            additionalDetails,
            cartButtonText,
            externalCheckoutEnabled,
            externalCheckoutUrl,
            receiverMode,
            receiverId,
            receiverName,
            receiverStatus,
            deliveryOptionsEnabled,
            homeDeliveryEnabled,
            homeDeliveryPrice,
            pickupEnabled,
            reservationEnabled,
            reservationTimeSlots,
            reservationMaxPeople,
            reservationDaysAhead,
            reservationAvailableWeekdays,
            stockQuantity,
            savedAt,
          };

          localStorage.setItem(draftKey, JSON.stringify(draft));
          setLastDraftSavedAt(savedAt);
        }, [
          isDraftRestored,
          editId,
          title,
          address,
          selectedCategories,
          basePrice,
          reducedPrice,
          hours,
          startDate,
          endDate,
          qrValidFrom,
          qrValidUntil,
          qrNoExpiry,
          age,
          author,
          description,
          additionalLinks,
          additionalDetails,
          cartButtonText,
          externalCheckoutEnabled,
          externalCheckoutUrl,
          receiverMode,
          receiverId,
          receiverName,
          receiverStatus,
          deliveryOptionsEnabled,
          homeDeliveryEnabled,
          homeDeliveryPrice,
          pickupEnabled,
          reservationEnabled,
          reservationTimeSlots,
          reservationMaxPeople,
          reservationDaysAhead,
          reservationAvailableWeekdays,
          stockQuantity,
        ]);

        React.useEffect(() => {
          const cleanId = cleanDonosId(receiverId);
          const businessId = cleanDonosId(businessProfile?.transaction_id || "");

          if (receiverMode === "business" && cleanId && cleanId === businessId) {
            setReceiverName(businessProfile?.display_name || "");
            setReceiverStatus("Usando el ID Donoss de la empresa.");
            return;
          }

          setReceiverName("");

          if (cleanId.length !== 12) {
            setReceiverStatus(cleanId ? "Introduce los 12 caracteres del ID Donoss." : "");
            return;
          }

          let cancelled = false;
          setReceiverStatus("Buscando cuenta...");

          async function lookupReceiver() {
            const { data, error } = await supabaseClient.rpc("lookup_profile_by_transaction_id", {
              search_transaction_id: cleanId,
            });

            if (cancelled) return;

            if (error) {
              setReceiverStatus("No hemos podido confirmar este ID ahora. Puedes guardarlo y revisarlo más tarde.");
              return;
            }

            if (data && data.length > 0) {
              setReceiverName(data[0].display_name);
              setReceiverStatus("Cuenta encontrada.");
            } else {
              setReceiverStatus("No encontramos ninguna cuenta con ese ID.");
            }
          }

          lookupReceiver();

          return () => {
            cancelled = true;
          };
        }, [receiverId, receiverMode, businessProfile]);

        function useBusinessReceiverId() {
          setReceiverMode("business");
          if (isProfileLoading) {
            setReceiverStatus("Cargando el ID Donoss de la empresa...");
            return;
          }
          setReceiverId(businessProfile?.transaction_id || "");
          setReceiverName(businessProfile?.display_name || "");
          setReceiverStatus(
            businessProfile?.transaction_id
              ? "Usando el ID Donoss de la empresa."
              : "No encontramos el ID Donoss de esta empresa. Prueba a iniciar sesión otra vez."
          );
        }

        function useCustomReceiverId() {
          setReceiverMode("custom");
          setReceiverId("");
          setReceiverName("");
          setReceiverStatus("");
        }

        function toggleCategory(category) {
          setSelectedCategories((current) =>
            current.includes(category)
              ? current.filter((item) => item !== category)
              : [...current, category]
          );
        }

        function clearDraft() {
          localStorage.removeItem(draftKey);
          setCoverFiles([]);
          setPresentationFiles([]);
          setTitle("");
          setAddress("");
          setSelectedCategories([]);
          setBasePrice("");
          setReducedPrice("");
          setHours("");
          setStartDate("");
          setEndDate("");
          setQrValidFrom(todayDateString());
          setQrValidUntil("");
          setQrNoExpiry(false);
          setAge("");
          setAuthor("");
          setDescription("");
          setAdditionalLinks([emptyAdditionalLink()]);
          setAdditionalDetails([emptyAdditionalDetail()]);
          setCartButtonText("Comprar");
          setExternalCheckoutEnabled(false);
          setExternalCheckoutUrl("");
          setReceiverMode("business");
          setReceiverId(businessProfile?.transaction_id || "");
          setReceiverName(businessProfile?.display_name || "");
          setReceiverStatus(businessProfile?.transaction_id ? "Usando el ID Donoss de la empresa." : "");
          setDeliveryOptionsEnabled(false);
          setHomeDeliveryEnabled(false);
          setHomeDeliveryPrice("");
          setPickupEnabled(true);
          setReservationEnabled(false);
          setReservationTimeSlots("");
          setReservationMaxPeople("");
          setReservationDaysAhead("0");
          setReservationAvailableWeekdays(defaultReservationWeekdays);
          setStockQuantity("");
          setStatus({ type: "", message: "Borrador limpiado." });
        }

        async function handleSave(event) {
          event.preventDefault();
          setStatus({ type: "", message: "" });
          setIsSaving(true);

          try {
            const { data: userData } = await supabaseClient.auth.getUser();
            const userId = userData.user?.id;

            if (!userId) {
              redirectToLogin();
              return;
            }

            const today = todayDateString();
            const effectiveQrUntil = qrNoExpiry ? "" : (qrValidUntil || "");
            if (startDate && startDate < today) {
              setStatus({ type: "error", message: "La fecha de inicio no puede ser anterior a hoy." });
              return;
            }
            if (endDate && endDate < today) {
              setStatus({ type: "error", message: "La fecha de fin no puede ser anterior a hoy." });
              return;
            }
            if (startDate && endDate && endDate < startDate) {
              setStatus({ type: "error", message: "La fecha de fin no puede ser anterior a la fecha de inicio." });
              return;
            }
            if (qrValidFrom && qrValidFrom < today) {
              setStatus({ type: "error", message: "La fecha de inicio del QR no puede ser anterior a hoy." });
              return;
            }
            if (effectiveQrUntil && effectiveQrUntil < today) {
              setStatus({ type: "error", message: "La fecha de fin del QR no puede ser anterior a hoy." });
              return;
            }
            if (qrValidFrom && effectiveQrUntil && effectiveQrUntil < qrValidFrom) {
              setStatus({ type: "error", message: "La fecha final del QR no puede ser anterior a su fecha de inicio." });
              return;
            }
            const reservationSlots = normalizeReservationSlots(reservationTimeSlots);
            if (reservationEnabled && reservationSlots.length === 0) {
              setStatus({ type: "error", message: "Añade al menos un horario disponible para la reserva." });
              return;
            }
            if (reservationEnabled && parsedReservationMaxPeople <= 0) {
              setStatus({ type: "error", message: "Indica cuántas personas máximo puede reservar el cliente." });
              return;
            }
            const availableReservationWeekdays = normalizeReservationWeekdays(reservationAvailableWeekdays, []);
            if (reservationEnabled && availableReservationWeekdays.length === 0) {
              setStatus({ type: "error", message: "Elige al menos un día de la semana para aceptar reservas." });
              return;
            }
            if (canUseExternalCheckout && externalCheckoutEnabled) {
              try {
                new URL(externalCheckoutUrl.trim());
              } catch (_error) {
                setStatus({ type: "error", message: "Añade un enlace externo válido para el pago." });
                return;
              }
            }

            const payload = {
              business_id: userId,
              cover_photo_name: coverFiles[0]?.name || null,
              cover_photo_data_url: coverFiles[0] ? await fileToDataUrl(coverFiles[0]) : existingCoverImage || null,
              presentation_image_names: presentationFiles.map((file) => file.name),
              presentation_image_data_urls: [
                ...existingPresentationImages,
                ...(await Promise.all(presentationFiles.map(fileToDataUrl))),
              ],
              title: title.trim() || null,
              address: address.trim() || null,
              categories: selectedCategories,
              base_price: Number.isFinite(base) ? base : null,
              reduced_price: Number.isFinite(reduced) ? reduced : null,
              required_points: requiredPoints || null,
              hours: hours.trim() || null,
              start_date: startDate || null,
              end_date: endDate || null,
              qr_valid_from: qrValidFrom || todayDateString(),
              qr_valid_until: qrNoExpiry ? null : (qrValidUntil || null),
              age: age.trim() || null,
              author: author.trim() || null,
              description: description.trim() || null,
              additional_links: normalizeAdditionalLinks(additionalLinks),
              additional_details: normalizeAdditionalDetails(additionalDetails),
              cart_button_text: cartButtonText.trim() || "Comprar",
              receiver_transaction_id: cleanDonosId(receiverId) || null,
              receiver_display_name: receiverName || null,
              business_display_name: businessProfile?.display_name || null,
              business_is_verified: Boolean(businessProfile?.is_verified),
              delivery_home_enabled: deliveryOptionsEnabled && homeDeliveryEnabled,
              delivery_home_price: deliveryOptionsEnabled && homeDeliveryEnabled && Number.isFinite(deliveryPrice) ? deliveryPrice : null,
              delivery_home_points: deliveryOptionsEnabled && homeDeliveryEnabled ? deliveryPoints : null,
              delivery_pickup_enabled: deliveryOptionsEnabled && pickupEnabled,
              reservation_enabled: reservationEnabled,
              reservation_time_slots: reservationEnabled ? reservationSlots : [],
              reservation_max_people: reservationEnabled ? parsedReservationMaxPeople : null,
              reservation_days_ahead: reservationEnabled ? parsedReservationDaysAhead : 0,
              reservation_available_weekdays: reservationEnabled ? availableReservationWeekdays : defaultReservationWeekdays,
              stock_quantity: stockQuantity === "" ? null : soldItemsCount + Math.max(Number.parseInt(stockQuantity, 10) || 0, 0),
              out_of_stock_since: stockQuantity !== "" && Math.max(Number.parseInt(stockQuantity, 10) || 0, 0) <= 0 ? new Date().toISOString() : null,
              updated_at: new Date().toISOString(),
            };
            if (canUseExternalCheckout) {
              payload.external_checkout_enabled = externalCheckoutEnabled;
              payload.external_checkout_url = externalCheckoutEnabled ? externalCheckoutUrl.trim() : null;
            }

            const request = editId
              ? supabaseClient.from("business_offers").update(payload).eq("id", editId).eq("business_id", userId).select("id").maybeSingle()
              : supabaseClient.from("business_offers").insert(payload).select("id").maybeSingle();

            const { data, error } = await request;
            if (error) throw error;
            if (editId && !data) {
              setStatus({
                type: "error",
                message: "No tienes permiso para editar esta oferta con esta cuenta empresa.",
              });
              return;
            }

            if (!editId) localStorage.removeItem(draftKey);
            setStatus({ type: "success", message: editId ? "Oferta actualizada correctamente." : "Oferta guardada correctamente." });
          } catch (error) {
            setStatus({
              type: "error",
              message:
                error.message?.includes("row-level security")
                  ? "Supabase está bloqueando el guardado. Ejecuta el SQL modo desarrollo para quitar RLS."
                  : error.message || "No se ha podido guardar. Inténtalo de nuevo.",
            });
          } finally {
            setIsSaving(false);
          }
        }

        async function handleHide() {
          if (!editId || isDeleting) return;
          setStatus({ type: "", message: "" });

          const confirmed = window.confirm(`¿Ocultar "${title || "esta publicación"}"? Dejará de aparecer para los jóvenes y no podrán comprarla.`);
          if (!confirmed) return;

          setIsDeleting(true);

          try {
            const { data: userData } = await supabaseClient.auth.getUser();
            const userId = userData.user?.id;

            if (!userId) {
              redirectToLogin();
              return;
            }

            const { error } = await supabaseClient
              .from("business_offers")
              .update({ is_hidden: true, updated_at: new Date().toISOString() })
              .eq("id", editId)
              .eq("business_id", userId);

            if (error) throw error;

            setStatus({ type: "success", message: "Oferta ocultada correctamente." });
            setTimeout(() => {
              window.location.href = "my-offers.html";
            }, 650);
          } catch (error) {
            setStatus({
              type: "error",
              message:
                error.message?.includes("row-level security")
                  ? "Supabase está bloqueando la actualización. Revisa el SQL de ofertas."
                  : error.code === "42703"
                    ? "Falta ejecutar el SQL de ofertas para activar publicaciones ocultas."
                    : error.message || "No se ha podido ocultar. Inténtalo de nuevo.",
            });
          } finally {
            setIsDeleting(false);
          }
        }

        async function handleDelete() {
          if (!editId || isDeleting) return;
          setStatus({ type: "", message: "" });

          const confirmed = window.confirm(`¿Eliminar definitivamente "${title || "esta publicación"}"? Esta acción no se puede deshacer.`);
          if (!confirmed) return;

          setIsDeleting(true);

          try {
            const { data: userData } = await supabaseClient.auth.getUser();
            const userId = userData.user?.id;

            if (!userId) {
              redirectToLogin();
              return;
            }

            const { error } = await supabaseClient
              .from("business_offers")
              .delete()
              .eq("id", editId)
              .eq("business_id", userId);

            if (error) throw error;

            setStatus({ type: "success", message: "Oferta eliminada definitivamente." });
            setTimeout(() => {
              window.location.href = "my-offers.html";
            }, 650);
          } catch (error) {
            setStatus({
              type: "error",
              message:
                error.message?.includes("row-level security")
                  ? "Supabase está bloqueando la eliminación. Revisa el SQL de ofertas."
                  : error.message || "No se ha podido eliminar. Inténtalo de nuevo.",
            });
          } finally {
            setIsDeleting(false);
          }
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-5xl px-3 pb-10 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html?type=business" className="flex min-w-0 items-center gap-3">
                <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow sm:h-11 sm:w-11">D</div>
                <div className="min-w-0">
                  <p className="text-lg font-black leading-tight">Donoss</p>
                  <p className="text-xs font-semibold text-slate-400">Panel empresa</p>
                </div>
              </a>
              <div className="flex shrink-0 items-center gap-2">
                <a
                  className="max-w-[132px] truncate rounded-full border border-white/10 bg-white/[0.06] px-3 py-2 text-xs font-black text-slate-200 transition hover:bg-white/[0.1] sm:max-w-none sm:px-4"
                  href="my-offers.html"
                >
                  Mis publicaciones
                </a>
                <span className="hidden rounded-full bg-sun px-3 py-1.5 text-xs font-black text-ink min-[390px]:inline-flex">Soy Empresa</span>
              </div>
            </header>

            <section className="mt-7 grid gap-6 lg:grid-cols-[0.85fr_1.15fr] lg:items-start">
              <aside className="rounded-[28px] border border-white/10 bg-white/[0.055] p-4 shadow-glow sm:rounded-[34px] sm:p-6 lg:sticky lg:top-6">
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Editar oferta</p>
                <h1 className="mt-3 break-words text-3xl font-black leading-tight tracking-normal text-white sm:text-4xl">
                  {editId ? "Modifica tu publicación." : "Crea tu propuesta para Donoss."}
                </h1>
                <p className="mt-4 text-sm leading-6 text-slate-400">
                  {editId
                    ? "Cambia lo que quieras: imágenes, precios, entrega, fechas o texto. Después guarda y se actualiza la publicación."
                    : "Todos los campos son opcionales. Puedes guardar un borrador rápido y completarlo más tarde."}
                </p>

                <div className="mt-6 rounded-[26px] border border-white/10 bg-black/20 p-4">
                  <p className="text-xs font-bold uppercase tracking-[0.16em] text-slate-500">Puntos calculados</p>
                  <p className="mt-2 text-4xl font-black text-white sm:text-5xl">{requiredPoints}</p>
                  <p className="mt-1 text-sm font-semibold text-slate-400">ptos. necesarios</p>
                </div>

                <a
                  className="mt-4 flex h-12 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white transition hover:bg-white/[0.11]"
                  href="my-offers.html"
                >
                  Ver mis publicaciones
                </a>
              </aside>

              <form className="glass space-y-5 rounded-[28px] border border-white/10 p-4 shadow-2xl shadow-black/30 sm:rounded-[34px] sm:p-7" onSubmit={handleSave}>
                {isOfferLoading && (
                  <div className="rounded-2xl border border-white/10 bg-white/[0.045] p-4 text-sm font-bold text-slate-300">
                    Cargando publicación...
                  </div>
                )}

                {!editId && (
                  <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-white/10 bg-white/[0.045] p-3">
                    <div>
                      <p className="text-sm font-black text-white">Borrador automático</p>
                      <p className="mt-1 text-xs font-semibold text-slate-400">
                        {lastDraftSavedAt
                          ? `Guardado localmente a las ${new Date(lastDraftSavedAt).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}`
                          : "Se guardará mientras escribes."}
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={clearDraft}
                      className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-xs font-black text-slate-200 transition hover:bg-white/[0.1]"
                    >
                      Limpiar borrador
                    </button>
                  </div>
                )}

                <FileDrop
                  label="Foto de portada"
                  files={coverFiles}
                  existingImages={existingCoverImage ? [existingCoverImage] : []}
                  onChange={(files) => setCoverFiles(files.slice(0, 1))}
                  onRemoveExisting={() => setExistingCoverImage("")}
                />
                <Field label="Título">
                  <input className={inputClass} value={title} onChange={(event) => setTitle(event.target.value)} placeholder="Ej. Entrada de cine joven" />
                </Field>
                <FileDrop
                  label="Imágenes de presentación"
                  multiple
                  files={presentationFiles}
                  existingImages={existingPresentationImages}
                  onChange={setPresentationFiles}
                  onRemoveExisting={(index) => setExistingPresentationImages((current) => current.filter((_, itemIndex) => itemIndex !== index))}
                />
                <Field label="Dirección">
                  <input className={inputClass} value={address} onChange={(event) => setAddress(event.target.value)} placeholder="Calle, número, barrio..." />
                </Field>

                <div>
                  <p className="mb-2 text-sm font-medium text-slate-300">Categoría</p>
                  <div className="grid gap-2 min-[390px]:grid-cols-2 sm:grid-cols-3">
                    {categories.map((category) => {
                      const selected = selectedCategories.includes(category);
                      return (
                        <button
                          key={category}
                          type="button"
                          onClick={() => toggleCategory(category)}
                          className={`min-h-11 rounded-2xl border px-3 text-left text-sm font-bold transition ${
                            selected
                              ? "border-mint/60 bg-mint/15 text-mint"
                              : "border-line bg-white/[0.055] text-slate-300 hover:bg-white/[0.08]"
                          }`}
                        >
                          {category}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="grid gap-4 min-[430px]:grid-cols-2">
                  <Field label="Precio de base">
                    <input className={inputClass} inputMode="decimal" value={basePrice} onChange={(event) => setBasePrice(event.target.value)} placeholder="Ej. 12,00" />
                  </Field>
                  <Field label="Precio reducido">
                    <input className={inputClass} inputMode="decimal" value={reducedPrice} onChange={(event) => setReducedPrice(event.target.value)} placeholder="Ej. 8,00" />
                  </Field>
                </div>

                <div className="rounded-2xl border border-mint/20 bg-mint/10 p-4">
                  <p className="break-words text-sm font-black text-mint">{requiredPoints} puntos para obtener el precio reducido</p>
                  <p className="mt-1 text-xs font-semibold text-slate-400">Cálculo automático: 1 punto = 0,01 €.</p>
                </div>

                <Field label="Horarios">
                  <input className={inputClass} value={hours} onChange={(event) => setHours(event.target.value)} placeholder="Ej. Lunes a viernes, 17:00-22:00" />
                </Field>

                <div className="grid gap-4 min-[430px]:grid-cols-2">
                  <Field label="Fecha de inicio">
                    <input className={inputClass} type="date" min={todayDateString()} value={startDate} onChange={(event) => {
                        const value = event.target.value;
                        setStartDate(value);
                        if (endDate && value && endDate < value) setEndDate(value);
                      }} />
                  </Field>
                  <Field label="Fecha de fin">
                    <input className={inputClass} type="date" min={startDate || todayDateString()} value={endDate} onChange={(event) => setEndDate(event.target.value)} />
                  </Field>
                </div>

                <div className="rounded-[24px] border border-white/10 bg-white/[0.045] p-4">
                  <p className="text-sm font-black text-white">Validez del QR de compra</p>
                  <p className="mt-1 text-xs font-semibold leading-5 text-slate-400">
                    Se generará un QR único para cada compra. Si tu producto no caduca, activa la opción sin caducidad.
                  </p>
                  <button
                    type="button"
                    className={`mt-4 flex w-full items-center justify-between gap-3 rounded-2xl border p-3 text-left transition ${
                      qrNoExpiry ? "border-mint/35 bg-mint/10 text-mint" : "border-white/10 bg-black/20 text-slate-300"
                    }`}
                    onClick={() => {
                      setQrNoExpiry((current) => {
                        const next = !current;
                        if (next) setQrValidUntil("");
                        return next;
                      });
                    }}
                  >
                    <span>
                      <span className="block text-sm font-black">Este producto no caduca</span>
                      <span className="mt-1 block text-xs font-bold text-slate-500">El QR no tendrá fecha final.</span>
                    </span>
                    <span className={`grid h-7 w-7 shrink-0 place-items-center rounded-full text-sm font-black ${qrNoExpiry ? "bg-mint text-ink" : "bg-white/10 text-white"}`}>
                      {qrNoExpiry ? "✓" : ""}
                    </span>
                  </button>
                  <div className="mt-4 grid gap-4 min-[430px]:grid-cols-2">
                    <Field label="QR válido desde">
                      <input className={inputClass} type="date" min={todayDateString()} value={qrValidFrom} onChange={(event) => {
                          const value = event.target.value;
                          setQrValidFrom(value);
                          if (qrValidUntil && value && qrValidUntil < value) setQrValidUntil(value);
                        }} />
                    </Field>
                    <Field label="QR válido hasta">
                      <input
                        className={`${inputClass} ${qrNoExpiry ? "opacity-45" : ""}`}
                        type="date"
                        min={qrValidFrom || todayDateString()}
                        value={qrValidUntil}
                        disabled={qrNoExpiry}
                        onChange={(event) => setQrValidUntil(event.target.value)}
                      />
                    </Field>
                  </div>
                </div>

                <Field label="Stock disponible">
                  <div>
                    <input
                      className={inputClass}
                      inputMode="numeric"
                      min="0"
                      type="number"
                      value={stockQuantity}
                      onChange={(event) => setStockQuantity(event.target.value.replace(/[^0-9]/g, ""))}
                      placeholder="Ej. 15, deja vacío si no hay límite"
                    />
                    {editId && (
                      <p className="mt-2 text-xs font-semibold text-slate-500">
                        Vendidos: {soldItemsCount}. Este campo muestra solo las unidades disponibles ahora.
                      </p>
                    )}
                  </div>
                </Field>

                <Field label="Edad">
                  <input className={inputClass} value={age} onChange={(event) => setAge(event.target.value)} placeholder="Ej. Todos los públicos, +16..." />
                </Field>

                <Field label="Autor/a">
                  <input className={inputClass} value={author} onChange={(event) => setAuthor(event.target.value)} placeholder="Ej. Nombre del autor, artista o responsable" />
                </Field>

                <Field label="Descripción">
                  <textarea className={textareaClass} value={description} onChange={(event) => setDescription(event.target.value)} placeholder="Cuenta qué incluye la oferta..." />
                </Field>

                <div className="rounded-[24px] border border-white/10 bg-white/[0.045] p-4">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-black text-white">Información adicional</p>
                      <p className="mt-1 text-xs font-semibold leading-5 text-slate-400">
                        Añade enlaces o datos útiles sin llenar la descripción. El comprador verá botones limpios como “Ver vídeo”.
                      </p>
                    </div>
                    <span className="hidden rounded-full bg-mint/10 px-3 py-1 text-xs font-black text-mint ring-1 ring-mint/20 sm:inline-flex">Opcional</span>
                  </div>

                  <div className="mt-4 space-y-3">
                    <div className="flex items-center justify-between gap-3">
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Enlaces</p>
                      <button
                        type="button"
                        className="rounded-full bg-white/[0.08] px-3 py-1.5 text-xs font-black text-white ring-1 ring-white/10"
                        onClick={() => setAdditionalLinks((current) => [...current, emptyAdditionalLink()].slice(0, 6))}
                      >
                        Añadir enlace
                      </button>
                    </div>
                    {additionalLinks.map((link, index) => (
                      <div key={`link-${index}`} className="grid gap-2 rounded-2xl border border-white/10 bg-black/20 p-3 sm:grid-cols-[0.8fr_1fr_auto]">
                        <input
                          className={inputClass}
                          value={link.label}
                          onChange={(event) => setAdditionalLinks((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, label: event.target.value } : item))}
                          placeholder="Texto visible: Ver vídeo"
                        />
                        <input
                          className={inputClass}
                          value={link.url}
                          onChange={(event) => setAdditionalLinks((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, url: event.target.value } : item))}
                          placeholder="https://..."
                        />
                        <button
                          type="button"
                          className="h-12 rounded-2xl border border-coral/20 bg-coral/10 px-4 text-xs font-black text-coral"
                          onClick={() => setAdditionalLinks((current) => current.length <= 1 ? [emptyAdditionalLink()] : current.filter((_, itemIndex) => itemIndex !== index))}
                        >
                          Quitar
                        </button>
                      </div>
                    ))}
                  </div>

                  <div className="mt-5 space-y-3">
                    <div className="flex items-center justify-between gap-3">
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Otros datos</p>
                      <button
                        type="button"
                        className="rounded-full bg-white/[0.08] px-3 py-1.5 text-xs font-black text-white ring-1 ring-white/10"
                        onClick={() => setAdditionalDetails((current) => [...current, emptyAdditionalDetail()].slice(0, 8))}
                      >
                        Añadir dato
                      </button>
                    </div>
                    {additionalDetails.map((detail, index) => (
                      <div key={`detail-${index}`} className="grid gap-2 rounded-2xl border border-white/10 bg-black/20 p-3 sm:grid-cols-[0.8fr_1fr_auto]">
                        <input
                          className={inputClass}
                          value={detail.label}
                          onChange={(event) => setAdditionalDetails((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, label: event.target.value } : item))}
                          placeholder="Título: Dress code"
                        />
                        <input
                          className={inputClass}
                          value={detail.value}
                          onChange={(event) => setAdditionalDetails((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, value: event.target.value } : item))}
                          placeholder="Valor: Casual"
                        />
                        <button
                          type="button"
                          className="h-12 rounded-2xl border border-coral/20 bg-coral/10 px-4 text-xs font-black text-coral"
                          onClick={() => setAdditionalDetails((current) => current.length <= 1 ? [emptyAdditionalDetail()] : current.filter((_, itemIndex) => itemIndex !== index))}
                        >
                          Quitar
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                <Field label="Botón de acción">
                  <input className={inputClass} value={cartButtonText} onChange={(event) => setCartButtonText(event.target.value)} placeholder="Comprar, reservar, apuntarme..." />
                </Field>

                {canUseExternalCheckout && (
                  <div className="rounded-[24px] border border-sun/20 bg-sun/10 p-4">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-sm font-black text-white">Pagar con enlace externo</p>
                        <p className="mt-1 text-xs font-semibold leading-5 text-slate-300">
                          Solo aparece en tu cuenta Donoss admin. El cliente paga sus puntos en Donoss y después se le abre el enlace de pago de la empresa.
                        </p>
                      </div>
                      <button
                        type="button"
                        className={`relative h-8 w-14 shrink-0 rounded-full p-1 transition ${
                          externalCheckoutEnabled ? "bg-mint" : "bg-white/10 ring-1 ring-white/10"
                        }`}
                        onClick={() => setExternalCheckoutEnabled((current) => !current)}
                        aria-pressed={externalCheckoutEnabled}
                      >
                        <span className={`block h-6 w-6 rounded-full bg-white shadow-lg transition ${externalCheckoutEnabled ? "translate-x-6" : "translate-x-0"}`}></span>
                      </button>
                    </div>
                    {externalCheckoutEnabled && (
                      <div className="mt-4">
                        <Field label="Enlace de pago externo">
                          <input
                            className={inputClass}
                            value={externalCheckoutUrl}
                            onChange={(event) => setExternalCheckoutUrl(event.target.value)}
                            placeholder="https://web-del-comercio.com/pagar..."
                          />
                        </Field>
                        <p className="mt-2 text-xs font-semibold leading-5 text-slate-400">
                          Úsalo solo cuando la empresa quiere terminar la compra en su propia web.
                        </p>
                      </div>
                    )}
                  </div>
                )}

                <div className="rounded-[24px] border border-white/10 bg-white/[0.045] p-4">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-black text-white">¿Permitir reserva?</p>
                      <p className="mt-1 text-xs font-semibold leading-5 text-slate-400">
                        Actívalo si quieres que el comprador pueda elegir fecha, hora y número de personas al pagar.
                      </p>
                    </div>
                    <button
                      type="button"
                      className={`relative h-8 w-14 shrink-0 rounded-full p-1 transition ${
                        reservationEnabled ? "bg-mint" : "bg-white/10 ring-1 ring-white/10"
                      }`}
                      onClick={() => setReservationEnabled((current) => !current)}
                      aria-pressed={reservationEnabled}
                    >
                      <span className={`block h-6 w-6 rounded-full bg-white shadow-lg transition ${reservationEnabled ? "translate-x-6" : "translate-x-0"}`}></span>
                    </button>
                  </div>

                  {reservationEnabled && (
                    <div className="mt-4 grid gap-4">
                      <Field label="Horarios que pueden reservar">
                        <textarea
                          className={textareaClass}
                          value={reservationTimeSlots}
                          onChange={(event) => setReservationTimeSlots(event.target.value)}
                          placeholder={"Ej. 13:00, 14:30, 21:00\nTambién puedes escribir uno por línea"}
                        />
                      </Field>
                      <div className="grid gap-4 min-[430px]:grid-cols-2">
                        <Field label="Personas máximas por reserva">
                          <input
                            className={inputClass}
                            inputMode="numeric"
                            type="number"
                            min="1"
                            value={reservationMaxPeople}
                            onChange={(event) => setReservationMaxPeople(event.target.value.replace(/[^0-9]/g, ""))}
                            placeholder="Ej. 4"
                          />
                        </Field>
                        <Field label="Días de antelación permitidos">
                          <input
                            className={inputClass}
                            inputMode="numeric"
                            type="number"
                            min="0"
                            value={reservationDaysAhead}
                            onChange={(event) => setReservationDaysAhead(event.target.value.replace(/[^0-9]/g, ""))}
                            placeholder="0 = solo hoy"
                          />
                        </Field>
                      </div>
                      <div>
                        <p className="mb-2 text-sm font-medium text-slate-300">Días disponibles para reservar</p>
                        <div className="flex flex-wrap gap-2">
                          {reservationWeekdays.map((day) => {
                            const isActive = reservationAvailableWeekdays.includes(day.value);
                            return (
                              <button
                                key={day.value}
                                type="button"
                                className={`rounded-2xl px-4 py-3 text-sm font-black transition ${
                                  isActive
                                    ? "bg-mint text-ink shadow-glow"
                                    : "bg-white/[0.055] text-slate-400 ring-1 ring-white/10"
                                }`}
                                onClick={() => setReservationAvailableWeekdays((current) =>
                                  current.includes(day.value)
                                    ? current.filter((item) => item !== day.value)
                                    : [...current, day.value]
                                )}
                                aria-pressed={isActive}
                              >
                                {day.label}
                              </button>
                            );
                          })}
                        </div>
                        <p className="mt-2 text-xs font-semibold leading-5 text-slate-500">
                          Si el restaurante no trabaja el viernes, desactiva “Vie”. El cliente no podrá reservar ese día.
                        </p>
                      </div>
                      <div className="rounded-2xl border border-mint/20 bg-mint/10 p-3">
                        <p className="text-sm font-black text-mint">
                          {parsedReservationDaysAhead === 0 ? "El cliente solo podrá reservar para hoy." : `El cliente podrá reservar desde hoy hasta dentro de ${parsedReservationDaysAhead} día${parsedReservationDaysAhead === 1 ? "" : "s"}.`}
                        </p>
                        <p className="mt-1 text-xs font-semibold text-slate-400">
                          La reserva no suma puntos extra; solo guarda fecha, hora y personas en el pedido.
                        </p>
                      </div>
                    </div>
                  )}
                </div>

                <div className="rounded-[24px] border border-white/10 bg-white/[0.045] p-4">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-black text-white">¿Añadir entrega o recogida?</p>
                      <p className="mt-1 text-xs font-semibold leading-5 text-slate-400">
                        Si es solo un billete digital, déjalo apagado. El comprador pagará directamente sin elegir entrega.
                      </p>
                    </div>
                    <button
                      type="button"
                      className={`relative h-8 w-14 shrink-0 rounded-full p-1 transition ${
                        deliveryOptionsEnabled ? "bg-mint" : "bg-white/10 ring-1 ring-white/10"
                      }`}
                      onClick={() => {
                        setDeliveryOptionsEnabled((current) => {
                          const next = !current;
                          if (next && !pickupEnabled && !homeDeliveryEnabled) setPickupEnabled(true);
                          return next;
                        });
                      }}
                      aria-pressed={deliveryOptionsEnabled}
                    >
                      <span className={`block h-6 w-6 rounded-full bg-white shadow-lg transition ${deliveryOptionsEnabled ? "translate-x-6" : "translate-x-0"}`}></span>
                    </button>
                  </div>

                  {!deliveryOptionsEnabled ? (
                    <div className="mt-4 rounded-2xl border border-mint/20 bg-mint/10 p-4">
                      <p className="text-sm font-black text-mint">Billete digital / sin entrega</p>
                      <p className="mt-1 text-xs font-semibold leading-5 text-slate-300">
                        Perfecto para cine, conciertos, museos, gaming o cualquier compra que se valide con QR.
                      </p>
                    </div>
                  ) : (
                    <div className="mt-4 grid gap-3">
                      <p className="text-sm font-medium text-slate-300">Propuesta de entrega</p>
                      <label className="flex items-start gap-3 rounded-2xl border border-white/10 bg-black/20 p-3">
                        <input
                          type="checkbox"
                          className="mt-1 h-4 w-4 rounded border-line bg-panel accent-mint"
                          checked={pickupEnabled}
                          onChange={(event) => setPickupEnabled(event.target.checked)}
                        />
                        <span>
                          <span className="block text-sm font-black text-white">Recogida en tienda</span>
                          <span className="mt-1 block text-xs leading-5 text-slate-400">La persona viene a la dirección indicada. No paga puntos extra.</span>
                        </span>
                      </label>

                      <label className="rounded-2xl border border-white/10 bg-black/20 p-3">
                        <span className="flex items-start gap-3">
                          <input
                            type="checkbox"
                            className="mt-1 h-4 w-4 rounded border-line bg-panel accent-mint"
                            checked={homeDeliveryEnabled}
                            onChange={(event) => setHomeDeliveryEnabled(event.target.checked)}
                          />
                          <span>
                            <span className="block text-sm font-black text-white">Entrega a domicilio</span>
                            <span className="mt-1 block text-xs leading-5 text-slate-400">Indica el coste en euros y Donoss lo convierte automáticamente a puntos.</span>
                          </span>
                        </span>

                        {homeDeliveryEnabled && (
                          <div className="mt-3">
                            <input
                              className={inputClass}
                              inputMode="decimal"
                              value={homeDeliveryPrice}
                              onChange={(event) => setHomeDeliveryPrice(event.target.value.replace(/[^0-9,.]/g, ""))}
                              placeholder="Coste de entrega en €"
                            />
                            <div className="mt-3 rounded-2xl border border-mint/20 bg-mint/10 p-3">
                              <p className="text-sm font-black text-mint">
                                {deliveryPoints} puntos extra por entrega
                              </p>
                              <p className="mt-1 text-xs font-semibold text-slate-400">1 punto = 0,01 €</p>
                            </div>
                          </div>
                        )}
                      </label>
                    </div>
                  )}
                </div>

                <div>
                  <p className="mb-2 text-sm font-medium text-slate-300">ID Donoss con el que quieres recibir tus puntos</p>
                  <div className="grid gap-2 min-[430px]:grid-cols-2">
                    <button
                      type="button"
                      onClick={useBusinessReceiverId}
                      disabled={isProfileLoading}
                      className={`min-h-12 rounded-2xl border px-3 text-left text-sm font-black transition ${
                        receiverMode === "business"
                          ? "border-mint/60 bg-mint/15 text-mint"
                          : "border-line bg-white/[0.055] text-slate-300 hover:bg-white/[0.08]"
                      } disabled:cursor-not-allowed disabled:opacity-60`}
                    >
                      {isProfileLoading ? "Cargando ID de empresa..." : "Con el ID Donoss de la empresa"}
                    </button>
                    <button
                      type="button"
                      onClick={useCustomReceiverId}
                      className={`min-h-12 rounded-2xl border px-3 text-left text-sm font-black transition ${
                        receiverMode === "custom"
                          ? "border-mint/60 bg-mint/15 text-mint"
                          : "border-line bg-white/[0.055] text-slate-300 hover:bg-white/[0.08]"
                      }`}
                    >
                      Añadir otro ID
                    </button>
                  </div>

                  <input
                    className={`${inputClass} mt-3`}
                    value={formatDonosId(receiverId)}
                    onChange={(event) => {
                      setReceiverMode("custom");
                      setReceiverId(cleanDonosId(event.target.value));
                    }}
                    placeholder="3B8K-1940-A27Z"
                  />
                  {receiverMode === "business" && businessProfile?.transaction_id && (
                    <p className="mt-2 break-words text-xs font-semibold text-slate-400">
                      ID empresa: {formatDonosId(businessProfile.transaction_id)}
                    </p>
                  )}
                </div>

                {(receiverStatus || receiverName) && (
                  <div className={`rounded-2xl border p-4 text-sm font-semibold ${
                    receiverName ? "border-mint/25 bg-mint/10 text-mint" : "border-white/10 bg-white/[0.055] text-slate-300"
                  }`}>
                    {receiverName ? `Confirmación: ${receiverName}` : receiverStatus}
                  </div>
                )}

                {status.message && (
                  <div className={`rounded-2xl border p-4 text-sm font-semibold ${
                    status.type === "success" ? "border-mint/25 bg-mint/10 text-mint" : "border-coral/30 bg-coral/10 text-coral"
                  }`}>
                    <p>{status.message}</p>
                    {status.type === "error" && status.message.includes("Inicia sesión") && (
                      <a
                        className="mt-3 inline-flex rounded-full bg-coral px-4 py-2 text-xs font-black text-white"
                        href="login.html"
                      >
                        Iniciar sesión
                      </a>
                    )}
                  </div>
                )}

                <div className="grid gap-3 min-[430px]:grid-cols-[1fr_auto]">
                  <button
                    className="flex h-14 w-full items-center justify-center rounded-2xl bg-mint px-5 text-base font-black text-ink shadow-glow transition hover:translate-y-[-1px] hover:bg-[#66ffd0] disabled:cursor-not-allowed disabled:opacity-60"
                    disabled={isSaving || isOfferLoading || isDeleting}
                  >
                    {isSaving ? "Guardando..." : editId ? "Guardar cambios" : "Guardar"}
                  </button>
                  {editId && (
                    <div className="grid gap-3 min-[430px]:grid-cols-2">
                      <button
                        type="button"
                        className="flex h-14 items-center justify-center rounded-2xl border border-sun/30 bg-sun/10 px-5 text-base font-black text-sun transition hover:bg-sun/15 disabled:cursor-not-allowed disabled:opacity-60"
                        disabled={isSaving || isOfferLoading || isDeleting}
                        onClick={handleHide}
                      >
                        {isDeleting ? "Ocultando..." : "Ocultar publicación"}
                      </button>
                      <button
                        type="button"
                        className="flex h-14 items-center justify-center rounded-2xl border border-coral/30 bg-coral/10 px-5 text-base font-black text-coral transition hover:bg-coral/15 disabled:cursor-not-allowed disabled:opacity-60"
                        disabled={isSaving || isOfferLoading || isDeleting}
                        onClick={handleDelete}
                      >
                        {isDeleting ? "Procesando..." : "Eliminar"}
                      </button>
                    </div>
                  )}
                </div>
              </form>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
