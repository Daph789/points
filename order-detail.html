<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Detalle del pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166", violet: "#A78BFA" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 15% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 86% 8%, rgba(255, 209, 102, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      function formatDateTime(value) {
        return new Date(value).toLocaleString("es-ES", { dateStyle: "full", timeStyle: "short" });
      }

      function formatShortId(value) {
        return String(value || "").slice(0, 8).toUpperCase();
      }

      function formatDelivery(value) {
        return value === "home" ? "Entrega a domicilio" : "Recogida en tienda";
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-5 w-5 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3.5 w-3.5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function InfoCard({ label, value, tone = "default" }) {
        const toneClass = tone === "mint" ? "border-mint/20 bg-mint/10" : tone === "coral" ? "border-coral/25 bg-coral/10" : "border-white/10 bg-white/[0.055]";
        return (
          <div className={`rounded-3xl border p-4 ${toneClass}`}>
            <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">{label}</p>
            <p className="mt-2 break-words text-lg font-black text-white">{value || "No indicado"}</p>
          </div>
        );
      }

      function App() {
        const [purchase, setPurchase] = React.useState(null);
        const [status, setStatus] = React.useState("Cargando pedido...");
        const purchaseId = new URLSearchParams(window.location.search).get("id");

        React.useEffect(() => {
          loadPurchase();
        }, []);

        async function loadPurchase() {
          if (!purchaseId) {
            setStatus("Pedido no encontrado.");
            return;
          }

          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
            return;
          }

          try {
            const response = await fetch(`/api/me/purchases/${purchaseId}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "detail_failed");
            setPurchase(data.purchase);
            setStatus("");
          } catch (error) {
            setStatus(
              error.message === "purchase_not_found"
                ? "No encontramos este pedido en tu cuenta."
                : "No se ha podido cargar el detalle del pedido."
            );
          }
        }

        if (status) {
          return (
            <main className="mx-auto min-h-screen w-full max-w-3xl px-3 py-4 sm:px-6">
              <a className="inline-flex rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200" href="historial.html">Volver</a>
              <div className="mt-6 rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">{status}</div>
            </main>
          );
        }

        const offer = purchase.offer || {};
        const businessName = offer.business_display_name || purchase.receiver?.display_name || offer.author || "Donos";
        const image = offer.cover_image || offer.presentation_images?.[0];

        return (
          <main className="mx-auto min-h-screen w-full max-w-4xl px-3 pb-10 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200" href="historial.html">Volver</a>
              <span className="rounded-full bg-mint/10 px-4 py-2 text-xs font-black text-mint ring-1 ring-mint/20">
                Pedido #{formatShortId(purchase.id)}
              </span>
            </header>

            <section className="mt-6 overflow-hidden rounded-[36px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/30">
              <div className="relative min-h-[260px] bg-gradient-to-br from-mint via-[#17213C] to-violet p-5">
                {image && <img className="absolute inset-0 h-full w-full object-cover opacity-75" src={image} alt="" />}
                <div className="absolute inset-0 bg-gradient-to-t from-[#060914] via-[#060914]/30 to-transparent"></div>
                <div className="absolute bottom-5 left-5 right-5">
                  <div className="inline-flex items-center gap-2 rounded-full bg-black/35 px-3 py-1.5 text-xs font-black text-white ring-1 ring-white/10 backdrop-blur">
                    <span>{businessName}</span>
                    {offer.business_is_verified && <VerifiedBadge />}
                  </div>
                  <h1 className="mt-3 break-words text-3xl font-black leading-tight text-white sm:text-5xl">{offer.title || "Pedido Donos"}</h1>
                  <p className="mt-2 text-sm font-bold text-slate-300">{formatDateTime(purchase.created_at)}</p>
                </div>
              </div>

              <div className="space-y-5 p-4 sm:p-7">
                <div className="grid gap-3 min-[430px]:grid-cols-3">
                  <InfoCard label="Total pagado" value={`${purchase.total_points || 0} pts`} tone="mint" />
                  <InfoCard label="Oferta" value={`${purchase.offer_points || 0} pts`} />
                  <InfoCard label="Entrega" value={`${purchase.delivery_points || 0} pts`} />
                </div>

                <section className="rounded-[28px] border border-white/10 bg-[#0D111D] p-4">
                  <p className="text-sm font-black text-white">Resumen del pedido</p>
                  <div className="mt-4 space-y-3 text-sm font-bold">
                    <div className="flex justify-between gap-4">
                      <span className="text-slate-400">Método</span>
                      <span className="text-right text-white">{formatDelivery(purchase.delivery_method)}</span>
                    </div>
                    <div className="flex justify-between gap-4 border-t border-white/10 pt-3">
                      <span className="text-slate-400">Fecha del pedido</span>
                      <span className="text-right text-white">{formatDateTime(purchase.created_at)}</span>
                    </div>
                    <div className="flex justify-between gap-4 border-t border-white/10 pt-3">
                      <span className="text-slate-400">Comercio</span>
                      <span className="text-right text-white">{businessName}</span>
                    </div>
                    <div className="flex justify-between gap-4 border-t border-white/10 pt-3">
                      <span className="text-slate-400">ID receptor</span>
                      <span className="break-all text-right font-mono text-white">{purchase.receiver_transaction_id}</span>
                    </div>
                  </div>
                </section>

                <div className="grid gap-3 sm:grid-cols-2">
                  <InfoCard label="Dirección de la oferta" value={offer.address} />
                  <InfoCard label="Dirección de entrega" value={purchase.delivery_address || "Recogida en tienda"} />
                  <InfoCard label="Categoría" value={offer.categories?.join(", ")} />
                  <InfoCard label="Horarios" value={offer.hours} />
                </div>

                {offer.description && (
                  <section className="rounded-[28px] border border-white/10 bg-white/[0.045] p-4">
                    <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Descripción</p>
                    <p className="mt-2 text-sm font-semibold leading-6 text-slate-300">{offer.description}</p>
                  </section>
                )}

                <a className="grid h-13 min-h-12 place-items-center rounded-2xl bg-mint px-5 text-sm font-black text-ink shadow-glow" href={`offer-detail.html?id=${purchase.offer_id}`}>
                  Ver oferta original
                </a>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
