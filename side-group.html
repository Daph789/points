<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Grupo alternativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166", violet: "#A78BFA" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.18)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; }
      body {
        background:
          radial-gradient(circle at 20% -8%, rgba(255, 209, 102, 0.18), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(66, 242, 179, 0.15), transparent 32%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>
    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
      const params = new URLSearchParams(window.location.search);
      const planId = params.get("id") || "";
      const sideStatus = ["waiting", "removed"].includes(params.get("status")) ? params.get("status") : "waiting";
      const isEmbedded = params.get("embedded") === "1";

      function redirectToLogin() {
        window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      }

      function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function titleForStatus(status, merged) {
        if (merged) return "Grupo unido";
        return status === "waiting" ? "Grupo alternativo" : "Grupo aparte";
      }

      function statusText(status) {
        return status === "waiting" ? "En espera" : "Retirados";
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-4 w-4 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3 w-3" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5"><path d="m5 12 4 4L19 7" /></svg>
          </span>
        );
      }

      function Avatar({ user, mine = false }) {
        const photo = user?.plan_photo_data_urls?.[0];
        return (
          <span className={`grid h-9 w-9 shrink-0 place-items-center overflow-hidden rounded-2xl text-xs font-black ${mine ? "bg-sun text-ink" : "bg-white/[0.08] text-white ring-1 ring-white/10"}`}>
            {photo ? <img className="h-full w-full object-cover" src={photo} alt="" /> : String(user?.display_name || "D").slice(0, 1).toUpperCase()}
          </span>
        );
      }

      function canEditMessage(message) {
        if (!message?.created_at || message.deleted_at || message.pending) return false;
        return Date.now() - new Date(message.created_at).getTime() <= 15 * 60 * 1000;
      }

      function messageReadCount(message) {
        return (message?.read_by || []).filter((read) => read.reader?.id && read.reader.id !== message.sender_id).length;
      }

      function ReadTicks({ message }) {
        if (!message || message.pending) return <span className="text-ink/35">✓</span>;
        const isRead = messageReadCount(message) > 0;
        return <span className={`ml-1 inline-flex text-[13px] font-black ${isRead ? "text-sky-600" : "text-ink/45"}`}>✓✓</span>;
      }

      function mergeMessagesWithPending(serverMessages, currentMessages) {
        const confirmed = Array.isArray(serverMessages) ? serverMessages : [];
        const current = Array.isArray(currentMessages) ? currentMessages : [];
        const currentById = new Map(current.filter((message) => message.id).map((message) => [message.id, message]));
        const confirmedIds = new Set(confirmed.map((message) => message.id).filter(Boolean));
        const hydratedConfirmed = confirmed.map((message) => {
          const local = currentById.get(message.id);
          return local?.local_key ? { ...message, local_key: local.local_key } : message;
        });
        const localStillNeeded = current.filter((message) => {
          if (message.pending) return Date.now() - new Date(message.created_at).getTime() < 30000;
          if (!message.local_confirmed_at || confirmedIds.has(message.id)) return false;
          return Date.now() - new Date(message.local_confirmed_at).getTime() < 30000;
        });
        return [...hydratedConfirmed, ...localStillNeeded];
      }

      function App() {
        const [token, setToken] = React.useState("");
        const [profile, setProfile] = React.useState(null);
        const [plan, setPlan] = React.useState(null);
        const [members, setMembers] = React.useState([]);
        const [messages, setMessages] = React.useState([]);
        const [mergeRequests, setMergeRequests] = React.useState([]);
        const [merged, setMerged] = React.useState(false);
        const [otherCount, setOtherCount] = React.useState(0);
        const [draft, setDraft] = React.useState("");
        const [status, setStatus] = React.useState("Cargando grupo...");
        const [isSaving, setIsSaving] = React.useState(false);
        const [showMembers, setShowMembers] = React.useState(false);
        const [selectedMessage, setSelectedMessage] = React.useState(null);
        const [readListMessage, setReadListMessage] = React.useState(null);
        const [editingMessage, setEditingMessage] = React.useState(null);
        const [editDraft, setEditDraft] = React.useState("");
        const [messageToDelete, setMessageToDelete] = React.useState(null);
        const [showIntro, setShowIntro] = React.useState(false);
        const listRef = React.useRef(null);
        const bottomRef = React.useRef(null);
        const forceScrollRef = React.useRef(false);

        React.useEffect(() => { bootstrap(); }, []);
        React.useEffect(() => {
          const introKey = `donos-side-group-intro-${planId}-${sideStatus}`;
          if (!window.localStorage.getItem(introKey)) {
            setShowIntro(true);
            window.localStorage.setItem(introKey, "1");
          }
        }, []);
        React.useEffect(() => {
          if (!token) return undefined;
          const timer = window.setInterval(() => loadGroup(token, true), 2500);
          return () => window.clearInterval(timer);
        }, [token]);
        function scrollChatToBottom(behavior = "smooth") {
          window.requestAnimationFrame(() => {
            bottomRef.current?.scrollIntoView({ behavior, block: "end" });
            if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
          });
        }

        React.useEffect(() => {
          if (!forceScrollRef.current) return;
          forceScrollRef.current = false;
          scrollChatToBottom("smooth");
        }, [messages.length]);
        React.useEffect(() => {
          function handleMessage(event) {
            if (event.origin !== window.location.origin) return;
            if (event.data?.type === "donos:refresh-side-group") loadGroup(token, true);
          }
          window.addEventListener("message", handleMessage);
          return () => window.removeEventListener("message", handleMessage);
        }, [token]);

        async function bootstrap() {
          const { data } = await supabaseClient.auth.getSession();
          const accessToken = data.session?.access_token;
          if (!accessToken) return redirectToLogin();
          setToken(accessToken);
          await loadGroup(accessToken);
        }

        async function loadGroup(accessToken = token, silent = false) {
          try {
            const response = await fetch(`/api/social-plans/${planId}/side-group/${sideStatus}`, { headers: { Authorization: `Bearer ${accessToken}` } });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "side_group_failed");
            setProfile(data.profile || null);
            setPlan(data.plan || null);
            setMembers(data.members || []);
            setMessages((current) => mergeMessagesWithPending(data.messages || [], current));
            setMergeRequests(data.merge_requests || []);
            setMerged(Boolean(data.merged));
            setOtherCount(Number(data.other_count || 0));
            setStatus("");
            markSideNotificationsRead(accessToken);
          } catch (error) {
            if (!silent) setStatus(error.message === "side_groups_sql_missing" ? "Falta ejecutar supabase-side-groups.sql en Supabase." : "No se ha podido cargar este grupo.");
          }
        }

        async function markSideNotificationsRead(accessToken = token) {
          if (!accessToken || !planId || !sideStatus) return;
          try {
            const response = await fetch("/api/me/notifications", { headers: { Authorization: `Bearer ${accessToken}` } });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) return;
            const keys = (data.events || [])
              .filter((event) => event.section === "quedar" && String(event.kind || "").startsWith("side_") && event.plan_id === planId && event.side_status === sideStatus && !event.read)
              .map((event) => event.key)
              .filter(Boolean);
            if (keys.length === 0) return;
            await fetch("/api/me/notifications/read", {
              method: "POST",
              keepalive: true,
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` },
              body: JSON.stringify({ keys }),
            });
          } catch (_error) {}
        }

        function goBack(event) {
          event.preventDefault();
          if (isEmbedded && window.parent !== window) {
            window.parent.postMessage({ type: "donos:navigate", route: "quedar" }, window.location.origin);
            return;
          }
          window.location.href = "plans.html?tab=joined";
        }

        async function sendMessage(event) {
          event.preventDefault();
          const body = draft.trim();
          if (!body || isSaving) return;
          const tempId = `tmp-${Date.now()}`;
          const temp = { id: tempId, local_key: tempId, sender_id: profile?.id, body, created_at: new Date().toISOString(), sender: profile, pending: true, read_by: [] };
          setDraft("");
          forceScrollRef.current = true;
          setMessages((current) => [...current, temp]);
          setIsSaving(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/side-group/${sideStatus}/messages`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ body }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "side_message_failed");
            forceScrollRef.current = true;
            setMessages((current) => current.map((item) => item.id === temp.id ? { ...data.message, local_key: tempId, local_confirmed_at: new Date().toISOString() } : item));
            window.setTimeout(() => loadGroup(token, true), 450);
            window.setTimeout(() => scrollChatToBottom("smooth"), 80);
          } catch (_error) {
            setMessages((current) => current.filter((item) => item.id !== temp.id));
            setDraft(body);
            setStatus("No se ha podido enviar el mensaje.");
          } finally {
            setIsSaving(false);
          }
        }

        async function saveEditedMessage(event) {
          event.preventDefault();
          if (!editingMessage || isSaving) return;
          const body = editDraft.trim();
          if (!body) return;
          setIsSaving(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/side-group/${sideStatus}/messages/${editingMessage.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ body }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "edit_message_failed");
            setMessages((current) => current.map((item) => item.id === data.message.id ? data.message : item));
            setEditingMessage(null);
            setEditDraft("");
          } catch (_error) {
            setStatus("No se ha podido modificar el mensaje.");
          } finally {
            setIsSaving(false);
          }
        }

        async function deleteMessage() {
          if (!messageToDelete || isSaving) return;
          setIsSaving(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/side-group/${sideStatus}/messages/${messageToDelete.id}`, {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "delete_message_failed");
            setMessages((current) => current.map((item) => item.id === data.message.id ? data.message : item));
            setMessageToDelete(null);
            setSelectedMessage(null);
          } catch (_error) {
            setStatus("No se ha podido eliminar el mensaje.");
          } finally {
            setIsSaving(false);
          }
        }

        async function proposeMerge() {
          setIsSaving(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/side-group/${sideStatus}/merge-request`, { method: "POST", headers: { Authorization: `Bearer ${token}` } });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "merge_request_failed");
            setStatus("Solicitud enviada al otro grupo.");
            await loadGroup(token, true);
          } catch (_error) {
            setStatus("No se ha podido enviar la solicitud.");
          } finally {
            setIsSaving(false);
          }
        }

        async function acceptMerge(requestId) {
          setIsSaving(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/side-group/${sideStatus}/merge-request/${requestId}/accept`, { method: "POST", headers: { Authorization: `Bearer ${token}` } });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "merge_accept_failed");
            setStatus("Grupos unidos correctamente.");
            await loadGroup(token, true);
          } catch (_error) {
            setStatus("No se ha podido unir los grupos.");
          } finally {
            setIsSaving(false);
          }
        }

        const receivedRequests = mergeRequests.filter((request) => request.to_status === sideStatus);
        const sentRequests = mergeRequests.filter((request) => request.from_status === sideStatus);

        return (
          <main className="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 pb-4 pt-4 sm:px-6">
            <header className="sticky top-0 z-20 -mx-4 border-b border-white/10 bg-[#080C16]/88 px-4 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6">
              <div className="flex items-center gap-3">
                <a className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-white/[0.07] text-2xl font-black text-white ring-1 ring-white/10" href="plans.html?tab=joined" onClick={goBack}>‹</a>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-black uppercase tracking-[0.16em] text-sun">{statusText(sideStatus)}</p>
                  <h1 className="truncate text-xl font-black text-white">{titleForStatus(sideStatus, merged)}</h1>
                </div>
                <button className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-white/[0.07] text-white ring-1 ring-white/10" onClick={() => setShowMembers(true)} aria-label="Ver participantes">
                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.4">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
                    <circle cx="9.5" cy="7" r="4" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  </svg>
                </button>
              </div>
            </header>

            {status && <p className="mt-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4 text-sm font-black leading-6 text-slate-300">{status}</p>}

            <section className="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">
              {members.map((member) => (
                <article key={member.id} className="overflow-hidden rounded-[28px] border border-white/10 bg-white/[0.055]">
                  <div className="flex gap-2 overflow-x-auto bg-black/20 p-2">
                    {(member.user?.plan_photo_data_urls || []).slice(0, 2).map((photo, index) => <img key={index} className="h-28 w-24 shrink-0 rounded-[22px] object-cover" src={photo} alt="" />)}
                    {(!member.user?.plan_photo_data_urls || member.user.plan_photo_data_urls.length === 0) && <div className="grid h-28 w-full place-items-center text-xs font-bold text-slate-500">Sin fotos</div>}
                  </div>
                  <div className="p-3">
                    <div className="flex items-center gap-2">
                      <p className="truncate text-sm font-black text-white">{member.user?.display_name || "Usuario"}</p>
                      {member.user?.is_verified && <VerifiedBadge />}
                    </div>
                    <p className="mt-1 text-xs font-bold text-slate-500">{statusText(member.status)}</p>
                  </div>
                </article>
              ))}
            </section>

            {!merged && otherCount > 0 && (
              <section className="mt-4 rounded-[30px] border border-sun/20 bg-sun/10 p-4">
                <p className="text-sm font-black text-white">Unir grupos</p>
                <p className="mt-2 text-sm font-bold leading-6 text-slate-300">Hay {otherCount} persona(s) en el otro grupo alternativo. Podéis proponer uniros para organizaros juntos.</p>
                {receivedRequests.length > 0 ? (
                  <button className="mt-3 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" disabled={isSaving} onClick={() => acceptMerge(receivedRequests[0].id)}>Aceptar unión</button>
                ) : sentRequests.length > 0 ? (
                  <p className="mt-3 rounded-2xl bg-black/20 px-3 py-2 text-xs font-black text-sun">Solicitud enviada. Esperando respuesta.</p>
                ) : (
                  <button className="mt-3 h-12 w-full rounded-2xl bg-sun text-sm font-black text-ink" disabled={isSaving} onClick={proposeMerge}>Proponer unir grupos</button>
                )}
              </section>
            )}

            <section ref={listRef} className="min-h-[260px] flex-1 overflow-y-auto py-5">
              <div className="space-y-3">
                {messages.map((message) => {
                  const mine = message.sender_id === profile?.id;
                  return (
                    <div key={message.local_key || message.id} className={`flex items-end gap-2 ${mine ? "justify-end" : "justify-start"}`}>
                      {!mine && <Avatar user={message.sender} />}
                      <article
                        className={`max-w-[76%] rounded-[24px] px-3.5 py-2.5 shadow-2xl shadow-black/10 transition sm:max-w-[68%] ${mine && !message.pending && !message.deleted_at ? "cursor-pointer active:scale-[0.99]" : ""} ${mine ? "rounded-br-md bg-sun text-ink" : "rounded-bl-md border border-white/10 bg-white/[0.075] text-white"} ${message.deleted_at ? "opacity-70" : ""}`}
                        onClick={() => mine && !message.pending && !message.deleted_at ? setSelectedMessage(message) : null}
                      >
                        {!mine && <p className="mb-1 text-xs font-black text-sun">{message.sender?.display_name || "Usuario Donos"}</p>}
                        <p className={`break-words text-sm font-semibold leading-5 ${message.deleted_at ? "italic" : ""}`}>{message.body}</p>
                        <p className={`mt-1 flex items-center justify-end gap-1 text-right text-[11px] font-black ${mine ? "text-ink/55" : "text-slate-500"}`}>
                          <span>{message.pending ? "Enviando..." : `${formatTime(message.created_at)}${message.edited_at ? " · editado" : ""}`}</span>
                          {mine && !message.deleted_at && <ReadTicks message={message} />}
                        </p>
                      </article>
                      {mine && <Avatar user={profile} mine />}
                    </div>
                  );
                })}
                <div ref={bottomRef} className="h-1" />
              </div>
            </section>

            <form className="sticky bottom-0 z-20 -mx-4 border-t border-white/10 bg-[#080C16]/90 px-4 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6" onSubmit={sendMessage}>
              <div className="flex items-end gap-2 rounded-[28px] border border-white/10 bg-white/[0.055] p-2">
                <textarea className="max-h-32 min-h-12 flex-1 resize-none bg-transparent px-3 py-3 text-sm font-bold text-white outline-none placeholder:text-slate-500" value={draft} rows="1" onChange={(event) => setDraft(event.target.value)} placeholder="Escribe al grupo..." />
                <button className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-sun text-xl font-black text-ink disabled:opacity-50" disabled={isSaving || !draft.trim()} type="submit">↑</button>
              </div>
            </form>

            {selectedMessage && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setSelectedMessage(null)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <p className="text-sm font-black text-white">Opciones del mensaje</p>
                  <p className="mt-1 text-xs font-bold text-slate-500">Puedes modificarlo solo durante 15 minutos.</p>
                  <div className="mt-4 grid gap-2">
                    <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => {
                      setReadListMessage(selectedMessage);
                      setSelectedMessage(null);
                    }}>
                      Ver quién lo ha leído
                    </button>
                    {canEditMessage(selectedMessage) && (
                      <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => {
                        setEditingMessage(selectedMessage);
                        setEditDraft(selectedMessage.body || "");
                        setSelectedMessage(null);
                      }}>
                        Modificar
                      </button>
                    )}
                    <button className="h-12 rounded-2xl bg-coral/10 text-sm font-black text-coral ring-1 ring-coral/20" onClick={() => {
                      setMessageToDelete(selectedMessage);
                      setSelectedMessage(null);
                    }}>
                      Eliminar
                    </button>
                    <button className="h-12 rounded-2xl bg-white/[0.04] text-sm font-black text-slate-300 ring-1 ring-white/10" onClick={() => setSelectedMessage(null)}>Cancelar</button>
                  </div>
                </section>
              </div>
            )}

            {readListMessage && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setReadListMessage(null)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-sun">Lecturas</p>
                      <h2 className="mt-1 text-2xl font-black text-white">Visto por</h2>
                    </div>
                    <button className="grid h-10 w-10 place-items-center rounded-2xl bg-white/[0.07] text-xl font-black text-white ring-1 ring-white/10" onClick={() => setReadListMessage(null)}>×</button>
                  </div>
                  <div className="mt-4 max-h-[55vh] space-y-2 overflow-y-auto pr-1">
                    {(readListMessage.read_by || []).filter((read) => read.reader?.id !== readListMessage.sender_id).map((read) => (
                      <div key={`${read.reader?.id}-${read.read_at}`} className="flex items-center gap-3 rounded-3xl bg-white/[0.055] p-3 ring-1 ring-white/10">
                        <Avatar user={read.reader} />
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2">
                            <p className="truncate text-sm font-black text-white">{read.reader?.display_name || "Usuario Donos"}</p>
                            {read.reader?.is_verified && <VerifiedBadge />}
                          </div>
                          <p className="truncate text-xs font-bold text-slate-500">{read.reader?.email || read.reader?.transaction_id || "Cuenta Donos"}</p>
                        </div>
                        <p className="shrink-0 text-xs font-black text-sun">{formatTime(read.read_at)}</p>
                      </div>
                    ))}
                    {messageReadCount(readListMessage) === 0 && (
                      <div className="rounded-3xl border border-white/10 bg-white/[0.045] p-5 text-center">
                        <p className="text-sm font-black text-white">Todavía nadie lo ha leído</p>
                        <p className="mt-1 text-xs font-bold leading-5 text-slate-500">Cuando alguien abra este grupo, aparecerá aquí.</p>
                      </div>
                    )}
                  </div>
                </section>
              </div>
            )}

            {editingMessage && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/55 px-4 backdrop-blur-sm">
                <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl" onSubmit={saveEditedMessage}>
                  <p className="text-sm font-black uppercase tracking-[0.14em] text-sun">Modificar mensaje</p>
                  <textarea className="mt-4 min-h-32 w-full rounded-3xl border border-line bg-black/20 px-4 py-3 text-sm font-bold text-white outline-none focus:border-sun/60" value={editDraft} onChange={(event) => setEditDraft(event.target.value)} />
                  <div className="mt-4 grid grid-cols-2 gap-3">
                    <button type="button" className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => setEditingMessage(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-sun text-sm font-black text-ink" disabled={isSaving || !editDraft.trim()} type="submit">Guardar</button>
                  </div>
                </form>
              </div>
            )}

            {messageToDelete && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/55 px-4 backdrop-blur-sm">
                <section className="w-full max-w-md rounded-[34px] border border-coral/20 bg-[#0D111D] p-5 text-center shadow-2xl">
                  <div className="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-coral/10 text-2xl font-black text-coral ring-1 ring-coral/25">!</div>
                  <h2 className="mt-4 text-2xl font-black text-white">¿Eliminar mensaje?</h2>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-400">Se mostrará como “Mensaje eliminado” para que el chat siga claro.</p>
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => setMessageToDelete(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-coral text-sm font-black text-white" disabled={isSaving} onClick={deleteMessage}>Eliminar</button>
                  </div>
                </section>
              </div>
            )}

            {showMembers && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setShowMembers(false)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-sun">Participantes</p>
                      <h2 className="mt-1 text-2xl font-black text-white">{members.length} personas</h2>
                    </div>
                    <button className="grid h-10 w-10 place-items-center rounded-2xl bg-white/[0.07] text-xl font-black text-white ring-1 ring-white/10" onClick={() => setShowMembers(false)}>×</button>
                  </div>
                  <div className="mt-4 max-h-[58vh] space-y-2 overflow-y-auto pr-1">
                    {members.map((member) => (
                      <div key={member.id} className="flex items-center gap-3 rounded-3xl bg-white/[0.055] p-3 ring-1 ring-white/10">
                        <Avatar user={member.user} />
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2">
                            <p className="truncate text-sm font-black text-white">{member.user?.display_name || "Usuario Donos"}</p>
                            {member.user?.is_verified && <VerifiedBadge />}
                          </div>
                          <p className="truncate text-xs font-bold text-slate-500">{statusText(member.status)}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {showIntro && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/60 px-4 backdrop-blur-sm">
                <section className="w-full max-w-md rounded-[34px] border border-sun/20 bg-[#0D111D] p-5 text-center shadow-2xl">
                  <div className="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-sun text-2xl font-black text-ink">i</div>
                  <h2 className="mt-4 text-2xl font-black text-white">{merged ? "Grupo unido" : titleForStatus(sideStatus, merged)}</h2>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-400">
                    {merged ? "Podéis veros, hablar y organizaros juntos sin entrar en el grupo principal." : "Aquí ves la gente de tu mismo estado. Puedes chatear y, si hay otro grupo disponible, proponer unirlos."}
                  </p>
                  <button className="mt-5 h-12 w-full rounded-2xl bg-sun text-sm font-black text-ink" onClick={() => setShowIntro(false)}>Entendido</button>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
