<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Donoss | App</title>
    <link rel="stylesheet" href="app-shell.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="activity-tracker.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        overflow: hidden;
        background: #060914;
      }

      body {
        margin: 0;
        padding: 0;
        color: white;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(167, 139, 250, 0.13), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 52%, #050711 100%);
      }

      .spa-root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      .spa-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #060914;
        opacity: 0;
        visibility: hidden;
        transform: translateX(18px) scale(0.992);
        transition:
          opacity 220ms ease,
          transform 260ms cubic-bezier(.2,.8,.2,1),
          visibility 220ms ease;
      }

      .spa-frame.is-active {
        opacity: 1;
        visibility: visible;
        transform: translateX(0) scale(1);
      }

      .spa-frame.is-left {
        transform: translateX(-18px) scale(0.992);
      }

      .spa-boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: grid;
        place-items: center;
        padding: 24px;
        pointer-events: none;
        background:
          radial-gradient(circle at 24% 20%, rgba(66, 242, 179, 0.20), transparent 28%),
          radial-gradient(circle at 80% 8%, rgba(167, 139, 250, 0.14), transparent 26%),
          linear-gradient(180deg, #0a0e19 0%, #060914 100%);
        opacity: 1;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .spa-boot.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .spa-boot-card {
        width: min(100%, 360px);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 34px;
        background: rgba(13, 17, 29, 0.72);
        padding: 24px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.36);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }

      .spa-logo {
        display: grid;
        width: 60px;
        height: 60px;
        place-items: center;
        border-radius: 22px;
        background: #42f2b3;
        color: #060914;
        font-size: 30px;
        font-weight: 900;
        box-shadow: 0 18px 48px rgba(66, 242, 179, 0.24);
      }

      .spa-boot-title {
        margin: 18px 0 0;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .spa-boot-text {
        margin: 8px 0 0;
        color: #94a3b8;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }

      .spa-progress {
        height: 12px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .spa-progress::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, rgba(66, 242, 179, 0.68), transparent);
        animation: spa-sweep 1050ms cubic-bezier(.2,.8,.2,1) infinite;
      }

      @keyframes spa-sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }

      body.is-chat-route #donos-static-nav {
        opacity: 0;
        transform: translateY(120%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="spa-root" aria-live="polite">
      <iframe class="spa-frame is-active" data-route="inicio" data-index="0" title="Inicio Donoss" src="home.html?embedded=1"></iframe>
      <iframe class="spa-frame" data-route="historial" data-index="1" title="Historial Donoss" src="historial.html?embedded=1"></iframe>
      <iframe class="spa-frame" data-route="quedar" data-index="2" title="Quedar Donoss" src="plans.html?embedded=1"></iframe>
      <iframe class="spa-frame" data-route="transfer" data-index="3" title="Transferencias Donoss" src="transfer.html?embedded=1"></iframe>
      <iframe class="spa-frame" data-route="perfil" data-index="4" title="Perfil Donoss" src="profile.html?embedded=1"></iframe>
    </main>

    <div id="spa-boot" class="spa-boot" aria-hidden="true">
      <section class="spa-boot-card">
        <div class="spa-logo">D</div>
        <h1 class="spa-boot-title">Donoss</h1>
        <p class="spa-boot-text">Preparando tu app para que las secciones cambien sin recargar.</p>
        <div class="spa-progress"></div>
      </section>
    </div>

    <nav id="donos-static-nav" class="donos-static-nav" data-active-index="0" aria-label="Navegación principal">
      <div class="donos-static-nav__grid">
        <a class="donos-static-nav__item" href="#inicio" data-route="inicio" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z"/></svg><span>Inicio</span></a>
        <a class="donos-static-nav__item" href="#historial" data-route="historial" aria-label="Historial"><span class="donos-static-nav__badge" data-nav-badge="historial"></span><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2"/></svg><span>Historial</span></a>
        <a class="donos-static-nav__item" href="#quedar" data-route="quedar" aria-label="Quedar"><span class="donos-static-nav__badge" data-nav-badge="quedar"></span><svg viewBox="0 0 24 24"><path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7"/></svg><span>Quedar</span></a>
        <a class="donos-static-nav__item" href="#transfer" data-route="transfer" aria-label="Transferencias"><svg viewBox="0 0 24 24"><path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4"/></svg><span>Transf.</span></a>
        <a class="donos-static-nav__item" href="#perfil" data-route="perfil" aria-label="Perfil"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><span>Perfil</span></a>
      </div>
    </nav>

    <script>
      (function () {
        const routeNames = ["inicio", "historial", "quedar", "transfer", "perfil"];
        const bottomRoutes = ["inicio", "historial", "quedar", "transfer", "perfil"];
        const nav = document.getElementById("donos-static-nav");
        const root = document.querySelector(".spa-root");
        const grid = nav.querySelector(".donos-static-nav__grid");
        const links = Array.from(nav.querySelectorAll("[data-route]"));
        const baseFrames = Array.from(document.querySelectorAll(".spa-frame"));
        const categoryFrames = new Map();
        const offerFrames = new Map();
        const chatFrames = new Map();
        const sideGroupFrames = new Map();
        const pendingChatPrefetches = new Set();
        const pendingSidePrefetches = new Set();
        const boot = document.getElementById("spa-boot");
        let activeIndex = 0;
        let activeRoute = "inicio";
        let activeCategoryKey = "";

        async function hydrateNotificationBadges() {
          const badges = Array.from(nav.querySelectorAll("[data-nav-badge]"));
          if (badges.length === 0 || !window.supabase?.createClient) return;
          const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
          const supabaseAnonKey =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
            const { data: auth } = await client.auth.getSession();
            const token = auth?.session?.access_token;
            if (!token) return;
            const response = await fetch("/api/me/notifications", { headers: { Authorization: `Bearer ${token}` } });
            if (!response.ok) return;
            const data = await response.json();
            badges.forEach((badge) => {
              const section = badge.dataset.navBadge;
              const count = Number(data?.counts?.sections?.[section] || 0);
              if (count > 0) {
                badge.textContent = `+${count > 9 ? "9" : count}`;
                badge.classList.add("is-visible");
              } else {
                badge.classList.remove("is-visible");
              }
            });
          } catch (_error) {
            badges.forEach((badge) => badge.classList.remove("is-visible"));
          }
        }

        function routeFromHash() {
          const clean = window.location.hash.replace("#", "");
          if (clean.startsWith("categoria=")) return "categoria";
          if (clean.startsWith("detalle=")) return "detalle";
          if (clean.startsWith("chat=")) return "chat";
          if (clean.startsWith("side=")) return "side";
          return routeNames.includes(clean) ? clean : "inicio";
        }

        function setRoute(route, options = {}) {
          const isExternalInicioRoute = route === "categoria" || route === "detalle";
          const navRoute = route === "chat" || route === "side" ? "quedar" : isExternalInicioRoute ? "inicio" : route;
          const nextIndex = Math.max(bottomRoutes.indexOf(navRoute), 0);
          const direction = nextIndex < activeIndex ? "left" : "right";
          activeIndex = nextIndex;
          activeRoute = route;
          document.body.classList.toggle("is-chat-route", route === "chat" || route === "side");

          nav.dataset.activeIndex = String(nextIndex);
          grid.style.setProperty("--nav-index", String(nextIndex));

          links.forEach((link, index) => {
            const isActive = index === nextIndex;
            link.classList.toggle("is-active", isActive);
            if (isActive) link.setAttribute("aria-current", "page");
            else link.removeAttribute("aria-current");
          });
          window.setTimeout(hydrateNotificationBadges, 500);
          if (route === "historial") {
            const historyFrame = baseFrames.find((frame) => frame.dataset.route === "historial");
            window.setTimeout(() => {
              historyFrame?.contentWindow?.postMessage({ type: "donos:refresh-historial" }, window.location.origin);
            }, 80);
          }

          allFrames().forEach((frame) => {
            const isActive =
              route === "categoria"
                ? frame.dataset.route === "categoria" && frame.dataset.categoryKey === activeCategoryKey
                : route === "detalle"
                  ? frame.dataset.route === "detalle" && frame.dataset.offerId === activeOfferId
                : route === "chat"
                  ? frame.dataset.route === "chat" && frame.dataset.planId === activePlanChatId
                : route === "side"
                  ? frame.dataset.route === "side" && frame.dataset.sideKey === activeSideGroupKey
                : frame.dataset.route === route;
            frame.classList.toggle("is-active", isActive);
            frame.classList.toggle("is-left", !isActive && direction === "left");
          });

          if (!options.skipHash && window.location.hash !== `#${route}`) {
            history.pushState({ route }, "", `#${route}`);
          }
        }

        function allFrames() {
          return [...baseFrames, ...categoryFrames.values(), ...offerFrames.values(), ...chatFrames.values(), ...sideGroupFrames.values()];
        }

        function categoryKey(category) {
          return String(category || "Libros").trim().toLowerCase();
        }

        function watchFrame(frame) {
          frame.addEventListener("load", () => {
            try {
              const childUrl = new URL(frame.contentWindow.location.href);
              if (childUrl.pathname.endsWith("/login.html") || childUrl.pathname.endsWith("login.html")) {
                window.location.href = childUrl.pathname + childUrl.search.replace(/[?&]embedded=1\b/, "");
                return;
              }
            } catch (_error) {}
            if (frame.dataset.shouldActivate === "1") {
              const messageType = frame.dataset.route === "side" ? "donos:activate-side-group" : frame.dataset.route === "chat" ? "donos:activate-chat" : "";
              if (messageType) frame.contentWindow?.postMessage({ type: messageType }, window.location.origin);
            }
            hideBootWhenReady();
          }, { once: false });
        }

        function openCategory(category, options = {}) {
          const cleanCategory = category || "Libros";
          const key = categoryKey(cleanCategory);
          activeCategoryKey = key;
          if (!categoryFrames.has(key)) {
            const frame = document.createElement("iframe");
            frame.className = "spa-frame";
            frame.dataset.route = "categoria";
            frame.dataset.categoryKey = key;
            frame.dataset.index = "0";
            frame.title = `${cleanCategory} Donoss`;
            frame.src = `category.html?embedded=1&category=${encodeURIComponent(cleanCategory)}`;
            watchFrame(frame);
            root.appendChild(frame);
            categoryFrames.set(key, frame);
          } else {
            categoryFrames.get(key).contentWindow?.postMessage({ type: "donos:refresh-category" }, window.location.origin);
          }
          setRoute("categoria", { skipHash: true });
          if (!options.skipHash) {
            history.pushState({ route: "categoria", category: cleanCategory }, "", `#categoria=${encodeURIComponent(cleanCategory)}`);
          }
        }

        let activeOfferId = "";
        function openOfferDetail(offerId, options = {}) {
          const cleanId = String(offerId || "").trim();
          if (!cleanId) return;
          activeOfferId = cleanId;
          if (!offerFrames.has(cleanId)) {
            const frame = document.createElement("iframe");
            frame.className = "spa-frame";
            frame.dataset.route = "detalle";
            frame.dataset.offerId = cleanId;
            frame.dataset.index = "0";
            frame.title = "Detalle Donoss";
            frame.src = `offer-detail.html?embedded=1&id=${encodeURIComponent(cleanId)}`;
            watchFrame(frame);
            root.appendChild(frame);
            offerFrames.set(cleanId, frame);
          }
          setRoute("detalle", { skipHash: true });
          if (!options.skipHash) {
            history.pushState({ route: "detalle", offerId: cleanId }, "", `#detalle=${encodeURIComponent(cleanId)}`);
          }
        }

        let activePlanChatId = "";
        function ensurePlanChatFrame(planId, options = {}) {
          const cleanId = String(planId || "").trim();
          if (!cleanId) return null;
          if (!chatFrames.has(cleanId)) {
            const frame = document.createElement("iframe");
            frame.className = "spa-frame";
            frame.dataset.route = "chat";
            frame.dataset.planId = cleanId;
            frame.dataset.index = "2";
            frame.dataset.prefetched = options.prefetch ? "1" : "0";
            frame.title = "Chat Quedar";
            frame.src = `plan-chat.html?embedded=1&id=${encodeURIComponent(cleanId)}${options.prefetch ? "&prefetch=1" : ""}`;
            watchFrame(frame);
            root.appendChild(frame);
            chatFrames.set(cleanId, frame);
          }
          return chatFrames.get(cleanId);
        }

        function prefetchPlanChat(planId) {
          const cleanId = String(planId || "").trim();
          if (!cleanId || chatFrames.has(cleanId) || pendingChatPrefetches.has(cleanId) || pendingChatPrefetches.size > 5 || chatFrames.size > 8) return;
          pendingChatPrefetches.add(cleanId);
          const run = () => {
            ensurePlanChatFrame(cleanId, { prefetch: true });
            pendingChatPrefetches.delete(cleanId);
          };
          (window.requestIdleCallback || ((callback) => window.setTimeout(callback, 450)))(run);
        }

        function openPlanChat(planId, options = {}) {
          const cleanId = String(planId || "").trim();
          if (!cleanId) return;
          activePlanChatId = cleanId;
          const frame = ensurePlanChatFrame(cleanId);
          if (frame) {
            frame.dataset.prefetched = "0";
            frame.dataset.shouldActivate = "1";
            frame.contentWindow?.postMessage({ type: "donos:activate-chat" }, window.location.origin);
          }
          setRoute("chat", { skipHash: true });
          if (!options.skipHash) {
            history.pushState({ route: "chat", planId: cleanId }, "", `#chat=${encodeURIComponent(cleanId)}`);
          }
        }

        let activeSideGroupKey = "";
        function ensureSideGroupFrame(planId, status, options = {}) {
          const cleanId = String(planId || "").trim();
          const cleanStatus = ["waiting", "removed"].includes(status) ? status : "";
          if (!cleanId || !cleanStatus) return null;
          const key = `${cleanId}:${cleanStatus}`;
          if (!sideGroupFrames.has(key)) {
            const frame = document.createElement("iframe");
            frame.className = "spa-frame";
            frame.dataset.route = "side";
            frame.dataset.sideKey = key;
            frame.dataset.index = "2";
            frame.dataset.prefetched = options.prefetch ? "1" : "0";
            frame.title = "Grupo alternativo";
            frame.src = `side-group.html?embedded=1&id=${encodeURIComponent(cleanId)}&status=${encodeURIComponent(cleanStatus)}${options.prefetch ? "&prefetch=1" : ""}`;
            watchFrame(frame);
            root.appendChild(frame);
            sideGroupFrames.set(key, frame);
          }
          return sideGroupFrames.get(key);
        }

        function prefetchSideGroup(planId, status) {
          const cleanId = String(planId || "").trim();
          const cleanStatus = ["waiting", "removed"].includes(status) ? status : "";
          const key = `${cleanId}:${cleanStatus}`;
          if (!cleanId || !cleanStatus || sideGroupFrames.has(key) || pendingSidePrefetches.has(key) || pendingSidePrefetches.size > 5 || sideGroupFrames.size > 8) return;
          pendingSidePrefetches.add(key);
          const run = () => {
            ensureSideGroupFrame(cleanId, cleanStatus, { prefetch: true });
            pendingSidePrefetches.delete(key);
          };
          (window.requestIdleCallback || ((callback) => window.setTimeout(callback, 600)))(run);
        }

        function openSideGroup(planId, status, options = {}) {
          const cleanId = String(planId || "").trim();
          const cleanStatus = ["waiting", "removed"].includes(status) ? status : "";
          if (!cleanId || !cleanStatus) return;
          const key = `${cleanId}:${cleanStatus}`;
          activeSideGroupKey = key;
          const frame = ensureSideGroupFrame(cleanId, cleanStatus);
          if (frame) {
            frame.dataset.prefetched = "0";
            frame.dataset.shouldActivate = "1";
            frame.contentWindow?.postMessage({ type: "donos:activate-side-group" }, window.location.origin);
          }
          setRoute("side", { skipHash: true });
          if (!options.skipHash) {
            history.pushState({ route: "side", planId: cleanId, status: cleanStatus }, "", `#side=${encodeURIComponent(cleanId)}:${cleanStatus}`);
          }
        }

        links.forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            setRoute(link.dataset.route);
          });
        });

        window.addEventListener("popstate", () => {
          const clean = window.location.hash.replace("#", "");
          if (clean.startsWith("categoria=")) {
            openCategory(decodeURIComponent(clean.slice("categoria=".length)), { skipHash: true });
          } else if (clean.startsWith("detalle=")) {
            openOfferDetail(decodeURIComponent(clean.slice("detalle=".length)), { skipHash: true });
          } else if (clean.startsWith("chat=")) {
            openPlanChat(decodeURIComponent(clean.slice("chat=".length)), { skipHash: true });
          } else if (clean.startsWith("side=")) {
            const raw = decodeURIComponent(clean.slice("side=".length));
            const [planId, status] = raw.split(":");
            openSideGroup(planId, status, { skipHash: true });
          } else {
            setRoute(routeFromHash(), { skipHash: true });
          }
        });
        window.addEventListener("message", (event) => {
          if (event.origin !== window.location.origin) return;
          if (event.data?.type === "donos:category") {
            openCategory(event.data.category);
            return;
          }
          if (event.data?.type === "donos:offer-detail") {
            openOfferDetail(event.data.id);
            return;
          }
          if (event.data?.type === "donos:likes-changed") {
            const historyFrame = baseFrames.find((frame) => frame.dataset.route === "historial");
            historyFrame?.contentWindow?.postMessage({ type: "donos:refresh-historial" }, window.location.origin);
            return;
          }
          if (event.data?.type === "donos:plan-chat") {
            openPlanChat(event.data.id);
            return;
          }
          if (event.data?.type === "donos:prefetch-plan-chat") {
            prefetchPlanChat(event.data.id);
            return;
          }
          if (event.data?.type === "donos:side-group") {
            openSideGroup(event.data.id, event.data.status);
            return;
          }
          if (event.data?.type === "donos:prefetch-side-group") {
            prefetchSideGroup(event.data.id, event.data.status);
            return;
          }
          if (event.data?.type === "donos:detail-back") {
            history.back();
            return;
          }
          if (event.data?.type === "donos:navigate") {
            if (!routeNames.includes(event.data.route)) return;
            setRoute(event.data.route);
          }
        });

        let loaded = 0;
        function hideBootWhenReady() {
          loaded += 1;
          if (loaded >= 1) window.setTimeout(() => boot.classList.add("is-hidden"), 260);
        }

        baseFrames.forEach(watchFrame);

        window.setTimeout(() => boot.classList.add("is-hidden"), 1600);
        window.requestAnimationFrame(() => {
          nav.classList.add("is-ready");
          window.setTimeout(hydrateNotificationBadges, 900);
          const hash = window.location.hash.replace("#", "");
          if (hash.startsWith("categoria=")) {
            openCategory(decodeURIComponent(hash.slice("categoria=".length)), { skipHash: true });
          } else if (hash.startsWith("detalle=")) {
            openOfferDetail(decodeURIComponent(hash.slice("detalle=".length)), { skipHash: true });
          } else if (hash.startsWith("chat=")) {
            openPlanChat(decodeURIComponent(hash.slice("chat=".length)), { skipHash: true });
          } else if (hash.startsWith("side=")) {
            const raw = decodeURIComponent(hash.slice("side=".length));
            const [planId, status] = raw.split(":");
            openSideGroup(planId, status, { skipHash: true });
          } else {
            setRoute(routeFromHash(), { skipHash: true });
          }
        });
      })();
    </script>
  </body>
</html>
