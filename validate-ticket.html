<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Validar QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166", violet: "#A78BFA" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 84% 10%, rgba(255, 209, 102, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
      #qr-reader video { border-radius: 28px; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      function cleanValidation(value) {
        return String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(0, 7);
      }

      function cleanSecurity(value) {
        return String(value || "").replace(/[^0-9]/g, "").slice(0, 4);
      }

      function extractTicketToken(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        try {
          const url = new URL(raw);
          return url.searchParams.get("ticket") || raw;
        } catch {
          return raw;
        }
      }

      function formatDateTime(value) {
        if (!value) return "No indicado";
        return new Date(value).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" });
      }

      function statusCopy(status) {
        if (status === "valid") return { title: "Billete válido", tone: "mint", text: "La compra está confirmada y se ha registrado la validación." };
        if (status === "already_verified") return { title: "Billete ya validado", tone: "coral", text: "Este código ya fue escaneado o comprobado antes." };
        if (status === "expired") return { title: "Billete caducado", tone: "coral", text: "La fecha de validez del QR ya ha pasado." };
        if (status === "not_started") return { title: "Todavía no válido", tone: "sun", text: "La compra existe, pero la validez del QR empieza más tarde." };
        return { title: "Resultado", tone: "white", text: "Validación recibida." };
      }

      function Detail({ label, value }) {
        return (
          <div className="rounded-2xl border border-white/10 bg-white/[0.045] p-4">
            <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">{label}</p>
            <p className="mt-1 break-words text-sm font-black text-white">{value || "No indicado"}</p>
          </div>
        );
      }

      function Result({ result }) {
        if (!result) return null;
        const copy = statusCopy(result.status);
        const purchase = result.purchase || {};
        const offer = purchase.offer || {};
        const buyer = result.buyer || {};
        const toneClass = copy.tone === "mint" ? "border-mint/25 bg-mint/10 text-mint" : copy.tone === "sun" ? "border-sun/25 bg-sun/10 text-sun" : "border-coral/25 bg-coral/10 text-coral";

        return (
          <section className="mt-5 overflow-hidden rounded-[34px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/30">
            <div className={`border-b p-5 ${toneClass}`}>
              <p className="text-xs font-black uppercase tracking-[0.18em] opacity-80">Validación</p>
              <h2 className="mt-2 text-3xl font-black text-white">{copy.title}</h2>
              <p className="mt-2 text-sm font-bold leading-6">{copy.text}</p>
            </div>

            <div className="space-y-5 p-5">
              <div>
                <p className="text-xs font-bold uppercase tracking-[0.16em] text-mint">Compra</p>
                <h3 className="mt-2 break-words text-2xl font-black text-white">{offer.title || "Pedido Donos"}</h3>
                <p className="mt-1 text-sm font-bold text-slate-400">{offer.business_display_name || result.business?.display_name || "Comercio Donos"}</p>
              </div>

              <div className="grid gap-3 min-[430px]:grid-cols-3">
                <Detail label="Total" value={`${purchase.total_points || 0} pts`} />
                <Detail label="Método" value={purchase.delivery_method === "home" ? "Entrega a domicilio" : "Recogida en tienda"} />
                <Detail label="Pedido" value={`#${String(purchase.id || "").slice(0, 8).toUpperCase()}`} />
              </div>

              <div className="grid gap-3 sm:grid-cols-2">
                <Detail label="Comprador" value={buyer.display_name} />
                <Detail label="Email" value={buyer.email} />
                <Detail label="Teléfono" value={buyer.phone} />
                <Detail label="ID Donos cliente" value={buyer.transaction_id} />
                <Detail label="Fecha de compra" value={formatDateTime(purchase.created_at)} />
                <Detail label="Fecha de validación" value={formatDateTime(purchase.verified_at)} />
                <Detail label="Veces comprobado" value={`${purchase.verification_count || 0}`} />
                <Detail label="Validez QR" value={`${purchase.qr_valid_from || "Hoy"}${purchase.qr_valid_until ? ` → ${purchase.qr_valid_until}` : ""}`} />
                <Detail label="Dirección entrega" value={purchase.delivery_address || "Recogida en tienda"} />
                <Detail label="Dirección oferta" value={offer.address} />
              </div>
            </div>
          </section>
        );
      }

      function App() {
        const [validationCode, setValidationCode] = React.useState("");
        const [securityCode, setSecurityCode] = React.useState("");
        const [status, setStatus] = React.useState("");
        const [result, setResult] = React.useState(null);
        const [scanner, setScanner] = React.useState(null);
        const [isScanning, setIsScanning] = React.useState(false);
        const [isVerifying, setIsVerifying] = React.useState(false);

        React.useEffect(() => {
          const token = new URLSearchParams(window.location.search).get("ticket");
          if (token) verifyTicket({ qrToken: token });
          return () => stopScanner();
        }, []);

        async function getTokenOrRedirect() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
            return "";
          }
          return token;
        }

        async function verifyTicket(payload) {
          setStatus("");
          setResult(null);
          setIsVerifying(true);

          const token = await getTokenOrRedirect();
          if (!token) return;

          try {
            const response = await fetch("/api/business/tickets/verify", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "verify_failed");
            setResult(data);
          } catch (error) {
            const message = error.message || "";
            setStatus(
              message === "business_account_required"
                ? "Debes iniciar sesión con una cuenta empresa para validar billetes."
                : message === "ticket_not_found"
                  ? "No encontramos ningún billete con estos datos."
                  : message === "ticket_not_owned_by_business"
                    ? "Este billete pertenece a otro comercio."
                    : message === "missing_ticket_codes"
                      ? "Introduce el código de validación y el código de seguridad."
                      : "No se ha podido validar el billete."
            );
          } finally {
            setIsVerifying(false);
          }
        }

        async function startScanner() {
          setStatus("");
          if (!window.Html5Qrcode) {
            setStatus("El lector QR no se ha cargado. Usa la validación manual.");
            return;
          }

          try {
            const reader = new window.Html5Qrcode("qr-reader");
            setScanner(reader);
            setIsScanning(true);
            await reader.start(
              { facingMode: "environment" },
              { fps: 10, qrbox: { width: 240, height: 240 } },
              async (decodedText) => {
                await stopScanner(reader);
                verifyTicket({ qrToken: extractTicketToken(decodedText) });
              },
              () => {}
            );
          } catch (error) {
            setIsScanning(false);
            setStatus("No se ha podido abrir la cámara. Puedes introducir los códigos manualmente.");
          }
        }

        async function stopScanner(instance = scanner) {
          if (!instance) return;
          try {
            await instance.stop();
            instance.clear();
          } catch {}
          setScanner(null);
          setIsScanning(false);
        }

        function submitManual(event) {
          event.preventDefault();
          verifyTicket({
            validationCode: cleanValidation(validationCode),
            securityCode: cleanSecurity(securityCode),
          });
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-4xl px-3 pb-10 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html?type=business" className="flex min-w-0 items-center gap-3">
                <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow">D</div>
                <div className="min-w-0">
                  <p className="text-lg font-black leading-tight">Donos</p>
                  <p className="text-xs font-semibold text-slate-400">Control empresa</p>
                </div>
              </a>
              <span className="rounded-full bg-sun px-3 py-1.5 text-xs font-black text-ink">Empresa</span>
            </header>

            <section className="mt-6 rounded-[36px] border border-white/10 bg-white/[0.055] p-4 shadow-glow sm:p-7">
              <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Validar acceso</p>
              <h1 className="mt-2 break-words text-3xl font-black leading-tight text-white sm:text-4xl">Escanea o introduce el código</h1>
              <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">
                Verifica que el billete pertenece a tu comercio, sigue válido y no se ha usado antes.
              </p>

              <div className="mt-5 grid gap-4 lg:grid-cols-[1fr_0.95fr]">
                <section className="rounded-[30px] border border-white/10 bg-black/20 p-4">
                  <div id="qr-reader" className="min-h-[280px] overflow-hidden rounded-[28px] border border-white/10 bg-[#060914]"></div>
                  <div className="mt-4 grid gap-2 min-[430px]:grid-cols-2">
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" onClick={startScanner} disabled={isScanning || isVerifying}>
                      {isScanning ? "Escaneando..." : "Escanear QR"}
                    </button>
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white disabled:opacity-60" onClick={() => stopScanner()} disabled={!isScanning}>
                      Parar cámara
                    </button>
                  </div>
                </section>

                <form className="rounded-[30px] border border-white/10 bg-black/20 p-4" onSubmit={submitManual}>
                  <p className="text-sm font-black text-white">Validación manual</p>
                  <label className="mt-4 block">
                    <span className="mb-2 block text-sm font-bold text-slate-300">Código de validación</span>
                    <input
                      className="h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 font-mono text-base font-black uppercase text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                      value={validationCode}
                      onChange={(event) => setValidationCode(cleanValidation(event.target.value))}
                      placeholder="A7K92ZX"
                    />
                  </label>
                  <label className="mt-4 block">
                    <span className="mb-2 block text-sm font-bold text-slate-300">Código de seguridad</span>
                    <input
                      className="h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 font-mono text-base font-black text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                      value={securityCode}
                      onChange={(event) => setSecurityCode(cleanSecurity(event.target.value))}
                      inputMode="numeric"
                      placeholder="4821"
                    />
                  </label>
                  <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={isVerifying}>
                    {isVerifying ? "Validando..." : "Validar billete"}
                  </button>
                </form>
              </div>
            </section>

            {status && <p className="mt-5 rounded-2xl border border-coral/25 bg-coral/10 p-4 text-sm font-bold text-coral">{status}</p>}
            <Result result={result} />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
