<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="activity-tracker.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 86% 8%, rgba(255, 107, 107, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 44%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }

      @keyframes success-pop {
        0% { transform: scale(0.82); opacity: 0; }
        55% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes success-ring {
        0% { transform: scale(0.72); opacity: 0.9; }
        100% { transform: scale(1.55); opacity: 0; }
      }

      .success-pop { animation: success-pop 520ms cubic-bezier(.2,.9,.2,1) both; }
      .success-ring { animation: success-ring 1500ms ease-out infinite; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "Sin ID";
      }

      function cleanDonosId(value) {
        return String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
      }

      function formatEuro(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "0,00 €";
        return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(amount);
      }

      const defaultReservationWeekdays = [1, 2, 3, 4, 5, 6, 0];
      const reservationWeekdayLabels = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

      function localDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseLocalDate(dateString) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateString || ""))) return null;
        const [year, month, day] = dateString.split("-").map(Number);
        return new Date(year, month - 1, day, 12, 0, 0);
      }

      function normalizeReservationWeekdays(value) {
        const source = Array.isArray(value) ? value : defaultReservationWeekdays;
        const normalized = [...new Set(source.map((day) => Number(day)).filter((day) => Number.isInteger(day) && day >= 0 && day <= 6))];
        return normalized.length ? normalized : [...defaultReservationWeekdays];
      }

      function isReservationDateAllowed(dateString, weekdays) {
        const date = parseLocalDate(dateString);
        return Boolean(date && weekdays.includes(date.getDay()));
      }

      function buildReservableDates(daysAhead, weekdays) {
        const dates = [];
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        for (let index = 0; index <= daysAhead; index += 1) {
          const date = new Date(today);
          date.setDate(today.getDate() + index);
          if (weekdays.includes(date.getDay())) {
            dates.push({
              value: localDateString(date),
              weekday: reservationWeekdayLabels[date.getDay()],
              day: date.getDate(),
              month: date.toLocaleDateString("es-ES", { month: "short" }).replace(".", ""),
            });
          }
        }
        return dates;
      }

      function App() {
        const params = new URLSearchParams(window.location.search);
        const offerId = params.get("id");
        const rawDelivery = params.get("delivery") || "pickup";
        const delivery = rawDelivery === "home" ? "home" : rawDelivery === "none" ? "none" : "pickup";
        const fromApp = params.get("from") === "app";
        const backHref = fromApp ? "app.html#quedar" : "";
        const homeHref = fromApp ? "app.html#inicio" : "home.html";
        const [offer, setOffer] = React.useState(null);
        const [profile, setProfile] = React.useState(null);
        const [userId, setUserId] = React.useState("");
        const [deliveryAddress, setDeliveryAddress] = React.useState("");
        const [addressStatus, setAddressStatus] = React.useState({ type: "", message: "" });
        const [status, setStatus] = React.useState("Preparando pago...");
        const [purchaseStatus, setPurchaseStatus] = React.useState({ type: "", message: "" });
        const [isBuying, setIsBuying] = React.useState(false);
        const [isSavingAddress, setIsSavingAddress] = React.useState(false);
        const [accessToken, setAccessToken] = React.useState("");
        const [successPurchase, setSuccessPurchase] = React.useState(null);
        const [wantsReservation, setWantsReservation] = React.useState(false);
        const [reservationDate, setReservationDate] = React.useState("");
        const [reservationTime, setReservationTime] = React.useState("");
        const [reservationPeople, setReservationPeople] = React.useState("1");

        function goBackFromCheckout() {
          if (fromApp) {
            window.location.replace(backHref);
            return;
          }
          history.back();
        }

        function goToAppRoute(route = "inicio") {
          if (fromApp) {
            window.location.replace(`app.html#${route}`);
            return;
          }
          window.location.href = route === "historial" ? "historial.html" : "home.html";
        }

        function goToRecharge() {
          if (fromApp) {
            window.location.replace("app.html#transfer");
            return;
          }
          window.location.href = "transfer.html";
        }

        function safeExternalUrl(value) {
          try {
            const url = new URL(String(value || "").trim());
            return ["http:", "https:"].includes(url.protocol) ? url.href : "";
          } catch (_error) {
            return "";
          }
        }

        React.useEffect(() => {
          async function loadCheckout() {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            const session = sessionData.session;
            if (!session?.user) {
              window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
              return;
            }
            setUserId(session.user.id);
            setAccessToken(session.access_token);

            const [{ data: offerData, error: offerError }, profileResponse] = await Promise.all([
              supabaseClient.from("business_offers").select("*").eq("id", offerId).maybeSingle(),
              fetch("/api/me/profile", {
                headers: { Authorization: `Bearer ${session.access_token}` },
              }),
            ]);

            const profileJson = await profileResponse.json().catch(() => ({}));
            const profileData = profileResponse.ok ? profileJson.profile : null;

            if (offerError || !offerData) {
              setStatus("No hemos encontrado esta oferta.");
              return;
            }

            if (offerData.is_hidden) {
              setStatus("Esta oferta ya no está disponible.");
              return;
            }

            setOffer(offerData);
            setProfile(profileData);
            setDeliveryAddress(profileData?.address || "");
            if (offerData.reservation_enabled) {
              const allowedWeekdays = normalizeReservationWeekdays(offerData.reservation_available_weekdays);
              const availableDates = buildReservableDates(Math.max(Number(offerData.reservation_days_ahead || 0), 0), allowedWeekdays);
              setReservationDate(availableDates[0]?.value || "");
              const slots = Array.isArray(offerData.reservation_time_slots) ? offerData.reservation_time_slots.filter(Boolean) : [];
              setReservationTime(slots[0] || "");
              setReservationPeople("1");
            }
            setStatus("");
          }

          loadCheckout();
        }, [offerId]);

        React.useEffect(() => {
          if (!successPurchase?.externalCheckoutUrl) return;
          const timer = setTimeout(() => {
            window.location.href = successPurchase.externalCheckoutUrl;
          }, 1800);
          return () => clearTimeout(timer);
        }, [successPurchase?.externalCheckoutUrl]);

        if (status) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">{status}</div>
            </main>
          );
        }

        const isExternalCheckout = Boolean(offer.external_checkout_enabled && safeExternalUrl(offer.external_checkout_url));
        const offerPoints = isExternalCheckout ? 0 : Number(offer.required_points || 0);
        const deliveryPoints = isExternalCheckout ? 0 : (delivery === "home" ? Number(offer.delivery_home_points || 0) : 0);
        const totalPoints = offerPoints + deliveryPoints;
        const deliveryLabel = delivery === "home" ? "Entrega a domicilio" : delivery === "none" ? "Billete digital" : "Recogida en tienda";
        const userPoints = Number(profile?.points || 0);
        const hasStockLimit = offer.stock_quantity !== null && offer.stock_quantity !== undefined && offer.stock_quantity !== "" && Number.isFinite(Number(offer.stock_quantity));
        const stockLimit = hasStockLimit ? Math.max(Math.floor(Number(offer.stock_quantity)), 0) : null;
        const soldCount = Math.max(Number(offer.sold_count || 0), 0);
        const remainingStock = hasStockLimit ? Math.max(stockLimit - soldCount, 0) : null;
        const isOutOfStock = hasStockLimit && remainingStock <= 0;
        const isOwnOffer = Boolean(
          userId && (
            offer.business_id === userId ||
            (cleanDonosId(profile?.transaction_id) && cleanDonosId(profile?.transaction_id) === cleanDonosId(offer.receiver_transaction_id))
          )
        );
        const hasEnoughPoints = isExternalCheckout || userPoints >= totalPoints;
        const needsDeliveryAddress = delivery === "home";
        const hasDeliveryAddress = !needsDeliveryAddress || deliveryAddress.trim().length >= 4;
        const reservationSlots = Array.isArray(offer.reservation_time_slots) ? offer.reservation_time_slots.filter(Boolean) : [];
        const reservationMaxPeople = Math.max(Number(offer.reservation_max_people || 0), 0);
        const reservationDaysAhead = Math.max(Number(offer.reservation_days_ahead || 0), 0);
        const reservationAvailableWeekdays = normalizeReservationWeekdays(offer.reservation_available_weekdays);
        const reservableDates = buildReservableDates(reservationDaysAhead, reservationAvailableWeekdays);
        const todayString = localDateString(new Date());
        const maxReservationDate = new Date();
        maxReservationDate.setDate(maxReservationDate.getDate() + reservationDaysAhead);
        const maxReservationDateString = localDateString(maxReservationDate);
        const reservationPeopleNumber = Math.max(Number.parseInt(reservationPeople, 10) || 0, 0);
        const hasValidReservation = !wantsReservation || (
          offer.reservation_enabled &&
          reservationDate >= todayString &&
          reservationDate <= maxReservationDateString &&
          isReservationDateAllowed(reservationDate, reservationAvailableWeekdays) &&
          reservationSlots.includes(reservationTime) &&
          reservationPeopleNumber >= 1 &&
          (!reservationMaxPeople || reservationPeopleNumber <= reservationMaxPeople)
        );
        const canConfirmPurchase = hasEnoughPoints && hasDeliveryAddress && hasValidReservation && !isOwnOffer && !isOutOfStock;

        async function saveDeliveryAddress() {
          if (!deliveryAddress.trim() || !userId) return;

          setAddressStatus({ type: "", message: "" });
          setIsSavingAddress(true);

          try {
            const { error } = await supabaseClient
              .from("profiles")
              .update({ address: deliveryAddress.trim() })
              .eq("id", userId);

            if (error) throw error;

            setProfile((current) => ({ ...current, address: deliveryAddress.trim() }));
            setAddressStatus({ type: "success", message: "Dirección guardada para próximas compras." });
          } catch (error) {
            setAddressStatus({ type: "error", message: "No se ha podido guardar la dirección." });
          } finally {
            setIsSavingAddress(false);
          }
        }

        async function handleBuy() {
          setPurchaseStatus({ type: "", message: "" });
          setAddressStatus({ type: "", message: "" });

          if (!hasDeliveryAddress) {
            setPurchaseStatus({ type: "error", message: "Añade una dirección para la entrega a domicilio." });
            return;
          }

          if (isOwnOffer) {
            setPurchaseStatus({ type: "error", message: "No puedes comprar tu propia publicación." });
            return;
          }

          if (isOutOfStock) {
            setPurchaseStatus({ type: "error", message: "Esta oferta está agotada." });
            return;
          }

          if (!hasValidReservation) {
            setPurchaseStatus({ type: "error", message: "Completa la reserva con una fecha, hora y número de personas válidos." });
            return;
          }

          setIsBuying(true);

          try {
            if (!accessToken) {
              window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
              return;
            }

            const response = await fetch("/api/purchases/offer", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                offerId: offer.id,
                deliveryMethod: delivery,
                deliveryAddress: needsDeliveryAddress ? deliveryAddress.trim() : "",
                reservationRequested: wantsReservation,
                reservationDate: wantsReservation ? reservationDate : "",
                reservationTime: wantsReservation ? reservationTime : "",
                reservationPeople: wantsReservation ? reservationPeopleNumber : null,
              }),
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "purchase_failed");

            const updatedPoints = data?.buyer_points ?? 0;
            setPurchaseStatus({
              type: "success",
              message: isExternalCheckout
                ? "Validación realizada. Te enviamos al pago externo."
                : `Compra realizada. Te quedan ${updatedPoints} ptos.`,
            });
            localStorage.setItem("donosPoints", String(updatedPoints));
            setSuccessPurchase({
              id: data?.purchase_id,
              title: offer.title || "Oferta Donoss",
              totalPoints,
              remainingPoints: updatedPoints,
              deliveryLabel,
              reservationLabel: wantsReservation ? `${reservationDate} · ${reservationTime} · ${reservationPeopleNumber} persona${reservationPeopleNumber === 1 ? "" : "s"}` : "",
              receiver: data?.receiver_display_name || offer.receiver_display_name || "Comercio Donoss",
              externalCheckoutUrl: safeExternalUrl(data?.external_checkout_url) || (offer.external_checkout_enabled ? safeExternalUrl(offer.external_checkout_url) : ""),
            });
            setOffer((current) => current ? { ...current, sold_count: Number(current.sold_count || 0) + 1 } : current);
            setProfile((current) => ({ ...current, points: updatedPoints, address: deliveryAddress.trim() || current?.address }));
          } catch (error) {
            const message = error.message || "";
            setPurchaseStatus({
              type: "error",
              message: message.includes("insufficient_points")
                ? "No tienes puntos suficientes para esta compra."
                  : message.includes("delivery_address_missing")
                    ? "Añade una dirección para la entrega a domicilio."
                  : message.includes("delivery_method_required")
                    ? "Elige una opción de entrega válida para esta compra."
                  : message.includes("own_offer_not_allowed")
                    ? "No puedes comprar tu propia publicación."
                  : message.includes("out_of_stock")
                    ? "Esta oferta está agotada."
                  : message.includes("offer_expired")
                    ? "Esta oferta ha caducado."
                  : message.includes("reservation_day_unavailable")
                    ? "Este día no está disponible para reservas."
                  : message.includes("reservation")
                    ? "Revisa la reserva: fecha, hora o personas no válidas."
                  : message.includes("receiver")
                    ? "No se ha encontrado la cuenta que debe recibir los puntos."
                  : message.includes("reservation_columns_missing")
                    ? "Falta ejecutar el SQL de reservas en Supabase."
                  : message.includes("purchases_table_missing") || message.includes("purchase_insert_failed")
                    ? "Falta activar el SQL de pagos en Supabase."
                  : message.includes("points_update_failed")
                    ? "Supabase no ha podido mover los puntos. Revisa la tabla profiles."
                  : "No se ha podido completar la compra.",
            });
          } finally {
            setIsBuying(false);
          }
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-3xl px-3 py-4 sm:px-6">
            <header className="flex items-center justify-between">
              <button className="rounded-full bg-white/10 px-4 py-2 text-sm font-black text-white ring-1 ring-white/10" onClick={goBackFromCheckout}>
                Volver
              </button>
              <span className="rounded-full bg-mint/10 px-4 py-2 text-sm font-black text-mint ring-1 ring-mint/20">Pago seguro</span>
            </header>

            <section className="mt-7 overflow-hidden rounded-[34px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/30">
              <div className="relative min-h-[210px] bg-gradient-to-br from-mint via-[#183047] to-[#FF6B6B]">
                {offer.cover_photo_data_url && <img className="absolute inset-0 h-full w-full object-cover" src={offer.cover_photo_data_url} alt="" />}
                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/15 to-transparent"></div>
                <div className="absolute bottom-5 left-5 right-5">
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Resumen</p>
                  <h1 className="mt-2 break-words text-2xl font-black leading-tight text-white sm:text-3xl">{offer.title || "Oferta sin título"}</h1>
                </div>
              </div>

              <div className="space-y-4 p-5">
                <div className="grid gap-3 min-[380px]:grid-cols-2">
                  <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Tus puntos</p>
                    <p className="mt-2 text-2xl font-black text-white">{userPoints} ptos.</p>
                  </div>
                  <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <p className="text-xs font-bold uppercase tracking-[0.14em] text-mint">{isExternalCheckout ? "Precio externo" : "Total"}</p>
                    <p className="mt-2 text-2xl font-black text-white">{isExternalCheckout ? formatEuro(offer.reduced_price || offer.base_price) : `${totalPoints} ptos.`}</p>
                  </div>
                </div>

                <div className="rounded-3xl border border-white/10 bg-[#0D111D] p-4">
                  {isExternalCheckout && (
                    <div className="mb-3 rounded-2xl border border-sun/25 bg-sun/10 p-3">
                      <p className="text-xs font-black uppercase tracking-[0.14em] text-sun">No disponible en puntos</p>
                      <p className="mt-1 text-sm font-semibold leading-5 text-slate-300">Esta oferta se paga en euros en la web del comercio después de confirmar aquí.</p>
                    </div>
                  )}
                  <div className="flex items-center justify-between gap-3 py-2">
                    <span className="text-sm font-bold text-slate-400">{isExternalCheckout ? "Precio oferta" : "Oferta"}</span>
                    <span className="text-sm font-black text-white">{isExternalCheckout ? formatEuro(offer.reduced_price || offer.base_price) : `${offerPoints} ptos.`}</span>
                  </div>
                  {!isExternalCheckout && (
                    <div className="flex items-center justify-between gap-3 border-t border-white/10 py-3">
                      <span className="text-sm font-bold text-slate-400">{deliveryLabel}</span>
                      <span className="text-sm font-black text-white">{deliveryPoints} ptos.</span>
                    </div>
                  )}
                  <div className="flex items-center justify-between gap-3 border-t border-white/10 pt-3">
                    <span className="text-base font-black text-white">A pagar</span>
                    <span className="text-xl font-black text-mint">{isExternalCheckout ? formatEuro(offer.reduced_price || offer.base_price) : `${totalPoints} ptos.`}</span>
                  </div>
                </div>

                <div className="rounded-3xl border border-white/10 bg-white/[0.045] p-4">
                  <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">{isExternalCheckout ? "Comercio" : "Cuenta que recibe los puntos"}</p>
                  <p className="mt-2 text-base font-black text-white">{offer.receiver_display_name || "Comercio Donoss"}</p>
                  {!isExternalCheckout && <p className="mt-1 text-sm font-bold text-slate-400">{formatDonosId(offer.receiver_transaction_id)}</p>}
                </div>

                {hasStockLimit && (
                  <div className={`rounded-3xl border p-4 ${
                    isOutOfStock ? "border-coral/25 bg-coral/10" : "border-white/10 bg-white/[0.045]"
                  }`}>
                    <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Disponibilidad</p>
                    <p className={`mt-2 text-base font-black ${isOutOfStock ? "text-coral" : "text-white"}`}>
                      {isOutOfStock ? "Agotado" : `${remainingStock} disponibles`}
                    </p>
                  </div>
                )}

                {needsDeliveryAddress && (
                  <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <p className="text-xs font-bold uppercase tracking-[0.14em] text-mint">Dirección de entrega</p>
                        <p className="mt-1 text-sm font-semibold text-slate-300">
                          {profile?.address ? "Usamos la dirección guardada en tu cuenta." : "Añade tu dirección y se guardará para la próxima."}
                        </p>
                      </div>
                      <span className="rounded-full bg-black/20 px-3 py-1 text-xs font-black text-white">Domicilio</span>
                    </div>

                    <textarea
                      className="mt-4 min-h-[92px] w-full resize-none rounded-2xl border border-white/10 bg-[#060914]/70 px-4 py-3 text-sm font-bold text-white outline-none transition placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                      placeholder="Calle, número, piso, barrio..."
                      value={deliveryAddress}
                      onChange={(event) => setDeliveryAddress(event.target.value)}
                    />

                    <div className="mt-3 flex items-center justify-between gap-3">
                      <p className={`text-xs font-bold ${
                        addressStatus.type === "success" ? "text-mint" : addressStatus.type === "error" ? "text-coral" : "text-slate-500"
                      }`}>
                        {addressStatus.message || "Esta dirección se usará para esta compra."}
                      </p>
                      <button
                        className="shrink-0 rounded-full bg-white/10 px-4 py-2 text-xs font-black text-white ring-1 ring-white/10 transition hover:bg-white/15"
                        onClick={saveDeliveryAddress}
                        disabled={isSavingAddress || deliveryAddress.trim().length < 4}
                      >
                        {isSavingAddress ? "Guardando..." : "Guardar"}
                      </button>
                    </div>
                  </div>
                )}

                {offer.reservation_enabled && (
                  <div className="rounded-3xl border border-white/10 bg-white/[0.045] p-4">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <p className="text-xs font-bold uppercase tracking-[0.14em] text-mint">Reserva</p>
                        <p className="mt-1 text-sm font-semibold leading-5 text-slate-300">
                          Puedes guardar mesa, plaza u horario junto con esta compra.
                        </p>
                      </div>
                      <button
                        type="button"
                        className={`relative h-8 w-14 shrink-0 rounded-full p-1 transition ${
                          wantsReservation ? "bg-mint" : "bg-white/10 ring-1 ring-white/10"
                        }`}
                        onClick={() => setWantsReservation((current) => !current)}
                      >
                        <span className={`block h-6 w-6 rounded-full bg-white shadow-lg transition ${wantsReservation ? "translate-x-6" : "translate-x-0"}`}></span>
                      </button>
                    </div>

                    {wantsReservation && (
                      <div className="mt-4 grid gap-3">
                        {reservableDates.length > 0 ? (
                          <div>
                            <span className="mb-2 block text-xs font-black uppercase tracking-[0.12em] text-slate-500">Día</span>
                            <div className="flex gap-2 overflow-x-auto pb-2">
                              {reservableDates.map((date) => (
                                <button
                                  key={date.value}
                                  type="button"
                                  className={`min-w-[84px] rounded-2xl px-3 py-3 text-left transition ${
                                    reservationDate === date.value
                                      ? "bg-mint text-ink shadow-glow"
                                      : "bg-[#060914]/70 text-white ring-1 ring-white/10"
                                  }`}
                                  onClick={() => setReservationDate(date.value)}
                                >
                                  <span className="block text-xs font-black uppercase opacity-70">{date.weekday}</span>
                                  <span className="mt-1 block text-xl font-black leading-none">{date.day}</span>
                                  <span className="mt-1 block text-xs font-bold uppercase opacity-70">{date.month}</span>
                                </button>
                              ))}
                            </div>
                          </div>
                        ) : (
                          <p className="rounded-2xl border border-coral/20 bg-coral/10 p-3 text-xs font-bold leading-5 text-coral">
                            Este comercio no tiene días disponibles dentro del periodo de reserva.
                          </p>
                        )}
                        <div className="grid gap-3 min-[430px]:grid-cols-2">
                          <label>
                            <span className="mb-2 block text-xs font-black uppercase tracking-[0.12em] text-slate-500">Fecha manual</span>
                            <input
                              className="h-12 w-full rounded-2xl border border-white/10 bg-[#060914]/70 px-4 text-sm font-bold text-white outline-none focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                              type="date"
                              min={todayString}
                              max={maxReservationDateString}
                              value={reservationDate}
                              onChange={(event) => setReservationDate(event.target.value)}
                            />
                          </label>
                          <label>
                            <span className="mb-2 block text-xs font-black uppercase tracking-[0.12em] text-slate-500">Personas</span>
                            <input
                              className="h-12 w-full rounded-2xl border border-white/10 bg-[#060914]/70 px-4 text-sm font-bold text-white outline-none focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                              type="number"
                              min="1"
                              max={reservationMaxPeople || undefined}
                              value={reservationPeople}
                              onChange={(event) => setReservationPeople(event.target.value.replace(/[^0-9]/g, ""))}
                            />
                          </label>
                        </div>
                        <label>
                          <span className="mb-2 block text-xs font-black uppercase tracking-[0.12em] text-slate-500">Hora</span>
                          <select
                            className="h-12 w-full rounded-2xl border border-white/10 bg-[#060914]/70 px-4 text-sm font-bold text-white outline-none focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                            value={reservationTime}
                            onChange={(event) => setReservationTime(event.target.value)}
                          >
                            {reservationSlots.map((slot) => <option key={slot} value={slot}>{slot}</option>)}
                          </select>
                        </label>
                        <p className="rounded-2xl border border-mint/20 bg-mint/10 p-3 text-xs font-bold leading-5 text-mint">
                          Máximo {reservationMaxPeople || 1} persona{reservationMaxPeople === 1 ? "" : "s"} por reserva. {reservationDaysAhead === 0 ? "Solo disponible para hoy." : `Disponible hasta ${reservationDaysAhead} día${reservationDaysAhead === 1 ? "" : "s"} de antelación.`}
                        </p>
                        {reservationDate && !isReservationDateAllowed(reservationDate, reservationAvailableWeekdays) && (
                          <p className="rounded-2xl border border-coral/20 bg-coral/10 p-3 text-xs font-bold leading-5 text-coral">
                            Este día está cerrado para reservas. Elige uno de los días disponibles.
                          </p>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {!isExternalCheckout && !hasEnoughPoints && (
                  <div className="rounded-[26px] border border-coral/25 bg-coral/10 p-4">
                    <div className="flex items-start gap-3">
                      <div className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-coral/15 text-xl ring-1 ring-coral/20">!</div>
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-black text-coral">No tienes puntos suficientes para completar esta compra.</p>
                        <p className="mt-1 text-xs font-semibold leading-5 text-slate-300">
                          Te faltan {Math.max(totalPoints - userPoints, 0)} ptos. Puedes recargar y volver a comprar después.
                        </p>
                      </div>
                    </div>
                    <button
                      className="mt-4 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                      onClick={goToRecharge}
                    >
                      Recargar ahora
                    </button>
                  </div>
                )}

                {needsDeliveryAddress && !hasDeliveryAddress && (
                  <p className="rounded-2xl border border-coral/25 bg-coral/10 p-4 text-sm font-bold text-coral">
                    Añade una dirección para recibir la entrega a domicilio.
                  </p>
                )}

                {isOwnOffer && (
                  <p className="rounded-2xl border border-coral/25 bg-coral/10 p-4 text-sm font-bold text-coral">
                    No puedes comprar tu propia publicación porque los puntos volverían a tu misma cuenta.
                  </p>
                )}

                {isOutOfStock && (
                  <p className="rounded-2xl border border-coral/25 bg-coral/10 p-4 text-sm font-bold text-coral">
                    Esta oferta está agotada.
                  </p>
                )}

                {purchaseStatus.message && (
                  <div className={`rounded-2xl p-4 text-sm font-bold ${
                    purchaseStatus.type === "success" ? "bg-mint/10 text-mint ring-1 ring-mint/20" : "bg-coral/10 text-coral ring-1 ring-coral/20"
                  }`}>
                    <p>{purchaseStatus.message}</p>
                    {purchaseStatus.message.includes("puntos suficientes") && (
                      <button
                        className="mt-3 h-11 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                        onClick={goToRecharge}
                      >
                        Recargar ahora
                      </button>
                    )}
                  </div>
                )}

                <button
                  className={`h-14 w-full rounded-2xl text-base font-black transition ${
                    canConfirmPurchase && !isBuying ? "bg-mint text-ink shadow-glow hover:bg-[#66ffd0]" : "bg-white/10 text-slate-500"
                  }`}
                  disabled={!canConfirmPurchase || isBuying}
                  onClick={handleBuy}
                >
                  {isBuying ? "Preparando..." : isExternalCheckout ? "Continuar al pago externo" : "Comprar ahora"}
                </button>
              </div>
            </section>

            {successPurchase && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 px-4 backdrop-blur-2xl">
                <section className="success-pop w-full max-w-md overflow-hidden rounded-[36px] border border-mint/25 bg-[#0D111D] shadow-2xl shadow-mint/10">
                  <div className="relative grid place-items-center px-6 pt-8">
                    <span className="success-ring absolute h-28 w-28 rounded-full border border-mint/50"></span>
                    <span className="success-ring absolute h-28 w-28 rounded-full border border-mint/30 [animation-delay:450ms]"></span>
                    <div className="relative grid h-24 w-24 place-items-center rounded-full bg-mint text-ink shadow-glow">
                      <svg viewBox="0 0 24 24" className="h-12 w-12" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3">
                        <path d="m5 12 4 4L19 6" />
                      </svg>
                    </div>
                  </div>

                  <div className="px-6 pb-6 pt-5 text-center">
                    <p className="text-sm font-black uppercase tracking-[0.18em] text-mint">Pago realizado</p>
                    <h2 className="mt-2 text-3xl font-black leading-tight text-white">Compra completada</h2>
                    <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">
                      {successPurchase.externalCheckoutUrl
                        ? "Donoss ya ha validado tus puntos. Ahora te enviamos al pago final del comercio."
                        : "Tu reserva se ha confirmado correctamente. Los puntos ya se han movido de forma segura."}
                    </p>

                    <div className="mt-5 grid gap-3 rounded-[28px] border border-white/10 bg-white/[0.045] p-4 text-left">
                      <div className="flex justify-between gap-3">
                        <span className="text-sm font-bold text-slate-400">Producto</span>
                    <span className="break-words text-right text-sm font-black text-white">{successPurchase.title}</span>
                      </div>
                      <div className="flex justify-between gap-3">
                        <span className="text-sm font-bold text-slate-400">Entrega</span>
                        <span className="text-sm font-black text-white">{successPurchase.deliveryLabel}</span>
                      </div>
                      {successPurchase.reservationLabel && (
                        <div className="flex justify-between gap-3">
                          <span className="text-sm font-bold text-slate-400">Reserva</span>
                          <span className="text-right text-sm font-black text-white">{successPurchase.reservationLabel}</span>
                        </div>
                      )}
                      <div className="flex justify-between gap-3">
                        <span className="text-sm font-bold text-slate-400">Comercio</span>
                        <span className="text-sm font-black text-white">{successPurchase.receiver}</span>
                      </div>
                      <div className="flex justify-between gap-3 border-t border-white/10 pt-3">
                        <span className="text-sm font-bold text-slate-400">Pagado</span>
                        <span className="text-base font-black text-mint">{successPurchase.externalCheckoutUrl ? "Pago externo" : `${successPurchase.totalPoints} ptos.`}</span>
                      </div>
                      <div className="flex justify-between gap-3">
                        <span className="text-sm font-bold text-slate-400">Saldo restante</span>
                        <span className="text-base font-black text-white">{successPurchase.remainingPoints} ptos.</span>
                      </div>
                    </div>

                    {successPurchase.externalCheckoutUrl && (
                      <a
                        className="mt-5 grid h-12 place-items-center rounded-2xl bg-sun text-sm font-black text-ink shadow-2xl shadow-sun/10 transition hover:brightness-110"
                        href={successPurchase.externalCheckoutUrl}
                      >
                        Continuar al pago externo
                      </a>
                    )}

                    <div className="mt-5 grid gap-3 min-[380px]:grid-cols-2">
                      <button className="grid h-12 place-items-center rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white transition hover:bg-white/[0.11]" onClick={() => goToAppRoute("inicio")}>
                        Inicio
                      </button>
                      <button className="grid h-12 place-items-center rounded-2xl bg-mint text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]" onClick={() => {
                        if (fromApp) goToAppRoute("historial");
                        else window.location.href = successPurchase.id ? `order-detail.html?id=${successPurchase.id}` : "historial.html";
                      }}>
                        Ver pedido
                      </button>
                    </div>
                  </div>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
