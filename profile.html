    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";

      const navItems = [

        { label: "Quedar", icon: "users", href: "plans.html" },

      function NavIcon({ name }) {
        const paths = {
          home: <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" />,
          search: <path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />,
          history: <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2" />,
          plus: <path d="M12 5v14M5 12h14" />,
          users: <path d="M16 21a6 6 0 0 0-12 0M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21a5 5 0 0 0-5-5M17 11a3.5 3.5 0 0 0 0-7" />,
          transfer: <path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4 4m-4-4 4-4" />,

          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.3">
            {paths[name]}
          </svg>
        );
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "";
      }

      function NotificationBadge({ count }) {
        if (!count) return null;
        return (
          <span className="absolute -right-1 -top-1 grid min-h-5 min-w-5 place-items-center rounded-full bg-coral px-1.5 text-[10px] font-black leading-none text-white ring-2 ring-[#101522]">
            +{count > 9 ? "9" : count}
          </span>
        );
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString("es-ES");
      }

      function formatDateTime(value) {
        if (!value) return "No programado";
        return new Intl.DateTimeFormat("es-ES", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(value));
      }

      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;
      }

      function InfoCard({ label, value }) {
        return (
          <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
            <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">{label}</p>
            <p className="mt-2 break-words text-base font-black text-white">{value || "No indicado"}</p>
          </div>
        );
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-6 w-6 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-4 w-4" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      async function compressImageToDataUrl(file, maxSide = 900, quality = 0.76) {
        const image = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const ratio = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * ratio));
        canvas.height = Math.max(1, Math.round(image.height * ratio));
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", quality);
      }

      function App() {
        const [profile, setProfile] = React.useState(null);
        const [status, setStatus] = React.useState("Cargando perfil...");
        const [copyStatus, setCopyStatus] = React.useState("");
        const [navBadges, setNavBadges] = React.useState({});
        const [accessToken, setAccessToken] = React.useState("");
        const [planPhotos, setPlanPhotos] = React.useState([]);
        const [isSavingPhotos, setIsSavingPhotos] = React.useState(false);
        const [isSavingPlanGender, setIsSavingPlanGender] = React.useState(false);
        const [premium, setPremium] = React.useState(null);
        const [premiumSqlMissing, setPremiumSqlMissing] = React.useState(false);
        const [isPremiumOpen, setIsPremiumOpen] = React.useState(false);
        const [isActivatingPremium, setIsActivatingPremium] = React.useState(false);
        const [isEditingName, setIsEditingName] = React.useState(false);
        const [displayNameDraft, setDisplayNameDraft] = React.useState("");
        const [isSavingName, setIsSavingName] = React.useState(false);
        const [premiumDni, setPremiumDni] = React.useState("");
        const [premiumPhoto, setPremiumPhoto] = React.useState("");
        const [isSavingPremiumIdentity, setIsSavingPremiumIdentity] = React.useState(false);
        const [referralSponsor, setReferralSponsor] = React.useState(null);

        React.useEffect(() => {
          async function loadProfile() {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            const accessToken = sessionData.session?.access_token;
            setAccessToken(accessToken || "");
            const authUser = sessionData.session?.user;
            const userId = authUser?.id;

            if (!userId) {
              redirectToLogin();
              return;
            }

            const columns = "id, display_name, email, phone, neighborhood, account_type, business_categories, tax_id, address, transaction_id, points, plan_gender_preference";
            let data = null;
            let error = null;

            if (accessToken) {
              const response = await fetch("/api/me/profile", {
                headers: { Authorization: `Bearer ${accessToken}` },
              });
              const serverData = await response.json().catch(() => ({}));
              if (response.ok) {
                data = serverData.profile;
                setPremium(serverData.premium || null);
                setPremiumSqlMissing(Boolean(serverData.premium_sql_missing));
              }
            }

            if (!data) {
              const profileResponse = await supabaseClient
                .from("profiles")
                .select(columns)
                .eq("id", userId)
                .maybeSingle();
              data = profileResponse.data;
              error = profileResponse.error;
            }

            if (error) {
              const fallback = await supabaseClient
                .from("profiles")
                .select("id, display_name, email, phone, neighborhood, account_type, business_categories, tax_id, address, transaction_id")
                .eq("id", userId)
                .maybeSingle();

              data = fallback.data;
              error = fallback.error;
            }

            if (!data) {
              const metadata = authUser.user_metadata || {};
              data = {
                id: userId,
                display_name: metadata.display_name || authUser.email?.split("@")[0] || "Tu cuenta",
                email: authUser.email || "",
                phone: metadata.phone || "",
                neighborhood: metadata.neighborhood || "",
                account_type: metadata.account_type || "user",
                business_categories: metadata.business_categories || [],
                tax_id: metadata.tax_id || "",
                address: metadata.address || "",
                transaction_id: metadata.transaction_id || localStorage.getItem("donosTransactionId") || "",
                points: 0,
              };
            }

            setProfile({ points: 0, ...data });
            setPlanPhotos(data?.plan_photo_data_urls || []);
            setPremiumDni(data?.premium_identity?.dni || data?.premium_identity_dni || "");
            setPremiumPhoto(data?.premium_identity?.photo_data_url || data?.premium_identity_photo_data_url || "");
            setStatus("");

            if (accessToken) {
              const photosResponse = await fetch("/api/me/plan-photos", {
                headers: { Authorization: `Bearer ${accessToken}` },
              });
              const photosData = await photosResponse.json().catch(() => ({}));
              if (photosResponse.ok) setPlanPhotos(photosData.photos || []);

              const response = await fetch("/api/me/notifications", {
                headers: { Authorization: `Bearer ${accessToken}` },
              });
              const notifications = await response.json().catch(() => ({}));
              if (response.ok) setNavBadges(notifications.counts?.sections || {});

              const referralResponse = await fetch("/api/me/referral-program", {
                headers: { Authorization: `Bearer ${accessToken}` },
              });
              const referralData = await referralResponse.json().catch(() => ({}));
              if (referralResponse.ok) setReferralSponsor(referralData.sponsor?.referrer_profile || null);
            }
          }

          loadProfile();
        }, []);

        React.useEffect(() => {
          if (window.parent === window) return undefined;
          window.parent.postMessage({ type: isPremiumOpen ? "donos:hide-nav" : "donos:show-nav" }, window.location.origin);
          return () => window.parent.postMessage({ type: "donos:show-nav" }, window.location.origin);
        }, [isPremiumOpen]);

        async function copyId() {
          const clean = String(profile?.transaction_id || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
          if (!clean) return;
          await navigator.clipboard.writeText(clean);
          setCopyStatus("Copiado");
          setTimeout(() => setCopyStatus(""), 1400);
        }

        async function handlePlanPhotoUpload(event) {
          const files = Array.from(event.target.files || []).slice(0, 5 - planPhotos.length);
          if (!files.length) return;
          if (files.some((file) => file.size > 8 * 1024 * 1024)) {
            setStatus("Una foto es demasiado grande. Usa imágenes de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressed = await Promise.all(files.map((file) => compressImageToDataUrl(file)));
            setPlanPhotos((current) => [...current, ...compressed].slice(0, 5));
            setStatus("");
          } catch (_error) {
            setStatus("No se han podido preparar las fotos.");
          } finally {
            event.target.value = "";
          }
        }

        async function savePlanPhotos() {
          if (!accessToken) return redirectToLogin();
          setIsSavingPhotos(true);
          setStatus("");
          try {
            const response = await fetch("/api/me/plan-photos", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ photos: planPhotos }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "save_failed");
            setPlanPhotos(data.photos || []);
            setProfile((current) => current ? { ...current, plan_photo_data_urls: data.photos || [] } : current);
            setStatus("Fotos para planes guardadas correctamente.");
          } catch (error) {
            setStatus(error.message === "plan_photos_sql_missing" ? "Falta ejecutar el SQL de fotos para planes." : "No se han podido guardar las fotos.");
          } finally {
            setIsSavingPhotos(false);
          }
        }

        async function savePlanGenderPreference(gender) {
          if (!accessToken) return redirectToLogin();
          setIsSavingPlanGender(true);
          setStatus("");
          setProfile((current) => current ? { ...current, plan_gender_preference: gender } : current);
          try {
            const response = await fetch("/api/me/plan-preferences", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ gender }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "save_failed");
            setProfile((current) => current ? { ...current, plan_gender_preference: data.gender || gender } : current);
            setStatus("Preferencia para Quedar guardada correctamente.");
          } catch (error) {
            setStatus(error.message === "plan_gender_sql_missing" ? "Falta ejecutar el SQL de preferencia chico/chica." : "No se ha podido guardar tu preferencia.");
          } finally {
            setIsSavingPlanGender(false);
          }
        }

        async function saveDisplayName(event) {
          event?.preventDefault();
          if (!accessToken) return redirectToLogin();
          const cleanName = displayNameDraft.trim().replace(/\s+/g, " ");
          if (cleanName.length < 2 || cleanName.length > 60) {
            setStatus("El nombre debe tener entre 2 y 60 caracteres.");
            return;
          }

          setIsSavingName(true);
          setStatus("");
          try {
            const response = await fetch("/api/me/profile", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ display_name: cleanName }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "profile_update_failed");
            setProfile((current) => current ? { ...current, ...(data.profile || {}), display_name: cleanName } : current);
            localStorage.setItem("donosDisplayName", cleanName);
            setIsEditingName(false);
            setStatus("Nombre actualizado correctamente.");
          } catch (_error) {
            setStatus("No se ha podido actualizar tu nombre.");
          } finally {
            setIsSavingName(false);
          }
        }

        async function handlePremiumPhotoUpload(event) {
          const file = Array.from(event.target.files || [])[0];
          if (!file) return;
          if (file.size > 8 * 1024 * 1024) {
            setStatus("La foto es demasiado grande. Usa una imagen de menos de 8 MB.");
            event.target.value = "";
            return;
          }
          try {
            const compressed = await compressImageToDataUrl(file, 900, 0.84);
            setPremiumPhoto(compressed);
            setStatus("");
          } catch (_error) {
            setStatus("No se ha podido preparar la foto.");
          } finally {
            event.target.value = "";
          }
        }

        async function savePremiumIdentity({ activateAfter = false } = {}) {
          if (!accessToken) return redirectToLogin();
          const cleanDni = premiumDni.trim().toUpperCase().replace(/\s+/g, "");
          if (cleanDni.length < 5) {
            setStatus("Añade tu NIE o DNI para activar Premium.");
            return false;
          }
          if (!premiumPhoto) {
            setStatus("Añade una foto visible de ti para activar Premium.");
            return false;
          }

          setIsSavingPremiumIdentity(true);
          setStatus("");
          try {
            const response = await fetch("/api/me/premium/identity", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ dni: cleanDni, photo_data_url: premiumPhoto }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "identity_failed");
            setPremiumDni(data.premium_identity?.dni || cleanDni);
            setPremiumPhoto(data.premium_identity?.photo_data_url || premiumPhoto);
            setProfile((current) => current ? { ...current, premium_identity: data.premium_identity || current.premium_identity } : current);
            if (activateAfter) {
              await activatePremium();
            } else {
              setStatus("Identidad Premium guardada correctamente.");
            }
            return true;
          } catch (error) {
            if (error.message === "premium_identity_sql_missing") {
              setStatus("Falta ejecutar el SQL de identidad Premium en Supabase.");
            } else {
              setStatus("No se ha podido guardar la identidad Premium.");
            }
            return false;
          } finally {
            setIsSavingPremiumIdentity(false);
          }
        }

        async function signOut() {
          await supabaseClient.auth.signOut();
          localStorage.removeItem("donosAccountType");
          localStorage.removeItem("donosDisplayName");
          localStorage.removeItem("donosTransactionId");
          window.location.href = "login.html";
        }

        function refreshLatestVersion() {
          if (new URLSearchParams(window.location.search).get("embedded") === "1" && window.parent !== window) {
            window.parent.postMessage({ type: "donos:hard-refresh" }, window.location.origin);
            return;
          }

          const loader = document.querySelector(".donos-page-loader");
          if (loader) {
            loader.classList.remove("is-skipped");
            loader.style.display = "grid";
            loader.style.opacity = "1";
            loader.style.visibility = "visible";
          }
          window.setTimeout(() => window.location.reload(), 420);
        }

        async function activatePremium() {
          if (!accessToken) return redirectToLogin();
          setIsActivatingPremium(true);
          setStatus("");
          try {
            const response = await fetch("/api/me/premium/subscribe", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "premium_failed");
            setPremium(data.premium || null);
            setProfile((current) => current ? { ...current, ...(data.profile || {}) } : current);
            setIsPremiumOpen(false);
            setStatus("Premium activado correctamente. Tu certificación ya está activa.");
          } catch (error) {
            if (error.message === "premium_sql_missing") {
              setStatus("Falta ejecutar el SQL de Premium en Supabase.");
            } else if (error.message === "insufficient_points") {
              setStatus("No tienes puntos suficientes para activar Premium.");
            } else if (error.message === "premium_identity_required") {
              setStatus("Completa tu NIE/DNI y una foto visible antes de activar Premium.");
            } else {
              setStatus("No se ha podido activar Premium.");
            }
          } finally {
            setIsActivatingPremium(false);
          }
        }

        if (status === "Cargando perfil...") {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">{status}</div>
            </main>
          );
        }

        const isBusiness = profile.account_type === "business";
        const displayedDonosId = formatDonosId(profile.transaction_id);
        const premiumPoints = isBusiness ? 30 : 20;
        const premiumActive = premium?.status === "active";
        const premiumFailed = premium?.status === "failed";
        const premiumIdentity = profile.premium_identity || {};
        const premiumIdentityComplete = Boolean((premiumIdentity.dni || premiumDni) && (premiumIdentity.photo_data_url || premiumPhoto));

        return (
          <main className="mx-auto min-h-screen w-full max-w-4xl px-3 pb-28 pt-4 sm:px-6">
            <header className="flex items-center justify-between gap-3">
              <a href={`home.html?type=${profile.account_type || "user"}`} className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black leading-tight">Donoss</p>
                  <p className="text-xs font-semibold text-slate-400">Perfil</p>
                </div>
              </a>
              <span className="rounded-full bg-mint/10 px-4 py-2 text-sm font-black text-mint ring-1 ring-mint/20">
                {isBusiness ? "Empresa" : "Usuario"}
              </span>
            </header>

            {status && (
              <p className={`mt-4 rounded-2xl border p-4 text-sm font-black ${
                status.includes("correctamente") ? "border-mint/25 bg-mint/10 text-mint" : "border-coral/25 bg-coral/10 text-coral"
              }`}>
                {status}
              </p>
            )}

            <section className="mt-6 rounded-[30px] border border-white/10 bg-white/[0.055] p-4 shadow-glow sm:mt-7 sm:rounded-[38px] sm:p-8">
              <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Cuenta Donoss</p>
              <div className="mt-4 flex flex-wrap items-end justify-between gap-5">
                <div className="min-w-0">
                  {isEditingName ? (
                    <form className="max-w-full" onSubmit={saveDisplayName}>
                      <label className="block">
                        <span className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">Nombre / Apodo</span>
                        <input
                          className="mt-2 h-12 w-full rounded-2xl border border-mint/40 bg-black/25 px-4 text-base font-black text-white outline-none ring-4 ring-mint/10 placeholder:text-slate-600"
                          value={displayNameDraft}
                          maxLength="60"
                          onChange={(event) => setDisplayNameDraft(event.target.value)}
                          placeholder="Tu nombre o apodo"
                        />
                      </label>
                      <div className="mt-3 flex gap-2">
                        <button className="h-10 rounded-2xl bg-mint px-4 text-xs font-black text-ink shadow-glow disabled:opacity-60" disabled={isSavingName}>
                          {isSavingName ? "Guardando..." : "Guardar"}
                        </button>
                        <button
                          className="h-10 rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-xs font-black text-white"
                          type="button"
                          onClick={() => {
                            setIsEditingName(false);
                            setDisplayNameDraft(profile.display_name || "");
                          }}
                        >
                          Cancelar
                        </button>
                      </div>
                    </form>
                  ) : (
                    <div className="flex flex-wrap items-center gap-2">
                      <h1 className="flex flex-wrap items-center gap-2 break-words text-3xl font-black leading-tight text-white sm:text-4xl">
                        <span>{profile.display_name || "Tu cuenta"}</span>
                        {profile.is_verified && <VerifiedBadge />}
                      </h1>
                      <button
                        className="rounded-full border border-white/10 bg-white/[0.06] px-3 py-1.5 text-xs font-black text-slate-200 transition hover:bg-white/[0.10]"
                        type="button"
                        onClick={() => {
                          setDisplayNameDraft(profile.display_name || "");
                          setIsEditingName(true);
                        }}
                      >
                        Modificar
                      </button>
                    </div>
                  )}
                  <p className="mt-2 text-sm font-bold text-slate-400">{profile.email || "Correo no indicado"}</p>
                  {profile.is_verified && (
                    <p className="mt-2 inline-flex items-center gap-2 rounded-full bg-sky-500/10 px-3 py-1 text-xs font-black text-sky-300 ring-1 ring-sky-400/20">
                      <VerifiedBadge />
                      Cuenta certificada
                    </p>
                  )}
                </div>
                <div className="rounded-3xl border border-mint/20 bg-mint/10 px-5 py-4">
                  <p className="text-xs font-semibold text-mint">Puntos</p>
                  <p className="mt-1 text-3xl font-black text-white">{formatNumber(profile.points)}</p>
                </div>
              </div>

              <div className="mt-5 flex items-center justify-between gap-3 rounded-3xl border border-white/10 bg-black/20 p-4">
                <div className="min-w-0">
                  <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">ID Donoss</p>
                  <p className="mt-1 break-all font-mono text-base font-black text-white sm:text-lg">{displayedDonosId || "ID no disponible"}</p>
                </div>
                {displayedDonosId && (
                  <button className="shrink-0 rounded-full bg-mint px-4 py-2 text-xs font-black text-ink shadow-glow" onClick={copyId}>
                    {copyStatus || "Copiar"}
                  </button>
                )}
              </div>
              {referralSponsor && (
                <div className="mt-3 rounded-3xl border border-mint/20 bg-mint/10 p-4">
                  <p className="text-xs font-bold uppercase tracking-[0.14em] text-mint">Te invitó</p>
                  <div className="mt-2 flex flex-wrap items-center justify-between gap-3">
                    <div className="min-w-0">
                      <p className="flex items-center gap-2 text-base font-black text-white">
                        <span>{referralSponsor.display_name || "Cuenta Donoss"}</span>
                        {referralSponsor.is_verified && <VerifiedBadge />}
                      </p>
                      <p className="mt-1 font-mono text-xs font-black text-slate-400">{formatDonosId(referralSponsor.transaction_id)}</p>
                    </div>
                    <span className="rounded-full bg-white/10 px-3 py-1 text-xs font-black text-slate-200">
                      Invitación registrada
                    </span>
                  </div>
                </div>
              )}
            </section>

            <section className="mt-5 grid gap-3 sm:grid-cols-2">
              <InfoCard label="Tipo de cuenta" value={isBusiness ? "Comercio / Empresa" : "Usuario"} />
              <InfoCard label="Teléfono" value={profile.phone} />
              <InfoCard label="Barrio" value={profile.neighborhood} />
              <InfoCard label="Dirección" value={profile.address} />
              {isBusiness && <InfoCard label="CIF / NIF" value={profile.tax_id} />}
              {isBusiness && <InfoCard label="Categorías" value={profile.business_categories?.join(", ")} />}
            </section>

            <section className="mt-5 rounded-[30px] border border-sun/20 bg-sun/10 p-4">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-sm font-black text-white">Información esencial</p>
                  <p className="mt-1 text-xs font-bold leading-5 text-slate-300">
                    Si necesitas modificar un dato urgente o esencial que no aparece editable aquí, contacta con Donoss para revisarlo de forma segura.
                  </p>
                  <p className="mt-2 text-xs font-bold leading-5 text-slate-500">
                    Ejemplos: correo electrónico, teléfono principal, datos fiscales{isBusiness ? ", dirección fiscal o cuenta bancaria/IBAN" : " o datos sensibles de tu cuenta"}.
                  </p>
                </div>
                <span className="rounded-2xl border border-sun/25 bg-sun/10 px-4 py-2 text-xs font-black text-sun">
                  Contacta con Donoss
                </span>
              </div>
            </section>

            <section className="mt-5 rounded-[30px] border border-white/10 bg-white/[0.055] p-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-sm font-black text-white">Última versión</p>
                  <p className="mt-1 text-xs font-bold leading-5 text-slate-400">
                    Si algo no aparece después de una actualización, recarga Donoss sin cerrar sesión.
                  </p>
                </div>
                <button
                  className="h-11 rounded-2xl bg-mint px-5 text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                  type="button"
                  onClick={refreshLatestVersion}
                >
                  Actualizar app
                </button>
              </div>
            </section>

            <section className={`mt-5 rounded-[32px] border p-5 shadow-2xl shadow-black/20 ${
              premiumActive
                ? "border-mint/25 bg-mint/10"
                : premiumFailed
                  ? "border-coral/25 bg-coral/10"
                  : "border-white/10 bg-white/[0.055]"
            }`}>
              <div className="flex flex-wrap items-start justify-between gap-4">
                <div className="min-w-0">
                  <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Plan Premium</p>
                  <h2 className="mt-2 text-2xl font-black text-white">Certificación Donoss</h2>
                  <p className="mt-2 max-w-2xl text-sm font-bold leading-6 text-slate-400">
                    {isBusiness
                      ? "Gana confianza y muestra tus ofertas oficiales con más autoridad dentro de Donoss."
                      : "Demuestra que eres una persona real y consigue una atención más rápida cuando necesites ayuda."}
                  </p>
                </div>
                <div className="rounded-3xl border border-white/10 bg-black/25 px-4 py-3 text-right">
                  <p className="text-2xl font-black text-white">{premiumPoints} puntos</p>
                  <p className="text-xs font-black text-slate-400">cada 31 días</p>
                </div>
              </div>

              <div className="mt-4 grid gap-3 sm:grid-cols-4">
                <InfoCard label="Estado" value={premiumActive ? "Pago al día" : premiumFailed ? "Pago fallido" : "Sin activar"} />
                <InfoCard label="Próximo cobro" value={premiumActive ? formatDateTime(premium?.next_charge_at) : "Al activar Premium"} />
                <InfoCard label="Certificación" value={profile.is_verified ? "Activa" : "No activa"} />
                <InfoCard label="Identidad" value={premiumIdentityComplete ? "Completa" : "Pendiente"} />
              </div>

              {premiumFailed && (
                <p className="mt-4 rounded-2xl border border-coral/25 bg-black/20 p-3 text-sm font-black leading-6 text-coral">
                  El último cobro no se pudo hacer. Recarga puntos y vuelve a activar Premium para recuperar la certificación.
                </p>
              )}
              {premiumSqlMissing && (
                <p className="mt-4 rounded-2xl border border-sun/25 bg-sun/10 p-3 text-sm font-black leading-6 text-sun">
                  Falta activar Premium en Supabase. Ejecuta el SQL de Premium para usar esta sección.
                </p>
              )}

              <button
                className="mt-4 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0] disabled:opacity-60"
                onClick={() => setIsPremiumOpen(true)}
                disabled={isActivatingPremium}
              >
                {premiumActive ? "Ver detalles Premium" : "Activar Premium"}
              </button>
            </section>

            {!isBusiness && (
              <section className="mt-5 rounded-[32px] border border-white/10 bg-white/[0.055] p-4 shadow-2xl shadow-black/20 sm:p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Fotos para planes</p>
                    <h2 className="mt-2 text-2xl font-black text-white">Planes con más gente</h2>
                    <p className="mt-2 max-w-2xl text-sm font-semibold leading-6 text-slate-400">
                      Estas fotos solo se muestran a personas autorizadas en Quedar: quien creó el plan y participantes del mismo grupo. Para apuntarte se necesitan mínimo 2 fotos.
                    </p>
                  </div>
                  <span className={`rounded-full px-3 py-1 text-xs font-black ${planPhotos.length >= 2 ? "bg-mint text-ink" : "bg-coral/10 text-coral ring-1 ring-coral/20"}`}>
                    {planPhotos.length}/5 fotos
                  </span>
                </div>

                <div className="mt-5 rounded-[28px] border border-white/10 bg-black/20 p-4">
                  <p className="text-sm font-black text-white">¿Cómo te calificas para Quedar?</p>
                  <p className="mt-1 text-xs font-bold leading-5 text-slate-500">Esto se usará automáticamente cuando pulses “Voy contigo”. Puedes cambiarlo cuando quieras.</p>
                  <div className="mt-3 grid grid-cols-2 gap-2">
                    {[["woman", "Chica"], ["man", "Chico"]].map(([value, label]) => (
                      <button
                        key={value}
                        type="button"
                        className={`h-12 rounded-2xl text-sm font-black transition ${
                          profile.plan_gender_preference === value ? "bg-mint text-ink shadow-glow" : "bg-white/[0.06] text-slate-300 ring-1 ring-white/10"
                        }`}
                        disabled={isSavingPlanGender}
                        onClick={() => savePlanGenderPreference(value)}
                      >
                        {label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-4 flex gap-3 overflow-x-auto pb-2">
                  {planPhotos.map((photo, index) => (
                    <div key={`${photo.slice(0, 28)}-${index}`} className="relative h-40 w-32 shrink-0 overflow-hidden rounded-[28px] border border-white/10 bg-black/20">
                      <img className="h-full w-full object-cover" src={photo} alt="" />
                      <button
                        className="absolute right-2 top-2 grid h-8 w-8 place-items-center rounded-full bg-black/65 text-sm font-black text-white backdrop-blur"
                        type="button"
                        onClick={() => setPlanPhotos((current) => current.filter((_, itemIndex) => itemIndex !== index))}
                      >
                        ×
                      </button>
                    </div>
                  ))}
                  {planPhotos.length < 5 && (
                    <label className="grid h-40 w-32 shrink-0 cursor-pointer place-items-center rounded-[28px] border border-dashed border-mint/35 bg-mint/10 text-center">
                      <span>
                        <span className="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-mint text-ink"><NavIcon name="plus" /></span>
                        <span className="mt-2 block text-xs font-black text-mint">Añadir</span>
                      </span>
                      <input className="hidden" type="file" accept="image/*" multiple onChange={handlePlanPhotoUpload} />
                    </label>
                  )}
                </div>

                <button
                  className="mt-4 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60"
                  disabled={isSavingPhotos}
                  onClick={savePlanPhotos}
                >
                  {isSavingPhotos ? "Guardando..." : "Guardar fotos"}
                </button>
              </section>
            )}

            <section className="mt-5 rounded-[30px] border border-coral/25 bg-coral/10 p-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p className="text-sm font-black text-white">Sesión</p>
                  <p className="mt-1 text-xs font-bold text-coral/80">Sal de esta cuenta para entrar con otra.</p>
                </div>
                <button
                  className="h-11 rounded-2xl bg-coral px-5 text-sm font-black text-white transition hover:bg-[#ff8585]"
                  onClick={signOut}
                >
                  Cerrar sesión
                </button>
              </div>
            </section>

            <nav className="fixed inset-x-0 bottom-3 z-40 mx-auto w-[min(calc(100%-16px),520px)] rounded-[24px] border border-white/10 bg-[#101522]/88 p-1.5 shadow-nav backdrop-blur-2xl sm:bottom-4 sm:rounded-[28px] sm:p-2">
              <div className="grid grid-cols-5 gap-1">
                {navItems.map((item) => {
                  const badgeCount = navBadges[item.href === "historial.html" ? "historial" : ""];
                  return (
                  <a
                    key={item.label}
                    href={item.href}
                    className={`relative flex h-12 flex-col items-center justify-center rounded-2xl text-[10px] font-black transition sm:h-14 sm:rounded-3xl sm:text-xs ${
                      item.active
                        ? "bg-mint text-ink shadow-[0_14px_36px_rgba(66,242,179,0.24)]"
                        : "text-slate-400 hover:bg-white/[0.06] hover:text-white"
                    }`}
                  >
                    <NotificationBadge count={badgeCount} />
                    <NavIcon name={item.icon} />
                    <span className="mt-1">{item.label}</span>
                  </a>
                  );
                })}
              </div>
            </nav>

            {isPremiumOpen && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/75 px-4 py-5 backdrop-blur-xl">
                <div className="mx-auto min-h-full w-full max-w-lg py-6">
                <div className="relative w-full rounded-[34px] border border-white/10 bg-[#101522] p-5 pb-8 shadow-2xl shadow-black/50">
                  <button
                    className="absolute right-4 top-4 grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black text-white ring-1 ring-white/10"
                    type="button"
                    onClick={() => setIsPremiumOpen(false)}
                    aria-label="Cerrar Premium"
                  >
                    ×
                  </button>
                  <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Premium Donoss</p>
                  <h2 className="mt-2 pr-12 text-3xl font-black text-white">{isBusiness ? "Plan para empresas" : "Plan para usuarios"}</h2>
                  <div className="mt-5 space-y-3">
                    {(isBusiness
                      ? ["Certificación para ganar confianza.", "Tus ofertas oficiales se muestran con más autoridad."]
                      : ["Certificación para demostrar que eres una persona real.", "Servicio de ayuda más rápido cuando lo necesites."]
                    ).map((item) => (
                      <div key={item} className="flex gap-3 rounded-2xl border border-white/10 bg-white/[0.055] p-3">
                        <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-mint text-sm font-black text-ink">✓</span>
                        <p className="text-sm font-black leading-6 text-white">{item}</p>
                      </div>
                    ))}
                  </div>
                  <div className="mt-5 rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <p className="text-sm font-black text-mint">{premiumPoints} puntos cada 31 días</p>
                    <p className="mt-1 text-xs font-bold leading-5 text-slate-300">
                      Se cobra ahora y después cada 31 días cuando entres en Donoss. Si no hay puntos suficientes, Premium se pausa y desaparece la certificación hasta que lo actives otra vez.
                    </p>
                  </div>
                  <div className="mt-5 rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <p className="text-sm font-black text-white">Verificación de identidad</p>
                        <p className="mt-1 text-xs font-bold leading-5 text-slate-400">
                          Para activar Premium necesitamos tu NIE o DNI y una foto visible. Si después quieres modificar estos datos, contacta con Donoss.
                        </p>
                      </div>
                      <span className={`shrink-0 rounded-full px-3 py-1 text-xs font-black ${premiumIdentityComplete ? "bg-mint text-ink" : "bg-sun text-ink"}`}>
                        {premiumIdentityComplete ? "Lista" : "Pendiente"}
                      </span>
                    </div>

                    {premiumIdentityComplete ? (
                      <div className="mt-4 flex items-center gap-3 rounded-2xl border border-mint/20 bg-mint/10 p-3">
                        {premiumPhoto && <img className="h-14 w-14 rounded-2xl object-cover ring-1 ring-white/10" src={premiumPhoto} alt="" />}
                        <div className="min-w-0">
                          <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">NIE / DNI</p>
                          <p className="mt-1 break-all text-sm font-black text-white">{premiumDni || premiumIdentity.dni}</p>
                          <p className="mt-1 text-xs font-bold text-slate-500">Para modificarlo, contacta con Donoss.</p>
                        </div>
                      </div>
                    ) : (
                      <div className="mt-4 grid gap-3">
                        <label className="block">
                          <span className="text-xs font-black uppercase tracking-[0.14em] text-slate-500">NIE o DNI</span>
                          <input
                            className="mt-2 h-12 w-full rounded-2xl border border-line bg-black/25 px-4 text-sm font-black uppercase text-white outline-none placeholder:text-slate-600 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                            value={premiumDni}
                            onChange={(event) => setPremiumDni(event.target.value)}
                            placeholder="Ej. 12345678Z"
                          />
                        </label>
                        <div className="grid gap-3 sm:grid-cols-[104px_1fr] sm:items-center">
                          <div className="h-28 overflow-hidden rounded-[26px] border border-white/10 bg-black/25">
                            {premiumPhoto ? (
                              <img className="h-full w-full object-cover" src={premiumPhoto} alt="" />
                            ) : (
                              <div className="grid h-full place-items-center text-center text-xs font-black text-slate-500">Foto visible</div>
                            )}
                          </div>
                          <label className="grid min-h-12 cursor-pointer place-items-center rounded-2xl border border-dashed border-mint/35 bg-mint/10 px-4 text-sm font-black text-mint">
                            Añadir foto desde galería
                            <input className="hidden" type="file" accept="image/*" onChange={handlePremiumPhotoUpload} />
                          </label>
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-sm font-black text-white" onClick={() => setIsPremiumOpen(false)}>
                      Cerrar
                    </button>
                    <button
                      className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:opacity-60"
                      onClick={() => premiumIdentityComplete ? activatePremium() : savePremiumIdentity({ activateAfter: true })}
                      disabled={isActivatingPremium || isSavingPremiumIdentity || premiumSqlMissing}
                    >
                      {isActivatingPremium || isSavingPremiumIdentity
                        ? "Preparando..."
                        : premiumIdentityComplete
                          ? premiumActive ? "Renovar ahora" : "Activar"
                          : "Guardar y activar"}
                    </button>
                  </div>
                </div>
                </div>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
