<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Categoría</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="activity-tracker.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 86% 8%, rgba(255, 107, 107, 0.13), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 44%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
      body.embedded-category main { padding-bottom: 96px; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      const isEmbeddedCategory = new URLSearchParams(window.location.search).get("embedded") === "1";
      if (isEmbeddedCategory) document.body.classList.add("embedded-category");

      const categories = [
        { label: "Libros", icon: "📚", color: "from-mint/95 to-emerald-300" },
        { label: "Cine", icon: "🎬", color: "from-coral to-rose-300" },
        { label: "Festivales", icon: "🎪", color: "from-sun to-orange-300" },
        { label: "Conciertos", icon: "🎤", color: "from-violet-400 to-fuchsia-300" },
        { label: "Museos", icon: "🏛️", color: "from-sky-300 to-cyan-200" },
        { label: "Gaming", icon: "🎮", color: "from-lime-300 to-mint" },
        { label: "Música", icon: "🎧", color: "from-indigo-300 to-violet-400" },
        { label: "Viajes", icon: "✈️", color: "from-cyan-300 to-blue-400" },
        { label: "Restaurantes", icon: "🍽️", color: "from-orange-300 to-coral" },
      ];

      function goBackToInicio(event) {
        if (!isEmbeddedCategory || window.parent === window) return;
        event.preventDefault();
        window.parent.postMessage({ type: "donos:navigate", route: "inicio" }, window.location.origin);
      }

      function formatEuro(value) {
        if (value === null || value === undefined || value === "") return "—";
        return `${Number(value).toLocaleString("es-ES", { maximumFractionDigits: 2 })}€`;
      }

      function getDiscountPercent(basePrice, reducedPrice) {
        const base = Number(basePrice);
        const reduced = Number(reducedPrice);
        if (!base || !Number.isFinite(base) || !Number.isFinite(reduced) || reduced >= base) return null;
        return Math.round(((base - reduced) / base) * 100);
      }

      function getRemainingStock(offer) {
        if (offer.stock_quantity === null || offer.stock_quantity === undefined || offer.stock_quantity === "") return null;
        return Math.max(Number(offer.stock_quantity || 0) - Number(offer.sold_count || 0), 0);
      }

      function isOutOfStock(offer) {
        const remaining = getRemainingStock(offer);
        return remaining !== null && remaining <= 0;
      }

      function isVisibleForUsers(offer) {
        if (offer.is_hidden) return false;
        const today = new Date().toISOString().slice(0, 10);
        const validUntil = offer.qr_valid_until || offer.end_date || null;
        if (validUntil && String(validUntil).slice(0, 10) < today) return false;
        if (!isOutOfStock(offer)) return true;
        if (!offer.out_of_stock_since) return true;
        return Date.now() - new Date(offer.out_of_stock_since).getTime() < 24 * 60 * 60 * 1000;
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-5 w-5 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3.5 w-3.5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function notifyLikesChanged() {
        if (isEmbeddedCategory && window.parent !== window) {
          window.parent.postMessage({ type: "donos:likes-changed" }, window.location.origin);
        }
      }

      function matchesSearch(offer, query) {
        const cleanQuery = query.trim().toLowerCase();
        if (!cleanQuery) return true;

        return [
          offer.title,
          offer.address,
          offer.author,
          offer.business_display_name,
          offer.receiver_display_name,
          offer.description,
          offer.categories?.join(" "),
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase()
          .includes(cleanQuery);
      }

      function openCategoryInsideApp(category) {
        if (isEmbeddedCategory && window.parent !== window) {
          window.parent.postMessage({ type: "donos:category", category }, window.location.origin);
          return;
        }
        window.location.href = `category.html?category=${encodeURIComponent(category)}`;
      }

      function CategoryDiscovery({ items, currentCategory }) {
        const visibleItems = (items || []).filter((item) => Number(item.count || 0) > 0 && item.category !== currentCategory);
        if (visibleItems.length === 0) return null;

        return (
          <section className="mt-5 rounded-[28px] border border-white/10 bg-white/[0.045] p-4 shadow-2xl shadow-black/20 sm:p-5">
            <div className="mb-4 flex items-center justify-between gap-3">
              <div>
                <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Ver más</p>
                <h2 className="mt-1 text-xl font-black text-white">Secciones con ofertas</h2>
              </div>
              <button
                className="shrink-0 rounded-full bg-white/[0.08] px-4 py-2 text-xs font-black text-white ring-1 ring-white/10"
                onClick={() => openCategoryInsideApp(visibleItems[0].category)}
              >
                Abrir
              </button>
            </div>
            <div className="no-scrollbar -mx-4 flex gap-3 overflow-x-auto px-4 pb-1 sm:mx-0 sm:grid sm:grid-cols-2 sm:px-0 lg:grid-cols-3">
              {visibleItems.map((item) => {
                const categoryData = categories.find((category) => category.label === item.category) || categories[0];
                return (
                  <button
                    key={item.category}
                    className="group relative min-h-[126px] min-w-[205px] overflow-hidden rounded-[24px] border border-white/10 bg-[#101522] p-4 text-left shadow-xl shadow-black/20 transition hover:-translate-y-0.5 hover:border-mint/30"
                    onClick={() => openCategoryInsideApp(item.category)}
                  >
                    {item.preview?.cover_photo_data_url && (
                      <img className="absolute inset-0 h-full w-full object-cover opacity-35 transition group-hover:opacity-45" src={item.preview.cover_photo_data_url} alt="" />
                    )}
                    <div className={`absolute inset-0 bg-gradient-to-br ${categoryData.color} opacity-20`}></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/35 to-transparent"></div>
                    <div className="relative flex h-full flex-col justify-between gap-4">
                      <div className="flex items-center justify-between gap-3">
                        <span className="grid h-10 w-10 place-items-center rounded-2xl bg-white/12 text-2xl ring-1 ring-white/10">{categoryData.icon}</span>
                        <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">{item.count} ofertas</span>
                      </div>
                      <div>
                        <p className="text-lg font-black text-white">{item.category}</p>
                        <p className="mt-1 truncate text-xs font-bold text-slate-300">{item.preview?.title || "Ver ofertas"}</p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </section>
        );
      }

      function buildCategorySummaryFromOffers(offers) {
        const visibleOffers = (offers || []).filter(isVisibleForUsers);
        return categories.map((category) => {
          const categoryOffers = visibleOffers.filter((offer) => (offer.categories || []).includes(category.label));
          const preview = categoryOffers[0] || null;
          return {
            category: category.label,
            count: categoryOffers.length,
            preview: preview
              ? {
                  id: preview.id,
                  title: preview.title,
                  cover_photo_data_url: preview.cover_photo_data_url || preview.presentation_image_data_urls?.[0] || "",
                  required_points: preview.required_points,
                  business_display_name: preview.business_display_name,
                  business_is_verified: Boolean(preview.business_is_verified),
                }
              : null,
          };
        });
      }

      function OfferCard({ offer, isLiked, onLike }) {
        const discountPercent = getDiscountPercent(offer.base_price, offer.reduced_price);
        const businessName = offer.business_display_name || offer.receiver_display_name || offer.author || "";
        const outOfStock = isOutOfStock(offer);
        const isExternalCheckout = Boolean(offer.external_checkout_enabled);
        const detailUrl = `offer-detail.html?id=${offer.id}`;
        return (
          <article className="overflow-hidden rounded-[28px] border border-white/10 bg-white/[0.055] shadow-2xl shadow-black/20">
            <div className="block w-full cursor-pointer text-left" role="button" tabIndex="0" onClick={() => {
              if (isEmbeddedCategory && window.parent !== window) window.parent.postMessage({ type: "donos:offer-detail", id: offer.id }, window.location.origin);
              else window.location.href = detailUrl;
            }}>
              <div className="relative min-h-[190px] bg-gradient-to-br from-mint via-[#183047] to-[#FF6B6B]">
                {offer.cover_photo_data_url ? (
                  <img className="absolute inset-0 h-full w-full object-cover" src={offer.cover_photo_data_url} alt="" />
                ) : (
                  <div className="absolute bottom-4 right-5 text-7xl">📚</div>
                )}
                <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
                <button
                  className={`absolute left-4 top-4 z-10 grid h-11 w-11 place-items-center rounded-full text-xl shadow-2xl ring-1 backdrop-blur transition active:scale-90 ${
                    isLiked ? "bg-coral text-white ring-coral/30" : "bg-black/35 text-white ring-white/15"
                  }`}
                  type="button"
                  aria-label={isLiked ? "Quitar de me gusta" : "Guardar en me gusta"}
                  onClick={(event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    onLike?.(offer);
                  }}
                >
                  {isLiked ? "♥" : "♡"}
                </button>
                <div className="absolute bottom-4 left-4 right-4 flex items-end justify-between gap-3">
                  <div>
                    <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">{offer.categories?.[0] || "Oferta"}</p>
                    <h2 className="mt-1 break-words text-xl font-black leading-tight text-white sm:text-2xl">{offer.title || "Oferta sin título"}</h2>
                  </div>
	                  <div className="flex flex-col items-end gap-2">
	                    {outOfStock && (
	                      <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">Agotado</span>
	                    )}
	                    {discountPercent !== null && (
	                      <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">-{discountPercent}%</span>
	                    )}
                    {isExternalCheckout ? (
                      <span className="rounded-full bg-sun px-3 py-1 text-xs font-black text-ink">No disponible en puntos</span>
                    ) : (
                      <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">{offer.required_points || 0} ptos.</span>
                    )}
                  </div>
                </div>
              </div>

              <div className="p-4">
                <div className="flex items-start justify-between gap-3">
                  <p className="text-sm font-semibold leading-5 text-slate-400">{offer.address || "Donostia"}</p>
                  <div className="text-right">
                    {isExternalCheckout ? (
                      <p className="text-xl font-black text-white">{formatEuro(offer.reduced_price || offer.base_price)}</p>
                    ) : offer.base_price !== null && <p className="text-xl font-black text-slate-400 line-through">{formatEuro(offer.base_price)}</p>}
                  </div>
                </div>
                {businessName && (
                  <div className="mt-3 inline-flex max-w-full items-center gap-2 rounded-full border border-white/10 bg-white/[0.06] px-3 py-1.5 text-xs font-black text-slate-200">
                    <span className="truncate">{businessName}</span>
                    {offer.business_is_verified && <VerifiedBadge />}
                  </div>
                )}
	                <div className={`mt-4 h-11 rounded-2xl py-3 text-center text-sm font-black ring-1 ${
                    outOfStock ? "bg-coral/10 text-coral ring-coral/20" : "bg-white/[0.08] text-white ring-white/10"
                  }`}>
                    {outOfStock ? "Ver agotado" : "Ver detalles"}
                  </div>
              </div>
            </div>
          </article>
        );
      }

      function App() {
        const params = new URLSearchParams(window.location.search);
        const category = params.get("category") || "Libros";
        const backUrl = isEmbeddedCategory ? "#" : "app.html#inicio";
        const [offers, setOffers] = React.useState([]);
        const [likedOfferIds, setLikedOfferIds] = React.useState(new Set());
        const [likeToast, setLikeToast] = React.useState("");
        const [search, setSearch] = React.useState("");
        const [status, setStatus] = React.useState("Cargando ofertas...");
        const [categorySummary, setCategorySummary] = React.useState([]);
        const filteredOffers = offers.filter((offer) => matchesSearch(offer, search));

        const loadOffers = React.useCallback(async ({ silent = false } = {}) => {
            if (!silent) setStatus("Cargando ofertas...");
            const { data, error } = await supabaseClient
              .from("business_offers")
              .select("*")
              .contains("categories", [category])
              .order("created_at", { ascending: false });

            if (error) {
              setStatus("No se han podido cargar las ofertas.");
              return;
            }

            const visibleOffers = (data || []).filter(isVisibleForUsers);
            setOffers(visibleOffers);
            setStatus(visibleOffers.length ? "" : `Todavía no hay ofertas en ${category}.`);
        }, [category]);

        React.useEffect(() => {
          loadOffers();
          loadLikedOffers();
          loadCategorySummary();
        }, [loadOffers]);

        async function loadCategorySummary() {
          try {
            const response = await fetch("/api/offers/categories/summary");
            const data = await response.json().catch(() => ({}));
            if (response.ok) {
              setCategorySummary(data.categories || []);
              return;
            }
          } catch (error) {
            // Fallback below keeps empty sections helpful even before the API is refreshed.
          }

          try {
            const { data, error } = await supabaseClient
              .from("business_offers")
              .select("id,title,cover_photo_data_url,presentation_image_data_urls,categories,base_price,reduced_price,required_points,external_checkout_enabled,external_checkout_url,business_display_name,business_is_verified,is_hidden,stock_quantity,sold_count,out_of_stock_since,created_at")
              .order("created_at", { ascending: false })
              .limit(250);
            if (error) throw error;
            setCategorySummary(buildCategorySummaryFromOffers(data || []));
          } catch (error) {
            setCategorySummary([]);
          }
        }

        async function loadLikedOffers() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) return;
          try {
            const response = await fetch("/api/me/liked-offers", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok) setLikedOfferIds(new Set(data.offer_ids || []));
          } catch (error) {
            setLikedOfferIds(new Set());
          }
        }

        async function toggleLike(offer) {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent(`category.html?category=${category}`)}`;
            return;
          }

          const nextLiked = !likedOfferIds.has(offer.id);
          setLikedOfferIds((current) => {
            const next = new Set(current);
            if (nextLiked) next.add(offer.id);
            else next.delete(offer.id);
            return next;
          });
          setLikeToast(nextLiked ? "Guardado en Me gusta" : "Quitado de Me gusta");
          window.setTimeout(() => setLikeToast(""), 1500);

          const response = await fetch("/api/me/liked-offers", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ offerId: offer.id, liked: nextLiked }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            setLikedOfferIds((current) => {
              const next = new Set(current);
              if (nextLiked) next.delete(offer.id);
              else next.add(offer.id);
              return next;
            });
            setLikeToast(data.error === "liked_offers_table_missing" ? "Ejecuta el SQL de Me gusta" : "No se ha podido guardar");
            window.setTimeout(() => setLikeToast(""), 2200);
          } else {
            notifyLikesChanged();
          }
        }

        React.useEffect(() => {
          function handleMessage(event) {
            if (event.origin !== window.location.origin) return;
            if (event.data?.type !== "donos:refresh-category") return;
            loadOffers({ silent: true });
            loadCategorySummary();
          }

          window.addEventListener("message", handleMessage);
          return () => window.removeEventListener("message", handleMessage);
        }, [loadOffers]);

        const activeCategorySummary = categorySummary.filter((item) => Number(item.count || 0) > 0 && item.category !== category);
        const emptyCategoryText = activeCategorySummary.length
          ? `Todavía no hay ofertas en ${category}, pero puedes explorar estas secciones activas.`
          : `Todavía no hay ofertas en ${category}.`;

        return (
          <main className="mx-auto min-h-screen w-full max-w-5xl px-3 pb-10 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between">
              <a href={backUrl} onClick={goBackToInicio} className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-mint text-lg font-black text-ink shadow-glow">D</div>
                <div>
                  <p className="text-lg font-black leading-tight">Donoss</p>
                  <p className="text-xs font-semibold text-slate-400">Categorías</p>
                </div>
              </a>
              <a className="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-bold text-slate-200" href={backUrl} onClick={goBackToInicio}>Volver</a>
            </header>

            <section className="mt-8">
              <p className="text-sm font-bold uppercase tracking-[0.16em] text-mint">Explorar</p>
              <div className="mt-2 flex items-end justify-between gap-3">
                <h1 className="break-words text-3xl font-black tracking-normal text-white sm:text-4xl">{category}</h1>
                {activeCategorySummary.length > 0 && (
                  <button
                    className="shrink-0 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200 transition hover:bg-white/[0.1]"
                    onClick={() => openCategoryInsideApp(activeCategorySummary[0].category)}
                  >
                    Ver más
                  </button>
                )}
              </div>
            </section>

            <section className="mt-6">
              <div className="mb-4 rounded-[26px] border border-white/10 bg-white/[0.055] p-3 shadow-2xl shadow-black/20">
                <label className="flex items-center gap-3">
                  <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                  <input
                    className="h-11 min-w-0 flex-1 bg-transparent text-base font-bold text-white outline-none placeholder:text-slate-500"
                    value={search}
                    onChange={(event) => setSearch(event.target.value)}
                    placeholder={`Buscar en ${category}...`}
                  />
                </label>
              </div>

              {status ? (
                <div>
                  <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                    {status.includes("Todavía no hay ofertas") ? emptyCategoryText : status}
                  </div>
                  <CategoryDiscovery items={categorySummary} currentCategory={category} />
                </div>
              ) : filteredOffers.length === 0 ? (
                <div>
                  <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                    No hay resultados para esta búsqueda.
                  </div>
                  <CategoryDiscovery items={categorySummary} currentCategory={category} />
                </div>
              ) : (
                <div>
                  <div className="grid gap-4 sm:grid-cols-2">
                    {filteredOffers.map((offer) => (
                      <OfferCard
                        key={offer.id}
                        offer={offer}
                        isLiked={likedOfferIds.has(offer.id)}
                        onLike={toggleLike}
                      />
                    ))}
                  </div>
                  <CategoryDiscovery items={categorySummary} currentCategory={category} />
                </div>
              )}
            </section>

            {likeToast && (
              <div className="fixed left-1/2 top-1/2 z-[60] -translate-x-1/2 -translate-y-1/2 rounded-[28px] border border-mint/25 bg-[#101522]/95 px-6 py-5 text-center shadow-2xl shadow-mint/10 backdrop-blur-2xl">
                <div className="mx-auto grid h-14 w-14 place-items-center rounded-full bg-mint text-2xl text-ink shadow-glow">♥</div>
                <p className="mt-3 whitespace-nowrap text-base font-black text-white">{likeToast}</p>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
