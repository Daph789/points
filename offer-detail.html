<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Detalle</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="activity-tracker.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          linear-gradient(180deg, #0a0e19 0%, #060914 44%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
      const isEmbeddedDetail = new URLSearchParams(window.location.search).get("embedded") === "1";

      function goBackFromDetail() {
        if (isEmbeddedDetail && window.parent !== window) {
          window.parent.postMessage({ type: "donos:detail-back" }, window.location.origin);
          return;
        }
        history.back();
      }

      function openBusinessProfileFromDetail(event, businessId) {
        if (!businessId) return;
        if (isEmbeddedDetail && window.parent !== window) {
          event.preventDefault();
          const encodedId = encodeURIComponent(businessId);
          window.parent.postMessage({ type: "donos:business-profile", id: businessId }, window.location.origin);
          try {
            window.parent.location.hash = `empresa=${encodedId}`;
          } catch (_error) {
            window.parent.location.href = `app.html#empresa=${encodedId}`;
          }
        }
      }

      function formatEuro(value) {
        if (value === null || value === undefined || value === "") return "—";
        return `${Number(value).toLocaleString("es-ES", { maximumFractionDigits: 2 })}€`;
      }

      function getDiscountPercent(basePrice, reducedPrice) {
        const base = Number(basePrice);
        const reduced = Number(reducedPrice);
        if (!base || !Number.isFinite(base) || !Number.isFinite(reduced) || reduced >= base) return null;
        return Math.round(((base - reduced) / base) * 100);
      }

      function getRemainingStock(offer) {
        if (offer.stock_quantity === null || offer.stock_quantity === undefined || offer.stock_quantity === "") return null;
        return Math.max(Number(offer.stock_quantity || 0) - Number(offer.sold_count || 0), 0);
      }

      function normalizeAdditionalLinks(items) {
        return (Array.isArray(items) ? items : [])
          .map((item) => ({
            label: String(item?.label || "").trim(),
            url: String(item?.url || "").trim(),
          }))
          .filter((item) => item.label && item.url)
          .slice(0, 6);
      }

      function normalizeAdditionalDetails(items) {
        return (Array.isArray(items) ? items : [])
          .map((item) => ({
            label: String(item?.label || "").trim(),
            value: String(item?.value || "").trim(),
          }))
          .filter((item) => item.label && item.value)
          .slice(0, 8);
      }

      function safeExternalUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        const withProtocol = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
        try {
          const url = new URL(withProtocol);
          return ["http:", "https:"].includes(url.protocol) ? url.href : "";
        } catch {
          return "";
        }
      }

      function isOutOfStock(offer) {
        const remaining = getRemainingStock(offer);
        return remaining !== null && remaining <= 0;
      }

      function isOfferExpired(offer) {
        const today = new Date().toISOString().slice(0, 10);
        const validUntil = offer?.qr_valid_until || offer?.end_date || null;
        return Boolean(validUntil && String(validUntil).slice(0, 10) < today);
      }

      function VerifiedBadge() {
        return (
          <span className="relative inline-grid h-6 w-6 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_20px_rgba(14,165,233,0.5)] ring-2 ring-white/20" title="Cuenta certificada">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-4 w-4" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      const reservationWeekdayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      const defaultReservationWeekdays = [1, 2, 3, 4, 5, 6, 0];

      function reservationDaysLabel(value) {
        const source = Array.isArray(value) ? value : defaultReservationWeekdays;
        const days = [...new Set(source.map((day) => Number(day)).filter((day) => Number.isInteger(day) && day >= 0 && day <= 6))];
        return (days.length ? days : defaultReservationWeekdays).map((day) => reservationWeekdayNames[day]).join(", ");
      }

      function App() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const [offer, setOffer] = React.useState(null);
        const [status, setStatus] = React.useState("Cargando detalle...");
        const [canEdit, setCanEdit] = React.useState(false);
        const [activeImageIndex, setActiveImageIndex] = React.useState(null);
        const [deliveryChoice, setDeliveryChoice] = React.useState("");
        const [isLiked, setIsLiked] = React.useState(false);
        const [likeToast, setLikeToast] = React.useState("");
        const [touchStartX, setTouchStartX] = React.useState(null);
        const [dragDelta, setDragDelta] = React.useState(0);

        React.useEffect(() => {
          async function loadOffer() {
            try {
              const { data: sessionData } = await supabaseClient.auth.getSession();
              let payload = {};

              const { data: directOffer, error } = await supabaseClient
                .from("business_offers")
                .select("*")
                .eq("id", id)
                .maybeSingle();
              if (!error && directOffer) {
                const viewerId = sessionData.session?.user?.id || "";
                payload = { offer: directOffer, can_edit: Boolean(viewerId && viewerId === directOffer.business_id) };
              } else if (window.location.protocol !== "file:") {
                const headers = sessionData.session?.access_token ? { Authorization: `Bearer ${sessionData.session.access_token}` } : {};
                const response = await fetch(`/api/offers/${encodeURIComponent(id)}`, { headers });
                payload = await response.json().catch(() => ({}));
                if (!response.ok || !payload.offer) {
                  setStatus(payload.error === "offer_expired" ? "Esta oferta ha caducado." : payload.error === "offer_hidden" ? "Esta oferta ya no está disponible." : "No hemos encontrado esta oferta.");
                  return;
                }
              } else {
                setStatus("No hemos encontrado esta oferta.");
                return;
              }

              const data = payload.offer;
              setCanEdit(Boolean(payload.can_edit));
              if (data.is_hidden && !payload.can_edit) {
                setStatus("Esta oferta ya no está disponible.");
                return;
              }
              if (isOfferExpired(data) && !payload.can_edit) {
                setStatus("Esta oferta ha caducado.");
                return;
              }
              let nextOffer = data;
              if (data.business_id && window.location.protocol !== "file:") {
                try {
                  const profileResponse = await fetch(`/api/businesses/${encodeURIComponent(data.business_id)}/profile`);
                  const profileData = await profileResponse.json().catch(() => ({}));
                  if (profileResponse.ok && profileData.business) {
                    nextOffer = {
                      ...data,
                      business_display_name: profileData.business.display_name || data.business_display_name,
                      business_is_verified: Boolean(profileData.business.is_verified || data.business_is_verified),
                    };
                  }
                } catch (_error) {
                  nextOffer = data;
                }
              }
              setOffer(nextOffer);
              setDeliveryChoice(data.delivery_pickup_enabled ? "pickup" : data.delivery_home_enabled ? "home" : "none");
              setStatus("");
            } catch (error) {
              console.error("Offer detail load error:", error);
              setStatus("No se ha podido cargar el detalle. Inténtalo otra vez.");
            }
          }

          loadOffer();
          loadLikedState();
        }, [id]);

        async function loadLikedState() {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) return;
          try {
            const response = await fetch("/api/me/liked-offers", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok) setIsLiked((data.offer_ids || []).includes(id));
          } catch (error) {
            setIsLiked(false);
          }
        }

        async function toggleLike() {
          if (!offer?.id) return;
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const token = sessionData.session?.access_token;
          if (!token) {
            window.location.href = `login.html?next=${encodeURIComponent(`offer-detail.html?id=${offer.id}`)}`;
            return;
          }

          const nextLiked = !isLiked;
          setIsLiked(nextLiked);
          setLikeToast(nextLiked ? "Guardado en Me gusta" : "Quitado de Me gusta");
          window.setTimeout(() => setLikeToast(""), 1500);

          const response = await fetch("/api/me/liked-offers", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ offerId: offer.id, liked: nextLiked }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            setIsLiked(!nextLiked);
            setLikeToast(data.error === "liked_offers_table_missing" ? "Ejecuta el SQL de Me gusta" : "No se ha podido guardar");
            window.setTimeout(() => setLikeToast(""), 2200);
          } else if (isEmbeddedDetail && window.parent !== window) {
            window.parent.postMessage({ type: "donos:likes-changed" }, window.location.origin);
          }
        }

        const liveGallery = offer?.presentation_image_data_urls || [];
        const liveAllImages = offer ? [offer.cover_photo_data_url, ...liveGallery].filter(Boolean) : [];
        const activeImage = activeImageIndex !== null ? liveAllImages[activeImageIndex] : null;

        React.useEffect(() => {
          if (!isEmbeddedDetail || window.parent === window) return undefined;
          window.parent.postMessage({ type: activeImage ? "donos:hide-nav" : "donos:show-nav" }, window.location.origin);
          return () => window.parent.postMessage({ type: "donos:show-nav" }, window.location.origin);
        }, [activeImage]);

        if (status) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">{status}</div>
            </main>
          );
        }

        const gallery = liveGallery;
        const allImages = liveAllImages;
        const discountPercent = getDiscountPercent(offer.base_price, offer.reduced_price);
        const mapsUrl = offer.address
          ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${offer.address} Donostia`)}`
          : "";
        const dateRange = [offer.start_date, offer.end_date].filter(Boolean).join(" - ");
        const isExternalCheckout = Boolean(offer.external_checkout_enabled && safeExternalUrl(offer.external_checkout_url));
        const basePoints = isExternalCheckout ? 0 : Number(offer.required_points || 0);
        const hasDeliveryOptions = Boolean(offer.delivery_pickup_enabled || offer.delivery_home_enabled);
        const deliveryExtraPoints = isExternalCheckout ? 0 : (deliveryChoice === "home" ? Number(offer.delivery_home_points || 0) : 0);
        const totalPoints = basePoints + deliveryExtraPoints;
        const businessName = offer.business_display_name || offer.receiver_display_name || offer.author || "";
        const remainingStock = getRemainingStock(offer);
        const outOfStock = isOutOfStock(offer);
        const canBuy = Boolean(deliveryChoice && !outOfStock && (isExternalCheckout || totalPoints > 0));
        const actionButtonText = (offer.cart_button_text || "Comprar").trim() || "Comprar";
        const additionalLinks = normalizeAdditionalLinks(offer.additional_links);
        const additionalDetails = normalizeAdditionalDetails(offer.additional_details);
        const checkoutDockClass = `fixed left-0 right-0 z-40 border-t border-white/10 bg-[#060914]/88 px-4 py-4 backdrop-blur-2xl ${
          isEmbeddedDetail ? "bottom-[92px] sm:bottom-[104px]" : "bottom-0"
        }`;
        const goToCheckout = () => {
          if (!canBuy) return;
          const checkoutUrl = `checkout.html?id=${offer.id}&delivery=${deliveryChoice}${isEmbeddedDetail ? "&from=app" : ""}`;
          if (isEmbeddedDetail && window.parent !== window) window.parent.location.href = checkoutUrl;
          else window.location.href = checkoutUrl;
        };
        const resetDrag = () => {
          setTouchStartX(null);
          setDragDelta(0);
        };
        const openImage = (index) => {
          resetDrag();
          setActiveImageIndex(index);
        };
        const closeImage = () => {
          resetDrag();
          setActiveImageIndex(null);
        };
        const showPreviousImage = () => {
          resetDrag();
          setActiveImageIndex((current) => (current === 0 ? allImages.length - 1 : current - 1));
        };
        const showNextImage = () => {
          resetDrag();
          setActiveImageIndex((current) => (current === allImages.length - 1 ? 0 : current + 1));
        };
        const handleTouchStart = (event) => {
          if (allImages.length < 2) return;
          setTouchStartX(event.touches[0].clientX);
          setDragDelta(0);
        };
        const handleTouchMove = (event) => {
          if (touchStartX === null) return;
          setDragDelta(event.touches[0].clientX - touchStartX);
        };
        const handleTouchEnd = () => {
          if (touchStartX === null) return;
          if (dragDelta > 70) {
            showPreviousImage();
          } else if (dragDelta < -70) {
            showNextImage();
          } else {
            resetDrag();
          }
        };
        return (
          <main className={`mx-auto min-h-screen w-full max-w-5xl ${isEmbeddedDetail ? "pb-64" : "pb-44"}`}>
            <section className="relative min-h-[360px] overflow-hidden rounded-b-[30px] bg-gradient-to-br from-mint via-[#183047] to-[#FF6B6B] sm:min-h-[420px] sm:rounded-b-[36px]">
              {offer.cover_photo_data_url ? (
                <button className="absolute inset-0 block h-full w-full cursor-zoom-in" onClick={() => openImage(0)}>
                  <img className="h-full w-full object-cover" src={offer.cover_photo_data_url} alt="" />
                </button>
              ) : (
                <div className="absolute bottom-16 right-8 text-8xl">📚</div>
              )}
              <div className="absolute inset-0 bg-gradient-to-t from-[#060914] via-black/25 to-black/20"></div>
              <header className="relative z-10 flex items-center justify-between px-4 pt-5 sm:px-6 lg:px-8">
                <button className="rounded-full bg-black/30 px-4 py-2 text-sm font-black text-white backdrop-blur" onClick={goBackFromDetail}>
                  Volver
                </button>
                <div className="flex items-center gap-2">
                  <button
                    className={`grid h-10 w-10 place-items-center rounded-full text-xl shadow-2xl ring-1 backdrop-blur transition active:scale-90 ${
                      isLiked ? "bg-coral text-white ring-coral/30" : "bg-black/30 text-white ring-white/15"
                    }`}
                    type="button"
                    aria-label={isLiked ? "Quitar de me gusta" : "Guardar en me gusta"}
                    onClick={toggleLike}
                  >
                    {isLiked ? "♥" : "♡"}
                  </button>
                  {canEdit && (
                    <a
                      className="rounded-full bg-white/10 px-3 py-1.5 text-xs font-black text-white ring-1 ring-white/10 backdrop-blur transition hover:bg-white/15"
                      href={`admin-offer.html?id=${offer.id}`}
                    >
                      Editar
                    </a>
                  )}
	                  {discountPercent !== null && (
	                    <span className="rounded-full bg-coral px-3 py-1.5 text-xs font-black text-white">-{discountPercent}%</span>
	                  )}
                  {outOfStock && (
                    <span className="rounded-full bg-coral px-3 py-1.5 text-xs font-black text-white">Agotado</span>
                  )}
                  {isExternalCheckout ? (
                    <span className="rounded-full bg-sun px-3 py-1.5 text-xs font-black text-ink">No disponible en puntos</span>
                  ) : (
	                  <span className="rounded-full bg-mint px-3 py-1.5 text-xs font-black text-ink">{offer.required_points || 0} ptos.</span>
                  )}
                </div>
              </header>
              <div className="absolute bottom-8 left-4 right-4 z-10 sm:left-6 sm:right-6 lg:left-8 lg:right-8">
                <p className="text-sm font-black uppercase tracking-[0.18em] text-mint">{offer.categories?.[0] || "Oferta"}</p>
                <h1 className="mt-2 max-w-3xl break-words text-3xl font-black leading-tight text-white sm:text-5xl">{offer.title || "Oferta sin título"}</h1>
                {businessName && (
                  <a
                    className="mt-4 inline-flex items-center gap-2 rounded-full bg-black/35 px-4 py-2 text-sm font-black text-white ring-1 ring-white/10 backdrop-blur transition hover:bg-mint hover:text-ink"
                    href={offer.business_id ? `business-profile.html?id=${encodeURIComponent(offer.business_id)}` : "#"}
                    onClick={(event) => openBusinessProfileFromDetail(event, offer.business_id)}
                  >
                    <span>{businessName}</span>
                    {offer.business_is_verified && <VerifiedBadge />}
                  </a>
                )}
                {offer.author && (
                  <div className="mt-4 inline-flex items-center gap-2 rounded-full bg-black/35 px-4 py-2 text-sm font-black text-white ring-1 ring-white/10 backdrop-blur">
                    <span className="grid h-7 w-7 place-items-center rounded-full bg-white/10 text-slate-100 ring-1 ring-white/10">
                      <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.3" aria-hidden="true">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2V6a2 2 0 0 1 2-2h2" />
                        <path d="M9 4.5a3 3 0 0 1 6 0V6H9V4.5Z" />
                        <path d="M8 11h8M8 15h5" />
                      </svg>
                    </span>
                    <span>Por {offer.author}</span>
                  </div>
                )}
              </div>
            </section>

            <section className="px-4 pt-6 sm:px-6 lg:px-8">
              <div className="grid gap-3 sm:grid-cols-2">
                <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                  <p className="text-xs font-semibold text-slate-400">Precio base</p>
                  <p className="mt-1 text-3xl font-black line-through decoration-slate-500">{formatEuro(offer.base_price)}</p>
                </div>
                <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                  <p className="text-xs font-semibold text-mint">{isExternalCheckout ? "Precio externo" : "Puntos"}</p>
                  <p className="mt-1 text-3xl font-black">{isExternalCheckout ? formatEuro(offer.reduced_price || offer.base_price) : (offer.required_points || 0)}</p>
                </div>
                {isExternalCheckout && (
                  <div className="rounded-3xl border border-sun/25 bg-sun/10 p-4 sm:col-span-2">
                    <p className="text-xs font-semibold text-sun">No disponible en puntos</p>
                    <p className="mt-1 text-sm font-bold leading-6 text-slate-200">Esta oferta se paga en euros en la web del comercio.</p>
                  </div>
                )}
	                {discountPercent !== null && (
	                  <div className="rounded-3xl border border-coral/25 bg-coral/10 p-4 sm:col-span-2">
	                    <p className="text-xs font-semibold text-coral">Descuento</p>
	                    <p className="mt-1 text-3xl font-black">-{discountPercent}%</p>
	                  </div>
	                )}
                {remainingStock !== null && (
                  <div className={`rounded-3xl border p-4 sm:col-span-2 ${
                    outOfStock ? "border-coral/25 bg-coral/10" : "border-white/10 bg-white/[0.055]"
                  }`}>
                    <p className={`text-xs font-semibold ${outOfStock ? "text-coral" : "text-slate-400"}`}>Disponibilidad</p>
                    <p className="mt-1 text-3xl font-black">{outOfStock ? "Agotado" : `${remainingStock} disponibles`}</p>
                  </div>
                )}
	              </div>

              {allImages.length > 0 && (
                <div className="no-scrollbar -mx-4 mt-6 flex gap-3 overflow-x-auto px-4 sm:mx-0 sm:px-0">
                  {allImages.map((src, index) => (
                    <button
                      key={index}
                      className="group relative h-36 min-w-[180px] overflow-hidden rounded-3xl border border-white/10 bg-white/[0.055] sm:h-40 sm:min-w-[220px]"
                      onClick={() => openImage(index)}
                    >
                      <img className="h-full w-full object-cover transition duration-300 group-hover:scale-105" src={src} alt="" />
                      <div className="absolute inset-0 bg-black/0 transition group-hover:bg-black/20"></div>
                      <span className="absolute bottom-3 right-3 rounded-full bg-black/50 px-3 py-1 text-xs font-black text-white backdrop-blur">Ver</span>
                    </button>
                  ))}
                </div>
              )}

              {offer.description && (
                <section className="mt-7">
                  <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Descripción</p>
                  <p className="mt-3 text-base leading-7 text-slate-300">{offer.description}</p>
                </section>
              )}

              {(additionalLinks.length > 0 || additionalDetails.length > 0) && (
                <section className="mt-7 rounded-[28px] border border-white/10 bg-white/[0.045] p-5">
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <p className="text-sm font-bold uppercase tracking-[0.16em] text-mint">Información adicional</p>
                      <p className="mt-1 text-sm font-semibold text-slate-400">Detalles útiles antes de comprar.</p>
                    </div>
                    <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg ring-1 ring-mint/20">↗</span>
                  </div>

                  {additionalLinks.length > 0 && (
                    <div className="mt-4 flex flex-wrap gap-2">
                      {additionalLinks.map((link, index) => {
                        const href = safeExternalUrl(link.url);
                        if (!href) return null;
                        return (
                          <a
                            key={`${link.label}-${index}`}
                            className="inline-flex min-h-11 items-center gap-2 rounded-2xl border border-mint/20 bg-mint/10 px-4 py-2 text-sm font-black text-mint transition hover:bg-mint hover:text-ink"
                            href={href}
                            target="_blank"
                            rel="noreferrer"
                          >
                            <span>{link.label}</span>
                            <span aria-hidden="true">↗</span>
                          </a>
                        );
                      })}
                    </div>
                  )}

                  {additionalDetails.length > 0 && (
                    <div className="mt-4 grid gap-3 sm:grid-cols-2">
                      {additionalDetails.map((detail, index) => (
                        <div key={`${detail.label}-${index}`} className="rounded-2xl border border-white/10 bg-black/20 p-4">
                          <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">{detail.label}</p>
                          <p className="mt-2 text-sm font-black leading-5 text-white">{detail.value}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </section>
              )}

              <section className="mt-8 space-y-5">
                {offer.categories?.length > 0 && (
                  <div>
                    <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Categoría</p>
                    <div className="mt-3 flex flex-wrap gap-2">
                      {offer.categories.map((category) => (
                        <span key={category} className="rounded-full border border-mint/20 bg-mint/10 px-4 py-2 text-sm font-black text-mint">
                          {category}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                <div className="grid gap-3 sm:grid-cols-3">
                  {offer.hours && (
                    <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                      <div className="mb-4 grid h-11 w-11 place-items-center rounded-2xl bg-mint/10 text-xl ring-1 ring-mint/20">⏱</div>
                      <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Horarios</p>
                      <p className="mt-2 text-base font-black leading-snug text-white">{offer.hours}</p>
                    </div>
                  )}
                  {dateRange && (
                    <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                      <div className="mb-4 grid h-11 w-11 place-items-center rounded-2xl bg-coral/10 text-xl ring-1 ring-coral/20">⌁</div>
                      <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Fechas</p>
                      <p className="mt-2 text-base font-black leading-snug text-white">{dateRange}</p>
                    </div>
                  )}
                  {offer.age && (
                    <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4">
                      <div className="mb-4 grid h-11 w-11 place-items-center rounded-2xl bg-white/10 text-xl ring-1 ring-white/10">16+</div>
                      <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Edad</p>
                      <p className="mt-2 text-base font-black leading-snug text-white">{offer.age}</p>
                    </div>
                  )}
                </div>

                {offer.address ? (
                  <a
                    className="group flex items-center justify-between gap-4 rounded-3xl border border-white/10 bg-white/[0.055] p-4 transition hover:border-mint/30 hover:bg-mint/10"
                    href={mapsUrl}
                    target="_blank"
                    rel="noreferrer"
                  >
                    <div className="flex min-w-0 items-center gap-4">
                      <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-mint/10 text-xl ring-1 ring-mint/20">⌖</div>
                      <div className="min-w-0">
                        <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Dirección</p>
                        <p className="mt-1 truncate text-base font-black text-white">{offer.address}</p>
                      </div>
                    </div>
                    <span className="shrink-0 rounded-full bg-white/10 px-4 py-2 text-xs font-black text-white transition group-hover:bg-mint group-hover:text-ink">Abrir mapa</span>
                  </a>
                ) : (
                  <div className="flex items-center gap-4 rounded-3xl border border-white/10 bg-white/[0.045] p-4">
                    <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-white/10 text-xl ring-1 ring-white/10">⌖</div>
                    <div>
                      <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Dirección</p>
                      <p className="mt-1 text-base font-black text-slate-300">Dirección no indicada</p>
                    </div>
                  </div>
                )}

                {offer.reservation_enabled && (
                  <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <div className="flex items-start gap-4">
                      <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-mint/15 text-xl ring-1 ring-mint/20">◷</div>
                      <div className="min-w-0">
                        <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Reserva disponible</p>
                        <p className="mt-1 text-base font-black text-white">
                          Hasta {offer.reservation_max_people || 1} persona{Number(offer.reservation_max_people || 1) === 1 ? "" : "s"} por reserva
                        </p>
                        {Array.isArray(offer.reservation_time_slots) && offer.reservation_time_slots.length > 0 && (
                          <p className="mt-2 text-sm font-semibold leading-5 text-slate-300">
                            Horarios: {offer.reservation_time_slots.slice(0, 5).join(", ")}{offer.reservation_time_slots.length > 5 ? "..." : ""}
                          </p>
                        )}
                        <p className="mt-2 text-sm font-semibold leading-5 text-slate-300">
                          Días: {reservationDaysLabel(offer.reservation_available_weekdays)}
                        </p>
                        <p className="mt-1 text-xs font-bold text-slate-400">
                          Podrás elegir fecha, hora y personas en el pago.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {hasDeliveryOptions ? (
                  <div>
                    <p className="text-sm font-bold uppercase tracking-[0.16em] text-slate-500">Elige la entrega</p>
                    <div className="mt-3 grid gap-3 sm:grid-cols-2">
                      <button
                        className={`rounded-3xl border p-4 text-left transition ${
                          deliveryChoice === "pickup"
                            ? "border-mint bg-mint/10 shadow-glow"
                            : offer.delivery_pickup_enabled
                              ? "border-white/10 bg-white/[0.055] hover:border-mint/30"
                              : "cursor-not-allowed border-white/10 bg-white/[0.03] opacity-45"
                        }`}
                        disabled={!offer.delivery_pickup_enabled}
                        onClick={() => setDeliveryChoice("pickup")}
                      >
                        <div className="flex items-start justify-between gap-3">
                          <div className="grid h-11 w-11 place-items-center rounded-2xl bg-white/10 text-xl ring-1 ring-white/10">⌂</div>
                          <span className="rounded-full bg-white/10 px-3 py-1 text-xs font-black text-white">0 ptos. extra</span>
                        </div>
                        <p className="mt-4 text-base font-black text-white">Recogida en tienda</p>
                        <p className="mt-1 text-sm font-semibold text-slate-400">Vienes a recogerlo en la dirección indicada.</p>
                      </button>

                      <button
                        className={`rounded-3xl border p-4 text-left transition ${
                          deliveryChoice === "home"
                            ? "border-mint bg-mint/10 shadow-glow"
                            : offer.delivery_home_enabled
                              ? "border-white/10 bg-white/[0.055] hover:border-mint/30"
                              : "cursor-not-allowed border-white/10 bg-white/[0.03] opacity-45"
                        }`}
                        disabled={!offer.delivery_home_enabled}
                        onClick={() => setDeliveryChoice("home")}
                      >
                        <div className="flex items-start justify-between gap-3">
                          <div className="grid h-11 w-11 place-items-center rounded-2xl bg-white/10 text-xl ring-1 ring-white/10">⇥</div>
                          <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">{offer.delivery_home_points || 0} ptos. extra</span>
                        </div>
                        <p className="mt-4 text-base font-black text-white">Entrega a domicilio</p>
                        <p className="mt-1 text-sm font-semibold text-slate-400">Se suma al total de puntos al comprar.</p>
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="rounded-3xl border border-mint/20 bg-mint/10 p-4">
                    <div className="flex items-start gap-4">
                      <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-mint/15 text-xl ring-1 ring-mint/20">▣</div>
                      <div>
                        <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Sin entrega</p>
                        <p className="mt-1 text-base font-black text-white">Billete digital</p>
                        <p className="mt-1 text-sm font-semibold text-slate-300">No hace falta elegir recogida ni domicilio. Compra y guarda tu QR en Donoss.</p>
                      </div>
                    </div>
                  </div>
                )}
              </section>
            </section>

            <div className={checkoutDockClass}>
                <div className="mx-auto flex max-w-5xl items-center gap-3">
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-bold uppercase tracking-[0.16em] text-slate-500">Total</p>
                  <p className="truncate text-2xl font-black text-white">{isExternalCheckout ? formatEuro(offer.reduced_price || offer.base_price) : `${totalPoints} ptos.`}</p>
                </div>
	                <button
	                  className={`h-12 rounded-2xl px-5 text-sm font-black transition sm:h-14 sm:px-6 sm:text-base ${
	                    canBuy ? "bg-mint text-ink shadow-glow hover:bg-[#66ffd0]" : "bg-white/10 text-slate-500"
	                  }`}
	                  disabled={!canBuy}
	                  onClick={goToCheckout}
	                >
	                  {outOfStock ? "Agotado" : actionButtonText}
	                </button>
              </div>
            </div>

            {activeImage && (
              <div className="fixed inset-0 z-50 flex flex-col bg-[#03050B]/95 px-4 pb-[calc(18px+env(safe-area-inset-bottom,0px))] pt-5 backdrop-blur-2xl">
                <div className="mx-auto flex w-full max-w-6xl items-center justify-between gap-3">
                  <div>
                    <p className="text-xs font-black uppercase tracking-[0.18em] text-mint">Galería</p>
                    <p className="mt-1 text-sm font-bold text-slate-300">{activeImageIndex + 1} / {allImages.length}</p>
                  </div>
                  <button className="grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black text-white ring-1 ring-white/10" onClick={closeImage}>
                    ×
                  </button>
                </div>

                <div
                  className="relative mx-auto mt-5 flex min-h-0 w-full max-w-6xl flex-1 touch-pan-y items-center justify-center overflow-hidden"
                  onTouchStart={handleTouchStart}
                  onTouchMove={handleTouchMove}
                  onTouchEnd={handleTouchEnd}
                >
                  {allImages.length > 1 && (
                    <button
                      className="absolute left-0 z-10 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-3xl font-black text-white ring-1 ring-white/10 backdrop-blur transition hover:bg-white/20"
                      onClick={showPreviousImage}
                    >
                      ‹
                    </button>
                  )}
                  <div
                    className={`flex h-full w-full ${touchStartX === null ? "transition-transform duration-300 ease-out" : ""}`}
                    style={{ transform: `translateX(calc(${-activeImageIndex * 100}% + ${dragDelta}px))` }}
                  >
                    {allImages.map((src, index) => (
                      <div key={index} className="flex h-full min-w-full items-center justify-center px-2 sm:px-14">
                        <img
                          className="max-h-full max-w-full rounded-[28px] object-contain shadow-2xl shadow-black/50"
                          src={src}
                          alt=""
                        />
                      </div>
                    ))}
                  </div>
                  {allImages.length > 1 && (
                    <button
                      className="absolute right-0 z-10 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-3xl font-black text-white ring-1 ring-white/10 backdrop-blur transition hover:bg-white/20"
                      onClick={showNextImage}
                    >
                      ›
                    </button>
                  )}
                </div>

                {allImages.length > 1 && (
                  <div className="no-scrollbar mx-auto mt-5 flex w-full max-w-6xl gap-3 overflow-x-auto pb-1">
                    {allImages.map((src, index) => (
                      <button
                        key={index}
                        className={`h-16 min-w-20 overflow-hidden rounded-2xl border transition ${
                          index === activeImageIndex ? "border-mint opacity-100" : "border-white/10 opacity-55"
                        }`}
                        onClick={() => openImage(index)}
                      >
                        <img className="h-full w-full object-cover" src={src} alt="" />
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}

            {likeToast && (
              <div className="fixed left-1/2 top-1/2 z-[60] -translate-x-1/2 -translate-y-1/2 rounded-[28px] border border-mint/25 bg-[#101522]/95 px-6 py-5 text-center shadow-2xl shadow-mint/10 backdrop-blur-2xl">
                <div className="mx-auto grid h-14 w-14 place-items-center rounded-full bg-mint text-2xl text-ink shadow-glow">♥</div>
                <p className="mt-3 whitespace-nowrap text-base font-black text-white">{likeToast}</p>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
