<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Transferencias a empresas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 8%, rgba(255, 209, 102, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      function money(cents) {
        return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(Number(cents || 0) / 100);
      }

      function dateTime(value) {
        return new Date(value).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" });
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "Sin ID";
      }

      function Stat({ label, value, tone = "white" }) {
        const toneClass = tone === "mint" ? "border-mint/25 bg-mint/10 text-mint" : tone === "sun" ? "border-sun/25 bg-sun/10 text-sun" : "border-white/10 bg-white/[0.055] text-white";
        return (
          <div className={`rounded-3xl border p-4 ${toneClass}`}>
            <p className="text-xs font-bold uppercase tracking-[0.14em] opacity-75">{label}</p>
            <p className="mt-2 text-2xl font-black">{value}</p>
          </div>
        );
      }

      function App() {
        const [password, setPassword] = React.useState(sessionStorage.getItem("donosAdminPassword") || "");
        const [isUnlocked, setIsUnlocked] = React.useState(Boolean(sessionStorage.getItem("donosAdminPassword")));
        const [businesses, setBusinesses] = React.useState([]);
        const [summary, setSummary] = React.useState({});
        const [selected, setSelected] = React.useState(null);
        const [detail, setDetail] = React.useState(null);
        const [search, setSearch] = React.useState("");
        const [detailSearch, setDetailSearch] = React.useState("");
        const [status, setStatus] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        const [isPaying, setIsPaying] = React.useState(false);
        const [pointsToRemove, setPointsToRemove] = React.useState("");
        const [periodStart, setPeriodStart] = React.useState("");
        const [periodEnd, setPeriodEnd] = React.useState("");
        const [note, setNote] = React.useState("");

        React.useEffect(() => {
          if (isUnlocked) loadBusinesses();
        }, [isUnlocked]);

        async function loadBusinesses(event) {
          event?.preventDefault();
          setStatus("");
          setIsLoading(true);
          try {
            const response = await fetch("/api/admin/business-settlements", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "No autorizado");
            sessionStorage.setItem("donosAdminPassword", password);
            setIsUnlocked(true);
            setBusinesses(data.businesses || []);
            setSummary(data.summary || {});
          } catch (error) {
            setStatus(error.message || "No se han podido cargar las empresas.");
          } finally {
            setIsLoading(false);
          }
        }

        async function openDetail(business) {
          setSelected(business);
          setDetail(null);
          setDetailSearch("");
          setPointsToRemove(String(business.current_points || 0));
          setPeriodStart("");
          setPeriodEnd("");
          setNote("");
          setStatus("");
          const response = await fetch(`/api/admin/business-settlements/${business.id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok) setDetail(data);
          else setStatus(data.error || "No se ha podido cargar el detalle.");
        }

        function setToday() {
          const today = new Date().toISOString().slice(0, 10);
          setPeriodStart(today);
          setPeriodEnd(today);
        }

        function setYesterday() {
          const date = new Date();
          date.setDate(date.getDate() - 1);
          const value = date.toISOString().slice(0, 10);
          setPeriodStart(value);
          setPeriodEnd(value);
        }

        function setDetailSalesPoints() {
          const from = periodStart ? new Date(`${periodStart}T00:00:00`) : null;
          const to = periodEnd ? new Date(`${periodEnd}T23:59:59`) : null;
          const sales = (detail?.purchases || []).filter((purchase) => {
            const created = new Date(purchase.created_at);
            if (from && created < from) return false;
            if (to && created > to) return false;
            return true;
          });
          setPointsToRemove(String(sales.reduce((sum, item) => sum + Number(item.total_points || 0), 0)));
        }

        async function payBusiness() {
          const points = Math.floor(Number(pointsToRemove || 0));
          if (!selected || points <= 0) {
            setStatus("Introduce una cantidad válida de puntos.");
            return;
          }
          setIsPaying(true);
          setStatus("");
          try {
            const response = await fetch(`/api/admin/business-settlements/${selected.id}/pay`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, points, periodStart, periodEnd, note }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "No se ha podido registrar la liquidación.");
            setStatus("Liquidación registrada y puntos retirados.");
            await loadBusinesses();
            await openDetail({ ...selected, current_points: data.business_points });
          } catch (error) {
            setStatus(error.message || "No se ha podido registrar la liquidación.");
          } finally {
            setIsPaying(false);
          }
        }

        const filteredBusinesses = businesses.filter((business) => {
          const query = search.trim().toLowerCase();
          if (!query) return true;
          return [
            business.display_name,
            business.email,
            business.phone,
            business.transaction_id,
            business.neighborhood,
            business.address,
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });

        const filteredPurchases = (detail?.purchases || []).filter((purchase) => {
          const buyer = purchase.buyer || {};
          const offer = purchase.offer || {};
          const query = detailSearch.trim().toLowerCase();
          if (!query) return true;
          return [
            buyer.display_name,
            buyer.email,
            buyer.phone,
            buyer.transaction_id,
            offer.title,
            purchase.total_points,
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });

        if (!isUnlocked) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow" onSubmit={loadBusinesses}>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donos</p>
                <h1 className="mt-2 text-3xl font-black text-white">Transferencias a empresas</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Gestiona puntos que ya pagaste a empresas fuera de Donos.</p>
                <input className="mt-5 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10" type="password" value={password} onChange={(event) => setPassword(event.target.value)} placeholder="Contraseña" />
                {status && <p className="mt-3 text-sm font-bold text-coral">{status}</p>}
                <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-base font-black text-ink shadow-glow" disabled={isLoading}>{isLoading ? "Entrando..." : "Entrar"}</button>
              </form>
            </main>
          );
        }

        return (
          <main className="mx-auto min-h-screen w-full max-w-7xl px-3 py-4 sm:px-6 lg:px-8">
            <header className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donos</p>
                <h1 className="mt-1 text-3xl font-black text-white sm:text-4xl">Transferencias a empresas</h1>
              </div>
              <div className="flex w-full flex-wrap gap-2 sm:w-auto">
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-accounts.html">Cuentas</a>
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-payments.html">Pagos</a>
                <button className="flex-1 rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow sm:flex-none" onClick={loadBusinesses}>Actualizar</button>
              </div>
            </header>

            <section className="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
              <Stat label="Empresas" value={summary.total_businesses || 0} />
              <Stat label="Puntos empresas" value={`${summary.total_current_points || 0} ptos.`} tone="mint" />
              <Stat label="Equivalente" value={money(summary.total_current_value_cents)} tone="mint" />
              <Stat label="Ganado en ventas" value={`${summary.total_sold_points || 0} ptos.`} tone="sun" />
              <Stat label="Recargado empresas" value={`${summary.total_recharged_points || 0} ptos.`} />
            </section>

            <section className="mt-6 rounded-[26px] border border-white/10 bg-white/[0.055] p-3">
              <label className="flex items-center gap-3">
                <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                <input className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base" value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Buscar empresa, email, ID Donos..." />
              </label>
            </section>

            {status && <p className="mt-4 rounded-2xl border border-mint/25 bg-mint/10 p-4 text-sm font-bold text-mint">{status}</p>}

            <section className="mt-6 overflow-hidden rounded-[30px] border border-white/10 bg-white/[0.055]">
              <div className="hidden grid-cols-[1.2fr_.8fr_.8fr_.8fr_.8fr_auto] gap-3 border-b border-white/10 px-5 py-4 text-xs font-black uppercase tracking-[0.12em] text-slate-500 lg:grid">
                <span>Empresa</span><span>Actual</span><span>Vendido</span><span>Recargado</span><span>Equivalente</span><span></span>
              </div>
              <div className="divide-y divide-white/10">
                {filteredBusinesses.map((business) => (
                  <article key={business.id} className="grid gap-3 px-4 py-4 lg:grid-cols-[1.2fr_.8fr_.8fr_.8fr_.8fr_auto] lg:items-center lg:px-5">
                    <div className="min-w-0">
                      <p className="truncate font-black text-white">{business.display_name || "Empresa"}</p>
                      <p className="mt-1 truncate text-sm font-bold text-slate-400">{business.email || "Sin email"}</p>
                      <p className="mt-1 break-all font-mono text-xs font-bold text-slate-500">{formatDonosId(business.transaction_id)}</p>
                    </div>
                    <p className="text-sm font-black text-mint">{business.current_points || 0} ptos.</p>
                    <p className="text-sm font-black text-white">{business.sold_points || 0} ptos.</p>
                    <p className="text-sm font-black text-slate-300">{business.recharged_points || 0} ptos.</p>
                    <p className="text-sm font-black text-white">{money(business.current_value_cents)}</p>
                    <button className="h-10 rounded-2xl bg-mint px-5 text-sm font-black text-ink shadow-glow" onClick={() => openDetail(business)}>Más</button>
                  </article>
                ))}
              </div>
            </section>

            {selected && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 px-4 py-6 backdrop-blur-xl">
                <section className="mx-auto max-w-5xl rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl shadow-black/50 sm:p-7">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Empresa</p>
                      <h2 className="mt-2 text-3xl font-black text-white">{selected.display_name || "Empresa"}</h2>
                      <p className="mt-1 text-sm font-bold text-slate-400">{selected.email || "Sin email"} · {formatDonosId(selected.transaction_id)}</p>
                    </div>
                    <button className="grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black text-white" onClick={() => setSelected(null)}>×</button>
                  </div>

                  <div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-6">
                    <Stat label="Actual" value={`${detail?.business?.current_points ?? selected.current_points ?? 0} ptos.`} tone="mint" />
                    <Stat label="En euros" value={money((detail?.business?.current_points ?? selected.current_points ?? 0) * 10)} tone="mint" />
                    <Stat label="Ventas" value={`${detail?.business?.sold_points ?? selected.sold_points ?? 0} ptos.`} />
                    <Stat label="Recargas" value={`${detail?.business?.recharged_points ?? selected.recharged_points ?? 0} ptos.`} />
                    <Stat label="Total generado" value={`${(detail?.business?.gross_total_points ?? selected.gross_total_points ?? 0)} ptos.`} tone="sun" />
                    <Stat label="Ya liquidado" value={`${(detail?.business?.paid_out_points ?? selected.paid_out_points ?? 0)} ptos.`} />
                  </div>

                  <section className="mt-5 rounded-[28px] border border-white/10 bg-white/[0.045] p-4">
                    <p className="text-sm font-black text-white">Registrar dinero enviado fuera de Donos</p>
                    <p className="mt-1 text-xs font-bold text-slate-400">Cuando pagues a la empresa por Stripe o transferencia, retira aquí los puntos equivalentes.</p>
                    <div className="mt-4 grid gap-3 sm:grid-cols-5">
                      <input className="h-12 rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none focus:border-mint/70" type="number" min="1" value={pointsToRemove} onChange={(event) => setPointsToRemove(event.target.value)} placeholder="Puntos" />
                      <input className="h-12 rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none focus:border-mint/70" type="date" value={periodStart} onChange={(event) => setPeriodStart(event.target.value)} />
                      <input className="h-12 rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none focus:border-mint/70" type="date" value={periodEnd} onChange={(event) => setPeriodEnd(event.target.value)} />
                      <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-xs font-black text-slate-200" onClick={setToday}>Hoy</button>
                      <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] text-xs font-black text-slate-200" onClick={setYesterday}>Ayer</button>
                    </div>
                    <div className="mt-3 grid gap-3 sm:grid-cols-[1fr_auto_auto]">
                      <input className="h-12 rounded-2xl border border-line bg-black/20 px-4 text-sm font-bold text-white outline-none focus:border-mint/70" value={note} onChange={(event) => setNote(event.target.value)} placeholder="Nota: pago Stripe, llamada, etc." />
                      <button className="h-12 rounded-2xl border border-white/10 bg-white/[0.06] px-4 text-xs font-black text-slate-200" onClick={setDetailSalesPoints}>Usar ventas del periodo</button>
                      <button className="h-12 rounded-2xl bg-mint px-5 text-sm font-black text-ink shadow-glow disabled:opacity-60" disabled={isPaying} onClick={payBusiness}>{isPaying ? "Guardando..." : "Quitar puntos"}</button>
                    </div>
                  </section>

                  <section className="mt-5">
                    <div className="rounded-[24px] border border-white/10 bg-white/[0.055] p-3">
                      <label className="flex items-center gap-3">
                        <span className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint/10 text-mint">⌕</span>
                        <input className="h-10 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500" value={detailSearch} onChange={(event) => setDetailSearch(event.target.value)} placeholder="Buscar comprador, producto, email..." />
                      </label>
                    </div>
                    <div className="mt-4 max-h-[42vh] overflow-y-auto rounded-[26px] border border-white/10 bg-black/20">
                      {(detail ? filteredPurchases : []).map((purchase) => (
                        <article key={purchase.id} className="grid gap-2 border-b border-white/10 px-4 py-3 sm:grid-cols-[1fr_auto]">
                          <div className="min-w-0">
                            <p className="truncate text-sm font-black text-white">{purchase.buyer?.display_name || purchase.buyer?.email || "Cliente Donos"}</p>
                            <p className="mt-1 truncate text-xs font-bold text-slate-400">{purchase.offer?.title || "Compra"} · {purchase.buyer?.email || "Sin email"}</p>
                            <p className="mt-1 text-xs font-bold text-slate-600">{dateTime(purchase.created_at)}</p>
                          </div>
                          <p className="text-sm font-black text-mint">{purchase.total_points || 0} ptos.</p>
                        </article>
                      ))}
                      {detail && filteredPurchases.length === 0 && <p className="p-5 text-sm font-bold text-slate-400">No hay compras para esta búsqueda.</p>}
                      {!detail && <p className="p-5 text-sm font-bold text-slate-400">Cargando detalle...</p>}
                    </div>
                  </section>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
