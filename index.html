    <script type="text/babel">
      const neighborhoods = [

      const customNeighborhoodValue = "custom";
      const businessCategories = [
        "Cine / Cultura",
        "Moda / Segunda mano",
        "Restauración",
        "Eventos",
        "Librería",
        "Gaming",
        "Otro",
      ];
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

      function redirectToHome(accountType) {
        localStorage.setItem("donosAccountType", accountType);
        localStorage.setItem("donosDisplayName", localStorage.getItem("donosPendingDisplayName") || "");
        window.setTimeout(() => {
          window.location.href = `home.html?type=${accountType}`;
        }, 1200);
      }

      function generateTransactionId() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const digits = "0123456789";
        const values = new Uint32Array(24);
        crypto.getRandomValues(values);

        const characters = [
          ...Array.from(values.slice(0, 4), (value) => letters[value % letters.length]),
          ...Array.from(values.slice(4, 12), (value) => digits[value % digits.length]),
        ];

        for (let index = characters.length - 1; index > 0; index -= 1) {
          const swapIndex = values[12 + index] % (index + 1);
          [characters[index], characters[swapIndex]] = [characters[swapIndex], characters[index]];
        }

        return characters.join("");
      }

      function formatTransactionId(transactionId) {
        return transactionId.replace(/(.{4})(.{4})(.{4})/, "$1-$2-$3");
      }

      async function syncServerProfile() {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const accessToken = sessionData.session?.access_token;
        if (!accessToken) return null;

        const response = await fetch("/api/me/profile", {
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        const data = await response.json().catch(() => ({}));
        return response.ok ? data.profile : null;
      }

      function GoogleIcon() {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.7 3.8-5.5 3.8a6 6 0 0 1 0-12c1.9 0 3.1.8 3.8 1.5l2.6-2.5A9.7 9.7 0 0 0 12 2.4a9.6 9.6 0 1 0 0 19.2c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6h-9z" />
            <path fill="#34A853" d="M3.3 7.9l3.2 2.4A5.8 5.8 0 0 1 12 6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5A9.7 9.7 0 0 0 12 2.4a9.6 9.6 0 0 0-8.7 5.5z" />
            <path fill="#4A90E2" d="M12 21.6c2.6 0 4.9-.9 6.5-2.4l-3.1-2.4c-.8.6-1.9 1-3.4 1a5.8 5.8 0 0 1-5.5-4l-3.2 2.5a9.6 9.6 0 0 0 8.7 5.3z" />
            <path fill="#FBBC05" d="M6.5 13.8a5.8 5.8 0 0 1 0-3.5L3.3 7.9a9.6 9.6 0 0 0 0 8.4l3.2-2.5z" />
          </svg>
        );
      }

      function AppleIcon() {
        return (
          <svg viewBox="0 0 24 24" aria-hidden="true" className="h-5 w-5 fill-white">
            <path d="M16.7 12.8c0-2 1.6-3 1.7-3.1-1-.1-2.1-.6-3-.6-1.3 0-2.4.8-3 .8-.7 0-1.7-.8-2.8-.8-1.4 0-2.7.8-3.4 2.1-1.5 2.6-.4 6.4 1 8.5.7 1 1.5 2.1 2.6 2.1 1 0 1.5-.7 2.8-.7s1.7.7 2.8.7 1.9-1 2.6-2c.8-1.1 1.1-2.2 1.1-2.3 0 0-2.3-.9-2.4-3.7z" />
            <path d="M14.6 6.9c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6.9.1 1.9-.5 2.5-1.2z" />
          </svg>
        );
      }

      function Field({ label, children }) {
        return (
          <label className="block">
            <span className="mb-2 block text-sm font-medium text-slate-300">{label}</span>
            {children}
          </label>
        );
      }

      const inputClass =
        "h-12 w-full max-w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-[15px] text-white outline-none transition placeholder:text-slate-500 focus:border-mint/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-mint/10";

      function readableSignupError(error) {
        const rawMessage =
          typeof error === "string"
            ? error
            : error?.message || error?.error_description || error?.msg || "";
        const message = String(rawMessage || "").trim();
        const lowerMessage = message.toLowerCase();

        if (!message || message === "{}" || message === "[object Object]") {
          return "No se ha podido crear la cuenta. Revisa los datos y vuelve a intentarlo.";
        }
        if (lowerMessage.includes("already registered") || lowerMessage.includes("already exists")) {
          return "Este correo ya tiene una cuenta. Inicia sesión o usa otro correo.";
        }
        if (lowerMessage.includes("invalid email")) {
          return "El correo electrónico no parece válido.";
        }
        if (lowerMessage.includes("password")) {
          return "La contraseña no cumple los requisitos. Usa mínimo 8 caracteres.";
        }
        if (lowerMessage.includes("network") || lowerMessage.includes("failed")) {
          return "No se ha podido conectar. Revisa internet y vuelve a intentarlo.";
        }

        return message;
      }

      function App() {
        const formRef = React.useRef(null);
        const [accountType, setAccountType] = React.useState("");
        const [displayName, setDisplayName] = React.useState("");
        const [email, setEmail] = React.useState("");
        const [phone, setPhone] = React.useState("");
        const [password, setPassword] = React.useState("");
        const [passwordConfirm, setPasswordConfirm] = React.useState("");
        const [acceptedTerms, setAcceptedTerms] = React.useState(false);
        const [neighborhood, setNeighborhood] = React.useState("");
        const [customNeighborhood, setCustomNeighborhood] = React.useState("");
        const [businessCategoriesSelected, setBusinessCategoriesSelected] = React.useState([]);
        const [taxId, setTaxId] = React.useState("");
        const [businessAddress, setBusinessAddress] = React.useState("");
        const [status, setStatus] = React.useState({ type: "", message: "" });
        const [isSubmitting, setIsSubmitting] = React.useState(false);

        const isBusiness = accountType === "business";
        const isUser = accountType === "user";
        const isCustomNeighborhood = neighborhood === customNeighborhoodValue;
        const finalNeighborhood = isCustomNeighborhood ? customNeighborhood.trim() : neighborhood;
        const normalizedEmail = email.trim().toLowerCase();
        const canSubmit =
          accountType &&
          displayName.trim() &&
          normalizedEmail &&
          finalNeighborhood &&
          password.length >= 8 &&
          password === passwordConfirm &&
          acceptedTerms &&
          (!isBusiness || (businessCategoriesSelected.length > 0 && taxId.trim() && phone.trim() && businessAddress.trim()));

        function chooseAccountType(type) {
          setAccountType(type);
          setStatus({
            type: "info",
            message: type === "business" ? "Perfil empresa seleccionado. Completa el formulario de abajo." : "Perfil usuario seleccionado. Completa el formulario de abajo.",
          });
          localStorage.setItem("donosAccountType", type);
          window.setTimeout(() => {
            formRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 120);
        }

        function profilePayload(transactionId) {
          return {
            account_type: accountType,
            display_name: displayName.trim(),
            email: normalizedEmail,
            phone: isBusiness ? `+34 ${phone.trim()}` : null,
            neighborhood: finalNeighborhood,
            transaction_id: transactionId,
            business_categories: isBusiness ? businessCategoriesSelected : null,
            tax_id: isBusiness ? taxId.trim().toUpperCase() : null,
            address: isBusiness ? businessAddress.trim() : null,
          };
        }

        function toggleBusinessCategory(category) {
          setBusinessCategoriesSelected((current) =>
            current.includes(category)
              ? current.filter((item) => item !== category)
              : [...current, category]
          );
        }

        async function handleSubmit(event) {
          event.preventDefault();
          setStatus({ type: "", message: "" });

          if (!canSubmit) {
            setStatus({ type: "error", message: "Completa todos los campos necesarios para continuar." });
            return;
          }

          setIsSubmitting(true);
          localStorage.setItem("donosAccountType", accountType);
          localStorage.setItem("donosPendingDisplayName", displayName.trim());
          localStorage.setItem("donosDisplayName", displayName.trim());

          try {
            const transactionId = generateTransactionId();
            const { data, error } = await supabaseClient.auth.signUp({
              email: normalizedEmail,
              password,
              options: {
                data: {
                  ...profilePayload(transactionId),
                  formatted_transaction_id: formatTransactionId(transactionId),
                },
              },
            });

            if (error) throw error;

            if (data.user && data.session) {
              const profile = await syncServerProfile();
              if (profile?.transaction_id) localStorage.setItem("donosTransactionId", profile.transaction_id);
              if (profile?.display_name) localStorage.setItem("donosDisplayName", profile.display_name);
              setStatus({
                type: "success",
                message: `Cuenta creada. Tu ID Donos es ${formatTransactionId(profile?.transaction_id || transactionId)}.`,
              });
            } else {
              setStatus({
                type: "success",
                message: `Revisa tu correo. Tu ID Donos es ${formatTransactionId(transactionId)}.`,
              });
            }

            redirectToHome(accountType);
          } catch (error) {
            setStatus({
              type: "error",
              message: readableSignupError(error),
            });
          } finally {
            setIsSubmitting(false);
          }
        }

        async function handleSocialLogin(provider) {
          setStatus({ type: "", message: "" });
          localStorage.setItem("donosAccountType", accountType || "user");
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider,
            options: {
              redirectTo: window.location.origin + "/home.html",
            },
          });

          if (error) {
            setStatus({
              type: "error",
              message: error.message || "No se ha podido abrir el acceso social.",
            });
          }
        }

        const profileCards = (
          <div className="mt-6 grid gap-3 sm:mt-7 sm:grid-cols-2">
            <button
              type="button"
              onClick={() => chooseAccountType("user")}
              className={`max-w-full rounded-[24px] border p-4 text-left transition hover:translate-y-[-2px] sm:rounded-[26px] sm:p-5 ${
                isUser
                  ? "border-mint/60 bg-mint/10 shadow-glow"
                  : "border-white/10 bg-white/[0.055] hover:bg-white/[0.08]"
              }`}
            >
              <div className="grid h-12 w-12 place-items-center rounded-2xl bg-mint text-2xl sm:h-14 sm:w-14 sm:text-3xl">👤</div>
              <p className="mt-4 break-words text-lg font-black leading-tight text-white">Soy un usuario</p>
              <p className="mt-2 break-words text-sm leading-5 text-slate-400">Chollos, planes culturales y compraventa entre jóvenes.</p>
            </button>

            <button
              type="button"
              onClick={() => chooseAccountType("business")}
              className={`max-w-full rounded-[24px] border p-4 text-left transition hover:translate-y-[-2px] sm:rounded-[26px] sm:p-5 ${
                isBusiness
                  ? "border-mint/60 bg-mint/10 shadow-glow"
                  : "border-white/10 bg-white/[0.055] hover:bg-white/[0.08]"
              }`}
            >
              <div className="grid h-12 w-12 place-items-center rounded-2xl bg-sun text-2xl sm:h-14 sm:w-14 sm:text-3xl">🏢</div>
              <p className="mt-4 break-words text-lg font-black leading-tight text-white">Soy un comercio / Empresa</p>
              <p className="mt-2 break-words text-sm leading-5 text-slate-400">Publica ofertas, eventos y ventajas para la comunidad Donos.</p>
            </button>
          </div>
        );

        return (
          <main className="mesh min-h-screen overflow-hidden">
            <section className="mx-auto grid min-h-screen w-full max-w-6xl items-center gap-8 px-3 py-4 sm:px-6 lg:grid-cols-[1fr_0.92fr] lg:px-8 lg:py-10">
              <aside className="hidden lg:block">
                <div className="max-w-xl">
                  <div className="mb-8 inline-flex items-center gap-3 rounded-full border border-white/10 bg-white/[0.055] px-4 py-2 text-sm font-semibold text-slate-200">
                    <span className="h-2.5 w-2.5 rounded-full bg-mint shadow-[0_0_22px_rgba(66,242,179,0.9)]"></span>
                    Donostia en modo puntos
                  </div>

                  <h1 className="text-5xl font-extrabold leading-[1.02] tracking-normal text-white">
                    Chollos, planes y comercio local en una sola app.
                  </h1>
                  <p className="mt-5 max-w-lg text-lg leading-8 text-slate-300">
                    Donos conecta jóvenes, tiendas y cultura local con puntos, descuentos y experiencias cerca de tu barrio.
                  </p>

                  <div className="mt-10 grid max-w-lg grid-cols-3 gap-3">
                    {perks.map((perk) => (
                      <div key={perk.label} className="rounded-2xl border border-white/10 bg-white/[0.055] p-4">
                        <p className="text-2xl font-black text-white">{perk.value}</p>
                        <p className="mt-1 text-sm text-slate-400">{perk.label}</p>
                      </div>
                    ))}
                  </div>

                  <div className="mt-8 w-full max-w-lg rounded-[28px] border border-white/10 bg-white/[0.055] p-4 shadow-glow">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-sm font-semibold text-slate-300">Esta semana cerca de ti</p>
                        <p className="mt-1 text-xl font-bold text-white">Cine + chaqueta vintage</p>
                      </div>
                      <span className="rounded-full bg-mint px-3 py-1 text-sm font-black text-ink">+95 ptos.</span>
                    </div>
                    <div className="mt-4 grid grid-cols-[1.1fr_0.9fr] gap-3">
                      <div className="min-h-36 rounded-3xl bg-[linear-gradient(135deg,#42F2B3,#151A2A_58%,#FF6B6B)] p-4">
                        <p className="text-sm font-bold text-ink">Entradas Antiguo Berri</p>
                        <p className="mt-16 text-3xl font-black text-white">4,90€</p>
                      </div>
                      <div className="min-h-36 rounded-3xl bg-[linear-gradient(145deg,#FFD166,#2C1D45_58%,#0D111D)] p-4">
                        <p className="text-sm font-bold text-ink">Drop local</p>
                        <p className="mt-16 text-3xl font-black text-white">18€</p>
                      </div>
                    </div>
                  </div>
                </div>
              </aside>

              <section className="mx-auto w-full max-w-md lg:max-w-[520px]">
                <div className="mb-5 flex items-center justify-between gap-3 lg:hidden">
                  <div className="flex min-w-0 items-center gap-3">
                    <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-mint text-lg font-black text-ink sm:h-11 sm:w-11">D</div>
                    <div className="min-w-0">
                      <p className="text-lg font-black">Donos</p>
                      <p className="text-xs font-medium text-slate-400">Chollos locales</p>
                    </div>
                  </div>
                  <span className="shrink-0 rounded-full border border-white/10 px-3 py-1 text-xs font-semibold text-slate-300">Beta</span>
                </div>

                <div className="glass max-w-full rounded-[26px] border border-white/10 p-4 shadow-2xl shadow-black/30 sm:rounded-[30px] sm:p-7">
                  <div className="hidden items-center gap-3 lg:flex">
                    <div className="grid h-12 w-12 place-items-center rounded-2xl bg-mint text-xl font-black text-ink">D</div>
                    <div>
                      <p className="text-xl font-black">Donos</p>
                      <p className="text-sm font-medium text-slate-400">Tu barrio, tus puntos</p>
                    </div>
                  </div>

                  <div className="mt-1 lg:mt-8">
                    <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Crear cuenta</p>
                    <h2 className="mt-2 break-words text-[32px] font-black leading-tight tracking-normal text-white sm:text-4xl">
                      {accountType ? (isBusiness ? "Registro Empresa" : "Registro Usuario") : "Elige tu perfil"}
                    </h2>
                    <p className="mt-3 text-sm leading-6 text-slate-400">
                      {accountType
                        ? "Completa solo lo necesario para entrar en Donos."
                        : "Selecciona cómo vas a usar Donos para adaptar el registro."}
                    </p>
                  </div>

                  {profileCards}

                  {accountType && (
                    <form ref={formRef} className="mt-6 scroll-mt-4 space-y-4 rounded-[26px] border border-mint/15 bg-black/10 p-3 sm:p-4" onSubmit={handleSubmit}>
                      <div className="flex items-center justify-between gap-3 rounded-2xl bg-mint/10 px-4 py-3">
                        <div>
                          <p className="text-sm font-black text-white">{isBusiness ? "Formulario empresa" : "Formulario usuario"}</p>
                          <p className="mt-1 text-xs font-bold text-slate-400">Rellena estos datos para crear tu cuenta Donos.</p>
                        </div>
                        <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">Activo</span>
                      </div>
                      {isUser && (
                        <>
                          <div className="grid grid-cols-2 gap-2 sm:gap-3">
                            <button
                              type="button"
                              onClick={() => handleSocialLogin("google")}
                              className="flex h-12 min-w-0 items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[0.07] px-2 text-sm font-bold text-white transition hover:bg-white/[0.11] focus:outline-none focus:ring-4 focus:ring-white/10"
                            >
                              <GoogleIcon />
                              Google
                            </button>
                            <button
                              type="button"
                              onClick={() => handleSocialLogin("apple")}
                              className="flex h-12 min-w-0 items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[0.07] px-2 text-sm font-bold text-white transition hover:bg-white/[0.11] focus:outline-none focus:ring-4 focus:ring-white/10"
                            >
                              <AppleIcon />
                              Apple
                            </button>
                          </div>

                          <div className="my-6 flex items-center gap-3">
                            <div className="h-px flex-1 bg-white/10"></div>
                            <span className="text-xs font-semibold text-slate-500">o con correo</span>
                            <div className="h-px flex-1 bg-white/10"></div>
                          </div>
                        </>
                      )}

                      <Field label={isBusiness ? "Nombre del comercio / Empresa" : "Nombre o apodo"}>
                        <input
                          className={inputClass}
                          type="text"
                          placeholder={isBusiness ? "Ej. Donos Vintage" : "Ej. Ane, Markel..."}
                          autoComplete={isBusiness ? "organization" : "nickname"}
                          value={displayName}
                          onChange={(event) => setDisplayName(event.target.value)}
                        />
                      </Field>

                      {isBusiness && (
                        <>
                          <div>
                            <p className="mb-2 text-sm font-medium text-slate-300">Categorías</p>
                            <div className="grid gap-2 min-[390px]:grid-cols-2">
                              {businessCategories.map((item) => {
                                const isSelected = businessCategoriesSelected.includes(item);
                                return (
                                  <button
                                    key={item}
                                    type="button"
                                    onClick={() => toggleBusinessCategory(item)}
                                    className={`min-h-11 rounded-2xl border px-3 text-left text-sm font-bold transition ${
                                      isSelected
                                        ? "border-mint/60 bg-mint/15 text-mint"
                                        : "border-line bg-white/[0.055] text-slate-300 hover:bg-white/[0.08]"
                                    }`}
                                  >
                                    {item}
                                  </button>
                                );
                              })}
                            </div>
                          </div>

                          <Field label="CIF / NIF">
                            <input
                              className={inputClass}
                              type="text"
                              placeholder="Ej. B12345678"
                              value={taxId}
                              onChange={(event) => setTaxId(event.target.value)}
                            />
                          </Field>
                        </>
                      )}

                      <Field label={isBusiness ? "Correo electrónico profesional" : "Correo electrónico"}>
                        <input
                          className={inputClass}
                          type="email"
                          placeholder={isBusiness ? "hola@tuempresa.com" : "tu@email.com"}
                          autoComplete="email"
                          value={email}
                          onChange={(event) => setEmail(event.target.value)}
                        />
                      </Field>

                      {isBusiness && (
                        <>
                          <Field label="Teléfono de contacto">
	                            <div className="grid grid-cols-[82px_1fr] gap-2 sm:grid-cols-[96px_1fr]">
                              <button type="button" className="flex h-12 items-center justify-center gap-2 rounded-2xl border border-line bg-white/[0.055] px-3 text-sm font-bold text-white">
                                <span>🇪🇸</span>
                                <span>+34</span>
                              </button>
                              <input
                                className={inputClass}
                                type="tel"
                                inputMode="tel"
                                placeholder="943 000 000"
                                autoComplete="tel"
                                value={phone}
                                onChange={(event) => setPhone(event.target.value)}
                              />
                            </div>
                          </Field>

                          <Field label="Dirección">
                            <input
                              className={inputClass}
                              type="text"
                              placeholder="Calle, número..."
                              autoComplete="street-address"
                              value={businessAddress}
                              onChange={(event) => setBusinessAddress(event.target.value)}
                            />
                          </Field>
                        </>
                      )}

                      <Field label={isBusiness ? "Barrio / Zona" : "Barrio"}>
                        <select
                          className={`${inputClass} appearance-none bg-[linear-gradient(45deg,transparent_50%,#94a3b8_50%),linear-gradient(135deg,#94a3b8_50%,transparent_50%)] bg-[length:6px_6px,6px_6px] bg-[position:calc(100%-20px)_21px,calc(100%-14px)_21px] bg-no-repeat pr-10`}
                          value={neighborhood}
                          onChange={(event) => setNeighborhood(event.target.value)}
                        >
                          <option value="" className="bg-panel">Elige tu zona</option>
                          {neighborhoods.map((item) => (
                            <option
                              key={item}
                              className="bg-panel"
                              value={item === "Añadir otro barrio" ? customNeighborhoodValue : item}
                            >
                              {item}
                            </option>
                          ))}
                        </select>
                      </Field>

                      {isCustomNeighborhood && (
                        <Field label="Escribe tu barrio">
                          <input
                            className={inputClass}
                            type="text"
                            placeholder="Ej. Bidebieta, Añorga..."
                            value={customNeighborhood}
                            onChange={(event) => setCustomNeighborhood(event.target.value)}
                            autoComplete="address-level3"
                          />
                        </Field>
                      )}

                      <div className="grid gap-4 sm:grid-cols-2">
                        <Field label="Contraseña">
                          <input
                            className={inputClass}
                            type="password"
                            placeholder="Mín. 8 caracteres"
                            autoComplete="new-password"
                            value={password}
                            onChange={(event) => setPassword(event.target.value)}
                          />
                        </Field>

                        <Field label="Repetir contraseña">
                          <input
                            className={inputClass}
                            type="password"
                            placeholder="Repite la clave"
                            autoComplete="new-password"
                            value={passwordConfirm}
                            onChange={(event) => setPasswordConfirm(event.target.value)}
                          />
                        </Field>
                      </div>

                      <label className="flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.045] p-3">
                        <input
                          type="checkbox"
                          className="mt-1 h-4 w-4 rounded border-line bg-panel accent-mint"
                          checked={acceptedTerms}
                          onChange={(event) => setAcceptedTerms(event.target.checked)}
                        />
	                        <span className="min-w-0 break-words text-xs leading-5 text-slate-400">
                          Acepto las condiciones de Donos y recibir avisos importantes de mi cuenta.
                        </span>
                      </label>

                      {status.message && (
                        <div
                          className={`rounded-2xl border p-3 text-sm font-semibold ${
                            status.type === "success"
                              ? "border-mint/25 bg-mint/10 text-mint"
                              : status.type === "info"
                                ? "border-white/10 bg-white/[0.055] text-slate-300"
                              : "border-coral/30 bg-coral/10 text-coral"
                          }`}
                        >
                          {status.message}
                        </div>
                      )}

                      <button
                        className={`mt-2 flex h-14 w-full items-center justify-center rounded-2xl px-5 text-base font-black transition focus:outline-none focus:ring-4 ${
                          canSubmit
                            ? "bg-mint text-ink shadow-glow hover:translate-y-[-1px] hover:bg-[#66ffd0] focus:ring-mint/25"
                            : "cursor-not-allowed bg-slate-700 text-slate-400 shadow-none focus:ring-slate-600/25"
                        }`}
                        disabled={!canSubmit || isSubmitting}
                      >
                        {isSubmitting ? "Creando cuenta..." : "Crear cuenta gratis"}
                      </button>
                    </form>
                  )}

                  <p className="mt-5 text-center text-sm text-slate-400">
                    ¿Ya tienes cuenta? <a className="font-bold text-white underline decoration-mint/70 underline-offset-4" href="login.html">Inicia sesión</a>
                  </p>
                </div>

                <div className="no-scrollbar mt-4 flex gap-2 overflow-x-auto pb-1 lg:hidden">
                  {perks.map((perk) => (
                    <div key={perk.label} className="min-w-[132px] rounded-2xl border border-white/10 bg-white/[0.055] p-3">
                      <p className="text-lg font-black">{perk.value}</p>
                      <p className="text-xs text-slate-400">{perk.label}</p>
                    </div>
                  ))}
                </div>
              </section>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
