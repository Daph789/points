<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Admin pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html {
        background: #060914;
        overflow-x: hidden;
      }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 8%, rgba(255, 107, 107, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }

      #root,
      main {
        max-width: 100%;
        overflow-x: hidden;
      }

      * {
        min-width: 0;
      }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      function money(cents, currency = "eur") {
        return new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: (currency || "eur").toUpperCase(),
        }).format((Number(cents || 0)) / 100);
      }

      function dateTime(value) {
        return new Date(value).toLocaleString("es-ES", {
          dateStyle: "short",
          timeStyle: "short",
        });
      }

      function formatDonosId(value) {
        const clean = String(value || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
        return clean ? clean.match(/.{1,4}/g)?.join("-") : "Sin ID";
      }

      function DetailItem({ label, value }) {
        return (
          <div className="rounded-2xl border border-white/10 bg-white/[0.045] p-4">
            <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">{label}</p>
            <p className="mt-1 break-words text-sm font-black text-white">{value || "No indicado"}</p>
          </div>
        );
      }

      function App() {
        const [password, setPassword] = React.useState(sessionStorage.getItem("donosAdminPassword") || "");
        const [isUnlocked, setIsUnlocked] = React.useState(Boolean(sessionStorage.getItem("donosAdminPassword")));
        const [recharges, setRecharges] = React.useState([]);
        const [selected, setSelected] = React.useState(null);
        const [status, setStatus] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        const [deletingId, setDeletingId] = React.useState("");
        const [search, setSearch] = React.useState("");
        const [packs, setPacks] = React.useState([]);
        const [savingPack, setSavingPack] = React.useState("");

        React.useEffect(() => {
          if (isUnlocked) loadRecharges();
        }, [isUnlocked]);

        async function loadPacks() {
          const response = await fetch("/api/point-packs");
          const data = await response.json().catch(() => ({}));
          if (response.ok) setPacks(data.packs || []);
        }

        async function loadRecharges(event) {
          event?.preventDefault();
          setStatus("");
          setIsLoading(true);

          try {
            const response = await fetch("/api/admin/recharges", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password }),
            });
            const data = await response.json();

            if (!response.ok) throw new Error(data.error || "No autorizado");

            sessionStorage.setItem("donosAdminPassword", password);
            setIsUnlocked(true);
            setRecharges(data.recharges || []);
            loadPacks();
          } catch (error) {
            setStatus(error.message || "No se han podido cargar los pagos.");
          } finally {
            setIsLoading(false);
          }
        }

        async function togglePack(pack) {
          setSavingPack(String(pack.points));
          setStatus("");
          try {
            const response = await fetch("/api/admin/point-packs/toggle", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, points: pack.points, isDisabled: !pack.is_disabled }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "No se ha podido actualizar el pack.");
            setPacks((current) => current.map((item) => item.points === pack.points ? data.pack : item));
            setStatus(data.pack?.is_disabled ? `Pack ${pack.points} ptos. suspendido.` : `Pack ${pack.points} ptos. reactivado.`);
          } catch (error) {
            setStatus(error.message || "No se ha podido actualizar el pack.");
          } finally {
            setSavingPack("");
          }
        }

        async function deleteRecharge(item) {
          const profile = item.profiles || {};
          const label = profile.display_name || item.customer_email || "este cliente";
          const confirmed = window.confirm(`¿Eliminar este pago de ${label} y retirar ${item.points} ptos. de su cuenta?`);
          if (!confirmed) return;

          setStatus("");
          setDeletingId(item.id);

          try {
            const response = await fetch("/api/admin/recharges/delete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password, rechargeId: item.id }),
            });
            const data = await response.json();

            if (!response.ok) throw new Error(data.error || "No se ha podido eliminar el pago.");

            setRecharges((current) => current.filter((recharge) => recharge.id !== item.id));
            if (selected?.id === item.id) setSelected(null);
            setStatus("Pago eliminado y puntos ajustados.");
          } catch (error) {
            setStatus(error.message || "No se ha podido eliminar el pago.");
          } finally {
            setDeletingId("");
          }
        }

        if (!isUnlocked) {
          return (
            <main className="grid min-h-screen place-items-center px-4">
              <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow" onSubmit={loadRecharges}>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donos</p>
                <h1 className="mt-2 text-3xl font-black text-white">Pagos Stripe</h1>
                <p className="mt-3 text-sm font-semibold leading-6 text-slate-400">Zona privada. Introduce la contraseña para ver las recargas.</p>
                <input
                  className="mt-5 h-12 w-full rounded-2xl border border-line bg-white/[0.055] px-4 text-white outline-none placeholder:text-slate-500 focus:border-mint/70 focus:ring-4 focus:ring-mint/10"
                  type="password"
                  value={password}
                  onChange={(event) => setPassword(event.target.value)}
                  placeholder="Contraseña"
                />
                {status && <p className="mt-3 text-sm font-bold text-coral">{status}</p>}
                <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-base font-black text-ink shadow-glow" disabled={isLoading}>
                  {isLoading ? "Entrando..." : "Entrar"}
                </button>
              </form>
            </main>
          );
        }

        const totalPaid = recharges.reduce((sum, item) => sum + Number(item.amount_total || 0), 0);
        const totalFees = recharges.reduce((sum, item) => sum + Number(item.stripe_fee_amount || 0), 0);
        const totalNet = recharges.reduce((sum, item) => sum + Number(item.net_amount || 0), 0);
        const donosMoney = recharges.reduce((sum, item) => sum + Number(item.donos_company_margin_cents || 0), 0);
        const donosDebt = recharges.reduce((sum, item) => sum + Number(item.donos_debt_cents || 0), 0);
        const filteredRecharges = recharges.filter((item) => {
          const profile = item.profiles || {};
          const query = search.trim().toLowerCase();
          if (!query) return true;
          return [
            profile.display_name,
            profile.email,
            profile.phone,
            profile.transaction_id,
            profile.neighborhood,
            item.customer_email,
            item.stripe_session_id,
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });

        return (
            <main className="mx-auto min-h-screen w-full max-w-7xl px-3 py-4 sm:px-6 lg:px-8">
              <header className="flex flex-wrap items-center justify-between gap-3">
              <div className="min-w-0">
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Admin Donos</p>
                <h1 className="mt-1 break-words text-3xl font-black text-white sm:text-4xl">Pagos Stripe</h1>
              </div>
              <div className="flex w-full flex-wrap gap-2 sm:w-auto">
                <a className="flex-1 rounded-full bg-mint px-4 py-2 text-center text-sm font-black text-ink shadow-glow sm:flex-none" href="donos-admin-accounts.html">
                  Ver reserva por cuenta
                </a>
                <a className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-center text-sm font-black text-slate-200 sm:flex-none" href="donos-admin-business-settlements.html">
                  Empresas
                </a>
                <button className="flex-1 rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-black text-slate-200 sm:flex-none" onClick={loadRecharges}>
                  Actualizar
                </button>
              </div>
            </header>

            <section className="mt-6 grid gap-3 min-[430px]:grid-cols-3">
              <div className="rounded-3xl border border-white/10 bg-white/[0.055] p-4 sm:p-5">
                <p className="text-xs font-bold uppercase tracking-[0.14em] text-slate-500">Pagado por clientes</p>
                <p className="mt-2 text-2xl font-black text-white sm:text-3xl">{money(totalPaid)}</p>
              </div>
              <div className="rounded-3xl border border-coral/25 bg-coral/10 p-4 sm:p-5">
                <p className="text-xs font-bold uppercase tracking-[0.14em] text-coral">Corte Stripe</p>
                <p className="mt-2 text-2xl font-black text-white sm:text-3xl">-{money(totalFees)}</p>
              </div>
              <div className="rounded-3xl border border-mint/25 bg-mint/10 p-4 sm:p-5">
                <p className="text-xs font-bold uppercase tracking-[0.14em] text-mint">Neto recibido</p>
                <p className="mt-2 text-2xl font-black text-white sm:text-3xl">{money(totalNet)}</p>
              </div>
            </section>

            <section className="mt-3 grid gap-3 min-[430px]:grid-cols-2">
              <div className="rounded-3xl border border-mint/25 bg-mint/10 p-4 sm:p-5">
                <p className="text-xs font-bold uppercase tracking-[0.14em] text-mint">Dinero empresa Donos</p>
                <p className="mt-2 text-2xl font-black text-white sm:text-3xl">{money(donosMoney)}</p>
              </div>
              <a className="rounded-3xl border border-coral/25 bg-coral/10 p-4 text-coral sm:p-5" href="donos-admin-stripe-debts.html">
                <p className="text-xs font-bold uppercase tracking-[0.14em] opacity-80">Deuda por comisiones</p>
                <p className="mt-2 text-2xl font-black text-white sm:text-3xl">{money(donosDebt)}</p>
                <p className="mt-2 text-xs font-black text-coral/80">Ver cuentas que la causaron</p>
              </a>
            </section>

            <section className="mt-6 rounded-[30px] border border-white/10 bg-white/[0.055] p-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p className="text-sm font-black text-white">Control de packs</p>
                  <p className="mt-1 text-xs font-bold text-slate-400">Suspende una recarga si genera deuda o quieres revisarla.</p>
                </div>
                <span className="rounded-full bg-coral/10 px-3 py-1 text-xs font-black text-coral ring-1 ring-coral/20">Admin</span>
              </div>
              <div className="mt-4 grid gap-2 sm:grid-cols-4">
                {packs.map((pack) => (
                  <button
                    key={pack.points}
                    className={`rounded-2xl border p-3 text-left transition disabled:opacity-60 ${
                      pack.is_disabled ? "border-coral/25 bg-coral/10 text-coral" : "border-mint/25 bg-mint/10 text-mint"
                    }`}
                    disabled={savingPack === String(pack.points)}
                    onClick={() => togglePack(pack)}
                  >
                    <p className="text-lg font-black">{pack.points} ptos.</p>
                    <p className="mt-1 text-xs font-black">{pack.is_disabled ? "Suspendido" : "Activo"}</p>
                  </button>
                ))}
              </div>
            </section>

            <section className="mt-6 rounded-[26px] border border-white/10 bg-white/[0.055] p-3">
              <label className="flex items-center gap-3">
                <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                <input
                  className="h-11 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500 sm:text-base"
                  value={search}
                  onChange={(event) => setSearch(event.target.value)}
                  placeholder="Buscar pago, email, ID Donos, cliente..."
                />
              </label>
            </section>

            <section className="mt-6 overflow-hidden rounded-[24px] border border-white/10 bg-white/[0.055] sm:rounded-[30px]">
              <div className="hidden grid-cols-[1.25fr_1fr_.8fr_.8fr_.8fr_.8fr_150px] gap-3 border-b border-white/10 px-5 py-4 text-xs font-black uppercase tracking-[0.12em] text-slate-500 lg:grid">
                <span>Cliente</span>
                <span>Contacto</span>
                <span>Fecha</span>
                <span>Pagó</span>
                <span>Stripe</span>
                <span>Puntos</span>
                <span></span>
              </div>

              <div className="divide-y divide-white/10">
                {filteredRecharges.map((item) => {
                  const profile = item.profiles || {};
                  return (
                    <article key={item.id} className="grid gap-3 px-4 py-4 lg:grid-cols-[1.25fr_1fr_.8fr_.8fr_.8fr_.8fr_150px] lg:items-center lg:px-5">
                      <div className="min-w-0">
                        <p className="truncate font-black text-white">{profile.display_name || item.customer_email || "Cliente"}</p>
                        <p className="mt-1 break-all font-mono text-xs font-bold text-slate-500">{formatDonosId(profile.transaction_id)}</p>
                      </div>
                      <div className="min-w-0">
                        <p className="truncate text-sm font-bold text-slate-300">{profile.email || item.customer_email || "Sin email"}</p>
                        <p className="mt-1 truncate text-xs font-bold text-slate-500">{profile.phone || "Sin teléfono"}</p>
                      </div>
                      <p className="text-sm font-bold text-slate-300">{dateTime(item.created_at)}</p>
                      <p className="text-sm font-black text-white">{money(item.amount_total, item.currency)}</p>
                      <p className="text-sm font-black text-coral">-{money(item.stripe_fee_amount, item.currency)}</p>
                      <div>
                        <p className="text-sm font-black text-mint">+{item.points} ptos.</p>
                        <p className="mt-1 text-xs font-bold text-slate-500">Ahora: {profile.points || 0} ptos.</p>
                      </div>
                      <div className="grid gap-2 min-[360px]:grid-cols-2 lg:grid-cols-2">
                        <button className="h-10 rounded-2xl bg-mint px-4 text-sm font-black text-ink" onClick={() => setSelected(item)}>
                          Más
                        </button>
                        <button
                          className="h-10 rounded-2xl border border-coral/25 bg-coral/10 px-3 text-sm font-black text-coral transition hover:bg-coral/15 disabled:opacity-50"
                          disabled={deletingId === item.id}
                          onClick={() => deleteRecharge(item)}
                        >
                          {deletingId === item.id ? "..." : "Eliminar"}
                        </button>
                      </div>
                    </article>
                  );
                })}
              </div>

              {filteredRecharges.length === 0 && (
                <div className="p-6 text-sm font-bold text-slate-300">
                  {recharges.length === 0 ? "Todavía no hay recargas registradas." : "No hay resultados para esta búsqueda."}
                </div>
              )}
            </section>

            {selected && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 px-4 py-6 backdrop-blur-xl">
                <section className="mx-auto max-w-3xl rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl shadow-black/50 sm:p-7">
                  <div className="flex items-start justify-between gap-4">
                    <div>
                      <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Detalle del pago</p>
                      <h2 className="mt-2 text-3xl font-black text-white">{selected.profiles?.display_name || selected.customer_email || "Cliente"}</h2>
                    </div>
                    <button className="grid h-11 w-11 place-items-center rounded-full bg-white/10 text-2xl font-black text-white" onClick={() => setSelected(null)}>×</button>
                  </div>

                  <div className="mt-6 grid gap-3 sm:grid-cols-2">
                    <DetailItem label="Fecha y hora" value={dateTime(selected.created_at)} />
                    <DetailItem label="Stripe session" value={selected.stripe_session_id} />
                    <DetailItem label="Email cuenta" value={selected.profiles?.email || selected.customer_email} />
                    <DetailItem label="Teléfono" value={selected.profiles?.phone} />
                    <DetailItem label="Barrio" value={selected.profiles?.neighborhood} />
                    <DetailItem label="Dirección" value={selected.profiles?.address} />
                    <DetailItem label="ID Donos" value={formatDonosId(selected.profiles?.transaction_id)} />
                    <DetailItem label="Tipo de cuenta" value={selected.profiles?.account_type} />
                    <DetailItem label="Puntos comprados" value={`${selected.points} ptos.`} />
                    <DetailItem label="Puntos actuales" value={`${selected.profiles?.points || 0} ptos.`} />
                    <DetailItem label="Pagó" value={money(selected.amount_total, selected.currency)} />
                    <DetailItem label="Stripe cortó" value={`-${money(selected.stripe_fee_amount, selected.currency)}`} />
                    <DetailItem label="Neto recibido" value={money(selected.net_amount, selected.currency)} />
                    <DetailItem label="Dinero Donos" value={money(selected.donos_company_margin_cents, selected.currency)} />
                    <DetailItem label="Deuda generada" value={money(selected.donos_debt_cents, selected.currency)} />
                  </div>

                  <button
                    className="mt-5 h-12 w-full rounded-2xl border border-coral/25 bg-coral/10 text-sm font-black text-coral transition hover:bg-coral/15 disabled:opacity-50"
                    disabled={deletingId === selected.id}
                    onClick={() => deleteRecharge(selected)}
                  >
                    {deletingId === selected.id ? "Eliminando..." : "Eliminar este pago de prueba"}
                  </button>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
