<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Mis publicaciones</title>
    <script src="donoss-i18n.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166" },
            boxShadow: { glow: "0 24px 80px rgba(66, 242, 179, 0.16)" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; overflow-x: hidden; }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% -5%, rgba(66, 242, 179, 0.18), transparent 28%),
          radial-gradient(circle at 88% 10%, rgba(255, 209, 102, 0.12), transparent 30%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      #root, main { max-width: 100%; overflow-x: hidden; }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
      const myOfferListSelect = "id,business_id,title,cover_photo_data_url,address,categories,base_price,reduced_price,required_points,external_checkout_enabled,external_checkout_url,author,description,is_hidden,stock_quantity,sold_count,out_of_stock_since,qr_valid_until,end_date,created_at";

      function formatEuro(value) {
        if (value === null || value === undefined || value === "") return "";
        return `${Number(value).toLocaleString("es-ES", { maximumFractionDigits: 2 })}€`;
      }

      function formatCents(value) {
        return `${(Number(value || 0) / 100).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}€`;
      }

      function formatDateTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
      }

      function getDiscountPercent(basePrice, reducedPrice) {
        const base = Number(basePrice);
        const reduced = Number(reducedPrice);
        if (!base || !Number.isFinite(base) || !Number.isFinite(reduced) || reduced >= base) return null;
        return Math.round(((base - reduced) / base) * 100);
      }

      function getRemainingStock(offer) {
        if (offer.stock_quantity === null || offer.stock_quantity === undefined || offer.stock_quantity === "") return null;
        return Math.max(Number(offer.stock_quantity || 0) - Number(offer.sold_count || 0), 0);
      }

      function isOutOfStock(offer) {
        const remaining = getRemainingStock(offer);
        return remaining !== null && remaining <= 0;
      }

      function todayDateString() {
        return new Date().toISOString().slice(0, 10);
      }

      function getOfferExpiredReason(offer) {
        const today = todayDateString();
        const qrUntil = offer?.qr_valid_until ? String(offer.qr_valid_until).slice(0, 10) : "";
        const endDate = offer?.end_date ? String(offer.end_date).slice(0, 10) : "";
        if (qrUntil && qrUntil < today) return "QR caducado";
        if (endDate && endDate < today) return "Fecha de fin pasada";
        return "";
      }

      function isOfferExpired(offer) {
        return Boolean(getOfferExpiredReason(offer));
      }

      function matchesSearch(offer, query) {
        const cleanQuery = query.trim().toLowerCase();
        if (!cleanQuery) return true;

        return [
          offer.title,
          offer.address,
          offer.author,
          offer.description,
          offer.categories?.join(" "),
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase()
          .includes(cleanQuery);
      }

      function redirectToLogin() {
        const next = window.location.pathname + window.location.search;
        window.location.href = `login.html?next=${encodeURIComponent(next)}`;
      }

      function OfferRow({ offer, onToggleHidden, onDelete, onTransfer, canTransfer, promotion }) {
        const discount = getDiscountPercent(offer.base_price, offer.reduced_price);
        const remainingStock = getRemainingStock(offer);
        const outOfStock = isOutOfStock(offer);
        const hidden = Boolean(offer.is_hidden);
        const expiredReason = getOfferExpiredReason(offer);
        return (
          <article className={`overflow-hidden rounded-[28px] border shadow-2xl shadow-black/20 ${
            expiredReason
              ? "border-coral/25 bg-coral/10"
              : hidden
                ? "border-sun/25 bg-sun/10"
                : "border-white/10 bg-white/[0.055]"
          }`}>
            <div className="grid gap-0 sm:grid-cols-[220px_1fr]">
              <div className="relative min-h-[170px] bg-gradient-to-br from-mint via-[#183047] to-[#FF6B6B]">
                {offer.cover_photo_data_url ? (
                  <img className="absolute inset-0 h-full w-full object-cover" src={offer.cover_photo_data_url} alt="" />
                ) : (
                  <div className="absolute bottom-4 right-5 text-6xl">＋</div>
                )}
                <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>
	                <div className="absolute left-4 top-4 flex flex-wrap gap-2">
                    <span className="rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">{offer.required_points || 0} ptos.</span>
                    {outOfStock && <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">Agotado</span>}
                    {expiredReason && <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">Caducada</span>}
                    {hidden && <span className="rounded-full bg-sun px-3 py-1 text-xs font-black text-ink">Oculta</span>}
                    {promotion && <span className="rounded-full bg-sky-400 px-3 py-1 text-xs font-black text-ink">Promocionada</span>}
                  </div>
              </div>

              <div className="flex flex-col gap-4 p-4 sm:p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
	                    <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">{offer.categories?.join(", ") || "Sin categoría"}</p>
	                    <h2 className="mt-1 text-2xl font-black leading-tight text-white">{offer.title || "Oferta sin título"}</h2>
	                    <p className="mt-2 text-sm font-semibold text-slate-400">{offer.address || "Dirección no indicada"}</p>
                      {remainingStock !== null && (
                        <p className={`mt-2 inline-flex rounded-full px-3 py-1 text-xs font-black ${
                          outOfStock ? "bg-coral/10 text-coral ring-1 ring-coral/20" : "bg-white/10 text-slate-300 ring-1 ring-white/10"
                        }`}>
                          {outOfStock ? "Ruptura de stock" : `${remainingStock} disponibles`}
                        </p>
                      )}
                      {expiredReason && (
                        <p className="mt-2 inline-flex rounded-full bg-coral/10 px-3 py-1 text-xs font-black text-coral ring-1 ring-coral/20">
                          {expiredReason}
                        </p>
                      )}
                      {promotion && (
                        <p className="mt-2 inline-flex rounded-full bg-sky-400/10 px-3 py-1 text-xs font-black text-sky-200 ring-1 ring-sky-400/20">
                          Promocionada hasta {formatDateTime(promotion.ends_at)}
                        </p>
                      )}
	                  </div>
                  <div className="flex items-center gap-2">
                    {discount !== null && <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">-{discount}%</span>}
                    {offer.base_price !== null && <span className="rounded-full bg-white/10 px-3 py-1 text-xs font-black text-slate-300 line-through">{formatEuro(offer.base_price)}</span>}
                  </div>
                </div>

                  <div className="mt-auto grid gap-2 min-[390px]:grid-cols-4 sm:flex sm:justify-end">
                  <a
                    className="flex h-11 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.07] px-4 text-sm font-black text-white transition hover:bg-white/[0.11]"
                    href={`offer-detail.html?id=${offer.id}`}
                  >
                    Ver
                  </a>
                  <a
                    className="flex h-11 items-center justify-center rounded-2xl bg-mint px-4 text-sm font-black text-ink shadow-glow transition hover:bg-[#66ffd0]"
                    href={`admin-offer.html?id=${offer.id}`}
                  >
                    Editar
                  </a>
                  <button
                    className={`flex h-11 items-center justify-center rounded-2xl border px-4 text-sm font-black transition ${
                      hidden
                        ? "border-mint/25 bg-mint/10 text-mint hover:bg-mint/15"
                        : "border-sun/25 bg-sun/10 text-sun hover:bg-sun/15"
                    }`}
                    onClick={() => onToggleHidden(offer)}
                  >
                    {hidden ? "Mostrar" : "Ocultar"}
                  </button>
                  {canTransfer && (
                    <button
                      className="flex h-11 items-center justify-center rounded-2xl border border-sky-400/25 bg-sky-400/10 px-4 text-sm font-black text-sky-200 transition hover:bg-sky-400/15"
                      onClick={() => onTransfer(offer)}
                    >
                      Transferir
                    </button>
                  )}
                  <button
                    className="flex h-11 items-center justify-center rounded-2xl border border-coral/25 bg-coral/10 px-4 text-sm font-black text-coral transition hover:bg-coral/15"
                    onClick={() => onDelete(offer)}
                  >
                    Eliminar
                  </button>
                </div>
              </div>
            </div>
          </article>
        );
      }

      function App() {
        const [offers, setOffers] = React.useState([]);
        const [search, setSearch] = React.useState("");
        const [status, setStatus] = React.useState("Cargando publicaciones...");
        const [deleteStatus, setDeleteStatus] = React.useState({ type: "", message: "" });
        const [businessName, setBusinessName] = React.useState(localStorage.getItem("donosDisplayName") || "Empresa");
        const [stockFilter, setStockFilter] = React.useState(0);
        const [accessToken, setAccessToken] = React.useState("");
        const [canTransferOffers, setCanTransferOffers] = React.useState(false);
        const [transferOffer, setTransferOffer] = React.useState(null);
        const [transferBusinesses, setTransferBusinesses] = React.useState([]);
        const [transferSearch, setTransferSearch] = React.useState("");
        const [selectedTransferBusinessId, setSelectedTransferBusinessId] = React.useState("");
        const [isLoadingTransferBusinesses, setIsLoadingTransferBusinesses] = React.useState(false);
        const [isTransferring, setIsTransferring] = React.useState(false);
        const [profilePoints, setProfilePoints] = React.useState(Number(localStorage.getItem("donosPoints") || 0));
        const [isAdminFreePromotion, setIsAdminFreePromotion] = React.useState(false);
        const [activePromotions, setActivePromotions] = React.useState([]);
        const [promotionOpen, setPromotionOpen] = React.useState(false);
        const [promotionIntroOpen, setPromotionIntroOpen] = React.useState(() => localStorage.getItem("donossPromotionIntroHidden") !== "1");
        const [promotionSearch, setPromotionSearch] = React.useState("");
        const [selectedPromotionOfferIds, setSelectedPromotionOfferIds] = React.useState([]);
        const [promotionHours, setPromotionHours] = React.useState(24);
        const [isPromoting, setIsPromoting] = React.useState(false);
        const promotionOptions = Array.from({ length: 7 }, (_, index) => {
          const hours = (index + 1) * 24;
          return { hours, days: index + 1, cents: (index + 1) * 1599 };
        });
        const promotionOffers = offers.filter((offer) => !isOfferExpired(offer) && !offer.is_hidden);
        const filteredPromotionOffers = promotionOffers.filter((offer) => matchesSearch(offer, promotionSearch));
        const activePromotionByOfferId = Object.fromEntries(activePromotions.map((promotion) => [promotion.offer_id, promotion]));
        const selectedPromotionCount = selectedPromotionOfferIds.length;
        const promotionDays = promotionHours / 24;
        const promotionUnitCents = promotionDays * 1599;
        const promotionTotalCents = selectedPromotionCount * promotionUnitCents;
        const promotionTotalPoints = Math.ceil(promotionTotalCents / 10);
        const hasEnoughPromotionPoints = isAdminFreePromotion || profilePoints >= promotionTotalPoints;
        const activeFilteredOffers = offers.filter((offer) => !isOfferExpired(offer) && matchesSearch(offer, search));
        const expiredFilteredOffers = offers.filter((offer) => isOfferExpired(offer) && matchesSearch(offer, search));
        const filteredTransferBusinesses = transferBusinesses.filter((business) => {
          const query = transferSearch.trim().toLowerCase();
          if (!query) return true;
          return [
            business.display_name,
            business.email,
            business.transaction_id,
            business.neighborhood,
            business.address,
            business.business_categories?.join(" "),
          ].filter(Boolean).join(" ").toLowerCase().includes(query);
        });
        const stockWatchOffers = offers
          .filter((offer) => {
            const remaining = getRemainingStock(offer);
            return !isOfferExpired(offer) && remaining !== null && remaining <= stockFilter;
          })
          .sort((a, b) => getRemainingStock(a) - getRemainingStock(b));

        React.useEffect(() => {
          async function loadOffers() {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            const session = sessionData.session;
            const { data: userData } = await supabaseClient.auth.getUser();
            const userId = userData.user?.id;

            if (!userId) {
              redirectToLogin();
              return;
            }

            setAccessToken(session?.access_token || "");
            setCanTransferOffers(String(userData.user?.email || "").trim().toLowerCase() === "donoss.red@gmail.com");

            const [{ data: profile }, { data, error }, promotionsResponse] = await Promise.all([
              supabaseClient.from("profiles").select("display_name, account_type, points, email").eq("id", userId).maybeSingle(),
              supabaseClient.from("business_offers").select(myOfferListSelect).eq("business_id", userId).order("created_at", { ascending: false }),
              session?.access_token
                ? fetch("/api/me/offer-promotions", { headers: { Authorization: `Bearer ${session.access_token}` } }).catch(() => null)
                : null,
            ]);

            if (profile?.display_name) setBusinessName(profile.display_name);
            if (typeof profile?.points !== "undefined") {
              setProfilePoints(Number(profile.points || 0));
              localStorage.setItem("donosPoints", String(Number(profile.points || 0)));
            }
            setIsAdminFreePromotion(String(userData.user?.email || profile?.email || "").trim().toLowerCase() === "donoss.red@gmail.com");

            if (profile?.account_type && profile.account_type !== "business") {
              setStatus("Esta zona es solo para cuentas empresa.");
              return;
            }

            if (error) {
              setStatus("No se han podido cargar tus publicaciones.");
              return;
            }

            setOffers(data || []);
            if (promotionsResponse?.ok) {
              const promotionsData = await promotionsResponse.json().catch(() => ({}));
              setActivePromotions(promotionsData.promotions || []);
            }
            setStatus(data?.length ? "" : "Todavía no has publicado ninguna oferta.");
          }

          loadOffers();
        }, []);

        function openPromotionPanel() {
          setPromotionOpen(true);
          setPromotionSearch("");
          setSelectedPromotionOfferIds([]);
          setPromotionHours(24);
          setDeleteStatus({ type: "", message: "" });
        }

        function hidePromotionIntro() {
          localStorage.setItem("donossPromotionIntroHidden", "1");
          setPromotionIntroOpen(false);
        }

        function togglePromotionOffer(offerId) {
          setSelectedPromotionOfferIds((current) => (
            current.includes(offerId)
              ? current.filter((id) => id !== offerId)
              : [...current, offerId]
          ));
        }

        async function submitPromotion() {
          if (!accessToken) return redirectToLogin();
          if (selectedPromotionOfferIds.length === 0) {
            setDeleteStatus({ type: "error", message: "Elige al menos una publicación para promocionar." });
            return;
          }
          if (!hasEnoughPromotionPoints) {
            setDeleteStatus({ type: "error", message: "No tienes puntos suficientes para esta promoción." });
            return;
          }

          setIsPromoting(true);
          setDeleteStatus({ type: "", message: "" });
          try {
            const response = await fetch("/api/me/offer-promotions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ offerIds: selectedPromotionOfferIds, durationHours: promotionHours }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "promotion_failed");
            setActivePromotions((current) => [...(data.promotions || []), ...current]);
            if (typeof data.profile_points !== "undefined") {
              setProfilePoints(Number(data.profile_points || 0));
              localStorage.setItem("donosPoints", String(Number(data.profile_points || 0)));
            }
            setPromotionOpen(false);
            setSelectedPromotionOfferIds([]);
            setDeleteStatus({
              type: "success",
              message: data.admin_free
                ? "Promoción activada sin coste para la cuenta Donoss."
                : "Promoción activada correctamente.",
            });
          } catch (error) {
            const message = error.message || "";
            setDeleteStatus({
              type: "error",
              message: message.includes("offer_promotions_sql_missing")
                ? "Falta ejecutar supabase-offer-promotions.sql en Supabase."
                : message.includes("insufficient_points")
                  ? "No tienes puntos suficientes para esta promoción."
                  : "No se ha podido activar la promoción.",
            });
          } finally {
            setIsPromoting(false);
          }
        }

        React.useEffect(() => {
          if (!transferOffer || !accessToken || transferBusinesses.length > 0) return;

          let cancelled = false;
          async function loadTransferBusinesses() {
            setIsLoadingTransferBusinesses(true);
            try {
              const response = await fetch("/api/me/offer-transfer/businesses", {
                headers: { Authorization: `Bearer ${accessToken}` },
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(data.error || "businesses_load_failed");
              if (!cancelled) setTransferBusinesses(data.businesses || []);
            } catch (error) {
              if (!cancelled) {
                setDeleteStatus({ type: "error", message: "No se han podido cargar las empresas para transferir." });
                setTransferOffer(null);
              }
            } finally {
              if (!cancelled) setIsLoadingTransferBusinesses(false);
            }
          }

          loadTransferBusinesses();
          return () => {
            cancelled = true;
          };
        }, [transferOffer, accessToken, transferBusinesses.length]);

        async function toggleHiddenOffer(offer) {
          setDeleteStatus({ type: "", message: "" });
          const nextHidden = !offer.is_hidden;
          const confirmed = window.confirm(
            nextHidden
              ? `¿Ocultar "${offer.title || "esta publicación"}"? Dejará de aparecer para los jóvenes y no podrán comprarla.`
              : `¿Volver a mostrar "${offer.title || "esta publicación"}" en Donoss?`
          );
          if (!confirmed) return;

          const { data: userData } = await supabaseClient.auth.getUser();
          const userId = userData.user?.id;

          if (!userId) {
            redirectToLogin();
            return;
          }

          const { error } = await supabaseClient
            .from("business_offers")
            .update({ is_hidden: nextHidden, updated_at: new Date().toISOString() })
            .eq("id", offer.id)
            .eq("business_id", userId);

          if (error) {
            setDeleteStatus({
              type: "error",
              message: error.message?.includes("row-level security")
                ? "Supabase está bloqueando la actualización. Revisa el SQL de ofertas."
                : error.code === "42703"
                  ? "Falta ejecutar el SQL de ofertas para activar publicaciones ocultas."
                  : "No se ha podido actualizar la publicación.",
            });
            return;
          }

          setOffers((current) => current.map((item) => item.id === offer.id ? { ...item, is_hidden: nextHidden } : item));
          setDeleteStatus({ type: "success", message: nextHidden ? "Publicación ocultada correctamente." : "Publicación visible de nuevo." });
        }

        function openTransferModal(offer) {
          setDeleteStatus({ type: "", message: "" });
          setTransferOffer(offer);
          setTransferSearch("");
          setSelectedTransferBusinessId("");
        }

        function closeTransferModal() {
          if (isTransferring) return;
          setTransferOffer(null);
          setTransferSearch("");
          setSelectedTransferBusinessId("");
        }

        async function transferSelectedOffer() {
          if (!transferOffer || !selectedTransferBusinessId) return;
          const target = transferBusinesses.find((business) => business.id === selectedTransferBusinessId);
          if (!target) return;

          const confirmed = window.confirm(
            `¿Transferir "${transferOffer.title || "esta publicación"}" a ${target.display_name || "esta empresa"}? Después ya no aparecerá en tus publicaciones.`
          );
          if (!confirmed) return;

          setIsTransferring(true);
          setDeleteStatus({ type: "", message: "" });

          try {
            const response = await fetch("/api/me/offer-transfer", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                offerId: transferOffer.id,
                targetBusinessId: target.id,
              }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "offer_transfer_failed");

            setOffers((current) => current.filter((offer) => offer.id !== transferOffer.id));
            setDeleteStatus({
              type: "success",
              message: `Publicación transferida a ${target.display_name || "la empresa"} correctamente.`,
            });
            setTransferOffer(null);
            setTransferSearch("");
            setSelectedTransferBusinessId("");
          } catch (error) {
            const message = error.message || "";
            setDeleteStatus({
              type: "error",
              message: message.includes("target_business_missing_donos_id")
                ? "La empresa elegida no tiene ID Donoss. Revisa su cuenta antes de transferir."
                : message.includes("only_own_admin_offers")
                  ? "Solo puedes transferir publicaciones creadas desde tu cuenta admin."
                  : message.includes("admin_email_required")
                    ? "Solo donoss.red@gmail.com puede transferir publicaciones."
                    : "No se ha podido transferir la publicación.",
            });
          } finally {
            setIsTransferring(false);
          }
        }

        async function deleteOffer(offer) {
          setDeleteStatus({ type: "", message: "" });
          const confirmed = window.confirm(`¿Eliminar definitivamente "${offer.title || "esta publicación"}"? Esta acción no se puede deshacer.`);
          if (!confirmed) return;

          const { data: userData } = await supabaseClient.auth.getUser();
          const userId = userData.user?.id;

          if (!userId) {
            redirectToLogin();
            return;
          }

          const { error } = await supabaseClient
            .from("business_offers")
            .delete()
            .eq("id", offer.id)
            .eq("business_id", userId);

          if (error) {
            setDeleteStatus({
              type: "error",
              message: error.message?.includes("row-level security")
                ? "Supabase está bloqueando la eliminación. Revisa el SQL de ofertas."
                : "No se ha podido eliminar la publicación.",
            });
            return;
          }

          setOffers((current) => current.filter((item) => item.id !== offer.id));
          setDeleteStatus({ type: "success", message: "Publicación eliminada definitivamente." });
        }

        return (
            <main className="mx-auto min-h-screen w-full max-w-5xl px-3 pb-10 pt-4 sm:px-6 lg:px-8">
            <header className="flex items-center justify-between gap-3">
              <a href="home.html?type=business" className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center overflow-hidden rounded-2xl bg-white shadow-glow">
                  <img src="assets/donoss-infinity-logo.jpeg" alt="" className="h-full w-full object-cover" />
                </div>
                <div>
                  <p className="text-lg font-black leading-tight">Donoss</p>
                  <p className="text-xs font-semibold text-slate-400">Panel empresa</p>
                </div>
              </a>
              <div className="flex shrink-0 items-center gap-2">
                <button className="rounded-full border border-sky-400/25 bg-sky-400/10 px-4 py-2 text-sm font-black text-sky-100 shadow-glow" type="button" onClick={openPromotionPanel}>
                  Promocionar
                </button>
                <a className="rounded-full bg-mint px-4 py-2 text-sm font-black text-ink shadow-glow" href="create-offer.html">Crear</a>
              </div>
            </header>

            <section className="mt-8 rounded-[34px] border border-white/10 bg-white/[0.055] p-6 shadow-glow sm:p-8">
              <p className="text-sm font-bold uppercase tracking-[0.18em] text-mint">Mis publicaciones</p>
              <h1 className="mt-2 break-words text-3xl font-black tracking-normal text-white sm:text-4xl">{businessName}</h1>
              <p className="mt-3 max-w-2xl text-sm leading-6 text-slate-400">
                Gestiona todas las ofertas de tu empresa desde un solo lugar. Puedes revisar la vista pública o editar cualquier publicación.
              </p>
            </section>

	            <section className="mt-6">
                {!status && (
                  <div className="mb-5 rounded-[30px] border border-white/10 bg-white/[0.055] p-4 shadow-2xl shadow-black/20 sm:p-5">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                      <div>
                        <p className="text-xs font-bold uppercase tracking-[0.16em] text-coral">Stock crítico</p>
                        <h2 className="mt-1 text-xl font-black text-white">Productos a revisar</h2>
                        <p className="mt-1 text-sm font-semibold text-slate-400">Filtra los productos agotados o con pocas unidades disponibles.</p>
                      </div>
                      <div className="grid grid-cols-4 gap-2 rounded-2xl border border-white/10 bg-black/20 p-1">
                        {[
                          [0, "Agotado"],
                          [2, "≤2"],
                          [3, "≤3"],
                          [5, "≤5"],
                        ].map(([value, label]) => (
                          <button
                            key={value}
                            className={`h-10 rounded-xl px-3 text-xs font-black transition ${
                              stockFilter === value ? "bg-coral text-white" : "bg-white/[0.06] text-slate-300"
                            }`}
                            onClick={() => setStockFilter(value)}
                          >
                            {label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="mt-4 grid gap-3">
                      {stockWatchOffers.length > 0 ? (
                        stockWatchOffers.map((offer) => (
                          <a
                            key={offer.id}
                            className="flex items-center justify-between gap-3 rounded-2xl border border-white/10 bg-black/20 p-3 transition hover:border-mint/30 hover:bg-white/[0.07]"
                            href={`admin-offer.html?id=${offer.id}`}
                          >
                            <div className="min-w-0">
                              <p className="truncate text-sm font-black text-white">{offer.title || "Oferta sin título"}</p>
                              <p className="mt-1 text-xs font-bold text-slate-500">
                                Vendidos: {offer.sold_count || 0} · Disponible: {getRemainingStock(offer)}
                              </p>
                            </div>
                            <span className="shrink-0 rounded-full bg-mint px-3 py-1 text-xs font-black text-ink">Editar stock</span>
                          </a>
                        ))
                      ) : (
                        <p className="rounded-2xl border border-white/10 bg-black/20 p-4 text-sm font-bold text-slate-400">
                          No hay productos en este filtro.
                        </p>
                      )}
                    </div>
                  </div>
                )}

	              <div className="mb-4 rounded-[26px] border border-white/10 bg-white/[0.055] p-3">
                <label className="flex items-center gap-3">
                  <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-mint/10 text-lg text-mint ring-1 ring-mint/20">⌕</span>
                  <input
                    className="h-11 min-w-0 flex-1 bg-transparent text-base font-bold text-white outline-none placeholder:text-slate-500"
                    value={search}
                    onChange={(event) => setSearch(event.target.value)}
                    placeholder="Buscar por título, categoría, dirección..."
                  />
                </label>
              </div>

              {deleteStatus.message && (
                <div className={`mb-4 rounded-2xl border p-4 text-sm font-bold ${
                  deleteStatus.type === "success" ? "border-mint/25 bg-mint/10 text-mint" : "border-coral/30 bg-coral/10 text-coral"
                }`}>
                  {deleteStatus.message}
                </div>
              )}

              {status ? (
                <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6">
                  <p className="text-sm font-bold text-slate-300">{status}</p>
                  <a className="mt-4 inline-flex rounded-full bg-mint px-4 py-2 text-sm font-black text-ink" href="create-offer.html">
                    Crear una publicación
                  </a>
                </div>
              ) : (
                <div className="space-y-5">
                  {expiredFilteredOffers.length > 0 && (
                    <section className="rounded-[30px] border border-coral/25 bg-coral/10 p-4 shadow-2xl shadow-black/20 sm:p-5">
                      <div className="mb-4 flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <p className="text-xs font-bold uppercase tracking-[0.16em] text-coral">Caducadas</p>
                          <h2 className="mt-1 text-xl font-black text-white">Billetes y ofertas fuera de fecha</h2>
                          <p className="mt-1 text-sm font-semibold leading-6 text-slate-300">
                            Ya no aparecen para los jóvenes. Puedes modificarlas, ocultarlas o eliminarlas.
                          </p>
                        </div>
                        <span className="rounded-full bg-coral px-3 py-1 text-xs font-black text-white">{expiredFilteredOffers.length}</span>
                      </div>
                      <div className="grid gap-4">
                        {expiredFilteredOffers.map((offer) => (
                          <OfferRow
                            key={offer.id}
                            offer={offer}
                            promotion={activePromotionByOfferId[offer.id]}
                            onToggleHidden={toggleHiddenOffer}
                            onDelete={deleteOffer}
                            onTransfer={openTransferModal}
                            canTransfer={canTransferOffers}
                          />
                        ))}
                      </div>
                    </section>
                  )}

                  {activeFilteredOffers.length === 0 && expiredFilteredOffers.length === 0 ? (
                    <div className="rounded-[28px] border border-white/10 bg-white/[0.055] p-6 text-sm font-bold text-slate-300">
                      No hay publicaciones que coincidan con tu búsqueda.
                    </div>
                  ) : activeFilteredOffers.length > 0 ? (
                    <div className="grid gap-4">
                      {activeFilteredOffers.map((offer) => (
                        <OfferRow
                          key={offer.id}
                          offer={offer}
                          promotion={activePromotionByOfferId[offer.id]}
                          onToggleHidden={toggleHiddenOffer}
                          onDelete={deleteOffer}
                          onTransfer={openTransferModal}
                          canTransfer={canTransferOffers}
                        />
                      ))}
                    </div>
                  ) : null}
                </div>
              )}
            </section>
            {promotionOpen && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/72 px-4 py-6 backdrop-blur-xl">
                <section className="max-h-[90vh] w-full max-w-5xl overflow-hidden rounded-[34px] border border-white/10 bg-[#0D111D] shadow-2xl shadow-black/50">
                  <div className="border-b border-white/10 p-5 sm:p-6">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.16em] text-sky-200">Promocionar</p>
                        <h2 className="mt-2 text-3xl font-black text-white">Impulsa tus publicaciones</h2>
                        <p className="mt-2 max-w-2xl text-sm font-semibold leading-6 text-slate-400">
                          Elige una o varias publicaciones, define la duración y paga con puntos Donoss.
                        </p>
                      </div>
                      <button
                        className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-white/10 text-xl font-black text-white ring-1 ring-white/10"
                        onClick={() => setPromotionOpen(false)}
                        disabled={isPromoting}
                      >
                        ×
                      </button>
                    </div>

                    {promotionIntroOpen && (
                      <div className="mt-5 rounded-[28px] border border-mint/20 bg-mint/10 p-4">
                        <p className="text-sm font-black text-white">Cada recarga fortalece tu posición en Donoss</p>
                        <p className="mt-2 text-sm font-semibold leading-6 text-slate-300">
                          Con Donoss, cada recarga refuerza tu posición de negociación para bajar tus precios de promoción, premium u otros servicios cuando haya acuerdos especiales.
                        </p>
                        <div className="mt-4 flex flex-wrap gap-2">
                          <button className="h-10 rounded-2xl bg-mint px-4 text-sm font-black text-ink shadow-glow" type="button" onClick={hidePromotionIntro}>
                            No volver a mostrar
                          </button>
                          <button className="h-10 rounded-2xl border border-white/10 bg-white/[0.07] px-4 text-sm font-black text-white" type="button" onClick={() => setPromotionIntroOpen(false)}>
                            Quitar
                          </button>
                        </div>
                      </div>
                    )}

                    <label className="mt-5 flex items-center gap-3 rounded-2xl border border-white/10 bg-black/20 p-3">
                      <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-sky-400/10 text-sky-200 ring-1 ring-sky-400/20">⌕</span>
                      <input
                        className="h-10 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500"
                        value={promotionSearch}
                        onChange={(event) => setPromotionSearch(event.target.value)}
                        placeholder="Buscar publicación para promocionar..."
                      />
                    </label>
                  </div>

                  <div className="grid max-h-[58vh] overflow-y-auto lg:grid-cols-[1.25fr_.75fr]">
                    <div className="border-white/10 p-4 sm:p-5 lg:border-r">
                      <div className="mb-3 flex items-center justify-between gap-3">
                        <p className="text-sm font-black text-white">Biblioteca de publicaciones</p>
                        <span className="rounded-full bg-white/10 px-3 py-1 text-xs font-black text-slate-300">
                          {selectedPromotionCount} seleccionadas
                        </span>
                      </div>
                      {filteredPromotionOffers.length === 0 ? (
                        <p className="rounded-2xl border border-white/10 bg-white/[0.055] p-4 text-sm font-bold text-slate-300">
                          No hay publicaciones disponibles para promocionar.
                        </p>
                      ) : (
                        <div className="grid gap-3">
                          {filteredPromotionOffers.map((offer) => {
                            const selected = selectedPromotionOfferIds.includes(offer.id);
                            const promotion = activePromotionByOfferId[offer.id];
                            return (
                              <button
                                key={offer.id}
                                type="button"
                                className={`grid gap-3 rounded-3xl border p-3 text-left transition min-[520px]:grid-cols-[82px_1fr_auto] ${
                                  selected
                                    ? "border-mint/50 bg-mint/10 shadow-glow"
                                    : "border-white/10 bg-white/[0.045] hover:border-sky-300/30 hover:bg-white/[0.07]"
                                }`}
                                onClick={() => togglePromotionOffer(offer.id)}
                              >
                                <div className="relative h-20 overflow-hidden rounded-2xl bg-gradient-to-br from-mint via-[#183047] to-sky-400">
                                  {offer.cover_photo_data_url && <img className="h-full w-full object-cover" src={offer.cover_photo_data_url} alt="" />}
                                </div>
                                <div className="min-w-0">
                                  <p className="truncate text-base font-black text-white">{offer.title || "Oferta sin título"}</p>
                                  <p className="mt-1 truncate text-xs font-bold text-slate-400">{offer.categories?.join(", ") || "Sin categoría"}</p>
                                  {promotion && <p className="mt-2 inline-flex rounded-full bg-sky-400/10 px-3 py-1 text-[11px] font-black text-sky-200 ring-1 ring-sky-400/20">Activa hasta {formatDateTime(promotion.ends_at)}</p>}
                                </div>
                                <span className={`self-center rounded-full px-3 py-1 text-xs font-black ${selected ? "bg-mint text-ink" : "bg-white/10 text-slate-300"}`}>
                                  {selected ? "Elegida" : "Elegir"}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    <aside className="p-4 sm:p-5">
                      <p className="text-sm font-black text-white">Duración</p>
                      <div className="mt-3 grid gap-2">
                        {promotionOptions.map((option) => (
                          <button
                            key={option.hours}
                            type="button"
                            className={`rounded-2xl border p-3 text-left transition ${
                              promotionHours === option.hours ? "border-mint/60 bg-mint/10 shadow-glow" : "border-white/10 bg-white/[0.045]"
                            }`}
                            onClick={() => setPromotionHours(option.hours)}
                          >
                            <span className="flex items-center justify-between gap-3">
                              <span className="text-sm font-black text-white">{option.hours}h · {option.days} día{option.days > 1 ? "s" : ""}</span>
                              <span className="rounded-full bg-white/10 px-3 py-1 text-xs font-black text-slate-200">{formatCents(option.cents)}</span>
                            </span>
                          </button>
                        ))}
                      </div>

                      <div className="mt-5 rounded-[26px] border border-mint/20 bg-mint/10 p-4">
                        <p className="text-xs font-black uppercase tracking-[0.14em] text-mint">Resumen</p>
                        <div className="mt-3 space-y-2 text-sm font-bold text-slate-300">
                          <div className="flex justify-between gap-3"><span>Publicaciones</span><span>{selectedPromotionCount}</span></div>
                          <div className="flex justify-between gap-3"><span>Duración</span><span>{promotionHours}h</span></div>
                          <div className="flex justify-between gap-3"><span>Precio</span><span>{isAdminFreePromotion ? "Gratis Donoss" : formatCents(promotionTotalCents)}</span></div>
                          <div className="flex justify-between gap-3 border-t border-white/10 pt-3 text-white"><span>Total puntos</span><span>{isAdminFreePromotion ? 0 : promotionTotalPoints} ptos.</span></div>
                          <div className="flex justify-between gap-3 text-slate-400"><span>Tu saldo</span><span>{profilePoints} ptos.</span></div>
                        </div>
                      </div>

                      {!hasEnoughPromotionPoints && (
                        <div className="mt-4 rounded-[24px] border border-sun/25 bg-sun/10 p-4">
                          <p className="text-sm font-black text-sun">Te faltan puntos para promocionar.</p>
                          <p className="mt-2 text-xs font-bold leading-5 text-slate-300">
                            Recarga puntos para activar la promoción y reforzar tu posición de negociación dentro de Donoss.
                          </p>
                          <a className="mt-3 grid h-11 place-items-center rounded-2xl bg-sun text-sm font-black text-ink" href="transfer.html">
                            Recargar puntos
                          </a>
                        </div>
                      )}
                    </aside>
                  </div>

                  <div className="grid gap-3 border-t border-white/10 p-5 min-[430px]:grid-cols-2">
                    <button
                      className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white"
                      onClick={() => setPromotionOpen(false)}
                      disabled={isPromoting}
                    >
                      Cancelar
                    </button>
                    <button
                      className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:cursor-not-allowed disabled:opacity-45"
                      onClick={submitPromotion}
                      disabled={isPromoting || selectedPromotionCount === 0 || !hasEnoughPromotionPoints}
                    >
                      {isPromoting ? "Activando..." : isAdminFreePromotion ? "Promocionar gratis" : `Pagar ${promotionTotalPoints} ptos.`}
                    </button>
                  </div>
                </section>
              </div>
            )}
            {transferOffer && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 px-4 py-6 backdrop-blur-xl">
                <section className="max-h-[88vh] w-full max-w-3xl overflow-hidden rounded-[32px] border border-white/10 bg-[#0D111D] shadow-2xl shadow-black/50">
                  <div className="border-b border-white/10 p-5 sm:p-6">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <p className="text-xs font-black uppercase tracking-[0.16em] text-sky-300">Transferir publicación</p>
                        <h2 className="mt-2 text-2xl font-black text-white">{transferOffer.title || "Oferta sin título"}</h2>
                        <p className="mt-2 text-sm font-semibold leading-6 text-slate-400">
                          Elige la empresa que será propietaria. La publicación aparecerá como suya y recibirá los puntos de futuras compras.
                        </p>
                      </div>
                      <button
                        className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-white/10 text-xl font-black text-white ring-1 ring-white/10"
                        onClick={closeTransferModal}
                      >
                        ×
                      </button>
                    </div>

                    <label className="mt-5 flex items-center gap-3 rounded-2xl border border-white/10 bg-black/20 p-3">
                      <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-sky-400/10 text-sky-200 ring-1 ring-sky-400/20">⌕</span>
                      <input
                        className="h-10 min-w-0 flex-1 bg-transparent text-sm font-bold text-white outline-none placeholder:text-slate-500"
                        value={transferSearch}
                        onChange={(event) => setTransferSearch(event.target.value)}
                        placeholder="Buscar empresa, email, ID Donoss, barrio..."
                      />
                    </label>
                  </div>

                  <div className="max-h-[46vh] overflow-y-auto p-4 sm:p-5">
                    {isLoadingTransferBusinesses ? (
                      <p className="rounded-2xl border border-white/10 bg-white/[0.055] p-4 text-sm font-bold text-slate-300">Cargando empresas...</p>
                    ) : filteredTransferBusinesses.length === 0 ? (
                      <p className="rounded-2xl border border-white/10 bg-white/[0.055] p-4 text-sm font-bold text-slate-300">No hay empresas con esta búsqueda.</p>
                    ) : (
                      <div className="grid gap-3">
                        {filteredTransferBusinesses.map((business) => {
                          const selected = selectedTransferBusinessId === business.id;
                          return (
                            <button
                              key={business.id}
                              type="button"
                              className={`w-full rounded-3xl border p-4 text-left transition ${
                                selected
                                  ? "border-mint/50 bg-mint/10 shadow-glow"
                                  : "border-white/10 bg-white/[0.045] hover:border-sky-300/30 hover:bg-white/[0.07]"
                              }`}
                              onClick={() => setSelectedTransferBusinessId(business.id)}
                            >
                              <div className="flex items-start justify-between gap-3">
                                <div className="min-w-0">
                                  <p className="truncate text-lg font-black text-white">{business.display_name || "Empresa sin nombre"}</p>
                                  <p className="mt-1 truncate text-sm font-bold text-slate-400">{business.email || "Sin email visible"}</p>
                                  <p className="mt-2 text-xs font-black uppercase tracking-[0.12em] text-mint">
                                    {business.transaction_id || "Sin ID Donoss"}
                                  </p>
                                  {(business.neighborhood || business.address) && (
                                    <p className="mt-1 truncate text-xs font-bold text-slate-500">{business.neighborhood || business.address}</p>
                                  )}
                                </div>
                                <span className={`shrink-0 rounded-full px-3 py-1 text-xs font-black ${
                                  selected ? "bg-mint text-ink" : "bg-white/10 text-slate-300"
                                }`}>
                                  {selected ? "Elegida" : "Elegir"}
                                </span>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="grid gap-3 border-t border-white/10 p-5 min-[430px]:grid-cols-2">
                    <button
                      className="h-12 rounded-2xl border border-white/10 bg-white/[0.07] text-sm font-black text-white"
                      onClick={closeTransferModal}
                      disabled={isTransferring}
                    >
                      Cancelar
                    </button>
                    <button
                      className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow disabled:cursor-not-allowed disabled:opacity-45"
                      onClick={transferSelectedOffer}
                      disabled={!selectedTransferBusinessId || isTransferring}
                    >
                      {isTransferring ? "Transfiriendo..." : "Confirmar transferencia"}
                    </button>
                  </div>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
