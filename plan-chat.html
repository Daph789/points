<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donos | Chat del grupo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166", violet: "#A78BFA" },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.18)",
              nav: "0 20px 70px rgba(0, 0, 0, 0.42)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; }
      body {
        background:
          radial-gradient(circle at 20% -8%, rgba(66, 242, 179, 0.20), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(167, 139, 250, 0.16), transparent 32%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
      const params = new URLSearchParams(window.location.search);
      const planId = params.get("id") || "";
      const isEmbeddedChat = params.get("embedded") === "1";

      function redirectToLogin() {
        window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      }

      function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function planTitle(plan) {
        return plan?.title || plan?.purchase?.offer?.title || "Chat del grupo";
      }

      function verifiedBadge() {
        return (
          <span className="relative inline-grid h-4 w-4 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3 w-3" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function friendlyChatError(error) {
        const messages = {
          plan_chat_table_missing: "Falta activar el SQL del chat de grupos en Supabase.",
          not_member: "Para chatear tienes que participar primero en este plan.",
          not_accepted: "Tu solicitud aún no está aceptada. Cuando estés dentro del grupo podrás chatear.",
          plan_not_found: "No encontramos este plan.",
          empty_message: "Escribe un mensaje antes de enviar.",
          edit_window_closed: "Solo puedes modificar un mensaje durante los primeros 15 minutos.",
          message_not_found: "No encontramos este mensaje.",
        };
        return messages[error] || "No se ha podido cargar el chat.";
      }

      function canEditMessage(message) {
        if (!message?.created_at || message.deleted_at || message.pending) return false;
        return Date.now() - new Date(message.created_at).getTime() <= 15 * 60 * 1000;
      }

      function App() {
        const [token, setToken] = React.useState("");
        const [profile, setProfile] = React.useState(null);
        const [plan, setPlan] = React.useState(null);
        const [messages, setMessages] = React.useState([]);
        const [draft, setDraft] = React.useState("");
        const [status, setStatus] = React.useState("Cargando chat...");
        const [isSending, setIsSending] = React.useState(false);
        const [selectedMessage, setSelectedMessage] = React.useState(null);
        const [editingMessage, setEditingMessage] = React.useState(null);
        const [editDraft, setEditDraft] = React.useState("");
        const [messageToDelete, setMessageToDelete] = React.useState(null);
        const listRef = React.useRef(null);

        React.useEffect(() => {
          bootstrap();
        }, []);

        React.useEffect(() => {
          function handleMessage(event) {
            if (event.origin !== window.location.origin) return;
            if (event.data?.type === "donos:refresh-chat") loadChat(token, true);
          }
          window.addEventListener("message", handleMessage);
          return () => window.removeEventListener("message", handleMessage);
        }, [token]);

        React.useEffect(() => {
          if (!token || !planId) return undefined;
          const interval = window.setInterval(() => loadChat(token, true), 2500);
          return () => window.clearInterval(interval);
        }, [token, planId]);

        React.useEffect(() => {
          window.setTimeout(() => {
            if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
          }, 40);
        }, [messages.length]);

        async function bootstrap() {
          if (!planId) {
            setStatus("No encontramos el grupo.");
            return;
          }
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          if (!accessToken) return redirectToLogin();
          setToken(accessToken);
          await loadChat(accessToken);
        }

        async function loadChat(accessToken = token, silent = false) {
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat`, {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "plan_chat_failed");
            setProfile(data.profile || null);
            setPlan(data.plan || null);
            setMessages(data.messages || []);
            setStatus("");
            markChatNotificationsRead(accessToken);
          } catch (error) {
            if (!silent) setStatus(friendlyChatError(error.message));
          }
        }

        async function markChatNotificationsRead(accessToken = token) {
          if (!accessToken || !planId) return;
          try {
            const response = await fetch("/api/me/notifications", { headers: { Authorization: `Bearer ${accessToken}` } });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) return;
            const keys = (data.events || [])
              .filter((event) => event.section === "quedar" && event.kind === "chat" && event.plan_id === planId && !event.read)
              .map((event) => event.key)
              .filter(Boolean);
            if (keys.length === 0) return;
            await fetch("/api/me/notifications/read", {
              method: "POST",
              keepalive: true,
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` },
              body: JSON.stringify({ keys }),
            });
          } catch (_error) {}
        }

        function goBackToQuedar(event) {
          event.preventDefault();
          if (isEmbeddedChat && window.parent !== window) {
            window.parent.postMessage({ type: "donos:navigate", route: "quedar" }, window.location.origin);
            return;
          }
          window.location.href = "plans.html?tab=joined";
        }

        async function sendMessage(event) {
          event.preventDefault();
          const body = draft.trim();
          if (!body || isSending) return;
          const temporaryId = `temp-${Date.now()}`;
          setIsSending(true);
          setDraft("");
          setMessages((current) => [
            ...current,
            {
              id: temporaryId,
              plan_id: planId,
              sender_id: profile?.id,
              body,
              created_at: new Date().toISOString(),
              sender: profile,
              pending: true,
            },
          ]);
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ body }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "send_message_failed");
            setMessages((current) => [...current.filter((item) => item.id !== temporaryId && item.id !== data.message?.id), data.message].filter(Boolean));
            setStatus("");
            await loadChat(token, true);
          } catch (error) {
            setMessages((current) => current.filter((item) => item.id !== temporaryId));
            setDraft(body);
            setStatus(friendlyChatError(error.message));
          } finally {
            setIsSending(false);
          }
        }

        async function saveEditedMessage(event) {
          event.preventDefault();
          if (!editingMessage || isSending) return;
          const body = editDraft.trim();
          if (!body) return;
          setIsSending(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat/${editingMessage.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ body }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "edit_message_failed");
            setMessages((current) => current.map((item) => item.id === data.message.id ? data.message : item));
            setEditingMessage(null);
            setEditDraft("");
            setStatus("");
          } catch (error) {
            setStatus(friendlyChatError(error.message));
          } finally {
            setIsSending(false);
          }
        }

        async function deleteMessage() {
          if (!messageToDelete || isSending) return;
          setIsSending(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat/${messageToDelete.id}`, {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "delete_message_failed");
            setMessages((current) => current.map((item) => item.id === data.message.id ? data.message : item));
            setMessageToDelete(null);
            setSelectedMessage(null);
            setStatus("");
          } catch (error) {
            setStatus(friendlyChatError(error.message));
          } finally {
            setIsSending(false);
          }
        }

        return (
          <main className="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 pb-4 pt-4 sm:px-6">
            <header className="sticky top-0 z-20 -mx-4 border-b border-white/10 bg-[#080C16]/85 px-4 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6">
              <div className="flex items-center gap-3">
                <a className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-white/[0.07] text-2xl font-black text-white ring-1 ring-white/10" href="plans.html" onClick={goBackToQuedar}>‹</a>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-black uppercase tracking-[0.16em] text-mint">Chat del grupo</p>
                  <h1 className="truncate text-xl font-black text-white">{plan ? planTitle(plan) : "Quedar"}</h1>
                </div>
                <span className="rounded-full bg-mint/10 px-3 py-2 text-xs font-black text-mint ring-1 ring-mint/20">En directo</span>
              </div>
              {plan?.creator && (
                <div className="mt-3 flex items-center gap-2 overflow-hidden rounded-2xl bg-white/[0.055] px-3 py-2">
                  <span className="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-mint text-sm font-black text-ink">{String(plan.creator.display_name || "D").slice(0, 1).toUpperCase()}</span>
                  <p className="truncate text-xs font-bold text-slate-300">Creado por <span className="text-white">{plan.creator.display_name || "Usuario Donos"}</span></p>
                  {plan.creator.is_verified && verifiedBadge()}
                </div>
              )}
            </header>

            {status && (
              <div className={`mt-4 rounded-[28px] border p-4 text-sm font-bold leading-6 ${
                status.includes("Cargando")
                  ? "border-white/10 bg-white/[0.055] text-slate-300"
                  : "border-coral/25 bg-coral/10 text-coral"
              }`}>
                {status}
              </div>
            )}

            <section ref={listRef} className="min-h-0 flex-1 overflow-y-auto py-5">
              <div className="space-y-3">
                {messages.map((message) => {
                  const mine = message.sender_id === profile?.id;
                  return (
                    <div key={message.id} className={`flex ${mine ? "justify-end" : "justify-start"}`}>
                      <article
                        className={`max-w-[82%] rounded-[28px] px-4 py-3 shadow-2xl shadow-black/10 ${mine && !message.pending && !message.deleted_at ? "cursor-pointer active:scale-[0.99]" : ""} ${
                        mine
                          ? "rounded-br-md bg-mint text-ink"
                          : "rounded-bl-md border border-white/10 bg-white/[0.075] text-white"
                      } ${message.deleted_at ? "opacity-70" : ""}`}
                        onClick={() => mine && !message.pending && !message.deleted_at ? setSelectedMessage(message) : null}
                      >
                        {!mine && (
                          <div className="mb-1 flex items-center gap-2">
                            <p className="truncate text-xs font-black text-mint">{message.sender?.display_name || "Usuario Donos"}</p>
                            {message.sender?.is_verified && verifiedBadge()}
                          </div>
                        )}
                        <p className={`whitespace-pre-wrap break-words text-sm font-bold leading-6 ${message.deleted_at ? "italic" : ""}`}>{message.body}</p>
                        <p className={`mt-1 text-right text-[11px] font-black ${mine ? "text-ink/55" : "text-slate-500"}`}>{message.pending ? "Enviando..." : `${formatTime(message.created_at)}${message.edited_at ? " · editado" : ""}`}</p>
                      </article>
                    </div>
                  );
                })}
                {!status && messages.length === 0 && (
                  <div className="rounded-[30px] border border-white/10 bg-white/[0.055] p-6 text-center">
                    <p className="text-lg font-black text-white">Todavía no hay mensajes</p>
                    <p className="mt-2 text-sm font-bold leading-6 text-slate-400">Sé la primera persona en escribir al grupo.</p>
                  </div>
                )}
              </div>
            </section>

            <form className="sticky bottom-0 z-20 -mx-4 border-t border-white/10 bg-[#080C16]/90 px-4 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6" onSubmit={sendMessage}>
              <div className="flex items-end gap-2 rounded-[28px] border border-white/10 bg-white/[0.055] p-2">
                <textarea
                  className="max-h-32 min-h-12 flex-1 resize-none bg-transparent px-3 py-3 text-sm font-bold text-white outline-none placeholder:text-slate-500"
                  value={draft}
                  rows="1"
                  onChange={(event) => setDraft(event.target.value)}
                  placeholder="Escribe un mensaje..."
                />
                <button className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-mint text-xl font-black text-ink shadow-glow disabled:opacity-50" disabled={isSending || !draft.trim()} type="submit">
                  ↑
                </button>
              </div>
            </form>

            {selectedMessage && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setSelectedMessage(null)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <p className="text-sm font-black text-white">Opciones del mensaje</p>
                  <p className="mt-1 text-xs font-bold text-slate-500">Puedes modificarlo solo durante 15 minutos.</p>
                  <div className="mt-4 grid gap-2">
                    {canEditMessage(selectedMessage) && (
                      <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => {
                        setEditingMessage(selectedMessage);
                        setEditDraft(selectedMessage.body || "");
                        setSelectedMessage(null);
                      }}>
                        Modificar
                      </button>
                    )}
                    <button className="h-12 rounded-2xl bg-coral/10 text-sm font-black text-coral ring-1 ring-coral/20" onClick={() => {
                      setMessageToDelete(selectedMessage);
                      setSelectedMessage(null);
                    }}>
                      Eliminar
                    </button>
                    <button className="h-12 rounded-2xl bg-white/[0.04] text-sm font-black text-slate-300 ring-1 ring-white/10" onClick={() => setSelectedMessage(null)}>Cancelar</button>
                  </div>
                </section>
              </div>
            )}

            {editingMessage && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/55 px-4 backdrop-blur-sm">
                <form className="w-full max-w-md rounded-[34px] border border-white/10 bg-[#0D111D] p-5 shadow-2xl" onSubmit={saveEditedMessage}>
                  <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Modificar mensaje</p>
                  <textarea className="mt-4 min-h-32 w-full rounded-3xl border border-line bg-black/20 px-4 py-3 text-sm font-bold text-white outline-none focus:border-mint/60" value={editDraft} onChange={(event) => setEditDraft(event.target.value)} />
                  <div className="mt-4 grid grid-cols-2 gap-3">
                    <button type="button" className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => setEditingMessage(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" disabled={isSending || !editDraft.trim()} type="submit">Guardar</button>
                  </div>
                </form>
              </div>
            )}

            {messageToDelete && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/55 px-4 backdrop-blur-sm">
                <section className="w-full max-w-md rounded-[34px] border border-coral/20 bg-[#0D111D] p-5 text-center shadow-2xl">
                  <div className="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-coral/10 text-2xl font-black text-coral ring-1 ring-coral/25">!</div>
                  <h2 className="mt-4 text-2xl font-black text-white">¿Eliminar mensaje?</h2>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-400">Se mostrará como “Mensaje eliminado” para que el chat siga claro.</p>
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => setMessageToDelete(null)}>Cancelar</button>
                    <button className="h-12 rounded-2xl bg-coral text-sm font-black text-white" disabled={isSending} onClick={deleteMessage}>Eliminar</button>
                  </div>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
