<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donoss | Chat del grupo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            colors: { ink: "#060914", panel: "#0D111D", line: "#20273A", mint: "#42F2B3", coral: "#FF6B6B", sun: "#FFD166", violet: "#A78BFA" },
            boxShadow: {
              glow: "0 24px 80px rgba(66, 242, 179, 0.18)",
              nav: "0 20px 70px rgba(0, 0, 0, 0.42)",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      html { background: #060914; }
      body {
        background:
          radial-gradient(circle at 20% -8%, rgba(66, 242, 179, 0.20), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(167, 139, 250, 0.16), transparent 32%),
          linear-gradient(180deg, #0a0e19 0%, #060914 48%, #050711 100%);
      }
      * { min-width: 0; }
    </style>
  </head>
  <body class="min-h-screen text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const supabaseUrl = "https://pwpvdpajkaljibytboka.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cHZkcGFqa2FsamlieXRib2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMwNzcsImV4cCI6MjEwMDkxOTA3N30.nfuO7qVK90WtmrTuTG8aAfUCOxnZdWysAl1cOyVxcA0";
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
      const params = new URLSearchParams(window.location.search);
      const planId = params.get("id") || "";
      const isEmbeddedChat = params.get("embedded") === "1";
      const startsPrefetched = params.get("prefetch") === "1";

      function redirectToLogin() {
        window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      }

      function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }

      function planTitle(plan) {
        return plan?.title || plan?.purchase?.offer?.title || "Chat del grupo";
      }

      function verifiedBadge() {
        return (
          <span className="relative inline-grid h-4 w-4 shrink-0 place-items-center rounded-full bg-sky-500 text-white shadow-[0_0_18px_rgba(14,165,233,0.45)] ring-2 ring-white/20">
            <span className="absolute inset-[-2px] rounded-[42%] bg-sky-500"></span>
            <svg viewBox="0 0 24 24" className="relative h-3 w-3" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="3.5">
              <path d="m5 12 4 4L19 7" />
            </svg>
          </span>
        );
      }

      function friendlyChatError(error) {
        const messages = {
          plan_chat_table_missing: "Falta activar el SQL del chat de grupos en Supabase.",
          not_member: "Para chatear tienes que participar primero en este plan.",
          not_accepted: "Tu solicitud aún no está aceptada. Cuando estés dentro del grupo podrás chatear.",
          plan_not_found: "No encontramos este plan.",
          empty_message: "Escribe un mensaje antes de enviar.",
          edit_window_closed: "Solo puedes modificar un mensaje durante los primeros 15 minutos.",
          message_not_found: "No encontramos este mensaje.",
        };
        return messages[error] || "No se ha podido cargar el chat.";
      }

      function canEditMessage(message) {
        if (!message?.created_at || message.deleted_at || message.pending) return false;
        return Date.now() - new Date(message.created_at).getTime() <= 15 * 60 * 1000;
      }

      function canModerateMessage(message, profile) {
        if (!message || message.pending || message.deleted_at) return false;
        return Boolean(profile?.is_donoss_admin);
      }

      function messageReadCount(message) {
        return (message?.read_by || []).filter((read) => read.reader?.id && read.reader.id !== message.sender_id && String(read.reader?.email || "").toLowerCase() !== "donoss.red@gmail.com").length;
      }

      function ReadTicks({ message }) {
        if (!message || message.pending) return <span className="text-ink/35">✓</span>;
        const isRead = messageReadCount(message) > 0;
        return (
          <span className={`ml-1 inline-flex items-center text-[13px] font-black ${isRead ? "text-sky-600" : "text-ink/45"}`} aria-label={isRead ? "Leído" : "Enviado"}>
            ✓✓
          </span>
        );
      }

      function firstUnreadMessageId(chatMessages = [], profileId = "") {
        const firstUnread = (chatMessages || []).find((message) => {
          if (!message?.id || message.pending || message.deleted_at || message.sender_id === profileId) return false;
          return !(message.read_by || []).some((read) => read.reader?.id === profileId);
        });
        return firstUnread?.id || "";
      }

      function Avatar({ user, mine = false }) {
        const photo = user?.account_type === "business" ? (user?.profile_photo_data_url || user?.plan_photo_data_urls?.[0]) : user?.plan_photo_data_urls?.[0];
        return (
          <span className={`grid h-9 w-9 shrink-0 place-items-center overflow-hidden rounded-2xl text-xs font-black ${mine ? "bg-mint text-ink" : "bg-white/[0.08] text-white ring-1 ring-white/10"}`}>
            {photo ? <img className="h-full w-full object-cover object-center" src={photo} alt="" /> : String(user?.display_name || "D").slice(0, 1).toUpperCase()}
          </span>
        );
      }

      function messageExcerpt(message) {
        const text = String(message?.body || "").replace(/\s+/g, " ").trim();
        return text.length > 92 ? `${text.slice(0, 92)}...` : text || "Mensaje";
      }

      function ReplySnippet({ reply, mine = false }) {
        if (!reply) return null;
        return (
          <div className={`mb-2 rounded-2xl border-l-4 border-mint/70 px-3 py-2 ${mine ? "bg-ink/10 text-ink" : "bg-black/20 text-white"}`}>
            <p className={`truncate text-[11px] font-black ${mine ? "text-ink/70" : "text-mint"}`}>{reply.sender?.display_name || "Usuario Donoss"}</p>
            <p className={`truncate text-xs font-bold ${mine ? "text-ink/60" : "text-slate-300"}`}>{messageExcerpt(reply)}</p>
          </div>
        );
      }

      function mergeMessagesWithPending(serverMessages, currentMessages) {
        const confirmed = Array.isArray(serverMessages) ? serverMessages : [];
        const current = Array.isArray(currentMessages) ? currentMessages : [];
        const currentById = new Map(current.filter((message) => message.id).map((message) => [message.id, message]));
        const confirmedIds = new Set(confirmed.map((message) => message.id).filter(Boolean));
        const hydratedConfirmed = confirmed.map((message) => {
          const local = currentById.get(message.id);
          return local?.local_key ? { ...message, local_key: local.local_key } : message;
        });
        const localStillNeeded = current.filter((message) => {
          if (message.pending) return Date.now() - new Date(message.created_at).getTime() < 30000;
          if (!message.local_confirmed_at || confirmedIds.has(message.id)) return false;
          return Date.now() - new Date(message.local_confirmed_at).getTime() < 30000;
        });
        return [...hydratedConfirmed, ...localStillNeeded];
      }

      function prependOlderMessages(olderMessages, currentMessages) {
        const current = Array.isArray(currentMessages) ? currentMessages : [];
        const currentIds = new Set(current.map((message) => message.id).filter(Boolean));
        const cleanOlder = (Array.isArray(olderMessages) ? olderMessages : []).filter((message) => message.id && !currentIds.has(message.id));
        return [...cleanOlder, ...current];
      }

      const reactionEmojis = ["❤️", "😂", "🔥", "👏", "😮", "😢"];

      function App() {
        const [token, setToken] = React.useState("");
        const [profile, setProfile] = React.useState(null);
        const [plan, setPlan] = React.useState(null);
        const [messages, setMessages] = React.useState([]);
        const [draft, setDraft] = React.useState("");
        const [status, setStatus] = React.useState("Cargando chat...");
        const [isSending, setIsSending] = React.useState(false);
        const [selectedMessage, setSelectedMessage] = React.useState(null);
        const [readListMessage, setReadListMessage] = React.useState(null);
        const [readListStatus, setReadListStatus] = React.useState("");
        const [showParticipants, setShowParticipants] = React.useState(false);
        const [editingMessage, setEditingMessage] = React.useState(null);
        const [editDraft, setEditDraft] = React.useState("");
        const [messageToDelete, setMessageToDelete] = React.useState(null);
        const [replyingTo, setReplyingTo] = React.useState(null);
        const [activeReactionMessageId, setActiveReactionMessageId] = React.useState("");
        const [reactionPickerClosing, setReactionPickerClosing] = React.useState(false);
        const [reactionList, setReactionList] = React.useState(null);
        const [swipeState, setSwipeState] = React.useState({ id: "", x: 0, ready: false });
        const [unreadDividerId, setUnreadDividerId] = React.useState("");
        const [hasMoreMessages, setHasMoreMessages] = React.useState(false);
        const [isLoadingOlder, setIsLoadingOlder] = React.useState(false);
        const [showIntro, setShowIntro] = React.useState(false);
        const [isActiveChat, setIsActiveChat] = React.useState(!startsPrefetched);
        const listRef = React.useRef(null);
        const bottomRef = React.useRef(null);
        const forceScrollRef = React.useRef(false);
        const isActiveRef = React.useRef(!startsPrefetched);
        const loadingChatRef = React.useRef(false);
        const swipeRef = React.useRef(null);
        const longPressTimerRef = React.useRef(null);
        const reactionPickerCloseTimerRef = React.useRef(null);
        const pendingReactionRef = React.useRef({});
        const swipeBlockClickRef = React.useRef(false);
        const positionedInitialChatRef = React.useRef(false);
        const messageRefs = React.useRef({});

        React.useEffect(() => {
          bootstrap();
        }, []);

        React.useEffect(() => {
          const introKey = `donos-plan-chat-intro-${planId}`;
          if (!window.localStorage.getItem(introKey)) {
            setShowIntro(true);
            window.localStorage.setItem(introKey, "1");
          }
        }, []);

        React.useEffect(() => {
          function handleMessage(event) {
            if (event.origin !== window.location.origin) return;
            if (event.data?.type === "donos:route-visibility" && !event.data.active) {
              isActiveRef.current = false;
              setIsActiveChat(false);
              return;
            }
            if (event.data?.type === "donos:activate-chat") {
              isActiveRef.current = true;
              setIsActiveChat(true);
              loadChat(token, true, { markRead: true });
              return;
            }
            if (event.data?.type === "donos:refresh-chat") loadChat(token, true);
          }
          window.addEventListener("message", handleMessage);
          return () => window.removeEventListener("message", handleMessage);
        }, [token]);

        React.useEffect(() => {
          if (!token || !planId || !isActiveChat) return undefined;
          const interval = window.setInterval(() => loadChat(token, true), 6000);
          return () => window.clearInterval(interval);
        }, [token, planId, isActiveChat]);

        function scrollChatToBottom(behavior = "smooth") {
          window.requestAnimationFrame(() => {
            bottomRef.current?.scrollIntoView({ behavior, block: "end" });
            if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
          });
        }

        function scrollChatToMessage(messageId, behavior = "auto") {
          window.requestAnimationFrame(() => {
            const target = messageRefs.current[messageId];
            if (target) {
              target.scrollIntoView({ behavior, block: "center" });
              return;
            }
            scrollChatToBottom(behavior);
          });
        }

        React.useEffect(() => {
          if (!forceScrollRef.current) return;
          forceScrollRef.current = false;
          scrollChatToBottom("smooth");
        }, [messages.length]);

        async function bootstrap() {
          if (!planId) {
            setStatus("No encontramos el grupo.");
            return;
          }
          const { data: sessionData } = await supabaseClient.auth.getSession();
          const accessToken = sessionData.session?.access_token;
          if (!accessToken) return redirectToLogin();
          setToken(accessToken);
          if (startsPrefetched) {
            setStatus("");
            return;
          }
          await loadChat(accessToken, startsPrefetched, { markRead: !startsPrefetched });
        }

        async function loadChat(accessToken = token, silent = false, options = {}) {
          if (loadingChatRef.current) return;
          loadingChatRef.current = true;
          try {
            const query = options.before ? `?before=${encodeURIComponent(options.before)}` : "";
            const response = await fetch(`/api/social-plans/${planId}/chat${query}`, {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "plan_chat_failed");
            setProfile(data.profile || null);
            setPlan(data.plan || null);
            setMessages((current) => applyPendingReactions(options.prepend ? prependOlderMessages(data.messages || [], current) : mergeMessagesWithPending(data.messages || [], current)));
            setHasMoreMessages(Boolean(data.has_more));
            setStatus("");
            if (!positionedInitialChatRef.current) {
              positionedInitialChatRef.current = true;
              const unreadId = firstUnreadMessageId(data.messages || [], data.profile?.id);
              if (unreadId) {
                setUnreadDividerId(unreadId);
                scrollChatToMessage(unreadId, "auto");
                window.setTimeout(() => setUnreadDividerId((current) => current === unreadId ? "" : current), 4500);
              } else {
                scrollChatToBottom("auto");
              }
            }
            if (options.markRead || isActiveRef.current) {
              markChatMessagesRead(accessToken);
              markChatNotificationsRead(accessToken, data.messages || [], data.profile?.id);
            }
          } catch (error) {
            if (!silent) setStatus(friendlyChatError(error.message));
          } finally {
            loadingChatRef.current = false;
          }
        }

        async function loadOlderMessages() {
          if (isLoadingOlder || !hasMoreMessages || messages.length === 0) return;
          const oldest = messages.find((message) => message?.created_at);
          if (!oldest?.created_at) return;
          setIsLoadingOlder(true);
          try {
            await loadChat(token, true, { before: oldest.created_at, prepend: true, markRead: false });
          } finally {
            setIsLoadingOlder(false);
          }
        }

        async function openReadList(message) {
          setSelectedMessage(null);
          setReadListMessage(message);
          setReadListStatus("Cargando lecturas...");
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat/${message.id}/reads`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "message_reads_failed");
            setReadListMessage(data.message || message);
            setMessages((current) => current.map((item) => item.id === message.id ? { ...item, read_by: data.message?.read_by || item.read_by || [] } : item));
            setReadListStatus("");
          } catch (_error) {
            setReadListStatus("No se han podido cargar las lecturas.");
          }
        }

        async function markChatMessagesRead(accessToken = token) {
          if (!accessToken || !planId || !isActiveRef.current) return;
          try {
            await fetch(`/api/social-plans/${planId}/chat/read`, {
              method: "POST",
              keepalive: true,
              headers: { Authorization: `Bearer ${accessToken}` },
            });
          } catch (_error) {}
        }

        async function markChatNotificationsRead(accessToken = token, chatMessages = messages, profileId = profile?.id) {
          if (!accessToken || !planId) return;
          try {
            const keys = (chatMessages || [])
              .filter((message) => message.id && message.sender_id !== profileId)
              .map((message) => `quedar:chat:${message.id}:${profileId}`)
              .filter(Boolean);
            if (keys.length === 0) return;
            await fetch("/api/me/notifications/read", {
              method: "POST",
              keepalive: true,
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` },
              body: JSON.stringify({ keys }),
            });
          } catch (_error) {}
        }

        function goBackToQuedar(event) {
          event.preventDefault();
          if (isEmbeddedChat && window.parent !== window) {
            window.parent.postMessage({ type: "donos:navigate", route: "quedar" }, window.location.origin);
            return;
          }
          window.location.href = "plans.html?tab=joined";
        }

        function startReplyToMessage(message) {
          if (!message || message.pending || message.deleted_at) return;
          setReplyingTo(message);
          window.navigator?.vibrate?.(12);
        }

        function clearLongPressTimer() {
          if (longPressTimerRef.current) {
            window.clearTimeout(longPressTimerRef.current);
            longPressTimerRef.current = null;
          }
        }

        function closeReactionPicker() {
          if (!activeReactionMessageId) return;
          setReactionPickerClosing(true);
          if (reactionPickerCloseTimerRef.current) window.clearTimeout(reactionPickerCloseTimerRef.current);
          reactionPickerCloseTimerRef.current = window.setTimeout(() => {
            setActiveReactionMessageId("");
            setReactionPickerClosing(false);
          }, 170);
        }

        function openReactionPicker(message) {
          if (!message || message.pending || message.deleted_at) return;
          if (reactionPickerCloseTimerRef.current) window.clearTimeout(reactionPickerCloseTimerRef.current);
          setReactionPickerClosing(false);
          setActiveReactionMessageId(message.id);
          swipeBlockClickRef.current = true;
          window.navigator?.vibrate?.(12);
          window.setTimeout(() => {
            swipeBlockClickRef.current = false;
          }, 180);
        }

        function openReactionList(message, reaction) {
          if (!reaction?.emoji) return;
          closeReactionPicker();
          setReactionList({ message, reaction });
        }

        function handleBubblePointerDown(event, message) {
          if (!message || message.pending || message.deleted_at || event.button > 0) return;
          clearLongPressTimer();
          swipeRef.current = {
            id: message.id,
            startX: event.clientX,
            startY: event.clientY,
            active: false,
          };
          longPressTimerRef.current = window.setTimeout(() => openReactionPicker(message), 420);
          event.currentTarget.setPointerCapture?.(event.pointerId);
        }

        function handleBubblePointerMove(event, message) {
          const swipe = swipeRef.current;
          if (!swipe || swipe.id !== message.id) return;
          const dx = event.clientX - swipe.startX;
          const dy = Math.abs(event.clientY - swipe.startY);
          if (dx < 0 || dy > 42) {
            clearLongPressTimer();
            setSwipeState({ id: "", x: 0, ready: false });
            return;
          }
          if (dx > 8) {
            clearLongPressTimer();
            swipe.active = true;
            swipeBlockClickRef.current = true;
            const x = Math.min(dx, 86);
            setSwipeState({ id: message.id, x, ready: x > 56 });
          }
        }

        function handleBubblePointerUp(message) {
          clearLongPressTimer();
          const swipe = swipeRef.current;
          const x = swipeState.id === message.id ? swipeState.x : 0;
          swipeRef.current = null;
          setSwipeState({ id: "", x: 0, ready: false });
          if (swipe?.active && x > 56) startReplyToMessage(message);
          window.setTimeout(() => {
            swipeBlockClickRef.current = false;
          }, 0);
        }

        async function sendMessage(event) {
          event.preventDefault();
          const body = draft.trim();
          if (!body || isSending) return;
          const replyTarget = replyingTo && !replyingTo.deleted_at && !replyingTo.pending ? replyingTo : null;
          const temporaryId = `temp-${Date.now()}`;
          const optimisticMessage = {
            id: temporaryId,
            local_key: temporaryId,
            plan_id: planId,
            sender_id: profile?.id,
            body,
            reply_to_message_id: replyTarget?.id || null,
            reply_to: replyTarget ? {
              id: replyTarget.id,
              sender_id: replyTarget.sender_id,
              body: replyTarget.body,
              deleted_at: replyTarget.deleted_at,
              sender: replyTarget.sender,
            } : null,
            created_at: new Date().toISOString(),
            sender: profile,
            pending: true,
            read_by: [],
          };
          setIsSending(true);
          setDraft("");
          setReplyingTo(null);
          forceScrollRef.current = true;
          setMessages((current) => [...current, optimisticMessage]);
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ body, reply_to_message_id: replyTarget?.id || null }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "send_message_failed");
            forceScrollRef.current = true;
            setMessages((current) => current.map((item) => item.id === temporaryId ? { ...data.message, local_key: temporaryId, local_confirmed_at: new Date().toISOString() } : item).filter(Boolean));
            setStatus("");
            window.setTimeout(() => loadChat(token, true), 450);
            window.setTimeout(() => scrollChatToBottom("smooth"), 80);
          } catch (error) {
            setMessages((current) => current.filter((item) => item.id !== temporaryId));
            setDraft(body);
            setReplyingTo(replyTarget);
            setStatus(friendlyChatError(error.message));
          } finally {
            setIsSending(false);
          }
        }

        async function saveEditedMessage(event) {
          event.preventDefault();
          if (!editingMessage || isSending) return;
          const body = editDraft.trim();
          if (!body) return;
          setIsSending(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat/${editingMessage.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ body }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "edit_message_failed");
            setMessages((current) => current.map((item) => item.id === data.message.id ? data.message : item));
            setEditingMessage(null);
            setEditDraft("");
            setStatus("");
          } catch (error) {
            setStatus(friendlyChatError(error.message));
          } finally {
            setIsSending(false);
          }
        }

        async function deleteMessage() {
          if (!messageToDelete || isSending) return;
          setIsSending(true);
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat/${messageToDelete.id}`, {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "delete_message_failed");
            setMessages((current) => current.map((item) => item.id === data.message.id ? data.message : item));
            setMessageToDelete(null);
            setSelectedMessage(null);
            setStatus("");
          } catch (error) {
            setStatus(friendlyChatError(error.message));
          } finally {
            setIsSending(false);
          }
        }

        function setMessageReactions(messageId, reactions) {
          setMessages((current) => current.map((item) => item.id === messageId ? { ...item, reactions: reactions || [] } : item));
        }

        function applyPendingReactions(list) {
          const now = Date.now();
          return (list || []).map((message) => {
            const pending = pendingReactionRef.current[message.id];
            if (!pending) return message;
            if (pending.expires <= now) {
              delete pendingReactionRef.current[message.id];
              return message;
            }
            return { ...message, reactions: pending.reactions };
          });
        }

        function optimisticReactionToggle(message, emoji) {
          const currentReactions = Array.isArray(message.reactions) ? message.reactions : [];
          const currentMine = currentReactions.find((reaction) => reaction.mine);
          const removeOnly = currentMine?.emoji === emoji;
          const nextReactions = currentReactions
            .map((reaction) => {
              if (!reaction.mine) return reaction;
              const users = (reaction.users || []).filter((user) => user.id !== profile?.id);
              return { ...reaction, mine: false, count: Math.max(Number(reaction.count || 0) - 1, 0), users };
            })
            .filter((reaction) => Number(reaction.count || 0) > 0);
          if (!removeOnly) {
            const target = nextReactions.find((reaction) => reaction.emoji === emoji);
            const publicMe = profile ? { id: profile.id, display_name: profile.display_name, transaction_id: profile.transaction_id, is_verified: profile.is_verified, account_type: profile.account_type, profile_photo_data_url: profile.profile_photo_data_url, plan_photo_data_urls: profile.plan_photo_data_urls } : null;
            if (target) {
              target.mine = true;
              target.count = Number(target.count || 0) + 1;
              if (publicMe && !(target.users || []).some((user) => user.id === publicMe.id)) target.users = [...(target.users || []), publicMe];
            } else {
              nextReactions.push({ emoji, count: 1, mine: true, users: publicMe ? [publicMe] : [] });
            }
          }
          setMessageReactions(message.id, nextReactions);
          return nextReactions;
        }

        async function reactToMessage(message, emoji) {
          if (!message?.id || message.pending || message.deleted_at || !reactionEmojis.includes(emoji)) return;
          closeReactionPicker();
          const optimisticReactions = optimisticReactionToggle(message, emoji);
          pendingReactionRef.current[message.id] = { reactions: optimisticReactions, expires: Date.now() + 2200 };
          try {
            const response = await fetch(`/api/social-plans/${planId}/chat/${message.id}/reaction`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ emoji }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "reaction_failed");
            delete pendingReactionRef.current[message.id];
            setMessageReactions(message.id, data.reactions || []);
          } catch (error) {
            setStatus(friendlyChatError(error.message));
            window.setTimeout(() => {
              delete pendingReactionRef.current[message.id];
              loadChat(token, true);
            }, 900);
          }
        }

        const visibleMessages = messages.filter((message) => !message.deleted_at);

        return (
          <main className="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 pb-4 pt-4 sm:px-6">
            <header className="sticky top-0 z-20 -mx-4 border-b border-white/10 bg-[#080C16]/85 px-4 py-3 backdrop-blur-2xl sm:-mx-6 sm:px-6">

                <div className="min-w-0 flex-1">

                </div>

                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.4">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
                    <circle cx="9.5" cy="7" r="4" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  </svg>
                </button>

                  <Avatar user={plan.creator} mine />
                  <p className="truncate text-xs font-bold text-slate-300">Creado por <span className="text-white">{plan.creator.display_name || "Usuario Donoss"}</span></p>

            {status && (

                {hasMoreMessages && (
                  <div className="flex justify-center pb-2">
                    <button className="rounded-full border border-white/10 bg-white/[0.055] px-4 py-2 text-xs font-black text-slate-300 transition hover:bg-white/[0.09] disabled:opacity-50" type="button" disabled={isLoadingOlder} onClick={loadOlderMessages}>
                      {isLoadingOlder ? "Cargando..." : "Cargar mensajes anteriores"}
                    </button>
                  </div>
                )}
                {visibleMessages.map((message) => {
                  const mine = message.sender_id === profile?.id;
                  const canModerate = canModerateMessage(message, profile);
                  const swipe = swipeState.id === message.id ? swipeState : { x: 0, ready: false };
                  return (
                    <React.Fragment key={message.local_key || message.id}>
                      {unreadDividerId === message.id && (
                        <div className="flex items-center gap-3 py-2 transition-opacity duration-500">

                          <span className="rounded-full border border-mint/20 bg-mint/10 px-3 py-1 text-[11px] font-black uppercase tracking-[0.16em] text-mint shadow-glow">No leído</span>
                          <span className="h-px flex-1 bg-mint/25"></span>

                      {!mine && <Avatar user={message.sender} />}
                      <div className="relative max-w-[76%] sm:max-w-[68%]">
                        <span
                          className={`pointer-events-none absolute top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-full text-lg font-black transition ${mine ? "right-full mr-2" : "left-0"} ${swipe.ready ? "scale-100 bg-mint text-ink opacity-100" : "scale-75 bg-white/10 text-mint opacity-0"}`}
                          style={{ transform: `translateY(-50%) scale(${swipe.ready ? 1 : 0.75})` }}

                        </span>
                        <article

                                key={emoji}
                                type="button"
                                className="grid h-9 w-9 place-items-center rounded-full bg-white/[0.08] text-lg transition duration-150 hover:scale-110 hover:bg-white/[0.14] active:scale-95"

                              >
                                {emoji}
                              </button>
                            ))}
                          </div>
                          </React.Fragment>
                        )}
                      </div>
                      {mine && <Avatar user={profile} mine />}
                    </div>
                    </React.Fragment>

                  rows="1"
                  onChange={(event) => setDraft(event.target.value)}
                  placeholder="Escribe un mensaje..."
                />
                <button className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-mint text-xl font-black text-ink shadow-glow disabled:opacity-50" disabled={isSending || !draft.trim()} type="submit">
                  ↑
                </button>
              </div>
            </form>

            {reactionList && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setReactionList(null)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <p className="text-sm font-black text-white">Personas que reaccionaron</p>
                      <p className="mt-1 text-xs font-bold text-slate-500">{reactionList.reaction.emoji} {reactionList.reaction.count || 0} reacción(es)</p>
                    </div>
                    <button className="grid h-10 w-10 place-items-center rounded-2xl bg-white/[0.07] text-xl font-black text-white ring-1 ring-white/10" onClick={() => setReactionList(null)}>×</button>
                  </div>
                  <div className="mt-4 grid gap-2">
                    {(reactionList.reaction.users || []).map((user) => (
                      <div key={user.id} className="flex items-center gap-3 rounded-2xl bg-white/[0.055] p-3">
                        <Avatar user={user} />
                        <div className="min-w-0 flex-1">
                          <p className="truncate text-sm font-black text-white">{user.display_name || "Usuario Donoss"}</p>
                          <p className="truncate text-xs font-bold text-slate-500">{user.transaction_id || ""}</p>
                        </div>
                        {user.is_verified && verifiedBadge()}
                      </div>
                    ))}
                    {(reactionList.reaction.users || []).length === 0 && (
                      <p className="rounded-2xl bg-white/[0.055] p-4 text-sm font-bold text-slate-400">No se ha podido cargar la lista.</p>
                    )}
                  </div>
                </section>
              </div>
            )}

            {selectedMessage && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setSelectedMessage(null)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <p className="text-sm font-black text-white">Opciones del mensaje</p>
                  <p className="mt-1 text-xs font-bold text-slate-500">
                    {profile?.is_donoss_admin ? "Modo Donoss: puedes moderar este mensaje sin aparecer como miembro." : "Puedes modificarlo solo durante 15 minutos."}
                  </p>
                  <div className="mt-4 grid gap-2">
                    <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => {
                      startReplyToMessage(selectedMessage);
                      setSelectedMessage(null);
                    }}>
                      Responder
                    </button>
                    <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => openReadList(selectedMessage)}>
                      Ver quién lo ha leído
                    </button>
                    {(profile?.is_donoss_admin || canEditMessage(selectedMessage)) && (
                      <button className="h-12 rounded-2xl bg-white/[0.07] text-sm font-black text-white ring-1 ring-white/10" onClick={() => {
                        setEditingMessage(selectedMessage);
                        setEditDraft(selectedMessage.body || "");
                        setSelectedMessage(null);
                      }}>
                        Modificar
                      </button>

                    {(selectedMessage.sender_id === profile?.id || profile?.is_donoss_admin) && (
                      <button className="h-12 rounded-2xl bg-coral/10 text-sm font-black text-coral ring-1 ring-coral/20" onClick={() => {

                        Eliminar
                      </button>

            {readListMessage && (
              <div className="fixed inset-0 z-50 grid place-items-end bg-black/45 px-4 pb-5 backdrop-blur-sm" onClick={() => setReadListMessage(null)}>
                <section className="w-full max-w-md rounded-[32px] border border-white/10 bg-[#0D111D] p-4 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="text-sm font-black uppercase tracking-[0.14em] text-mint">Lecturas</p>

                  <div className="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-mint text-2xl font-black text-ink">i</div>
                  <h2 className="mt-4 text-2xl font-black text-white">Chat del grupo</h2>
                  <p className="mt-2 text-sm font-bold leading-6 text-slate-400">Aquí solo hablan las personas aceptadas y el creador del plan. Puedes ver participantes desde el icono superior.</p>
                  <button className="mt-5 h-12 w-full rounded-2xl bg-mint text-sm font-black text-ink shadow-glow" onClick={() => setShowIntro(false)}>Entendido</button>
                </section>
              </div>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
